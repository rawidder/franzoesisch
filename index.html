ur f."}, {"f": "direkte Objektpronomen", "b": "me, te, le, la, nous, vous, les"}, {"f": "indirekte Objektpronomen", "b": "me, te, lui, nous, vous, leur"}, {"f": "lui", "b": "ihm und ihr (indirekt) – auch betont: er"}, {"f": "leur (Pronomen) / leurs (Possessiv)", "b": "Je leur donne leurs cadeaux."}, {"f": "attendre, chercher, écouter, aider", "b": "direktes Objekt: Je l'attends. Je l'aide."}, {"f": "téléphoner, répondre, plaire, ressembler", "b": "à + Person → lui/leur"}, {"f": "Ich denke an dich.", "b": "Je pense à toi. (betontes Pronomen)"}, {"f": "y", "b": "ersetzt Ort (dort, dorthin) oder à + Sache: J'y vais. J'y pense."}, {"f": "en", "b": "ersetzt de + Ergänzung, Mengen: J'en veux. J'en ai deux."}, {"f": "Hast du ein Auto? – Ja, eins.", "b": "Oui, j'en ai une."}, {"f": "Reihenfolge der Pronomen", "b": "me/te/se/nous/vous – le/la/les – lui/leur – y – en"}, {"f": "Ich gebe es ihm.", "b": "Je le lui donne."}, {"f": "Es gibt welche.", "b": "Il y en a."}, {"f": "Pronomen bei Verb + Infinitiv", "b": "vor dem Infinitiv: Je vais le faire."}, {"f": "Pronomen im bejahten Imperativ", "b": "hinten mit Bindestrich: Regarde-le ! Donne-le-moi !"}, {"f": "Pronomen im verneinten Imperativ", "b": "vorne: Ne le regarde pas !"}, {"f": "betonte Pronomen", "b": "moi, toi, lui, elle, nous, vous, eux, elles (soi)"}, {"f": "bei mir zu Hause", "b": "chez moi"}, {"f": "Los geht's! / Geschafft!", "b": "On y va ! / Ça y est !"}, {"f": "Ich gehe weg. / Ich hab's satt.", "b": "Je m'en vais. / J'en ai marre."}, {"f": "Bitte sehr / Gern geschehen (höflich)", "b": "Je vous en prie."}, {"f": "Vous êtes prête, madame ?", "b": "vous zu einer Person: Verb Plural, Adjektiv Singular"}]}, {"nr": 9.5, "id": "k10", "title": "Das Verb im Überblick", "teil": "Das Verb und seine Ergänzungen", "intro": "Bevor es an die einzelnen Zeiten geht, verschaffst du dir hier einen Überblick: Verbgruppen, Personen und Anrede, das System der Zeiten und Modi – und warum man im Französischen so viele Formen schreibt, aber gleich ausspricht.", "sections": [{"h": "Drei Verbgruppen", "html": "<p>Französische Verben werden traditionell in drei Gruppen eingeteilt:<\/p><table><tr><th>Gruppe<\/th><th>Infinitiv<\/th><th>Beispiel<\/th><th>Anteil<\/th><\/tr><tr><td>1. Gruppe<\/td><td><em>-er<\/em><\/td><td><em>parler<\/em> sprechen<\/td><td>ca. 90 %, alle regelmäßig (außer <em>aller<\/em>)<\/td><\/tr><tr><td>2. Gruppe<\/td><td><em>-ir<\/em> mit <em>-iss-<\/em><\/td><td><em>finir<\/em> beenden → <em>nous finissons<\/em><\/td><td>ca. 300 Verben<\/td><\/tr><tr><td>3. Gruppe<\/td><td><em>-ir, -re, -oir<\/em><\/td><td><em>partir, prendre, voir<\/em><\/td><td>die „unregelmäßigen“ – wenige, aber sehr häufig<\/td><\/tr><\/table><p>Neue Verben kommen fast immer in die 1. Gruppe: <em>surfer, googler, liker, scanner<\/em>.<\/p><div class='tip'>Merke: Die 3. Gruppe ist klein, aber enthält die wichtigsten Verben: <em>être, avoir, aller, faire, dire, pouvoir, vouloir, savoir, venir, prendre, mettre, voir<\/em>. Die lohnt es sich auswendig zu lernen.<\/div>"}, {"h": "Personen und Anrede", "html": "<table><tr><th>Person<\/th><th>parler<\/th><th>Aussprache<\/th><th>Deutsch<\/th><\/tr><tr><td>je<\/td><td><em>parle<\/em><\/td><td>[parl]<\/td><td>ich spreche<\/td><\/tr><tr><td>tu<\/td><td><em>parles<\/em><\/td><td>[parl]<\/td><td>du sprichst<\/td><\/tr><tr><td>il / elle / on<\/td><td><em>parle<\/em><\/td><td>[parl]<\/td><td>er/sie/man spricht<\/td><\/tr><tr><td>nous<\/td><td><em>parlons<\/em><\/td><td>[parlõ]<\/td><td>wir sprechen<\/td><\/tr><tr><td>vous<\/td><td><em>parlez<\/em><\/td><td>[parle]<\/td><td>ihr sprecht / Sie sprechen<\/td><\/tr><tr><td>ils / elles<\/td><td><em>parlent<\/em><\/td><td>[parl]<\/td><td>sie sprechen<\/td><\/tr><\/table><p>Vier von sechs Formen klingen gleich! Deshalb kann das Subjektpronomen – anders als im Italienischen und Spanischen – nicht wegfallen.<\/p><p><b>Anrede<\/b>: <em>tu<\/em> (Familie, Freunde, Kinder, unter Jüngeren) und <em>vous<\/em> (höflich, auch für mehrere Personen). Ob man sich duzt, entscheidet traditionell die ältere oder ranghöhere Person: <em>On se tutoie ?<\/em> – Wollen wir uns duzen?<\/p><div class='warn'>Achtung: Im Französischen siezt man länger als im Spanischen – unter Kollegen, mit Nachbarn, oft sogar mit den Schwiegereltern.<\/div>"}, {"h": "Das System der Zeiten", "html": "<table><tr><th>Zeit<\/th><th>Beispiel<\/th><th>Gebrauch<\/th><\/tr><tr><td><em>présent<\/em><\/td><td><em>je parle<\/em><\/td><td>Gegenwart, Gewohnheit<\/td><\/tr><tr><td><em>passé composé<\/em><\/td><td><em>j'ai parlé<\/em><\/td><td>abgeschlossene Handlung in der Vergangenheit (gesprochen und geschrieben)<\/td><\/tr><tr><td><em>imparfait<\/em><\/td><td><em>je parlais<\/em><\/td><td>Hintergrund, Zustand, Gewohnheit in der Vergangenheit<\/td><\/tr><tr><td><em>plus-que-parfait<\/em><\/td><td><em>j'avais parlé<\/em><\/td><td>Vorvergangenheit<\/td><\/tr><tr><td><em>passé simple<\/em><\/td><td><em>je parlai<\/em><\/td><td>nur in Literatur und Geschichtsschreibung<\/td><\/tr><tr><td><em>futur proche<\/em><\/td><td><em>je vais parler<\/em><\/td><td>nahe Zukunft, Pläne<\/td><\/tr><tr><td><em>futur simple<\/em><\/td><td><em>je parlerai<\/em><\/td><td>Zukunft<\/td><\/tr><tr><td><em>futur antérieur<\/em><\/td><td><em>j'aurai parlé<\/em><\/td><td>vollendete Zukunft<\/td><\/tr><\/table><div class='tip'>Merke: <em>passé composé<\/em> ≈ ital. <em>passato prossimo<\/em> – aber im Französischen ist es <b>die<\/b> Erzählzeit des Alltags, wie das deutsche Perfekt. Den Unterschied zum <em>imparfait<\/em> kennst du aus dem Italienischen (<em>imperfetto<\/em>) und Spanischen (<em>indefinido/imperfecto<\/em>).<\/div>"}, {"h": "Die Modi", "html": "<table><tr><th>Modus<\/th><th>Beispiel<\/th><th>Funktion<\/th><\/tr><tr><td>Indikativ<\/td><td><em>il vient<\/em><\/td><td>Wirklichkeit, Tatsachen<\/td><\/tr><tr><td><em>subjonctif<\/em><\/td><td><em>qu'il vienne<\/em><\/td><td>nach Wunsch, Gefühl, Notwendigkeit, Zweifel<\/td><\/tr><tr><td><em>conditionnel<\/em><\/td><td><em>il viendrait<\/em><\/td><td>Höflichkeit, Bedingung, Vermutung<\/td><\/tr><tr><td>Imperativ<\/td><td><em>viens !<\/em><\/td><td>Aufforderung<\/td><\/tr><\/table><p>Dazu kommen die infiniten Formen: Infinitiv (<em>venir<\/em>), Partizip Präsens (<em>venant<\/em>), Partizip Perfekt (<em>venu<\/em>) und <em>gérondif<\/em> (<em>en venant<\/em>).<\/p><div class='tip'>Merke: Der <em>subjonctif<\/em> wird im Französischen fast nur im Präsens verwendet – der <em>subjonctif imparfait<\/em> ist literarisch. Das ist einfacher als im Spanischen und Italienischen!<\/div>"}, {"h": "Aussprache und Schreibung der Endungen", "html": "<p>Viele Endungen sind stumm. Unterschiedlich geschrieben, gleich gesprochen:<\/p><ul><li><em>parle, parles, parlent<\/em> = [parl]<\/li><li><em>parler, parlez, parlé, parlée(s)<\/em> = [parle]<\/li><li><em>parlais, parlait, parlaient<\/em> = [parlä]<\/li><\/ul><p>Das macht das Verstehen leicht, das Schreiben schwer. Ein Trick, um <em>-er<\/em>, <em>-é<\/em> und <em>-ez<\/em> zu unterscheiden: Ersetze das Verb durch ein Verb der 3. Gruppe, z. B. <em>vendre/vendu<\/em>:<\/p><ul><li><em>Je vais manger<\/em> → <em>Je vais vendre<\/em> → Infinitiv <em>-er<\/em><\/li><li><em>J'ai mangé<\/em> → <em>J'ai vendu<\/em> → Partizip <em>-é<\/em><\/li><\/ul><div class='warn'>Achtung: Typischer Fehler: <em>Je vais mangé<\/em> ✗ – nach Modalverb und Präposition steht immer der Infinitiv: <em>Je vais manger.<\/em><\/div>"}], "exercises": [{"type": "choice", "title": "Welche Gruppe?", "task": "Zu welcher Gruppe gehört das Verb?", "items": [{"q": "chanter", "options": ["1. Gruppe", "2. Gruppe", "3. Gruppe"], "a": 0, "why": "Verben auf -er (außer aller) = 1. Gruppe."}, {"q": "choisir (nous choisissons)", "options": ["1. Gruppe", "2. Gruppe", "3. Gruppe"], "a": 1, "why": "-ir mit -iss- = 2. Gruppe."}, {"q": "partir (nous partons)", "options": ["1. Gruppe", "2. Gruppe", "3. Gruppe"], "a": 2, "why": "-ir ohne -iss- = 3. Gruppe."}, {"q": "aller", "options": ["1. Gruppe", "2. Gruppe", "3. Gruppe"], "a": 2, "why": "aller ist die Ausnahme: 3. Gruppe."}, {"q": "prendre", "options": ["1. Gruppe", "2. Gruppe", "3. Gruppe"], "a": 2, "why": "-re = 3. Gruppe."}, {"q": "réussir (nous réussissons)", "options": ["1. Gruppe", "2. Gruppe", "3. Gruppe"], "a": 1, "why": "-iss- = 2. Gruppe."}]}, {"type": "choice", "title": "-er, -é oder -ez?", "task": "Welche Schreibung ist richtig?", "items": [{"q": "Je vais ___ demain.", "options": ["travailler", "travaillé", "travaillez"], "a": 0, "why": "Nach aller steht der Infinitiv."}, {"q": "Hier, j'ai ___ toute la journée.", "options": ["travailler", "travaillé", "travaillez"], "a": 1, "why": "passé composé → Partizip."}, {"q": "Vous ___ où ?", "options": ["travailler", "travaillé", "travaillez"], "a": 2, "why": "vous → -ez."}, {"q": "Il faut ___ ce soir.", "options": ["manger", "mangé", "mangez"], "a": 0, "why": "il faut + Infinitiv."}, {"q": "Elle a ___ un gâteau.", "options": ["acheter", "acheté", "achetez"], "a": 1, "why": "avoir + Partizip."}, {"q": "Avant de ___, lave-toi les mains.", "options": ["manger", "mangé", "mangez"], "a": 0, "why": "Nach Präposition steht der Infinitiv."}]}, {"type": "choice", "title": "Welche Zeit, welcher Modus?", "task": "Bestimme die Verbform.", "items": [{"q": "nous avons fini", "options": ["passé composé", "imparfait", "futur simple"], "a": 0, "why": "avoir + Partizip."}, {"q": "tu parlais", "options": ["présent", "imparfait", "conditionnel"], "a": 1, "why": "Endung -ais am Präsensstamm."}, {"q": "ils viendront", "options": ["futur simple", "conditionnel", "subjonctif"], "a": 0, "why": "Futurstamm viendr- + -ont."}, {"q": "je voudrais", "options": ["imparfait", "conditionnel", "futur"], "a": 1, "why": "Futurstamm + Imperfekt-Endung = conditionnel."}, {"q": "qu'il fasse", "options": ["subjonctif", "indicatif", "impératif"], "a": 0, "why": "faire → subjonctif fasse."}, {"q": "je vais partir", "options": ["futur proche", "passé récent", "présent"], "a": 0, "why": "aller + Infinitiv."}]}], "cards": [{"f": "1. Gruppe", "b": "Verben auf -er (90 %), regelmäßig – außer aller"}, {"f": "2. Gruppe", "b": "-ir mit -iss-: finir → nous finissons"}, {"f": "3. Gruppe", "b": "unregelmäßige Verben auf -ir, -re, -oir: partir, prendre, voir"}, {"f": "Warum ist das Subjektpronomen Pflicht?", "b": "Weil viele Formen gleich klingen: parle, parles, parlent"}, {"f": "tu oder vous?", "b": "tu vertraut · vous höflich oder Plural"}, {"f": "Wollen wir uns duzen?", "b": "On se tutoie ?"}, {"f": "Hauptzeit für Erzählungen im Alltag", "b": "passé composé (+ imparfait für Hintergrund)"}, {"f": "passé simple", "b": "nur Literatur und Geschichtsschreibung"}, {"f": "futur proche", "b": "aller + Infinitiv: je vais partir"}, {"f": "subjonctif imparfait", "b": "nur literarisch – im Alltag nur subjonctif présent"}, {"f": "parler / parlez / parlé – Aussprache", "b": "alle [parle]"}, {"f": "Trick -er oder -é?", "b": "durch vendre/vendu ersetzen: je vais vendre (-er), j'ai vendu (-é)"}, {"f": "Infinite Formen", "b": "Infinitiv, participe présent, participe passé, gérondif (en …ant)"}, {"f": "vier Modi", "b": "indicatif, subjonctif, conditionnel, impératif"}]}, {"nr": 10, "id": "k11", "title": "Das Präsens", "teil": "Das Verb und seine Ergänzungen", "intro": "Das présent ist die Basis für fast alle anderen Zeiten: Aus der nous-Form bildet man das imparfait, aus der ils-Form den subjonctif. Hier lernst du die regelmäßigen Muster, die Schreibbesonderheiten der -er-Verben und die wichtigsten unregelmäßigen Verben.", "sections": [{"h": "Verben auf -er (1. Gruppe)", "html": "<p>Stamm = Infinitiv ohne <em>-er<\/em>, dazu die Endungen <em>-e, -es, -e, -ons, -ez, -ent<\/em>:<\/p><table><tr><th>Person<\/th><th>parler<\/th><th>aimer<\/th><\/tr><tr><td>je<\/td><td><em>parle<\/em><\/td><td><em>j'aime<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>parles<\/em><\/td><td><em>aimes<\/em><\/td><\/tr><tr><td>il/elle/on<\/td><td><em>parle<\/em><\/td><td><em>aime<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>parlons<\/em><\/td><td><em>aimons<\/em><\/td><\/tr><tr><td>vous<\/td><td><em>parlez<\/em><\/td><td><em>aimez<\/em><\/td><\/tr><tr><td>ils/elles<\/td><td><em>parlent<\/em><\/td><td><em>aiment<\/em><\/td><\/tr><\/table><p>Ebenso: <em>habiter, travailler, chercher, regarder, écouter, donner, trouver, penser, jouer, étudier, oublier<\/em>.<\/p><div class='tip'>Merke: <em>je<\/em> wird vor Vokal und stummem h zu <em>j'<\/em>: <em>j'habite, j'écoute<\/em>. Bei <em>ils aiment<\/em> Liaison [ilzäm].<\/div>"}, {"h": "-er-Verben mit Schreibbesonderheiten", "html": "<p>Einige -er-Verben ändern den Stamm, um die Aussprache zu erhalten. Betroffen sind die „stammbetonten“ Formen <em>je, tu, il, ils<\/em> (Schuh-Verben):<\/p><table><tr><th>Typ<\/th><th>Beispiel<\/th><th>Formen<\/th><\/tr><tr><td><em>e → è<\/em><\/td><td><em>acheter<\/em><\/td><td><em>j'achète, tu achètes, il achète, nous achetons, vous achetez, ils achètent<\/em><\/td><\/tr><tr><td><em>é → è<\/em><\/td><td><em>préférer<\/em><\/td><td><em>je préfère, nous préférons, ils préfèrent<\/em><\/td><\/tr><tr><td><em>l → ll, t → tt<\/em><\/td><td><em>appeler, jeter<\/em><\/td><td><em>j'appelle, nous appelons; je jette, nous jetons<\/em><\/td><\/tr><tr><td><em>y → i<\/em><\/td><td><em>payer, envoyer, essayer<\/em><\/td><td><em>je paie, nous payons, ils paient<\/em><\/td><\/tr><\/table><p>Ebenso: <em>se lever, mener, se promener<\/em> (wie acheter); <em>espérer, répéter, compléter<\/em> (wie préférer); <em>s'appeler, rappeler<\/em> (wie appeler); <em>nettoyer, s'ennuyer<\/em> (y → i).<\/p><p>In der <b>nous-Form<\/b> ändern sich:<\/p><ul><li><em>-ger<\/em> → <em>-geons<\/em>: <em>manger → nous mangeons, nager, voyager, changer<\/em><\/li><li><em>-cer<\/em> → <em>-çons<\/em>: <em>commencer → nous commençons, lancer, placer<\/em><\/li><\/ul><div class='tip'>Merke: Bei <em>payer, essayer<\/em> sind beide Formen erlaubt: <em>je paie / je paye<\/em>.<\/div>"}, {"h": "Verben auf -ir der 2. Gruppe", "html": "<p>Diese Verben schieben im Plural <b>-iss-<\/b> ein:<\/p><table><tr><th>Person<\/th><th>finir<\/th><\/tr><tr><td>je<\/td><td><em>finis<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>finis<\/em><\/td><\/tr><tr><td>il/elle/on<\/td><td><em>finit<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>finissons<\/em><\/td><\/tr><tr><td>vous<\/td><td><em>finissez<\/em><\/td><\/tr><tr><td>ils/elles<\/td><td><em>finissent<\/em><\/td><\/tr><\/table><p>Ebenso: <em>choisir, réussir, réfléchir, grandir, grossir, maigrir, obéir, remplir, agir, rougir<\/em> – viele bezeichnen Veränderungen (<em>vieillir<\/em> – alt werden).<\/p><div class='tip'>Merke: Wie die ital. <em>-isc-<\/em>-Verben (<em>finisco<\/em>) – nur steht das Einschiebsel im Französischen im <b>Plural<\/b>.<\/div>"}, {"h": "Verben der 3. Gruppe: Muster", "html": "<p>Viele Verben der 3. Gruppe haben im Singular die Endungen <em>-s, -s, -t<\/em> und im Plural einen anderen Stamm:<\/p><table><tr><th>Muster<\/th><th>je / nous / ils<\/th><th>ebenso<\/th><\/tr><tr><td><em>partir<\/em><\/td><td><em>je pars, nous partons, ils partent<\/em><\/td><td><em>sortir, dormir, sentir, servir<\/em><\/td><\/tr><tr><td><em>attendre<\/em><\/td><td><em>j'attends, il attend, nous attendons<\/em><\/td><td><em>vendre, répondre, entendre, perdre, descendre<\/em><\/td><\/tr><tr><td><em>ouvrir<\/em><\/td><td><em>j'ouvre, nous ouvrons<\/em> (Endungen wie -er!)<\/td><td><em>offrir, découvrir, souffrir<\/em><\/td><\/tr><tr><td><em>connaître<\/em><\/td><td><em>je connais, il connaît, nous connaissons<\/em><\/td><td><em>paraître, disparaître<\/em><\/td><\/tr><tr><td><em>écrire<\/em><\/td><td><em>j'écris, nous écrivons<\/em><\/td><td><em>décrire<\/em><\/td><\/tr><tr><td><em>lire<\/em><\/td><td><em>je lis, nous lisons<\/em><\/td><td><em>conduire (conduisons), construire<\/em><\/td><\/tr><\/table><div class='warn'>Achtung: Bei <em>-dre<\/em>-Verben steht in der 3. Person Singular kein <em>-t<\/em>: <em>il attend, il vend, il répond<\/em> (das d bleibt).<\/div>"}, {"h": "être, avoir, aller, faire", "html": "<table><tr><th><\/th><th>être<\/th><th>avoir<\/th><th>aller<\/th><th>faire<\/th><\/tr><tr><td>je<\/td><td><em>suis<\/em><\/td><td><em>ai<\/em><\/td><td><em>vais<\/em><\/td><td><em>fais<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>es<\/em><\/td><td><em>as<\/em><\/td><td><em>vas<\/em><\/td><td><em>fais<\/em><\/td><\/tr><tr><td>il<\/td><td><em>est<\/em><\/td><td><em>a<\/em><\/td><td><em>va<\/em><\/td><td><em>fait<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>sommes<\/em><\/td><td><em>avons<\/em><\/td><td><em>allons<\/em><\/td><td><em>faisons<\/em> [föso]<\/td><\/tr><tr><td>vous<\/td><td><em>êtes<\/em><\/td><td><em>avez<\/em><\/td><td><em>allez<\/em><\/td><td><em>faites<\/em><\/td><\/tr><tr><td>ils<\/td><td><em>sont<\/em><\/td><td><em>ont<\/em><\/td><td><em>vont<\/em><\/td><td><em>font<\/em><\/td><\/tr><\/table><div class='warn'>Achtung: <em>ils sont<\/em> [sõ] (sie sind) – <em>ils ont<\/em> [ilzõ] (sie haben): Der Unterschied liegt im stimmhaften z der Liaison! Und: <em>vous faites, vous dites, vous êtes<\/em> – die einzigen vous-Formen ohne <em>-ez<\/em>.<\/div><p><b>avoir<\/b> in festen Wendungen, wo das Deutsche „sein“ verwendet:<\/p><ul><li><em>avoir faim / soif / froid / chaud / peur / sommeil<\/em> – Hunger, Durst haben, frieren, …<\/li><li><em>avoir raison / tort<\/em> – recht / unrecht haben<\/li><li><em>avoir 30 ans<\/em> – 30 Jahre alt sein<\/li><li><em>avoir mal à<\/em> – Schmerzen haben: <em>J'ai mal à la tête.<\/em><\/li><li><em>avoir besoin de, avoir envie de<\/em> – brauchen, Lust haben auf<\/li><\/ul>"}, {"h": "Modalverben: pouvoir, vouloir, devoir, savoir", "html": "<table><tr><th><\/th><th>pouvoir<\/th><th>vouloir<\/th><th>devoir<\/th><th>savoir<\/th><\/tr><tr><td>je<\/td><td><em>peux<\/em><\/td><td><em>veux<\/em><\/td><td><em>dois<\/em><\/td><td><em>sais<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>peux<\/em><\/td><td><em>veux<\/em><\/td><td><em>dois<\/em><\/td><td><em>sais<\/em><\/td><\/tr><tr><td>il<\/td><td><em>peut<\/em><\/td><td><em>veut<\/em><\/td><td><em>doit<\/em><\/td><td><em>sait<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>pouvons<\/em><\/td><td><em>voulons<\/em><\/td><td><em>devons<\/em><\/td><td><em>savons<\/em><\/td><\/tr><tr><td>vous<\/td><td><em>pouvez<\/em><\/td><td><em>voulez<\/em><\/td><td><em>devez<\/em><\/td><td><em>savez<\/em><\/td><\/tr><tr><td>ils<\/td><td><em>peuvent<\/em><\/td><td><em>veulent<\/em><\/td><td><em>doivent<\/em><\/td><td><em>savent<\/em><\/td><\/tr><\/table><ul><li><em>pouvoir<\/em> – können (Möglichkeit, Erlaubnis): <em>Je peux entrer ?<\/em><\/li><li><em>savoir<\/em> – können (gelernt), wissen: <em>Je sais nager. Je sais qu'il est là.<\/em><\/li><li><em>devoir<\/em> – müssen, sollen; auch: schulden: <em>Je te dois 10 euros.<\/em><\/li><li><em>vouloir<\/em> – wollen; höflich: <em>Je voudrais …<\/em> (ich möchte)<\/li><\/ul><div class='warn'>Achtung: <em>savoir<\/em> vs. <em>connaître<\/em>: <em>savoir<\/em> = Fakten, Fähigkeiten, + Nebensatz; <em>connaître<\/em> = Personen, Orte, Werke kennen: <em>Je connais Paris. Je sais où il habite.<\/em><\/div>"}, {"h": "Weitere wichtige unregelmäßige Verben", "html": "<table><tr><th>Verb<\/th><th>je<\/th><th>nous<\/th><th>ils<\/th><\/tr><tr><td><em>venir<\/em> kommen<\/td><td><em>viens<\/em><\/td><td><em>venons<\/em><\/td><td><em>viennent<\/em><\/td><\/tr><tr><td><em>tenir<\/em> halten<\/td><td><em>tiens<\/em><\/td><td><em>tenons<\/em><\/td><td><em>tiennent<\/em><\/td><\/tr><tr><td><em>prendre<\/em> nehmen<\/td><td><em>prends<\/em><\/td><td><em>prenons<\/em><\/td><td><em>prennent<\/em><\/td><\/tr><tr><td><em>mettre<\/em> legen, setzen<\/td><td><em>mets<\/em><\/td><td><em>mettons<\/em><\/td><td><em>mettent<\/em><\/td><\/tr><tr><td><em>dire<\/em> sagen<\/td><td><em>dis<\/em><\/td><td><em>disons<\/em> (vous <em>dites<\/em>)<\/td><td><em>disent<\/em><\/td><\/tr><tr><td><em>voir<\/em> sehen<\/td><td><em>vois<\/em><\/td><td><em>voyons<\/em><\/td><td><em>voient<\/em><\/td><\/tr><tr><td><em>croire<\/em> glauben<\/td><td><em>crois<\/em><\/td><td><em>croyons<\/em><\/td><td><em>croient<\/em><\/td><\/tr><tr><td><em>boire<\/em> trinken<\/td><td><em>bois<\/em><\/td><td><em>buvons<\/em><\/td><td><em>boivent<\/em><\/td><\/tr><tr><td><em>recevoir<\/em> erhalten<\/td><td><em>reçois<\/em><\/td><td><em>recevons<\/em><\/td><td><em>reçoivent<\/em><\/td><\/tr><tr><td><em>vivre<\/em> leben<\/td><td><em>vis<\/em><\/td><td><em>vivons<\/em><\/td><td><em>vivent<\/em><\/td><\/tr><tr><td><em>courir<\/em> laufen<\/td><td><em>cours<\/em><\/td><td><em>courons<\/em><\/td><td><em>courent<\/em><\/td><\/tr><tr><td><em>suivre<\/em> folgen<\/td><td><em>suis<\/em><\/td><td><em>suivons<\/em><\/td><td><em>suivent<\/em><\/td><\/tr><\/table><p>Wie <em>venir<\/em>: <em>devenir, revenir, se souvenir<\/em>; wie <em>prendre<\/em>: <em>apprendre, comprendre, surprendre<\/em>; wie <em>mettre<\/em>: <em>permettre, promettre<\/em>.<\/p><div class='tip'>Merke: <em>je suis<\/em> = ich bin (être) <b>und<\/b> ich folge (suivre). Der Kontext klärt: <em>Je suis le guide.<\/em><\/div><p>Unpersönliche Verben: <em>il faut<\/em> (man muss, falloir), <em>il pleut<\/em> (es regnet, pleuvoir), <em>il neige<\/em>.<\/p>"}, {"h": "Gebrauch des Präsens", "html": "<ul><li>Gegenwart und Gewohnheit: <em>Je travaille à Lyon. Le samedi, je fais les courses.<\/em><\/li><li>allgemeine Wahrheiten: <em>L'eau bout à 100 degrés.<\/em><\/li><li>nahe Zukunft (mit Zeitangabe): <em>Je pars demain.<\/em><\/li><li>Handlung, die andauert, mit <b>depuis<\/b> („seit“): <em>J'habite ici depuis dix ans.<\/em> – Ich wohne seit zehn Jahren hier.<\/li><li>historisches Präsens in Erzählungen<\/li><\/ul><div class='warn'>Achtung: Wie im Deutschen, Spanischen und Italienischen steht bei andauernden Handlungen mit <em>depuis<\/em> das Präsens: <em>J'apprends le français depuis un an.<\/em> – nicht passé composé!<\/div><p>Verlaufsform: <em>être en train de<\/em> + Infinitiv betont, dass etwas gerade geschieht: <em>Je suis en train de cuisiner.<\/em> – Ich koche gerade. (Siehe Kapitel 19.)<\/p>"}], "exercises": [{"type": "gap", "title": "Regelmäßige Verben", "task": "Setze das Verb im Präsens ein.", "items": [{"q": "Nous ___ à Berlin. (habiter)", "a": ["habitons"], "de": "Wir wohnen in Berlin."}, {"q": "Tu ___ la radio ? (écouter)", "a": ["écoutes"], "de": "Hörst du Radio?"}, {"q": "Les enfants ___ dans le jardin. (jouer)", "a": ["jouent"], "de": "Die Kinder spielen im Garten."}, {"q": "Je ___ mes devoirs. (finir)", "a": ["finis"], "de": "Ich mache meine Hausaufgaben fertig."}, {"q": "Vous ___ quel dessert ? (choisir)", "a": ["choisissez"], "de": "Welchen Nachtisch wählen Sie?"}, {"q": "Ils ___ toujours à leurs examens. (réussir)", "a": ["réussissent"], "de": "Sie bestehen immer ihre Prüfungen."}, {"q": "Elle ___ le bus. (attendre)", "a": ["attend"], "de": "Sie wartet auf den Bus."}, {"q": "Nous ___ la fenêtre. (ouvrir)", "a": ["ouvrons"], "de": "Wir öffnen das Fenster."}, {"q": "Je ___ demain matin. (partir)", "a": ["pars"], "de": "Ich fahre morgen früh ab."}]}, {"type": "gap", "title": "Schreibbesonderheiten", "task": "Achte auf Stammänderungen.", "items": [{"q": "J'___ du pain. (acheter)", "a": ["achète"], "de": "Ich kaufe Brot."}, {"q": "Nous ___ à huit heures. (manger)", "a": ["mangeons"], "de": "Wir essen um acht Uhr."}, {"q": "Comment tu t'___ ? (appeler)", "a": ["appelles"], "de": "Wie heißt du?"}, {"q": "Ils ___ le thé au café. (préférer)", "a": ["préfèrent"], "de": "Sie mögen Tee lieber als Kaffee."}, {"q": "Nous ___ le cours à neuf heures. (commencer)", "a": ["commençons"], "de": "Wir beginnen den Kurs um neun."}, {"q": "Je ___ par carte. (payer)", "a": ["paie", "paye"], "de": "Ich zahle mit Karte."}, {"q": "Elle se ___ tôt. (lever)", "a": ["lève"], "de": "Sie steht früh auf."}, {"q": "Vous ___ beaucoup ? (voyager)", "a": ["voyagez"], "de": "Reisen Sie viel?"}, {"q": "J'___ que tu vas bien. (espérer)", "a": ["espère"], "de": "Ich hoffe, dass es dir gut geht."}]}, {"type": "gap", "title": "être, avoir, aller, faire", "task": "Setze die richtige Form ein.", "items": [{"q": "Nous ___ fatigués. (être)", "a": ["sommes"], "de": "Wir sind müde."}, {"q": "Ils ___ deux enfants. (avoir)", "a": ["ont"], "de": "Sie haben zwei Kinder."}, {"q": "Vous ___ quoi ce week-end ? (faire)", "a": ["faites"], "de": "Was macht ihr am Wochenende?"}, {"q": "Ils ___ au cinéma. (aller)", "a": ["vont"], "de": "Sie gehen ins Kino."}, {"q": "Tu ___ quel âge ? (avoir)", "a": ["as"], "de": "Wie alt bist du?"}, {"q": "Ils ___ très gentils. (être)", "a": ["sont"], "de": "Sie sind sehr nett."}, {"q": "Je ___ bien, merci. (aller)", "a": ["vais"], "de": "Mir geht es gut, danke."}, {"q": "Il ___ beau aujourd'hui. (faire)", "a": ["fait"], "de": "Heute ist schönes Wetter."}]}, {"type": "gap", "title": "Unregelmäßige Verben", "task": "Setze das Verb im Präsens ein.", "items": [{"q": "Je ne ___ pas venir ce soir. (pouvoir)", "a": ["peux"], "de": "Ich kann heute Abend nicht kommen."}, {"q": "Ils ___ partir tout de suite. (vouloir)", "a": ["veulent"], "de": "Sie wollen sofort gehen."}, {"q": "Vous ___ prendre le train de 8 heures. (devoir)", "a": ["devez"], "de": "Sie müssen den Zug um 8 nehmen."}, {"q": "Tu ___ nager ? (savoir)", "a": ["sais"], "de": "Kannst du schwimmen?"}, {"q": "Ils ___ de Marseille. (venir)", "a": ["viennent"], "de": "Sie kommen aus Marseille."}, {"q": "Nous ___ le métro. (prendre)", "a": ["prenons"], "de": "Wir nehmen die U-Bahn."}, {"q": "Qu'est-ce que vous ___ ? (dire)", "a": ["dites"], "de": "Was sagen Sie?"}, {"q": "Ils ___ trop de café. (boire)", "a": ["boivent"], "de": "Sie trinken zu viel Kaffee."}, {"q": "Je ___ beaucoup de mails. (recevoir)", "a": ["reçois"], "de": "Ich bekomme viele Mails."}, {"q": "Ils ne ___ pas la réponse. (connaître)", "a": ["connaissent"], "de": "Sie kennen die Antwort nicht."}]}, {"type": "choice", "title": "savoir oder connaître?", "task": "Wähle das passende Verb.", "items": [{"q": "Tu ___ Marie ?", "options": ["sais", "connais"], "a": 1, "why": "Person kennen → connaître."}, {"q": "Je ___ jouer du piano.", "options": ["sais", "connais"], "a": 0, "why": "Fähigkeit → savoir."}, {"q": "Vous ___ où est la gare ?", "options": ["savez", "connaissez"], "a": 0, "why": "Nebensatz → savoir."}, {"q": "Il ___ bien Paris.", "options": ["sait", "connaît"], "a": 1, "why": "Ort kennen → connaître."}, {"q": "Je ne ___ pas pourquoi.", "options": ["sais", "connais"], "a": 0, "why": "Nebensatz → savoir."}, {"q": "Tu ___ ce livre ?", "options": ["sais", "connais"], "a": 1, "why": "Werk kennen → connaître."}]}, {"type": "choice", "title": "avoir oder être?", "task": "Wähle die richtige Wendung.", "items": [{"q": "Ich habe Hunger.", "options": ["Je suis faim.", "J'ai faim."], "a": 1, "why": "avoir faim."}, {"q": "Er ist 40 Jahre alt.", "options": ["Il est 40 ans.", "Il a 40 ans."], "a": 1, "why": "Alter mit avoir."}, {"q": "Du hast recht.", "options": ["Tu as raison.", "Tu es raison."], "a": 0, "why": "avoir raison."}, {"q": "Mir ist kalt.", "options": ["J'ai froid.", "Je suis froid."], "a": 0, "why": "avoir froid (je suis froid = ich bin gefühlskalt)."}, {"q": "Wir sind müde.", "options": ["Nous avons fatigués.", "Nous sommes fatigués."], "a": 1, "why": "Adjektiv → être."}, {"q": "Sie hat Angst.", "options": ["Elle a peur.", "Elle est peur."], "a": 0, "why": "avoir peur."}]}, {"type": "choice", "title": "depuis + Präsens", "task": "Wähle die richtige Übersetzung.", "items": [{"q": "Ich lerne seit zwei Jahren Französisch.", "options": ["J'apprends le français depuis deux ans.", "J'ai appris le français depuis deux ans."], "a": 0, "why": "Andauernde Handlung mit depuis → Präsens."}, {"q": "Sie wohnen seit 2015 in Nantes.", "options": ["Ils habitent à Nantes depuis 2015.", "Ils habitent à Nantes pour 2015."], "a": 0, "why": "seit = depuis."}, {"q": "Ich bin gerade beim Lesen.", "options": ["Je suis lisant.", "Je suis en train de lire."], "a": 1, "why": "Verlaufsform: être en train de."}, {"q": "Morgen fahre ich nach Rom.", "options": ["Demain, je pars pour Rome.", "Demain, je suis parti pour Rome."], "a": 0, "why": "Präsens mit Zeitangabe drückt wie im Deutschen die nahe Zukunft aus."}]}], "cards": [{"f": "Endungen der -er-Verben", "b": "-e, -es, -e, -ons, -ez, -ent"}, {"f": "Endungen der 2. Gruppe (finir)", "b": "-is, -is, -it, -issons, -issez, -issent"}, {"f": "acheter – je / nous", "b": "j'achète / nous achetons"}, {"f": "appeler – je / nous", "b": "j'appelle / nous appelons"}, {"f": "préférer – je / ils", "b": "je préfère / ils préfèrent"}, {"f": "manger, commencer – nous", "b": "nous mangeons, nous commençons"}, {"f": "payer – je / nous", "b": "je paie (paye) / nous payons"}, {"f": "être – Präsens", "b": "suis, es, est, sommes, êtes, sont"}, {"f": "avoir – Präsens", "b": "ai, as, a, avons, avez, ont"}, {"f": "aller – Präsens", "b": "vais, vas, va, allons, allez, vont"}, {"f": "faire – Präsens", "b": "fais, fais, fait, faisons, faites, font"}, {"f": "ils sont / ils ont – Aussprache", "b": "[ilsõ] / [ilzõ] – stimmhaftes z bei ont"}, {"f": "vous-Formen ohne -ez", "b": "vous êtes, vous faites, vous dites"}, {"f": "pouvoir / vouloir – je, ils", "b": "je peux, ils peuvent / je veux, ils veulent"}, {"f": "devoir – je, nous, ils", "b": "je dois, nous devons, ils doivent"}, {"f": "savoir / connaître", "b": "Fakten, Fähigkeiten, Nebensatz / Personen, Orte, Werke"}, {"f": "venir – je, nous, ils", "b": "je viens, nous venons, ils viennent"}, {"f": "prendre – je, nous, ils", "b": "je prends, nous prenons, ils prennent"}, {"f": "boire – je, nous, ils", "b": "je bois, nous buvons, ils boivent"}, {"f": "voir – je, nous, ils", "b": "je vois, nous voyons, ils voient"}, {"f": "dire – vous", "b": "vous dites"}, {"f": "il attend – warum kein -t?", "b": "-dre-Verben: il attend, il vend, il répond"}, {"f": "Ich bin 30.", "b": "J'ai 30 ans."}, {"f": "Hunger, Durst, Angst haben, frieren", "b": "avoir faim, soif, peur, froid"}, {"f": "seit + andauernde Handlung", "b": "Präsens + depuis: J'habite ici depuis dix ans."}, {"f": "je suis – zwei Bedeutungen", "b": "ich bin (être) / ich folge (suivre)"}]}, {"nr": 11, "id": "k12", "title": "Das passé composé", "teil": "Das Verb und seine Ergänzungen", "intro": "Das passé composé ist die wichtigste Vergangenheitszeit des Alltags – es entspricht dem deutschen Perfekt, wird aber auch in Zeitungen und Berichten verwendet. Die Knackpunkte: die Wahl zwischen avoir und être, die Partizipien der unregelmäßigen Verben und die Angleichung des Partizips.", "sections": [{"h": "Bildung mit avoir", "html": "<p>Die meisten Verben bilden das passé composé mit <em>avoir<\/em> + Partizip Perfekt (<em>participe passé<\/em>):<\/p><table><tr><th>Person<\/th><th>parler<\/th><th>finir<\/th><th>vendre<\/th><\/tr><tr><td>je<\/td><td><em>j'ai parlé<\/em><\/td><td><em>j'ai fini<\/em><\/td><td><em>j'ai vendu<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>as parlé<\/em><\/td><td><em>as fini<\/em><\/td><td><em>as vendu<\/em><\/td><\/tr><tr><td>il/elle<\/td><td><em>a parlé<\/em><\/td><td><em>a fini<\/em><\/td><td><em>a vendu<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>avons parlé<\/em><\/td><td><em>avons fini<\/em><\/td><td><em>avons vendu<\/em><\/td><\/tr><tr><td>vous<\/td><td><em>avez parlé<\/em><\/td><td><em>avez fini<\/em><\/td><td><em>avez vendu<\/em><\/td><\/tr><tr><td>ils<\/td><td><em>ont parlé<\/em><\/td><td><em>ont fini<\/em><\/td><td><em>ont vendu<\/em><\/td><\/tr><\/table><p>Regelmäßige Partizipien: <em>-er → -é<\/em>, <em>-ir → -i<\/em>, <em>-re → -u<\/em>.<\/p><div class='tip'>Merke: Auch <em>être<\/em> und <em>avoir<\/em> selbst bilden das passé composé mit avoir: <em>j'ai été<\/em> (ich bin gewesen), <em>j'ai eu<\/em> (ich habe gehabt).<\/div>"}, {"h": "Unregelmäßige Partizipien", "html": "<table><tr><th>Endung<\/th><th>Verben<\/th><\/tr><tr><td><em>-u<\/em><\/td><td><em>avoir → eu, boire → bu, croire → cru, devoir → dû, lire → lu, pouvoir → pu, savoir → su, voir → vu, vouloir → voulu, venir → venu, tenir → tenu, recevoir → reçu, connaître → connu, vivre → vécu, courir → couru, falloir → fallu, pleuvoir → plu<\/em><\/td><\/tr><tr><td><em>-is<\/em><\/td><td><em>prendre → pris, mettre → mis, apprendre → appris, comprendre → compris, asseoir → assis<\/em><\/td><\/tr><tr><td><em>-it<\/em><\/td><td><em>dire → dit, écrire → écrit, faire → fait, conduire → conduit, construire → construit<\/em><\/td><\/tr><tr><td><em>-ert<\/em><\/td><td><em>ouvrir → ouvert, offrir → offert, découvrir → découvert, souffrir → souffert<\/em><\/td><\/tr><tr><td>Sonstige<\/td><td><em>être → été, naître → né, mourir → mort, rire → ri, suivre → suivi<\/em><\/td><\/tr><\/table><div class='warn'>Achtung: <em>dû<\/em> trägt den Zirkumflex nur im maskulinen Singular, zur Unterscheidung von <em>du<\/em>: <em>due, dus, dues<\/em>.<\/div><div class='tip'>Merke: Die Endung des Partizips verrät die feminine Aussprache: <em>pris → prise<\/em> [pris], <em>fait → faite<\/em> [fät], <em>ouvert → ouverte<\/em>. Daran hört man die Angleichung.<\/div>"}, {"h": "Bildung mit être", "html": "<p>Mit <em>être<\/em> bilden das passé composé:<\/p><ol><li><b>Verben der Bewegung und des Zustandswechsels<\/b> (ohne direktes Objekt) – die „Haus-Verben“:<\/li><\/ol><table><tr><th>Paar<\/th><th>Partizipien<\/th><\/tr><tr><td><em>aller – venir<\/em><\/td><td><em>allé – venu<\/em> (auch <em>devenir, revenir<\/em>)<\/td><\/tr><tr><td><em>arriver – partir<\/em><\/td><td><em>arrivé – parti<\/em><\/td><\/tr><tr><td><em>entrer – sortir<\/em><\/td><td><em>entré – sorti<\/em> (auch <em>rentrer<\/em>)<\/td><\/tr><tr><td><em>monter – descendre<\/em><\/td><td><em>monté – descendu<\/em><\/td><\/tr><tr><td><em>naître – mourir<\/em><\/td><td><em>né – mort<\/em><\/td><\/tr><tr><td><em>rester – tomber – passer – retourner<\/em><\/td><td><em>resté, tombé, passé, retourné<\/em><\/td><\/tr><\/table><ol start='2'><li><b>alle reflexiven Verben<\/b>: <em>je me suis levé, elle s'est trompée<\/em> (siehe Kapitel 21).<\/li><\/ol><div class='tip'>Merke: Eselsbrücke <b>DR MRS VANDERTRAMP<\/b>: Devenir, Revenir, Monter, Rester, Sortir, Venir, Aller, Naître, Descendre, Entrer, Rentrer, Tomber, Retourner, Arriver, Mourir, Partir.<\/div><div class='warn'>Achtung: Anders als im Deutschen: <em>marcher, courir, voyager, nager<\/em> bilden mit <em>avoir<\/em>: <em>J'ai couru. Nous avons voyagé.<\/em> Und anders als im Italienischen: <em>être<\/em> selbst mit avoir: <em>j'ai été<\/em> (ital. <em>sono stato<\/em>).<\/div>"}, {"h": "Angleichung bei être", "html": "<p>Bei <em>être<\/em> wird das Partizip an das <b>Subjekt<\/b> angeglichen – wie ein Adjektiv:<\/p><table><tr><th>Subjekt<\/th><th>Form<\/th><\/tr><tr><td><em>il<\/em><\/td><td><em>il est parti<\/em><\/td><\/tr><tr><td><em>elle<\/em><\/td><td><em>elle est partie<\/em><\/td><\/tr><tr><td><em>ils<\/em><\/td><td><em>ils sont partis<\/em><\/td><\/tr><tr><td><em>elles<\/em><\/td><td><em>elles sont parties<\/em><\/td><\/tr><tr><td><em>je<\/em> (Frau)<\/td><td><em>je suis partie<\/em><\/td><\/tr><tr><td><em>vous<\/em> (eine Frau, höflich)<\/td><td><em>vous êtes partie<\/em><\/td><\/tr><\/table><ul><li><em>Marie est née en 1990.<\/em><\/li><li><em>Mes parents sont restés à la maison.<\/em><\/li><li><em>Nous sommes arrivés hier<\/em> (gemischte Gruppe → maskulin).<\/li><\/ul><div class='tip'>Merke: Meist hört man die Angleichung nicht (<em>parti/partie<\/em> klingen gleich) – aber schriftlich ist sie Pflicht. Hörbar ist sie bei <em>mort/morte<\/em>.<\/div>"}, {"h": "Verben mit être oder avoir", "html": "<p><em>monter, descendre, sortir, rentrer, passer, retourner<\/em> können ein <b>direktes Objekt<\/b> haben. Dann stehen sie mit <em>avoir<\/em> und ändern die Bedeutung:<\/p><table><tr><th>mit être (ohne Objekt)<\/th><th>mit avoir (mit Objekt)<\/th><\/tr><tr><td><em>Je suis monté au 3<sup>e<\/sup> étage.<\/em> – Ich bin hinaufgegangen.<\/td><td><em>J'ai monté les valises.<\/em> – Ich habe die Koffer hinaufgetragen.<\/td><\/tr><tr><td><em>Elle est descendue.<\/em> – Sie ist heruntergekommen.<\/td><td><em>Elle a descendu l'escalier.<\/em> – Sie ist die Treppe hinuntergegangen.<\/td><\/tr><tr><td><em>Il est sorti.<\/em> – Er ist ausgegangen.<\/td><td><em>Il a sorti le chien.<\/em> – Er hat den Hund ausgeführt.<\/td><\/tr><tr><td><em>Nous sommes rentrés tard.<\/em> – Wir sind spät heimgekommen.<\/td><td><em>Nous avons rentré la voiture.<\/em> – Wir haben das Auto hineingefahren.<\/td><\/tr><tr><td><em>Il est passé chez moi.<\/em> – Er ist bei mir vorbeigekommen.<\/td><td><em>J'ai passé une semaine à Nice.<\/em> – Ich habe eine Woche in Nizza verbracht.<\/td><\/tr><\/table>"}, {"h": "Angleichung bei avoir", "html": "<p>Bei <em>avoir<\/em> bleibt das Partizip normalerweise <b>unverändert<\/b>: <em>Elle a mangé. Ils ont fini.<\/em><\/p><p><b>Ausnahme<\/b>: Steht das <b>direkte Objekt vor<\/b> dem Verb, wird das Partizip an dieses Objekt angeglichen. Das passiert<\/p><ul><li>bei Objektpronomen: <em>La lettre ? Je l'ai écrite.<\/em> <em>Tes clés ? Je les ai trouvées.<\/em><\/li><li>im Relativsatz mit <em>que<\/em>: <em>Les photos que j'ai prises sont belles.<\/em><\/li><li>in Fragen mit <em>quel / combien<\/em>: <em>Quelle robe as-tu choisie ?<\/em><\/li><\/ul><div class='warn'>Achtung: Keine Angleichung bei <em>en<\/em> und bei indirekten Objekten: <em>Des pommes ? J'en ai mangé.<\/em> <em>Je leur ai parlé.<\/em><\/div><div class='tip'>Merke: Bei <em>prendre, mettre, faire, écrire, ouvrir<\/em> hört man die Angleichung: <em>la photo que j'ai prise<\/em> [pris], <em>la porte, il l'a ouverte<\/em>.<\/div>"}, {"h": "Stellung von Verneinung, Pronomen und Adverbien", "html": "<ul><li>Verneinung umschließt das Hilfsverb: <em>Je n'ai pas compris. Il n'est jamais venu.<\/em><\/li><li>Objektpronomen stehen vor dem Hilfsverb: <em>Je l'ai vu. Je ne lui ai pas répondu. Il y est allé.<\/em><\/li><li>Kurze Adverbien stehen zwischen Hilfsverb und Partizip: <em>J'ai bien dormi. Il a beaucoup travaillé. Tu as déjà mangé ? J'ai mal compris.<\/em><\/li><li>Inversion mit dem Hilfsverb: <em>As-tu fini ? Est-elle partie ?<\/em><\/li><\/ul><div class='warn'>Achtung: Zeitadverbien wie <em>hier, aujourd'hui, demain<\/em> und längere Adverbien auf <em>-ment<\/em> stehen meist am Ende: <em>Je suis arrivé hier. Il a répondu rapidement.<\/em><\/div>"}, {"h": "Gebrauch des passé composé", "html": "<p>Das passé composé drückt <b>abgeschlossene Handlungen<\/b> in der Vergangenheit aus:<\/p><ul><li>einmalige Ereignisse: <em>Hier, j'ai vu un bon film.<\/em><\/li><li>Abfolge von Handlungen: <em>Il est entré, il a enlevé son manteau et il s'est assis.<\/em><\/li><li>Handlungen mit Zeitangabe zur Dauer: <em>J'ai habité dix ans à Paris.<\/em> (abgeschlossen)<\/li><li>plötzliche Ereignisse: <em>Soudain, le téléphone a sonné.<\/em><\/li><li>Ergebnis in der Gegenwart: <em>J'ai perdu mes clés.<\/em><\/li><\/ul><div class='tip'>Merke: Anders als im Spanischen (<em>perfecto<\/em> vs. <em>indefinido<\/em>) unterscheidet das gesprochene Französisch nicht zwischen „heute“ und „gestern“ – beides ist passé composé: <em>Ce matin j'ai bu un café, l'année dernière je suis allé au Canada.<\/em><\/div><p>Zum Gegensatz zum <em>imparfait<\/em> siehe Kapitel 12.<\/p>"}], "exercises": [{"type": "gap", "title": "Partizipien", "task": "Setze das Partizip Perfekt ein.", "items": [{"q": "J'ai ___ un livre. (lire)", "a": ["lu"], "de": "Ich habe ein Buch gelesen."}, {"q": "Nous avons ___ le train. (prendre)", "a": ["pris"], "de": "Wir haben den Zug genommen."}, {"q": "Tu as ___ ce film ? (voir)", "a": ["vu"], "de": "Hast du diesen Film gesehen?"}, {"q": "Il a ___ la vérité. (dire)", "a": ["dit"], "de": "Er hat die Wahrheit gesagt."}, {"q": "Elle a ___ la fenêtre. (ouvrir)", "a": ["ouvert"], "de": "Sie hat das Fenster geöffnet."}, {"q": "Ils ont ___ du vin. (boire)", "a": ["bu"], "de": "Sie haben Wein getrunken."}, {"q": "J'ai ___ partir. (devoir)", "a": ["dû", "du"], "de": "Ich musste gehen."}, {"q": "Vous avez ___ vos devoirs ? (faire)", "a": ["fait"], "de": "Habt ihr eure Hausaufgaben gemacht?"}, {"q": "J'ai ___ malade. (être)", "a": ["été"], "de": "Ich war krank."}, {"q": "On a ___ de la chance. (avoir)", "a": ["eu"], "de": "Wir hatten Glück."}, {"q": "Il a ___ toute la nuit. (pleuvoir)", "a": ["plu"], "de": "Es hat die ganze Nacht geregnet."}]}, {"type": "choice", "title": "avoir oder être?", "task": "Wähle das richtige Hilfsverb.", "items": [{"q": "Nous ___ allés au marché.", "options": ["avons", "sommes"], "a": 1, "why": "aller → être."}, {"q": "Elle ___ beaucoup voyagé.", "options": ["a", "est"], "a": 0, "why": "voyager → avoir."}, {"q": "Ils ___ restés à la maison.", "options": ["ont", "sont"], "a": 1, "why": "rester → être."}, {"q": "J'___ couru un marathon.", "options": ["ai", "suis"], "a": 0, "why": "courir → avoir."}, {"q": "Tu ___ tombé ?", "options": ["as", "es"], "a": 1, "why": "tomber → être."}, {"q": "Elle ___ sorti la poubelle.", "options": ["a", "est"], "a": 0, "why": "sortir mit direktem Objekt → avoir."}, {"q": "Je me ___ réveillé tard.", "options": ["ai", "suis"], "a": 1, "why": "Reflexive Verben → être."}, {"q": "Il ___ été très content.", "options": ["a", "est"], "a": 0, "why": "être → avoir été."}, {"q": "Nous ___ passé de bonnes vacances.", "options": ["avons", "sommes"], "a": 0, "why": "passer + Objekt (verbringen) → avoir."}]}, {"type": "gap", "title": "Angleichung bei être", "task": "Setze das Partizip mit der richtigen Endung ein.", "items": [{"q": "Marie est ___ à Lyon. (naître)", "a": ["née"], "de": "Marie ist in Lyon geboren."}, {"q": "Mes amis sont ___ hier. (arriver)", "a": ["arrivés"], "de": "Meine Freunde sind gestern angekommen."}, {"q": "Les filles sont ___ au cinéma. (aller)", "a": ["allées"], "de": "Die Mädchen sind ins Kino gegangen."}, {"q": "Elle est ___ dans l'escalier. (tomber)", "a": ["tombée"], "de": "Sie ist auf der Treppe gestürzt."}, {"q": "Madame, vous êtes ___ quand ? (partir)", "a": ["partie"], "de": "Wann sind Sie abgereist, gnädige Frau?"}, {"q": "Nous sommes ___ (Gruppe gemischt) tard. (rentrer)", "a": ["rentrés"], "de": "Wir sind spät heimgekommen."}, {"q": "Sa grand-mère est ___ l'an dernier. (mourir)", "a": ["morte"], "de": "Seine Großmutter ist letztes Jahr gestorben."}]}, {"type": "choice", "title": "Angleichung bei avoir", "task": "Welche Schreibung ist richtig?", "items": [{"q": "Ta lettre ? Je l'ai ___.", "options": ["lu", "lue"], "a": 1, "why": "Direktes Objekt (la) vorher → Angleichung."}, {"q": "Elle a ___ deux pommes.", "options": ["mangé", "mangées"], "a": 0, "why": "Objekt steht danach → keine Angleichung."}, {"q": "Les photos que tu as ___ sont super.", "options": ["pris", "prises"], "a": 1, "why": "que = les photos, vorangestellt → prises."}, {"q": "Des fraises ? J'en ai ___.", "options": ["acheté", "achetées"], "a": 0, "why": "Keine Angleichung bei en."}, {"q": "Mes sœurs ? Je leur ai ___.", "options": ["téléphoné", "téléphonées"], "a": 0, "why": "leur ist indirektes Objekt → keine Angleichung."}, {"q": "Quelle voiture as-tu ___ ?", "options": ["choisi", "choisie"], "a": 1, "why": "quelle voiture steht vorne → choisie."}, {"q": "Les clés ? Je les ai ___.", "options": ["trouvé", "trouvées"], "a": 1, "why": "les (f. Pl.) vorher → trouvées."}]}, {"type": "gap", "title": "Erzähle im passé composé", "task": "Setze das Verb ins passé composé.", "items": [{"q": "Hier, je ___ au travail à vélo. (aller)", "a": ["suis allé", "suis allée"], "de": "Gestern bin ich mit dem Rad zur Arbeit gefahren."}, {"q": "Nous ___ un bon restaurant. (trouver)", "a": ["avons trouvé"], "de": "Wir haben ein gutes Restaurant gefunden."}, {"q": "Ils ___ le problème. (ne pas comprendre)", "a": ["n'ont pas compris"], "de": "Sie haben das Problem nicht verstanden."}, {"q": "Elle ___ à 8 heures. (se lever)", "a": ["s'est levée"], "de": "Sie ist um 8 Uhr aufgestanden."}, {"q": "Tu ___ mon message ? (recevoir)", "a": ["as reçu"], "de": "Hast du meine Nachricht bekommen?"}, {"q": "Vous ___ en Italie ? (vivre)", "a": ["avez vécu"], "de": "Haben Sie in Italien gelebt?"}, {"q": "On ___ trop tard. (partir)", "a": ["est parti", "est partis", "est parties"], "de": "Wir sind zu spät losgefahren."}]}], "cards": [{"f": "Bildung passé composé", "b": "avoir/être (Präsens) + participe passé"}, {"f": "Regelmäßige Partizipien", "b": "-er → -é, -ir → -i, -re → -u"}, {"f": "prendre, mettre – Partizip", "b": "pris, mis"}, {"f": "faire, dire, écrire – Partizip", "b": "fait, dit, écrit"}, {"f": "voir, lire, boire, croire – Partizip", "b": "vu, lu, bu, cru"}, {"f": "avoir, être – Partizip", "b": "eu, été"}, {"f": "ouvrir, offrir – Partizip", "b": "ouvert, offert"}, {"f": "pouvoir, vouloir, devoir, savoir – Partizip", "b": "pu, voulu, dû, su"}, {"f": "naître, mourir, vivre – Partizip", "b": "né, mort, vécu"}, {"f": "Welche Verben mit être?", "b": "Bewegung/Zustandswechsel (DR MRS VANDERTRAMP) + alle reflexiven Verben"}, {"f": "DR MRS VANDERTRAMP", "b": "devenir, revenir, monter, rester, sortir, venir, aller, naître, descendre, entrer, rentrer, tomber, retourner, arriver, mourir, partir"}, {"f": "Ich bin gewesen.", "b": "J'ai été. (mit avoir!)"}, {"f": "courir, voyager, marcher – Hilfsverb?", "b": "avoir: j'ai couru"}, {"f": "Angleichung bei être", "b": "an das Subjekt: elle est partie, ils sont venus"}, {"f": "Angleichung bei avoir", "b": "nur an vorangestelltes direktes Objekt: je les ai vues"}, {"f": "Angleichung bei en?", "b": "Nein: J'en ai mangé."}, {"f": "sortir mit être / avoir", "b": "il est sorti (ausgegangen) / il a sorti le chien (ausgeführt)"}, {"f": "passer mit être / avoir", "b": "il est passé (vorbeigekommen) / j'ai passé une semaine (verbracht)"}, {"f": "Verneinung im passé composé", "b": "Je n'ai pas compris."}, {"f": "Stellung kurzer Adverbien", "b": "zwischen Hilfsverb und Partizip: J'ai bien dormi."}, {"f": "Gebrauch passé composé", "b": "abgeschlossene Handlung, Abfolge, plötzliches Ereignis"}, {"f": "dû / due", "b": "Zirkumflex nur im m. Sg."}]}, {"nr": 12, "id": "k13", "title": "Das imparfait und der Kontrast zum passé composé", "teil": "Das Verb und seine Ergänzungen", "intro": "Das imparfait beschreibt, wie etwas war: Hintergrund, Zustände, Gewohnheiten. Das passé composé erzählt, was passiert ist. Wer Italienisch (imperfetto/passato prossimo) oder Spanisch (imperfecto/indefinido) kann, kennt das Prinzip schon – die Regeln sind fast identisch.", "sections": [{"h": "Bildung des imparfait", "html": "<p>Stamm = <em>nous<\/em>-Form des Präsens ohne <em>-ons<\/em>. Endungen für alle Verben gleich: <em>-ais, -ais, -ait, -ions, -iez, -aient<\/em>.<\/p><table><tr><th>Person<\/th><th>parler (nous parl-ons)<\/th><th>finir (nous finiss-ons)<\/th><th>prendre (nous pren-ons)<\/th><\/tr><tr><td>je<\/td><td><em>parlais<\/em><\/td><td><em>finissais<\/em><\/td><td><em>prenais<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>parlais<\/em><\/td><td><em>finissais<\/em><\/td><td><em>prenais<\/em><\/td><\/tr><tr><td>il/elle<\/td><td><em>parlait<\/em><\/td><td><em>finissait<\/em><\/td><td><em>prenait<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>parlions<\/em><\/td><td><em>finissions<\/em><\/td><td><em>prenions<\/em><\/td><\/tr><tr><td>vous<\/td><td><em>parliez<\/em><\/td><td><em>finissiez<\/em><\/td><td><em>preniez<\/em><\/td><\/tr><tr><td>ils<\/td><td><em>parlaient<\/em><\/td><td><em>finissaient<\/em><\/td><td><em>prenaient<\/em><\/td><\/tr><\/table><p>So auch die unregelmäßigen Verben: <em>faire → nous faisons → je faisais; boire → je buvais; voir → je voyais; avoir → j'avais; aller → j'allais<\/em>.<\/p><div class='warn'>Einzige Ausnahme: <em>être → j'étais, tu étais, il était, nous étions, vous étiez, ils étaient<\/em>.<\/div><div class='tip'>Merke: <em>-ais, -ait, -aient<\/em> klingen gleich [ä]. Bei <em>manger, commencer<\/em> bleibt die Schreibänderung vor a: <em>je mangeais, je commençais<\/em> – aber <em>nous mangions, nous commencions<\/em>.<\/div>"}, {"h": "Gebrauch: Beschreibung und Hintergrund", "html": "<p>Das imparfait beschreibt<\/p><ul><li><b>Zustände und Situationen<\/b>: <em>Il faisait beau. La maison était grande.<\/em><\/li><li><b>Personen<\/b> (Aussehen, Alter, Gefühle): <em>Elle avait 20 ans et elle était très timide.<\/em><\/li><li><b>Hintergrund<\/b> einer Geschichte: <em>Il était minuit, tout le monde dormait.<\/em><\/li><li><b>Gedanken und Wissen<\/b>: <em>Je croyais que tu étais malade. Je ne savais pas.<\/em><\/li><li><b>Uhrzeit und Wetter<\/b>: <em>Il était huit heures. Il pleuvait.<\/em><\/li><\/ul><div class='tip'>Merke: Das imparfait ist der „Film im Hintergrund“ – es hat keinen klaren Anfang und kein klares Ende.<\/div>"}, {"h": "Gebrauch: Gewohnheiten", "html": "<p>Was man früher regelmäßig tat, steht im imparfait (deutsch oft „früher“, „immer“, „pflegte zu“):<\/p><ul><li><em>Quand j'étais petit, je passais mes vacances chez ma grand-mère.<\/em> – Als ich klein war, verbrachte ich meine Ferien bei meiner Oma.<\/li><li><em>Tous les dimanches, nous allions au marché.<\/em><\/li><li><em>Avant, il fumait beaucoup.<\/em> – Früher rauchte er viel.<\/li><\/ul><p>Signalwörter: <em>autrefois, avant, à l'époque, d'habitude, toujours, souvent, tous les jours, chaque été, le lundi<\/em>.<\/p><div class='warn'>Achtung: Signalwörter sind nur eine Hilfe. <em>Il est souvent venu me voir<\/em> (passé composé) betont die Gesamtheit der abgeschlossenen Besuche; das imparfait <em>il venait souvent<\/em> beschreibt die Gewohnheit.<\/div>"}, {"h": "Der Kontrast: Hintergrund und Handlung", "html": "<table><tr><th>imparfait<\/th><th>passé composé<\/th><\/tr><tr><td>Wie war es? Was war los?<\/td><td>Was ist passiert? Und dann?<\/td><\/tr><tr><td>Hintergrund, Situation<\/td><td>Ereignis, das eintritt<\/td><\/tr><tr><td>Gewohnheit<\/td><td>einmalige Handlung<\/td><\/tr><tr><td>laufende Handlung<\/td><td>neue Handlung, die sie unterbricht<\/td><\/tr><tr><td>unbestimmte Dauer<\/td><td>begrenzte, abgeschlossene Dauer<\/td><\/tr><\/table><p>Typisch: Eine laufende Handlung (imparfait) wird durch ein Ereignis (passé composé) unterbrochen:<\/p><ul><li><em>Je prenais ma douche quand le téléphone a sonné.<\/em> – Ich duschte gerade, als das Telefon klingelte.<\/li><li><em>Nous dînions quand Paul est arrivé.<\/em><\/li><\/ul><p>Gleichzeitige Hintergrundhandlungen: <em>Pendant que je lisais, il regardait la télé.<\/em><\/p><p>Abfolge von Ereignissen: <em>Il s'est levé, il a pris un café et il est parti.<\/em><\/p><div class='tip'>Merke: Wie ital. <em>Mentre facevo la doccia, è squillato il telefono<\/em> und span. <em>Mientras me duchaba, sonó el teléfono.<\/em><\/div>"}, {"h": "Bedeutungswechsel bei bestimmten Verben", "html": "<p>Bei Verben des Wissens, Könnens und Seins ändert sich die Nuance:<\/p><table><tr><th>Verb<\/th><th>imparfait<\/th><th>passé composé<\/th><\/tr><tr><td><em>savoir<\/em><\/td><td><em>Je savais.<\/em> – Ich wusste (es).<\/td><td><em>J'ai su.<\/em> – Ich habe es erfahren.<\/td><\/tr><tr><td><em>connaître<\/em><\/td><td><em>Je le connaissais.<\/em> – Ich kannte ihn.<\/td><td><em>Je l'ai connu à Paris.<\/em> – Ich habe ihn in Paris kennengelernt.<\/td><\/tr><tr><td><em>pouvoir<\/em><\/td><td><em>Je pouvais venir.<\/em> – Ich hätte kommen können / durfte.<\/td><td><em>J'ai pu venir.<\/em> – Ich habe es geschafft zu kommen.<\/td><\/tr><tr><td><em>vouloir<\/em><\/td><td><em>Je voulais partir.<\/em> – Ich wollte (Absicht).<\/td><td><em>J'ai voulu partir.<\/em> – Ich wollte (und habe es versucht).<\/td><\/tr><tr><td><em>devoir<\/em><\/td><td><em>Je devais travailler.<\/em> – Ich sollte / musste (eigentlich).<\/td><td><em>J'ai dû travailler.<\/em> – Ich musste (und tat es).<\/td><\/tr><tr><td><em>être<\/em><\/td><td><em>Il était malade.<\/em> – Er war krank (Zustand).<\/td><td><em>Il a été malade une semaine.<\/em> – Er war eine Woche krank (abgeschlossen).<\/td><\/tr><\/table><div class='tip'>Merke: <em>J'ai dû me tromper.<\/em> = Ich muss mich geirrt haben (Vermutung).<\/div>"}, {"h": "Besondere Verwendungen des imparfait", "html": "<ul><li><b>Höflichkeit<\/b>: <em>Je voulais vous demander …<\/em> – Ich wollte Sie fragen …<\/li><li><b>Vorschlag<\/b> mit <em>si<\/em>: <em>Si on allait au cinéma ?<\/em> – Wie wär's, wenn wir ins Kino gingen?<\/li><li><b>Wunsch / Bedauern<\/b>: <em>Si seulement j'avais le temps !<\/em> – Wenn ich nur Zeit hätte!<\/li><li><b>Bedingung<\/b> (irreal, siehe Kapitel 16): <em>Si j'étais riche, je voyagerais.<\/em><\/li><li><b>Nahe Vergangenheit / Zukunft in der Vergangenheit<\/b>: <em>Il venait de partir. J'allais t'appeler.<\/em> – Er war gerade gegangen. Ich wollte dich gerade anrufen.<\/li><\/ul><div class='warn'>Achtung: In der indirekten Rede wird das Präsens zum imparfait: <em>Il a dit qu'il était fatigué.<\/em> (siehe Kapitel 20).<\/div>"}, {"h": "Signalwörter im Überblick", "html": "<table><tr><th>eher imparfait<\/th><th>eher passé composé<\/th><\/tr><tr><td><em>autrefois, avant, à l'époque<\/em><\/td><td><em>hier, la semaine dernière, en 2010<\/em><\/td><\/tr><tr><td><em>d'habitude, toujours, souvent<\/em><\/td><td><em>un jour, ce jour-là, une fois<\/em><\/td><\/tr><tr><td><em>tous les jours, chaque année, le lundi<\/em><\/td><td><em>soudain, tout à coup, brusquement<\/em><\/td><\/tr><tr><td><em>pendant que<\/em> (während)<\/td><td><em>d'abord, ensuite, puis, enfin<\/em><\/td><\/tr><tr><td><em>en général, normalement<\/em><\/td><td><em>pendant trois ans<\/em> (abgeschlossen)<\/td><\/tr><\/table><div class='tip'>Merke: <em>pendant que<\/em> + imparfait (während, gleichzeitig) – <em>pendant<\/em> + Zeitraum + passé composé (abgeschlossene Dauer): <em>J'ai travaillé pendant deux heures.<\/em><\/div>"}], "exercises": [{"type": "gap", "title": "Bildung des imparfait", "task": "Setze das Verb ins imparfait.", "items": [{"q": "Quand j'étais petit, j'___ à la campagne. (habiter)", "a": ["habitais"], "de": "Als ich klein war, wohnte ich auf dem Land."}, {"q": "Nous ___ souvent au tennis. (jouer)", "a": ["jouions"], "de": "Wir spielten oft Tennis."}, {"q": "Il ___ très froid. (faire)", "a": ["faisait"], "de": "Es war sehr kalt."}, {"q": "Vous ___ où avant ? (travailler)", "a": ["travailliez"], "de": "Wo haben Sie früher gearbeitet?"}, {"q": "Elles ___ toujours en retard. (être)", "a": ["étaient"], "de": "Sie waren immer zu spät."}, {"q": "Je ___ beaucoup de lait. (boire)", "a": ["buvais"], "de": "Ich trank viel Milch."}, {"q": "Tu ___ beaucoup. (manger)", "a": ["mangeais"], "de": "Du hast viel gegessen."}, {"q": "Ils ___ deux chiens. (avoir)", "a": ["avaient"], "de": "Sie hatten zwei Hunde."}, {"q": "On ___ la mer de notre fenêtre. (voir)", "a": ["voyait"], "de": "Man sah das Meer von unserem Fenster aus."}, {"q": "Nous ___ tôt le matin. (commencer)", "a": ["commencions"], "de": "Wir fingen morgens früh an."}]}, {"type": "choice", "title": "imparfait oder passé composé?", "task": "Wähle die passende Form.", "items": [{"q": "Il ___ beau quand nous sommes partis.", "options": ["faisait", "a fait"], "a": 0, "why": "Wetter als Hintergrund → imparfait."}, {"q": "Je lisais quand tout à coup on ___ à la porte.", "options": ["frappait", "a frappé"], "a": 1, "why": "Plötzliches Ereignis → passé composé."}, {"q": "Quand j'étais jeune, je ___ du piano.", "options": ["faisais", "ai fait"], "a": 0, "why": "Gewohnheit in der Vergangenheit → imparfait."}, {"q": "Hier, nous ___ un film génial.", "options": ["voyions", "avons vu"], "a": 1, "why": "Einmalige abgeschlossene Handlung → passé composé."}, {"q": "Elle ___ fatiguée, alors elle est rentrée.", "options": ["était", "a été"], "a": 0, "why": "Zustand als Grund → imparfait."}, {"q": "Il s'est levé, il ___ et il est parti.", "options": ["s'habillait", "s'est habillé"], "a": 1, "why": "Abfolge von Handlungen → passé composé."}, {"q": "Pendant que je ___, mon mari faisait la vaisselle.", "options": ["cuisinais", "ai cuisiné"], "a": 0, "why": "pendant que + parallele Hintergrundhandlung → imparfait."}, {"q": "J'___ à Rome pendant trois ans, puis je suis rentré.", "options": ["habitais", "ai habité"], "a": 1, "why": "Abgeschlossener Zeitraum → passé composé."}, {"q": "Il ___ minuit quand l'accident s'est produit.", "options": ["était", "a été"], "a": 0, "why": "Uhrzeit → imparfait."}]}, {"type": "gap", "title": "Eine Geschichte", "task": "Setze die Verben ins imparfait oder passé composé.", "items": [{"q": "C'___ un samedi matin. (être)", "a": ["était"], "de": "Es war ein Samstagmorgen."}, {"q": "Le soleil ___ . (briller)", "a": ["brillait"], "de": "Die Sonne schien."}, {"q": "Je ___ mon café sur la terrasse. (boire)", "a": ["buvais"], "de": "Ich trank gerade meinen Kaffee auf der Terrasse."}, {"q": "Soudain, mon téléphone ___ . (sonner)", "a": ["a sonné"], "de": "Plötzlich klingelte mein Telefon."}, {"q": "C'___ ma sœur. (être)", "a": ["était"], "de": "Es war meine Schwester."}, {"q": "Elle ___ : « J'ai eu un bébé ! » (crier)", "a": ["a crié"], "de": "Sie rief: „Ich habe ein Baby bekommen!“"}, {"q": "Je ___ tout de suite ma voiture. (prendre)", "a": ["ai pris"], "de": "Ich nahm sofort mein Auto."}, {"q": "Et je ___ à l'hôpital. (aller)", "a": ["suis allé", "suis allée"], "de": "Und ich fuhr ins Krankenhaus."}]}, {"type": "choice", "title": "Bedeutungswechsel", "task": "Welche Übersetzung passt?", "items": [{"q": "Ich habe ihn 2010 kennengelernt.", "options": ["Je le connaissais en 2010.", "Je l'ai connu en 2010."], "a": 1, "why": "connaître im passé composé = kennenlernen."}, {"q": "Ich wusste nicht, dass du hier bist.", "options": ["Je ne savais pas que tu étais là.", "Je n'ai pas su que tu étais là."], "a": 0, "why": "Wissen als Zustand → imparfait."}, {"q": "Ich musste den ganzen Tag arbeiten (und habe es getan).", "options": ["J'ai dû travailler toute la journée.", "Je devais travailler toute la journée."], "a": 0, "why": "Tatsächlich erfüllte Pflicht → passé composé."}, {"q": "Ich wollte dich gerade anrufen.", "options": ["J'allais t'appeler.", "Je suis allé t'appeler."], "a": 0, "why": "aller im imparfait + Infinitiv = gerade wollen."}, {"q": "Wie wär's, wenn wir ans Meer führen?", "options": ["Si on allait à la mer ?", "Si on va à la mer ?"], "a": 0, "why": "Vorschlag mit si + imparfait."}]}], "cards": [{"f": "Stamm des imparfait", "b": "nous-Form Präsens ohne -ons: nous finiss-ons → je finissais"}, {"f": "Endungen des imparfait", "b": "-ais, -ais, -ait, -ions, -iez, -aient"}, {"f": "être im imparfait", "b": "j'étais, tu étais, il était, nous étions, vous étiez, ils étaient (einzige Ausnahme)"}, {"f": "faire / boire im imparfait", "b": "je faisais / je buvais"}, {"f": "manger im imparfait (je / nous)", "b": "je mangeais / nous mangions"}, {"f": "imparfait – Funktion", "b": "Beschreibung, Hintergrund, Zustand, Gewohnheit, laufende Handlung"}, {"f": "passé composé – Funktion", "b": "Ereignis, Abfolge, plötzliche Handlung, abgeschlossene Dauer"}, {"f": "Ich duschte, als das Telefon klingelte.", "b": "Je prenais ma douche quand le téléphone a sonné."}, {"f": "pendant que / pendant", "b": "pendant que + imparfait (während) · pendant deux heures + p. c. (abgeschlossen)"}, {"f": "je savais / j'ai su", "b": "ich wusste / ich habe erfahren"}, {"f": "je le connaissais / je l'ai connu", "b": "ich kannte ihn / ich habe ihn kennengelernt"}, {"f": "j'ai dû / je devais", "b": "ich musste (tat es) / ich sollte eigentlich"}, {"f": "Si on allait au cinéma ?", "b": "Wie wär's, wenn wir ins Kino gingen? (Vorschlag)"}, {"f": "Je voulais vous demander …", "b": "höfliches imparfait: Ich wollte Sie fragen …"}, {"f": "Er war gerade gegangen.", "b": "Il venait de partir."}, {"f": "Signalwörter imparfait", "b": "autrefois, avant, d'habitude, toujours, tous les jours"}, {"f": "Signalwörter passé composé", "b": "hier, un jour, soudain, tout à coup, d'abord, ensuite, enfin"}, {"f": "Wie im Italienischen/Spanischen?", "b": "Ja: imparfait = imperfetto/imperfecto, passé composé ≈ passato prossimo/indefinido"}]}, {"nr": 13, "id": "k14", "title": "plus-que-parfait und passé simple", "teil": "Das Verb und seine Ergänzungen", "intro": "Das plus-que-parfait drückt aus, was vor einem anderen Ereignis in der Vergangenheit schon geschehen war. Das passé simple ist die Erzählzeit der Literatur: Du musst es nicht aktiv beherrschen, aber erkennen können – in jedem Roman, Märchen und Geschichtsbuch begegnet es dir.", "sections": [{"h": "Bildung des plus-que-parfait", "html": "<p><em>avoir<\/em> oder <em>être<\/em> im <b>imparfait<\/b> + Partizip Perfekt. Hilfsverbwahl und Angleichung wie im passé composé:<\/p><table><tr><th>Person<\/th><th>mit avoir: faire<\/th><th>mit être: partir<\/th><\/tr><tr><td>je<\/td><td><em>j'avais fait<\/em><\/td><td><em>j'étais parti(e)<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>avais fait<\/em><\/td><td><em>étais parti(e)<\/em><\/td><\/tr><tr><td>il/elle<\/td><td><em>avait fait<\/em><\/td><td><em>était parti / partie<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>avions fait<\/em><\/td><td><em>étions parti(e)s<\/em><\/td><\/tr><tr><td>vous<\/td><td><em>aviez fait<\/em><\/td><td><em>étiez parti(e)(s)<\/em><\/td><\/tr><tr><td>ils/elles<\/td><td><em>avaient fait<\/em><\/td><td><em>étaient partis / parties<\/em><\/td><\/tr><\/table><div class='tip'>Merke: Entspricht dem deutschen Plusquamperfekt (<em>ich hatte gemacht, ich war gegangen<\/em>) und dem ital. <em>trapassato prossimo<\/em> bzw. span. <em>pluscuamperfecto<\/em>.<\/div>"}, {"h": "Gebrauch des plus-que-parfait", "html": "<p>Das plus-que-parfait drückt <b>Vorzeitigkeit<\/b> in der Vergangenheit aus:<\/p><ul><li><em>Quand je suis arrivé, le film avait déjà commencé.<\/em> – Als ich ankam, hatte der Film schon begonnen.<\/li><li><em>Il m'a rendu le livre que je lui avais prêté.<\/em> – Er gab mir das Buch zurück, das ich ihm geliehen hatte.<\/li><li><em>Elle était fatiguée parce qu'elle avait mal dormi.<\/em><\/li><\/ul><p>Weitere Verwendungen:<\/p><ul><li>irreale Bedingung der Vergangenheit: <em>Si j'avais su, je serais venu.<\/em> – Hätte ich das gewusst, wäre ich gekommen. (siehe Kapitel 16)<\/li><li>Bedauern: <em>Si seulement je l'avais écouté !<\/em><\/li><li>indirekte Rede: <em>Il a dit qu'il avait fini.<\/em> (aus passé composé wird plus-que-parfait)<\/li><\/ul><div class='warn'>Achtung: Im Deutschen wird oft das Plusquamperfekt weggelassen („Als ich ankam, begann der Film schon“). Im Französischen muss die Vorzeitigkeit genauer markiert werden.<\/div>"}, {"h": "venir de: die unmittelbare Vergangenheit", "html": "<p><em>venir de<\/em> + Infinitiv (<em>passé récent<\/em>) drückt aus, dass etwas <b>gerade eben<\/b> geschehen ist:<\/p><ul><li><em>Je viens de manger.<\/em> – Ich habe gerade gegessen.<\/li><li><em>Le train vient de partir.<\/em> – Der Zug ist gerade abgefahren.<\/li><li><em>Ils viennent d'arriver.<\/em> – Sie sind soeben angekommen.<\/li><\/ul><p>In der Vergangenheit steht <em>venir<\/em> im <b>imparfait<\/b>: <em>Il venait de partir quand tu as appelé.<\/em> – Er war gerade gegangen, als du angerufen hast.<\/p><div class='warn'>Achtung: <em>Je viens de Paris<\/em> = Ich komme aus Paris. <em>Je viens de voir Paris<\/em> = Ich habe gerade Paris gesehen. Der Infinitiv macht den Unterschied.<\/div><div class='tip'>Merke: Wie span. <em>acabo de comer<\/em> – das Italienische sagt <em>ho appena mangiato<\/em>.<\/div>"}, {"h": "Das passé simple: Bildung", "html": "<p>Das passé simple begegnet dir fast nur in der <b>3. Person<\/b> (Singular und Plural). Drei Endungsmuster:<\/p><table><tr><th>Typ<\/th><th>il / elle<\/th><th>ils / elles<\/th><\/tr><tr><td><em>-er<\/em>-Verben: <em>-a<\/em><\/td><td><em>il parla, il alla<\/em><\/td><td><em>ils parlèrent, ils allèrent<\/em><\/td><\/tr><tr><td><em>-i<\/em>-Typ (2. Gruppe, viele 3. Gruppe)<\/td><td><em>il finit, il partit, il prit, il fit, il dit, il mit, il vit<\/em><\/td><td><em>ils finirent, ils prirent, ils firent<\/em><\/td><\/tr><tr><td><em>-u<\/em>-Typ (meist Verben mit Partizip auf -u)<\/td><td><em>il eut, il fut, il put, il voulut, il sut, il dut, il lut, il but, il connut<\/em><\/td><td><em>ils eurent, ils furent, ils purent<\/em><\/td><\/tr><tr><td><em>venir, tenir<\/em><\/td><td><em>il vint, il tint<\/em><\/td><td><em>ils vinrent, ils tinrent<\/em><\/td><\/tr><\/table><p>Vollständige Formen (zum Erkennen):<\/p><table><tr><th><\/th><th>parler<\/th><th>finir<\/th><th>être<\/th><th>avoir<\/th><\/tr><tr><td>je<\/td><td><em>parlai<\/em><\/td><td><em>finis<\/em><\/td><td><em>fus<\/em><\/td><td><em>eus<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>parlas<\/em><\/td><td><em>finis<\/em><\/td><td><em>fus<\/em><\/td><td><em>eus<\/em><\/td><\/tr><tr><td>il<\/td><td><em>parla<\/em><\/td><td><em>finit<\/em><\/td><td><em>fut<\/em><\/td><td><em>eut<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>parlâmes<\/em><\/td><td><em>finîmes<\/em><\/td><td><em>fûmes<\/em><\/td><td><em>eûmes<\/em><\/td><\/tr><tr><td>vous<\/td><td><em>parlâtes<\/em><\/td><td><em>finîtes<\/em><\/td><td><em>fûtes<\/em><\/td><td><em>eûtes<\/em><\/td><\/tr><tr><td>ils<\/td><td><em>parlèrent<\/em><\/td><td><em>finirent<\/em><\/td><td><em>furent<\/em><\/td><td><em>eurent<\/em><\/td><\/tr><\/table><div class='warn'>Achtung: Verwechslungsgefahr: <em>il fit<\/em> (er machte, faire) – <em>il fut<\/em> (er war, être); <em>il finit<\/em> ist Präsens <b>und<\/b> passé simple. <em>naître → il naquit, mourir → il mourut, voir → il vit, vivre → il vécut<\/em>.<\/div>"}, {"h": "Das passé simple: Gebrauch", "html": "<p>Das passé simple ersetzt im <b>schriftlichen, literarischen<\/b> Stil das passé composé: Es erzählt abgeschlossene Ereignisse. Das imparfait bleibt für den Hintergrund.<\/p><blockquote><p><em>Il était une fois une jeune fille qui vivait dans une forêt. Un jour, elle rencontra un loup. Le loup lui demanda où elle allait.<\/em><\/p><p>Es war einmal ein junges Mädchen, das in einem Wald lebte. Eines Tages traf es einen Wolf. Der Wolf fragte es, wohin es gehe.<\/p><\/blockquote><ul><li>Romane, Märchen, Biografien: <em>Victor Hugo naquit en 1802.<\/em><\/li><li>Geschichtsbücher: <em>Louis XVI fut guillotiné en 1793.<\/em><\/li><li>Im Gespräch: praktisch nie – dort steht passé composé.<\/li><\/ul><div class='tip'>Merke: Für dich reicht es, die Formen <b>wiederzuerkennen<\/b> – aktiv brauchst du das passé simple nur, wenn du literarisch schreiben möchtest.<\/div>"}, {"h": "futur antérieur und passé antérieur", "html": "<p>Zwei weitere zusammengesetzte Zeiten zur Vollständigkeit:<\/p><ul><li><b>futur antérieur<\/b> (vollendete Zukunft): <em>avoir/être<\/em> im Futur + Partizip: <em>Quand tu arriveras, j'aurai fini.<\/em> – Wenn du ankommst, werde ich fertig sein. (siehe Kapitel 14)<\/li><li><b>passé antérieur<\/b> (literarische Vorzeitigkeit zum passé simple): <em>avoir/être<\/em> im passé simple + Partizip: <em>Quand il eut fini, il sortit.<\/em> – Als er fertig war, ging er hinaus.<\/li><\/ul><div class='tip'>Merke: Im Alltag ersetzt man das passé antérieur durch das plus-que-parfait oder eine Infinitivkonstruktion: <em>Après avoir fini, il est sorti.<\/em><\/div>"}], "exercises": [{"type": "gap", "title": "Bildung des plus-que-parfait", "task": "Setze das Verb ins plus-que-parfait.", "items": [{"q": "Quand je suis arrivé, ils ___ . (partir)", "a": ["étaient partis", "étaient déjà partis"], "de": "Als ich ankam, waren sie schon gegangen."}, {"q": "Elle ___ ses clés. (oublier)", "a": ["avait oublié"], "de": "Sie hatte ihre Schlüssel vergessen."}, {"q": "Nous ___ ce film avant. (voir)", "a": ["avions vu"], "de": "Wir hatten den Film vorher gesehen."}, {"q": "Tu ___ le message ? (lire)", "a": ["avais lu"], "de": "Hattest du die Nachricht gelesen?"}, {"q": "Marie ___ à 7 heures. (se lever)", "a": ["s'était levée"], "de": "Marie war um 7 Uhr aufgestanden."}, {"q": "Je ___ toute la nuit. (travailler)", "a": ["avais travaillé"], "de": "Ich hatte die ganze Nacht gearbeitet."}, {"q": "Vous ___ à Paris avant ? (venir)", "a": ["étiez venu", "étiez venus", "étiez venue", "étiez venues"], "de": "Waren Sie vorher schon einmal in Paris gewesen?"}]}, {"type": "choice", "title": "Welche Zeit passt?", "task": "passé composé, imparfait oder plus-que-parfait?", "items": [{"q": "Il m'a montré les photos qu'il ___ en Grèce.", "options": ["a prises", "avait prises", "prenait"], "a": 1, "why": "Die Fotos waren vorher gemacht worden → plus-que-parfait."}, {"q": "Quand nous sommes arrivés à la gare, le train ___ déjà.", "options": ["est parti", "était parti", "partait"], "a": 1, "why": "Vorzeitig zur Ankunft → plus-que-parfait."}, {"q": "Elle ___ très fatiguée ce soir-là.", "options": ["avait été", "était", "a été"], "a": 1, "why": "Zustand als Hintergrund → imparfait."}, {"q": "Hier, j'___ Pierre au supermarché.", "options": ["ai rencontré", "avais rencontré", "rencontrais"], "a": 0, "why": "Einmaliges Ereignis → passé composé."}, {"q": "Il avait faim parce qu'il n'___ rien mangé.", "options": ["a", "avait", "aura"], "a": 1, "why": "Ursache liegt vorher → plus-que-parfait."}, {"q": "Si j'___ , je serais venu.", "options": ["ai su", "avais su", "savais"], "a": 1, "why": "Irreale Bedingung der Vergangenheit → si + plus-que-parfait."}]}, {"type": "gap", "title": "venir de", "task": "Drücke mit venir de aus, dass es gerade passiert ist.", "items": [{"q": "Le film ___ commencer. (gerade)", "a": ["vient de"], "de": "Der Film hat gerade angefangen."}, {"q": "Nous ___ arriver.", "a": ["venons d'"], "de": "Wir sind gerade angekommen."}, {"q": "Je ___ finir mes devoirs.", "a": ["viens de"], "de": "Ich bin gerade mit den Hausaufgaben fertig geworden."}, {"q": "Ils ___ acheter une maison.", "a": ["viennent d'"], "de": "Sie haben gerade ein Haus gekauft."}, {"q": "Il ___ partir quand tu as appelé. (imparfait)", "a": ["venait de"], "de": "Er war gerade gegangen, als du angerufen hast."}]}, {"type": "choice", "title": "passé simple erkennen", "task": "Welcher Infinitiv steckt dahinter?", "items": [{"q": "il fut", "options": ["faire", "être", "falloir"], "a": 1, "why": "fut = passé simple von être."}, {"q": "il fit", "options": ["faire", "finir", "être"], "a": 0, "why": "fit = passé simple von faire."}, {"q": "ils eurent", "options": ["être", "avoir", "aller"], "a": 1, "why": "eurent = passé simple von avoir."}, {"q": "elle prit", "options": ["prier", "prendre", "pouvoir"], "a": 1, "why": "prit = passé simple von prendre."}, {"q": "il vint", "options": ["voir", "vivre", "venir"], "a": 2, "why": "vint = passé simple von venir."}, {"q": "il vit", "options": ["voir oder vivre (Präsens)", "nur voir", "nur vivre"], "a": 0, "why": "il vit = passé simple von voir oder Präsens von vivre."}, {"q": "il naquit", "options": ["naître", "nager", "nuire"], "a": 0, "why": "naquit = passé simple von naître."}, {"q": "ils allèrent", "options": ["aller", "allumer", "allonger"], "a": 0, "why": "-er-Verben: -èrent."}, {"q": "il mourut", "options": ["mourir", "mordre", "moudre"], "a": 0, "why": "mourut = passé simple von mourir."}]}, {"type": "gap", "title": "Vom passé simple ins passé composé", "task": "Übertrage in die Alltagssprache (passé composé).", "items": [{"q": "Il entra dans la pièce. → Il ___ dans la pièce.", "a": ["est entré"], "de": "Er betrat den Raum."}, {"q": "Elle prit son manteau. → Elle ___ son manteau.", "a": ["a pris"], "de": "Sie nahm ihren Mantel."}, {"q": "Ils furent très surpris. → Ils ___ très surpris.", "a": ["ont été"], "de": "Sie waren sehr überrascht."}, {"q": "Nous partîmes à l'aube. → Nous ___ à l'aube.", "a": ["sommes partis"], "de": "Wir brachen im Morgengrauen auf."}, {"q": "Il dit au revoir. → Il ___ au revoir.", "a": ["a dit"], "de": "Er verabschiedete sich."}, {"q": "Elle eut peur. → Elle ___ peur.", "a": ["a eu"], "de": "Sie bekam Angst."}]}], "cards": [{"f": "Bildung plus-que-parfait", "b": "avoir/être im imparfait + Partizip: j'avais fait, j'étais parti"}, {"f": "Funktion plus-que-parfait", "b": "Vorzeitigkeit in der Vergangenheit: Le film avait déjà commencé."}, {"f": "Hätte ich das gewusst …", "b": "Si j'avais su, …"}, {"f": "venir de + Infinitiv", "b": "gerade eben: Je viens de manger."}, {"f": "Er war gerade gegangen.", "b": "Il venait de partir."}, {"f": "passé simple – wann?", "b": "Literatur, Märchen, Geschichtsschreibung – nie im Gespräch"}, {"f": "passé simple der -er-Verben (il / ils)", "b": "il parla / ils parlèrent"}, {"f": "passé simple von être / avoir (il)", "b": "il fut / il eut"}, {"f": "passé simple von faire / dire / prendre (il)", "b": "il fit / il dit / il prit"}, {"f": "passé simple von venir (il / ils)", "b": "il vint / ils vinrent"}, {"f": "passé simple von naître / mourir", "b": "il naquit / il mourut"}, {"f": "il vit – zwei Bedeutungen", "b": "er sah (voir, passé simple) / er lebt (vivre, Präsens)"}, {"f": "Il était une fois …", "b": "Es war einmal … (Märchenanfang, imparfait)"}, {"f": "futur antérieur", "b": "j'aurai fini – ich werde fertig sein"}, {"f": "passé antérieur", "b": "literarisch: Quand il eut fini, il sortit."}, {"f": "Nachdem er fertig war, ging er.", "b": "Après avoir fini, il est parti."}]}, {"nr": 14, "id": "k15", "title": "Futur und Konditional", "teil": "Das Verb und seine Ergänzungen", "intro": "Für die Zukunft hat das Französische zwei Formen: das futur proche (je vais partir) für Pläne und das futur simple (je partirai) für Vorhersagen und Versprechen. Das conditionnel nutzt denselben Stamm wie das Futur – für Höflichkeit, Wünsche, Vermutungen und Bedingungen.", "sections": [{"h": "Das futur proche", "html": "<p><em>aller<\/em> im Präsens + Infinitiv – wie das englische „going to“:<\/p><table><tr><th>Person<\/th><th>Form<\/th><\/tr><tr><td>je<\/td><td><em>vais partir<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>vas partir<\/em><\/td><\/tr><tr><td>il/elle<\/td><td><em>va partir<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>allons partir<\/em><\/td><\/tr><tr><td>vous<\/td><td><em>allez partir<\/em><\/td><\/tr><tr><td>ils<\/td><td><em>vont partir<\/em><\/td><\/tr><\/table><ul><li>Pläne und Absichten: <em>Ce soir, je vais regarder un film.<\/em><\/li><li>Was gleich passiert: <em>Attention, tu vas tomber !<\/em> – Pass auf, du fällst gleich!<\/li><\/ul><p>Verneinung und Pronomen: <em>Je ne vais pas le faire.<\/em><\/p><div class='tip'>Merke: Im gesprochenen Französisch ist das futur proche viel häufiger als das futur simple – auch für entferntere Zukunft: <em>L'année prochaine, on va déménager.<\/em><\/div>"}, {"h": "Das futur simple: regelmäßige Bildung", "html": "<p>Infinitiv + Endungen <em>-ai, -as, -a, -ons, -ez, -ont<\/em> (die Präsensformen von <em>avoir<\/em>!). Bei <em>-re<\/em>-Verben fällt das End-e weg:<\/p><table><tr><th>Person<\/th><th>parler<\/th><th>finir<\/th><th>prendre<\/th><\/tr><tr><td>je<\/td><td><em>parlerai<\/em><\/td><td><em>finirai<\/em><\/td><td><em>prendrai<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>parleras<\/em><\/td><td><em>finiras<\/em><\/td><td><em>prendras<\/em><\/td><\/tr><tr><td>il<\/td><td><em>parlera<\/em><\/td><td><em>finira<\/em><\/td><td><em>prendra<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>parlerons<\/em><\/td><td><em>finirons<\/em><\/td><td><em>prendrons<\/em><\/td><\/tr><tr><td>vous<\/td><td><em>parlerez<\/em><\/td><td><em>finirez<\/em><\/td><td><em>prendrez<\/em><\/td><\/tr><tr><td>ils<\/td><td><em>parleront<\/em><\/td><td><em>finiront<\/em><\/td><td><em>prendront<\/em><\/td><\/tr><\/table><p>Schreibbesonderheiten der -er-Verben übernehmen die Formen mit <em>è, ll, tt, i<\/em> im ganzen Futur: <em>j'achèterai, j'appellerai, je jetterai, je paierai<\/em>. Aber: <em>je préférerai<\/em> (é bleibt).<\/p><div class='warn'>Achtung: Das Futur hat immer ein <b>r<\/b> vor der Endung – daran erkennst du es: <em>je parlerai<\/em> (Futur) vs. <em>je parlais<\/em> (imparfait).<\/div>"}, {"h": "Unregelmäßige Futurstämme", "html": "<table><tr><th>Infinitiv<\/th><th>Stamm<\/th><th>Infinitiv<\/th><th>Stamm<\/th><\/tr><tr><td><em>être<\/em><\/td><td><em>ser-<\/em> (je serai)<\/td><td><em>pouvoir<\/em><\/td><td><em>pourr-<\/em><\/td><\/tr><tr><td><em>avoir<\/em><\/td><td><em>aur-<\/em><\/td><td><em>vouloir<\/em><\/td><td><em>voudr-<\/em><\/td><\/tr><tr><td><em>aller<\/em><\/td><td><em>ir-<\/em><\/td><td><em>devoir<\/em><\/td><td><em>devr-<\/em><\/td><\/tr><tr><td><em>faire<\/em><\/td><td><em>fer-<\/em><\/td><td><em>savoir<\/em><\/td><td><em>saur-<\/em><\/td><\/tr><tr><td><em>venir<\/em><\/td><td><em>viendr-<\/em><\/td><td><em>voir<\/em><\/td><td><em>verr-<\/em><\/td><\/tr><tr><td><em>tenir<\/em><\/td><td><em>tiendr-<\/em><\/td><td><em>envoyer<\/em><\/td><td><em>enverr-<\/em><\/td><\/tr><tr><td><em>courir<\/em><\/td><td><em>courr-<\/em><\/td><td><em>mourir<\/em><\/td><td><em>mourr-<\/em><\/td><\/tr><tr><td><em>recevoir<\/em><\/td><td><em>recevr-<\/em><\/td><td><em>falloir<\/em><\/td><td><em>il faudra<\/em><\/td><\/tr><tr><td><em>s'asseoir<\/em><\/td><td><em>assiér-<\/em><\/td><td><em>pleuvoir<\/em><\/td><td><em>il pleuvra<\/em><\/td><\/tr><\/table><div class='tip'>Merke: Die Stämme mit Doppel-r: <em>pourr-, verr-, courr-, mourr-, enverr-<\/em> – das rr wird leicht verlängert gesprochen.<\/div>"}, {"h": "Gebrauch des futur simple", "html": "<ul><li>Vorhersagen: <em>Demain, il fera beau.<\/em><\/li><li>Versprechen: <em>Je t'appellerai ce soir.<\/em><\/li><li>Weiter entfernte, offiziellere Zukunft: <em>Le magasin ouvrira en mars.<\/em><\/li><li>Anweisungen: <em>Vous prendrez ce médicament trois fois par jour.<\/em><\/li><li>Vermutung (selten): <em>Ça sera le facteur.<\/em> – Das wird der Briefträger sein.<\/li><\/ul><p><b>quand<\/b> und <b>dès que<\/b> stehen – anders als im Deutschen – mit dem <b>Futur<\/b>, wenn die Zukunft gemeint ist:<\/p><ul><li><em>Quand je serai grand, je serai pilote.<\/em> – Wenn ich groß bin, …<\/li><li><em>Je t'écrirai dès que j'arriverai.<\/em> – … sobald ich ankomme.<\/li><\/ul><div class='warn'>Achtung: Nach <em>si<\/em> (wenn, falls) steht dagegen <b>nie<\/b> das Futur: <em>Si tu viens, je serai content.<\/em> (Kapitel 16)<\/div>"}, {"h": "Das futur antérieur", "html": "<p><em>avoir/être<\/em> im Futur + Partizip: <em>j'aurai fini, je serai parti(e)<\/em>.<\/p><p>Es drückt aus, dass etwas in der Zukunft <b>bereits abgeschlossen<\/b> sein wird:<\/p><ul><li><em>À 8 heures, j'aurai fini.<\/em> – Um 8 Uhr werde ich fertig sein.<\/li><li><em>Quand tu rentreras, j'aurai préparé le dîner.<\/em><\/li><li><em>Dès que tu auras fini, tu pourras sortir.<\/em> – Sobald du fertig bist, darfst du raus.<\/li><li>Vermutung über Vergangenes: <em>Il n'est pas là ? Il aura oublié.<\/em> – Er wird es vergessen haben.<\/li><\/ul><div class='tip'>Merke: Nach <em>quand, dès que, après que, une fois que<\/em> steht für eine vorher abgeschlossene Handlung das futur antérieur, wo das Deutsche das Perfekt verwendet.<\/div>"}, {"h": "Das conditionnel présent", "html": "<p>Futurstamm + Endungen des imparfait (<em>-ais, -ais, -ait, -ions, -iez, -aient<\/em>):<\/p><table><tr><th>Person<\/th><th>aimer<\/th><th>pouvoir<\/th><th>être<\/th><\/tr><tr><td>je<\/td><td><em>aimerais<\/em><\/td><td><em>pourrais<\/em><\/td><td><em>serais<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>aimerais<\/em><\/td><td><em>pourrais<\/em><\/td><td><em>serais<\/em><\/td><\/tr><tr><td>il<\/td><td><em>aimerait<\/em><\/td><td><em>pourrait<\/em><\/td><td><em>serait<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>aimerions<\/em><\/td><td><em>pourrions<\/em><\/td><td><em>serions<\/em><\/td><\/tr><tr><td>vous<\/td><td><em>aimeriez<\/em><\/td><td><em>pourriez<\/em><\/td><td><em>seriez<\/em><\/td><\/tr><tr><td>ils<\/td><td><em>aimeraient<\/em><\/td><td><em>pourraient<\/em><\/td><td><em>seraient<\/em><\/td><\/tr><\/table><div class='warn'>Achtung: <em>je parlerai<\/em> (Futur) und <em>je parlerais<\/em> (Konditional) klingen fast gleich – im Schriftlichen auf das <em>s<\/em> achten! Tipp: Ersetze durch <em>nous<\/em> (<em>parlerons / parlerions<\/em>).<\/div>"}, {"h": "Gebrauch des conditionnel", "html": "<ul><li><b>Höflichkeit<\/b>: <em>Je voudrais un café. Pourriez-vous m'aider ? Vous auriez l'heure ?<\/em><\/li><li><b>Wünsche<\/b>: <em>J'aimerais vivre au bord de la mer.<\/em><\/li><li><b>Ratschläge<\/b> mit <em>devoir<\/em>: <em>Tu devrais te reposer.<\/em> – Du solltest dich ausruhen.<\/li><li><b>Vorschläge<\/b>: <em>On pourrait aller au cinéma.<\/em><\/li><li><b>irreale Bedingung<\/b>: <em>Si j'avais le temps, je viendrais.<\/em> (Kapitel 16)<\/li><li><b
