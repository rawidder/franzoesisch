>unbestätigte Information<\/b> (Presse): <em>Le président serait malade.<\/em> – Der Präsident soll krank sein.<\/li><li><b>Futur in der Vergangenheit<\/b> (indirekte Rede): <em>Il a dit qu'il viendrait.<\/em><\/li><\/ul><p><b>conditionnel passé<\/b>: <em>avoir/être<\/em> im Konditional + Partizip: <em>J'aurais aimé venir.<\/em> (Ich wäre gern gekommen.) <em>Tu aurais dû me le dire.<\/em> (Du hättest es mir sagen sollen.)<\/p><div class='tip'>Merke: <em>j'aurais dû<\/em> = ich hätte … sollen; <em>j'aurais pu<\/em> = ich hätte … können – sehr häufig zum Ausdruck von Bedauern und Vorwurf.<\/div>"}], "exercises": [{"type": "gap", "title": "futur proche", "task": "Setze das futur proche ein.", "items": [{"q": "Ce soir, nous ___ au restaurant. (dîner)", "a": ["allons dîner"], "de": "Heute Abend essen wir im Restaurant."}, {"q": "Attention, tu ___ ! (tomber)", "a": ["vas tomber"], "de": "Pass auf, du fällst gleich!"}, {"q": "Ils ___ l'année prochaine. (se marier)", "a": ["vont se marier"], "de": "Sie heiraten nächstes Jahr."}, {"q": "Je ne ___ pas regarder ce film. (aller)", "a": ["vais"], "de": "Ich werde diesen Film nicht ansehen."}, {"q": "Vous ___ quoi ce week-end ? (faire)", "a": ["allez faire"], "de": "Was macht ihr am Wochenende?"}, {"q": "Il ___ pleuvoir.", "a": ["va"], "de": "Es wird gleich regnen."}]}, {"type": "gap", "title": "futur simple", "task": "Setze das Verb ins futur simple.", "items": [{"q": "Demain, il ___ beau. (faire)", "a": ["fera"], "de": "Morgen wird schönes Wetter sein."}, {"q": "Je t'___ ce soir. (appeler)", "a": ["appellerai"], "de": "Ich rufe dich heute Abend an."}, {"q": "Nous ___ en vacances en juillet. (partir)", "a": ["partirons"], "de": "Wir fahren im Juli in Urlaub."}, {"q": "Tu ___ content. (être)", "a": ["seras"], "de": "Du wirst zufrieden sein."}, {"q": "Ils ___ demain. (venir)", "a": ["viendront"], "de": "Sie kommen morgen."}, {"q": "On ___ bien. (voir)", "a": ["verra"], "de": "Wir werden sehen."}, {"q": "Vous ___ faire attention. (devoir)", "a": ["devrez"], "de": "Sie werden aufpassen müssen."}, {"q": "J'___ 50 ans en mai. (avoir)", "a": ["aurai"], "de": "Ich werde im Mai 50."}, {"q": "Elle ___ à Paris la semaine prochaine. (aller)", "a": ["ira"], "de": "Sie fährt nächste Woche nach Paris."}, {"q": "Je vous ___ la facture. (envoyer)", "a": ["enverrai"], "de": "Ich schicke Ihnen die Rechnung."}]}, {"type": "choice", "title": "Zeit nach quand und si", "task": "Wähle die richtige Form.", "items": [{"q": "Quand je ___ à la retraite, je voyagerai.", "options": ["suis", "serai"], "a": 1, "why": "quand + Zukunft → Futur."}, {"q": "Si tu ___, on ira au parc.", "options": ["veux", "voudras"], "a": 0, "why": "Nach si nie Futur → Präsens."}, {"q": "Je t'appellerai dès que j'___ .", "options": ["arrive", "arriverai"], "a": 1, "why": "dès que + Zukunft → Futur."}, {"q": "Quand tu ___ tes devoirs, tu pourras jouer.", "options": ["finis", "auras fini"], "a": 1, "why": "Vorher abgeschlossen → futur antérieur."}, {"q": "S'il ___ demain, nous resterons à la maison.", "options": ["pleut", "pleuvra"], "a": 0, "why": "si + Präsens."}]}, {"type": "gap", "title": "conditionnel", "task": "Setze das Verb ins conditionnel présent.", "items": [{"q": "Je ___ un café, s'il vous plaît. (vouloir)", "a": ["voudrais"], "de": "Ich hätte gern einen Kaffee."}, {"q": "___-vous fermer la fenêtre ? (pouvoir)", "a": ["Pourriez"], "de": "Könnten Sie das Fenster schließen?"}, {"q": "Tu ___ te reposer. (devoir)", "a": ["devrais"], "de": "Du solltest dich ausruhen."}, {"q": "J'___ visiter le Japon. (aimer)", "a": ["aimerais"], "de": "Ich würde gern Japan besuchen."}, {"q": "Ce ___ génial ! (être)", "a": ["serait"], "de": "Das wäre toll!"}, {"q": "On ___ aller au cinéma. (pouvoir)", "a": ["pourrait"], "de": "Wir könnten ins Kino gehen."}, {"q": "Vous ___ l'heure ? (avoir)", "a": ["auriez"], "de": "Hätten Sie die Uhrzeit?"}, {"q": "Ils ___ mieux de partir. (faire)", "a": ["feraient"], "de": "Sie täten besser daran zu gehen."}]}, {"type": "choice", "title": "Futur oder Konditional?", "task": "Welche Form passt?", "items": [{"q": "Je ___ volontiers avec toi, mais je n'ai pas le temps.", "options": ["viendrai", "viendrais"], "a": 1, "why": "Irreal (aber ich habe keine Zeit) → Konditional."}, {"q": "Je te promets, je ___ demain.", "options": ["viendrai", "viendrais"], "a": 0, "why": "Versprechen → Futur."}, {"q": "Il a dit qu'il ___ à 8 heures.", "options": ["arrivera", "arriverait"], "a": 1, "why": "Futur in der Vergangenheit → Konditional."}, {"q": "Selon la presse, le ministre ___ démissionner.", "options": ["va", "voudrait"], "a": 1, "why": "Unbestätigte Info → Konditional."}, {"q": "Tu ___ dû me prévenir !", "options": ["aurais", "auras"], "a": 0, "why": "Vorwurf → conditionnel passé."}, {"q": "Nous ___ ravis de vous revoir l'an prochain.", "options": ["serons", "serions"], "a": 0, "why": "Sichere Zukunftsaussage → Futur."}]}], "cards": [{"f": "futur proche", "b": "aller + Infinitiv: je vais partir"}, {"f": "futur simple – Bildung", "b": "Infinitiv (-re ohne e) + -ai, -as, -a, -ons, -ez, -ont"}, {"f": "être / avoir – Futur", "b": "je serai / j'aurai"}, {"f": "aller / faire – Futur", "b": "j'irai / je ferai"}, {"f": "venir / tenir – Futur", "b": "je viendrai / je tiendrai"}, {"f": "pouvoir / voir / envoyer – Futur", "b": "je pourrai / je verrai / j'enverrai"}, {"f": "vouloir / devoir / savoir – Futur", "b": "je voudrai / je devrai / je saurai"}, {"f": "il faut / il pleut – Futur", "b": "il faudra / il pleuvra"}, {"f": "acheter, appeler – Futur", "b": "j'achèterai, j'appellerai"}, {"f": "quand + Zukunft", "b": "Futur: Quand je serai grand …"}, {"f": "si + Zukunft", "b": "nie Futur: Si tu viens, je serai content."}, {"f": "futur antérieur", "b": "j'aurai fini – ich werde fertig sein"}, {"f": "Er wird es vergessen haben.", "b": "Il aura oublié."}, {"f": "conditionnel – Bildung", "b": "Futurstamm + imparfait-Endungen: je pourrais"}, {"f": "je parlerai / je parlerais", "b": "Futur / Konditional – Test: nous parlerons / parlerions"}, {"f": "Ich hätte gern …", "b": "Je voudrais …"}, {"f": "Du solltest …", "b": "Tu devrais …"}, {"f": "Wir könnten …", "b": "On pourrait …"}, {"f": "Ich hätte … sollen / können", "b": "J'aurais dû … / J'aurais pu …"}, {"f": "Le ministre serait malade.", "b": "Konditional für unbestätigte Nachrichten: soll krank sein"}, {"f": "Il a dit qu'il viendrait.", "b": "Konditional als Futur in der Vergangenheit"}]}, {"nr": 15, "id": "k16", "title": "Der subjonctif", "teil": "Das Verb und seine Ergänzungen", "intro": "Der subjonctif steht in Nebensätzen mit que, wenn der Hauptsatz einen Wunsch, ein Gefühl, eine Notwendigkeit oder einen Zweifel ausdrückt. Gute Nachricht für alle, die den spanischen oder italienischen congiuntivo kennen: Im Alltag brauchst du praktisch nur den subjonctif présent – und viele Formen klingen wie das Präsens.", "sections": [{"h": "Bildung: regelmäßige Verben", "html": "<p>Stamm = <em>ils<\/em>-Form des Präsens ohne <em>-ent<\/em>. Endungen: <em>-e, -es, -e, -ions, -iez, -ent<\/em>:<\/p><table><tr><th>Person<\/th><th>parler (ils parl-ent)<\/th><th>finir (ils finiss-ent)<\/th><th>attendre (ils attend-ent)<\/th><\/tr><tr><td>que je<\/td><td><em>parle<\/em><\/td><td><em>finisse<\/em><\/td><td><em>attende<\/em><\/td><\/tr><tr><td>que tu<\/td><td><em>parles<\/em><\/td><td><em>finisses<\/em><\/td><td><em>attendes<\/em><\/td><\/tr><tr><td>qu'il<\/td><td><em>parle<\/em><\/td><td><em>finisse<\/em><\/td><td><em>attende<\/em><\/td><\/tr><tr><td>que nous<\/td><td><em>parlions<\/em><\/td><td><em>finissions<\/em><\/td><td><em>attendions<\/em><\/td><\/tr><tr><td>que vous<\/td><td><em>parliez<\/em><\/td><td><em>finissiez<\/em><\/td><td><em>attendiez<\/em><\/td><\/tr><tr><td>qu'ils<\/td><td><em>parlent<\/em><\/td><td><em>finissent<\/em><\/td><td><em>attendent<\/em><\/td><\/tr><\/table><div class='tip'>Merke: Bei den <em>-er<\/em>-Verben sind <em>je, tu, il, ils<\/em> identisch mit dem Präsens, <em>nous, vous<\/em> mit dem imparfait. Neu lernen musst du also wenig!<\/div>"}, {"h": "Verben mit zwei Stämmen", "html": "<p>Verben, deren <em>nous<\/em>-Form im Präsens einen anderen Stamm hat als die <em>ils<\/em>-Form, behalten diesen Wechsel: <em>nous/vous<\/em> vom <em>nous<\/em>-Stamm, die übrigen vom <em>ils<\/em>-Stamm.<\/p><table><tr><th>Verb<\/th><th>que je / qu'ils<\/th><th>que nous / que vous<\/th><\/tr><tr><td><em>venir<\/em><\/td><td><em>vienne / viennent<\/em><\/td><td><em>venions / veniez<\/em><\/td><\/tr><tr><td><em>prendre<\/em><\/td><td><em>prenne / prennent<\/em><\/td><td><em>prenions / preniez<\/em><\/td><\/tr><tr><td><em>boire<\/em><\/td><td><em>boive / boivent<\/em><\/td><td><em>buvions / buviez<\/em><\/td><\/tr><tr><td><em>voir<\/em><\/td><td><em>voie / voient<\/em><\/td><td><em>voyions / voyiez<\/em><\/td><\/tr><tr><td><em>croire<\/em><\/td><td><em>croie / croient<\/em><\/td><td><em>croyions / croyiez<\/em><\/td><\/tr><tr><td><em>devoir<\/em><\/td><td><em>doive / doivent<\/em><\/td><td><em>devions / deviez<\/em><\/td><\/tr><tr><td><em>recevoir<\/em><\/td><td><em>reçoive / reçoivent<\/em><\/td><td><em>recevions / receviez<\/em><\/td><\/tr><tr><td><em>acheter<\/em><\/td><td><em>achète / achètent<\/em><\/td><td><em>achetions / achetiez<\/em><\/td><\/tr><\/table>"}, {"h": "Unregelmäßige Verben", "html": "<table><tr><th><\/th><th>être<\/th><th>avoir<\/th><th>aller<\/th><th>faire<\/th><\/tr><tr><td>que je<\/td><td><em>sois<\/em><\/td><td><em>aie<\/em><\/td><td><em>aille<\/em><\/td><td><em>fasse<\/em><\/td><\/tr><tr><td>que tu<\/td><td><em>sois<\/em><\/td><td><em>aies<\/em><\/td><td><em>ailles<\/em><\/td><td><em>fasses<\/em><\/td><\/tr><tr><td>qu'il<\/td><td><em>soit<\/em><\/td><td><em>ait<\/em><\/td><td><em>aille<\/em><\/td><td><em>fasse<\/em><\/td><\/tr><tr><td>que nous<\/td><td><em>soyons<\/em><\/td><td><em>ayons<\/em><\/td><td><em>allions<\/em><\/td><td><em>fassions<\/em><\/td><\/tr><tr><td>que vous<\/td><td><em>soyez<\/em><\/td><td><em>ayez<\/em><\/td><td><em>alliez<\/em><\/td><td><em>fassiez<\/em><\/td><\/tr><tr><td>qu'ils<\/td><td><em>soient<\/em><\/td><td><em>aient<\/em><\/td><td><em>aillent<\/em><\/td><td><em>fassent<\/em><\/td><\/tr><\/table><table><tr><th><\/th><th>pouvoir<\/th><th>savoir<\/th><th>vouloir<\/th><\/tr><tr><td>que je<\/td><td><em>puisse<\/em><\/td><td><em>sache<\/em><\/td><td><em>veuille<\/em><\/td><\/tr><tr><td>que nous<\/td><td><em>puissions<\/em><\/td><td><em>sachions<\/em><\/td><td><em>voulions<\/em><\/td><\/tr><tr><td>qu'ils<\/td><td><em>puissent<\/em><\/td><td><em>sachent<\/em><\/td><td><em>veuillent<\/em><\/td><\/tr><\/table><p>Unpersönlich: <em>il faut → qu'il faille<\/em>, <em>il pleut → qu'il pleuve<\/em>, <em>il vaut → qu'il vaille<\/em>.<\/p><div class='warn'>Achtung: <em>que j'aie<\/em> [ä] (subjonctif von avoir) – nicht verwechseln mit <em>j'ai<\/em> (Präsens). Und <em>que nous soyons, que vous ayez<\/em> ohne i nach y!<\/div>"}, {"h": "Nach Willen, Wunsch und Aufforderung", "html": "<p>Drückt der Hauptsatz einen <b>Willen<\/b> aus, steht im Nebensatz mit <em>que<\/em> der subjonctif:<\/p><ul><li><em>vouloir que<\/em>: <em>Je veux que tu viennes.<\/em> – Ich will, dass du kommst.<\/li><li><em>souhaiter / désirer / préférer que<\/em>: <em>Je préfère que vous restiez.<\/em><\/li><li><em>aimer (bien) que<\/em>: <em>J'aimerais que tu m'aides.<\/em><\/li><li><em>demander / exiger / ordonner que<\/em>: <em>Il exige qu'on soit à l'heure.<\/em><\/li><li><em>permettre / interdire / accepter que<\/em>: <em>Je n'accepte pas qu'il parte.<\/em><\/li><li><em>attendre que<\/em>: <em>J'attends que tu finisses.<\/em> – Ich warte, bis du fertig bist.<\/li><\/ul><div class='warn'>Achtung: Ist das Subjekt in Haupt- und Nebensatz <b>gleich<\/b>, steht der Infinitiv: <em>Je veux partir.<\/em> (nicht <em>Je veux que je parte<\/em>). <em>Je veux qu'il parte.<\/em> – verschiedene Subjekte.<\/div><div class='warn'>Achtung: <em>espérer que<\/em> steht mit Indikativ: <em>J'espère que tu viendras.<\/em> (anders als span. <em>espero que vengas<\/em>!)<\/div>"}, {"h": "Nach Gefühlen und Bewertungen", "html": "<ul><li><em>être content / heureux / ravi que<\/em>: <em>Je suis content que tu sois là.<\/em><\/li><li><em>être triste / désolé / déçu que<\/em>: <em>Je suis désolé que tu ne puisses pas venir.<\/em><\/li><li><em>avoir peur que<\/em>: <em>J'ai peur qu'il soit trop tard.<\/em><\/li><li><em>être surpris / étonné que<\/em>: <em>Je suis étonné qu'elle ne soit pas venue.<\/em><\/li><li><em>regretter que, s'étonner que<\/em><\/li><\/ul><p><b>Unpersönliche Ausdrücke<\/b> der Bewertung und Notwendigkeit:<\/p><ul><li><em>il faut que<\/em>: <em>Il faut que je parte.<\/em> – Ich muss gehen.<\/li><li><em>il est important / nécessaire / essentiel que<\/em><\/li><li><em>il vaut mieux que<\/em> – es ist besser, dass<\/li><li><em>c'est dommage que<\/em>: <em>C'est dommage que tu partes.<\/em><\/li><li><em>il est normal / bizarre / possible que<\/em><\/li><\/ul><div class='tip'>Merke: <em>il faut que<\/em> ist der häufigste Auslöser überhaupt – <em>Il faut que tu fasses tes devoirs.<\/em><\/div><div class='warn'>Achtung: <em>il est probable que<\/em> und <em>il est certain / sûr / évident que<\/em> stehen mit Indikativ – sie drücken (fast) Gewissheit aus.<\/div>"}, {"h": "Nach Zweifel und verneintem Denken", "html": "<ul><li><em>douter que<\/em>: <em>Je doute qu'il ait raison.<\/em><\/li><li><em>ne pas penser / ne pas croire que<\/em>: <em>Je ne crois pas qu'il vienne.<\/em><\/li><li><em>ne pas être sûr que<\/em>: <em>Je ne suis pas sûr que ce soit vrai.<\/em><\/li><li><em>il est possible / impossible que, il se peut que<\/em>: <em>Il se peut qu'il pleuve.<\/em><\/li><\/ul><p>Bejaht stehen Verben des Denkens und Sagens mit <b>Indikativ<\/b>:<\/p><table><tr><th>Indikativ<\/th><th>subjonctif<\/th><\/tr><tr><td><em>Je pense qu'il viendra.<\/em><\/td><td><em>Je ne pense pas qu'il vienne.<\/em><\/td><\/tr><tr><td><em>Je crois que c'est vrai.<\/em><\/td><td><em>Je ne crois pas que ce soit vrai.<\/em><\/td><\/tr><tr><td><em>Je suis sûr qu'il a raison.<\/em><\/td><td><em>Je ne suis pas sûr qu'il ait raison.<\/em><\/td><\/tr><\/table><div class='tip'>Merke: In Fragen mit Inversion kann ebenfalls der subjonctif stehen: <em>Penses-tu qu'il soit d'accord ?<\/em> – gesprochen meist Indikativ.<\/div>"}, {"h": "Nach bestimmten Konjunktionen", "html": "<table><tr><th>Konjunktion<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>pour que, afin que<\/em><\/td><td>damit<\/td><td><em>Je parle lentement pour que tu comprennes.<\/em><\/td><\/tr><tr><td><em>bien que, quoique<\/em><\/td><td>obwohl<\/td><td><em>Bien qu'il soit malade, il travaille.<\/em><\/td><\/tr><tr><td><em>avant que<\/em><\/td><td>bevor<\/td><td><em>Rentre avant qu'il (ne) pleuve.<\/em><\/td><\/tr><tr><td><em>jusqu'à ce que<\/em><\/td><td>bis<\/td><td><em>Attends jusqu'à ce que je revienne.<\/em><\/td><\/tr><tr><td><em>à condition que<\/em><\/td><td>unter der Bedingung, dass<\/td><td><em>Je viens à condition que tu conduises.<\/em><\/td><\/tr><tr><td><em>sans que<\/em><\/td><td>ohne dass<\/td><td><em>Il est parti sans que je le voie.<\/em><\/td><\/tr><tr><td><em>à moins que<\/em><\/td><td>es sei denn<\/td><td><em>On sort, à moins qu'il (ne) pleuve.<\/em><\/td><\/tr><tr><td><em>de peur que, de crainte que<\/em><\/td><td>aus Angst, dass<\/td><td><\/td><\/tr><\/table><div class='warn'>Achtung: <em>après que<\/em> (nachdem) steht offiziell mit Indikativ: <em>après qu'il est parti<\/em>. Und <em>parce que, pendant que, depuis que<\/em> natürlich auch.<\/div><div class='tip'>Merke: Das „ne explétif“ nach <em>avant que, à moins que, avoir peur que<\/em> ist keine Verneinung, sondern gehobener Stil: <em>J'ai peur qu'il ne soit trop tard.<\/em> = Ich fürchte, es ist zu spät.<\/div><p>Bei gleichem Subjekt: Präposition + Infinitiv: <em>pour partir, avant de partir, sans dire au revoir, à condition de payer<\/em>.<\/p>"}, {"h": "Weitere Fälle und subjonctif passé", "html": "<p>Der subjonctif steht außerdem<\/p><ul><li>im Relativsatz nach Superlativ und <em>le seul, le premier, le dernier<\/em>: <em>C'est le meilleur film que j'aie vu.<\/em><\/li><li>im Relativsatz bei gesuchten, ungewissen Dingen: <em>Je cherche quelqu'un qui sache parler chinois.<\/em><\/li><li>nach <em>que<\/em> am Satzanfang: <em>Qu'il vienne ou non, je pars.<\/em><\/li><li>in Wunschsätzen: <em>Vive la France ! Qu'il entre !<\/em><\/li><\/ul><p><b>subjonctif passé<\/b>: <em>avoir/être<\/em> im subjonctif + Partizip – für Handlungen, die vorher abgeschlossen sind:<\/p><ul><li><em>Je suis content que tu sois venu.<\/em> – Ich freue mich, dass du gekommen bist.<\/li><li><em>Je doute qu'il ait compris.<\/em><\/li><\/ul><div class='tip'>Merke: Der subjonctif imparfait (<em>qu'il fût, qu'il eût<\/em>) kommt nur in Literatur vor. Im Alltag gilt: Präsens oder passé – ganz gleich, ob der Hauptsatz in der Vergangenheit steht: <em>Je voulais que tu viennes.<\/em><\/div>"}], "exercises": [{"type": "gap", "title": "Bildung: regelmäßige Verben", "task": "Setze das Verb in den subjonctif présent.", "items": [{"q": "Il faut que tu ___ plus. (travailler)", "a": ["travailles"], "de": "Du musst mehr arbeiten."}, {"q": "Je veux que vous ___ vos devoirs. (finir)", "a": ["finissiez"], "de": "Ich will, dass ihr eure Hausaufgaben fertig macht."}, {"q": "Il faut qu'elle ___ la vérité. (dire)", "a": ["dise"], "de": "Sie muss die Wahrheit sagen."}, {"q": "Je préfère que tu m'___ . (attendre)", "a": ["attendes"], "de": "Mir ist lieber, du wartest auf mich."}, {"q": "Il faut que nous ___ le train de 8 h. (prendre)", "a": ["prenions"], "de": "Wir müssen den Zug um 8 nehmen."}, {"q": "Je voudrais qu'ils ___ avec nous. (venir)", "a": ["viennent"], "de": "Ich möchte, dass sie mitkommen."}, {"q": "Il faut que tu ___ beaucoup d'eau. (boire)", "a": ["boives"], "de": "Du musst viel Wasser trinken."}, {"q": "Il est important que vous ___ ce livre. (lire)", "a": ["lisiez"], "de": "Es ist wichtig, dass Sie dieses Buch lesen."}, {"q": "Je veux que tu m'___ demain. (écrire)", "a": ["écrives"], "de": "Ich will, dass du mir morgen schreibst."}]}, {"type": "gap", "title": "Unregelmäßige Formen", "task": "Setze den subjonctif ein.", "items": [{"q": "Je suis content que tu ___ là. (être)", "a": ["sois"], "de": "Ich freue mich, dass du da bist."}, {"q": "Il faut que j'___ à la banque. (aller)", "a": ["aille"], "de": "Ich muss zur Bank."}, {"q": "Il faut que nous ___ attention. (faire)", "a": ["fassions"], "de": "Wir müssen aufpassen."}, {"q": "J'ai peur qu'il n'___ pas assez d'argent. (avoir)", "a": ["ait"], "de": "Ich fürchte, er hat nicht genug Geld."}, {"q": "Bien qu'il ___ beaucoup, il est en forme. (fumer)", "a": ["fume"], "de": "Obwohl er viel raucht, ist er fit."}, {"q": "Je doute qu'elle ___ venir. (pouvoir)", "a": ["puisse"], "de": "Ich bezweifle, dass sie kommen kann."}, {"q": "Il faut que vous ___ patients. (être)", "a": ["soyez"], "de": "Ihr müsst geduldig sein."}, {"q": "Je ne pense pas qu'il ___ la réponse. (savoir)", "a": ["sache"], "de": "Ich glaube nicht, dass er die Antwort weiß."}, {"q": "Pour que tu ___ , je vais t'expliquer. (comprendre)", "a": ["comprennes"], "de": "Damit du verstehst, erkläre ich es dir."}, {"q": "Il faut qu'il ___ beau demain ! (faire)", "a": ["fasse"], "de": "Morgen muss schönes Wetter sein!"}]}, {"type": "choice", "title": "Indikativ oder subjonctif?", "task": "Wähle die richtige Form.", "items": [{"q": "Je pense qu'il ___ raison.", "options": ["a", "ait"], "a": 0, "why": "Bejahtes penser → Indikativ."}, {"q": "Je ne pense pas qu'il ___ raison.", "options": ["a", "ait"], "a": 1, "why": "Verneintes penser → subjonctif."}, {"q": "J'espère que tu ___ bientôt.", "options": ["viendras", "viennes"], "a": 0, "why": "espérer → Indikativ!"}, {"q": "Je souhaite que tu ___ heureux.", "options": ["es", "sois"], "a": 1, "why": "souhaiter (Wunsch) → subjonctif."}, {"q": "Il est certain qu'il ___ en retard.", "options": ["sera", "soit"], "a": 0, "why": "Gewissheit → Indikativ."}, {"q": "Il est possible qu'il ___ en retard.", "options": ["est", "soit"], "a": 1, "why": "Möglichkeit → subjonctif."}, {"q": "Je sais que vous ___ occupé.", "options": ["êtes", "soyez"], "a": 0, "why": "savoir → Indikativ."}, {"q": "Il est probable qu'elle ___ .", "options": ["viendra", "vienne"], "a": 0, "why": "il est probable → Indikativ."}, {"q": "C'est dommage que tu ___ partir.", "options": ["dois", "doives"], "a": 1, "why": "Bewertung → subjonctif."}]}, {"type": "choice", "title": "Infinitiv oder que + subjonctif?", "task": "Wähle die korrekte Konstruktion.", "items": [{"q": "Ich will gehen.", "options": ["Je veux que je parte.", "Je veux partir."], "a": 1, "why": "Gleiches Subjekt → Infinitiv."}, {"q": "Ich will, dass du gehst.", "options": ["Je veux te partir.", "Je veux que tu partes."], "a": 1, "why": "Verschiedene Subjekte → que + subjonctif."}, {"q": "Ich freue mich, dich zu sehen.", "options": ["Je suis content de te voir.", "Je suis content que je te voie."], "a": 0, "why": "Gleiches Subjekt → de + Infinitiv."}, {"q": "Ruf mich an, bevor du gehst.", "options": ["Appelle-moi avant que tu partes.", "Appelle-moi avant de partir."], "a": 1, "why": "Gleiches Subjekt → avant de + Infinitiv."}, {"q": "Ich spreche langsam, damit du verstehst.", "options": ["Je parle lentement pour comprendre.", "Je parle lentement pour que tu comprennes."], "a": 1, "why": "Verschiedene Subjekte → pour que + subjonctif."}]}, {"type": "choice", "title": "Konjunktionen", "task": "Welche Konjunktion verlangt den subjonctif?", "items": [{"q": "___ il pleuve, nous sortons.", "options": ["Bien qu'", "Parce qu'"], "a": 0, "why": "bien que + subjonctif (obwohl)."}, {"q": "Je reste ___ tu reviennes.", "options": ["jusqu'à ce que", "pendant que"], "a": 0, "why": "jusqu'à ce que + subjonctif."}, {"q": "Il est parti ___ je le sache.", "options": ["sans que", "après que"], "a": 0, "why": "sans que + subjonctif."}, {"q": "Je t'aide ___ tu finisses vite.", "options": ["pour que", "parce que"], "a": 0, "why": "pour que + subjonctif (Zweck)."}, {"q": "Je viendrai ___ tu viennes aussi.", "options": ["à condition que", "depuis que"], "a": 0, "why": "à condition que + subjonctif."}]}, {"type": "gap", "title": "Gemischt: subjonctif passé und Relativsatz", "task": "Setze die passende Form ein.", "items": [{"q": "Je suis heureux que tu ___ venu. (être)", "a": ["sois"], "de": "Ich freue mich, dass du gekommen bist."}, {"q": "C'est le plus beau pays que j'___ visité. (avoir)", "a": ["aie"], "de": "Das ist das schönste Land, das ich besucht habe."}, {"q": "Je cherche un appartement qui ___ un balcon. (avoir)", "a": ["ait"], "de": "Ich suche eine Wohnung, die einen Balkon hat."}, {"q": "Je doute qu'ils ___ compris. (avoir)", "a": ["aient"], "de": "Ich bezweifle, dass sie verstanden haben."}, {"q": "Il faut que tu ___ fini avant midi. (avoir)", "a": ["aies"], "de": "Du musst vor Mittag fertig sein."}]}], "cards": [{"f": "Stamm des subjonctif", "b": "ils-Form Präsens ohne -ent: ils finiss-ent → que je finisse"}, {"f": "Endungen des subjonctif", "b": "-e, -es, -e, -ions, -iez, -ent"}, {"f": "être – subjonctif", "b": "sois, sois, soit, soyons, soyez, soient"}, {"f": "avoir – subjonctif", "b": "aie, aies, ait, ayons, ayez, aient"}, {"f": "aller – subjonctif", "b": "aille, ailles, aille, allions, alliez, aillent"}, {"f": "faire – subjonctif", "b": "fasse … fassions"}, {"f": "pouvoir / savoir / vouloir – que je", "b": "puisse / sache / veuille"}, {"f": "venir / prendre – que je / que nous", "b": "vienne, venions / prenne, prenions"}, {"f": "il faut que …", "b": "+ subjonctif: Il faut que je parte."}, {"f": "vouloir que, souhaiter que", "b": "+ subjonctif"}, {"f": "espérer que", "b": "+ Indikativ! J'espère que tu viendras."}, {"f": "je pense que / je ne pense pas que", "b": "Indikativ / subjonctif"}, {"f": "il est probable / il est possible que", "b": "Indikativ / subjonctif"}, {"f": "Gefühle (content, peur, désolé) + que", "b": "subjonctif: Je suis content que tu sois là."}, {"f": "gleiches Subjekt – que + subjonctif?", "b": "Nein, Infinitiv: Je veux partir. Je suis content de te voir."}, {"f": "bien que, pour que, avant que, sans que", "b": "+ subjonctif"}, {"f": "jusqu'à ce que, à condition que, à moins que", "b": "+ subjonctif"}, {"f": "après que", "b": "offiziell + Indikativ"}, {"f": "C'est le meilleur film que j'aie vu.", "b": "subjonctif nach Superlativ im Relativsatz"}, {"f": "subjonctif passé", "b": "que tu sois venu, qu'il ait compris"}, {"f": "subjonctif imparfait", "b": "nur literarisch – im Alltag auch nach Vergangenheit subjonctif présent"}, {"f": "ne explétif", "b": "keine Verneinung: J'ai peur qu'il ne pleuve. (gehoben)"}]}, {"nr": 16, "id": "k17", "title": "Bedingungssätze und Zeitenfolge", "teil": "Das Verb und seine Ergänzungen", "intro": "Französische Bedingungssätze folgen drei festen Mustern. Die wichtigste Regel: Nach si steht nie Futur und nie Konditional. Dazu kommt die Zeitenfolge – wie sich die Zeit im Nebensatz nach der Zeit im Hauptsatz richtet.", "sections": [{"h": "Die drei Typen im Überblick", "html": "<table><tr><th>Typ<\/th><th>si-Satz<\/th><th>Hauptsatz<\/th><th>Bedeutung<\/th><\/tr><tr><td>1 – real<\/td><td><em>présent<\/em><\/td><td><em>présent / futur / impératif<\/em><\/td><td>möglich, wahrscheinlich<\/td><\/tr><tr><td>2 – irreal Gegenwart<\/td><td><em>imparfait<\/em><\/td><td><em>conditionnel présent<\/em><\/td><td>unwahrscheinlich, gedacht<\/td><\/tr><tr><td>3 – irreal Vergangenheit<\/td><td><em>plus-que-parfait<\/em><\/td><td><em>conditionnel passé<\/em><\/td><td>nicht mehr möglich<\/td><\/tr><\/table><div class='warn'>Achtung – die goldene Regel: Nach <em>si<\/em> (wenn, falls) stehen <b>nie<\/b> Futur oder Konditional. Falsch: <em>Si j'aurais le temps …<\/em> ✗<\/div><div class='tip'>Merke: Die Muster entsprechen genau dem Italienischen (<em>se avessi … farei<\/em>), nur steht im Französischen statt des congiuntivo das <b>imparfait<\/b>.<\/div>"}, {"h": "Typ 1: Reale Bedingung", "html": "<p><em>si<\/em> + Präsens → Präsens, Futur oder Imperativ:<\/p><ul><li><em>Si tu as faim, il y a du pain.<\/em> – Wenn du Hunger hast, ist Brot da.<\/li><li><em>S'il fait beau demain, nous irons à la plage.<\/em> – Wenn morgen schönes Wetter ist, fahren wir an den Strand.<\/li><li><em>Si tu vois Paul, dis-lui bonjour.<\/em> – Wenn du Paul siehst, grüß ihn.<\/li><\/ul><p>Auch mit passé composé im si-Satz: <em>Si tu as fini, tu peux partir.<\/em> – Wenn du fertig bist, kannst du gehen.<\/p><div class='warn'>Achtung: <em>si<\/em> wird nur vor <em>il/ils<\/em> zu <em>s'<\/em>: <em>s'il, s'ils<\/em> – aber <em>si elle, si on<\/em>.<\/div>"}, {"h": "Typ 2: Irreale Gegenwart", "html": "<p><em>si<\/em> + imparfait → conditionnel présent:<\/p><ul><li><em>Si j'avais de l'argent, j'achèterais une maison.<\/em> – Wenn ich Geld hätte, würde ich ein Haus kaufen.<\/li><li><em>Si j'étais toi, je partirais.<\/em> – An deiner Stelle würde ich gehen.<\/li><li><em>S'il faisait beau, on pourrait sortir.<\/em><\/li><li><em>Qu'est-ce que tu ferais si tu gagnais au loto ?<\/em><\/li><\/ul><p>Die Reihenfolge der Sätze ist frei: <em>Je viendrais si j'avais le temps.<\/em><\/p><div class='tip'>Merke: <em>Si j'étais toi …<\/em> / <em>À ta place …<\/em> – zwei Wege, einen Rat zu geben.<\/div>"}, {"h": "Typ 3: Irreale Vergangenheit", "html": "<p><em>si<\/em> + plus-que-parfait → conditionnel passé:<\/p><ul><li><em>Si j'avais su, je ne serais pas venu.<\/em> – Hätte ich das gewusst, wäre ich nicht gekommen.<\/li><li><em>Si tu m'avais appelé, je t'aurais aidé.<\/em> – Wenn du mich angerufen hättest, hätte ich dir geholfen.<\/li><li><em>S'il avait pris le train, il serait arrivé à l'heure.<\/em><\/li><\/ul><p><b>Mischformen<\/b> sind möglich, wenn Bedingung und Folge in verschiedenen Zeiten liegen:<\/p><ul><li><em>Si j'avais pris mon parapluie, je ne serais pas mouillé maintenant.<\/em> – Bedingung vergangen (plus-que-parfait), Folge gegenwärtig (conditionnel présent): <em>je ne serais pas mouillé<\/em>.<\/li><li><em>Si j'étais plus courageux, je lui aurais dit la vérité.<\/em><\/li><\/ul>"}, {"h": "Bedingungen ohne si", "html": "<table><tr><th>Ausdruck<\/th><th>Modus<\/th><th>Beispiel<\/th><\/tr><tr><td><em>au cas où<\/em> (falls)<\/td><td>Konditional<\/td><td><em>Prends un parapluie au cas où il pleuvrait.<\/em><\/td><\/tr><tr><td><em>à condition que<\/em><\/td><td>subjonctif<\/td><td><em>Je viens à condition que tu viennes aussi.<\/em><\/td><\/tr><tr><td><em>à moins que<\/em> (es sei denn)<\/td><td>subjonctif<\/td><td><em>On ira, à moins qu'il pleuve.<\/em><\/td><\/tr><tr><td><em>pourvu que<\/em> (vorausgesetzt / hoffentlich)<\/td><td>subjonctif<\/td><td><em>Pourvu qu'il fasse beau !<\/em><\/td><\/tr><tr><td><em>en cas de<\/em> + Substantiv<\/td><td>–<\/td><td><em>En cas de problème, appelez-moi.<\/em><\/td><\/tr><tr><td><em>sans<\/em> + Substantiv<\/td><td>Konditional<\/td><td><em>Sans toi, je serais perdu.<\/em><\/td><\/tr><tr><td><em>même si<\/em> (selbst wenn)<\/td><td>wie si<\/td><td><em>Même s'il pleut, je sortirai.<\/em><\/td><\/tr><\/table><div class='warn'>Achtung: <em>au cas où<\/em> verlangt den Konditional – eine der wenigen Ausnahmen!<\/div>"}, {"h": "si als „ob“ und „wenn“ in der Zeit", "html": "<p><em>si<\/em> hat noch andere Bedeutungen – dann gelten die Regeln oben <b>nicht<\/b>:<\/p><ul><li><b>ob<\/b> (indirekte Frage): Futur und Konditional erlaubt: <em>Je ne sais pas s'il viendra.<\/em> – Ich weiß nicht, ob er kommt.<\/li><li><b>Vorschlag<\/b>: <em>Si on allait à la plage ?<\/em><\/li><li><b>wenn = immer wenn<\/b> (Gewohnheit): <em>Si j'avais le temps, j'allais nager.<\/em> – Wenn ich Zeit hatte, ging ich schwimmen.<\/li><\/ul><p><b>quand vs. si<\/b>:<\/p><ul><li><em>quand<\/em> = wenn (zeitlich, es wird sicher eintreten) – mit Futur: <em>Quand il arrivera, on mangera.<\/em><\/li><li><em>si<\/em> = wenn, falls (Bedingung, unsicher): <em>S'il arrive, on mangera.<\/em><\/li><\/ul>"}, {"h": "Die Zeitenfolge (concordance des temps)", "html": "<p>Steht der Hauptsatz in einer Vergangenheitszeit, verschieben sich die Zeiten im <em>que<\/em>-Satz:<\/p><table><tr><th>Verhältnis<\/th><th>Hauptsatz Präsens<\/th><th>Hauptsatz Vergangenheit<\/th><\/tr><tr><td>gleichzeitig<\/td><td><em>Il dit qu'il est malade.<\/em><\/td><td><em>Il a dit qu'il était malade.<\/em><\/td><\/tr><tr><td>vorzeitig<\/td><td><em>Il dit qu'il a été malade.<\/em><\/td><td><em>Il a dit qu'il avait été malade.<\/em><\/td><\/tr><tr><td>nachzeitig<\/td><td><em>Il dit qu'il sera là.<\/em><\/td><td><em>Il a dit qu'il serait là.<\/em><\/td><\/tr><\/table><ul><li>Präsens → imparfait<\/li><li>passé composé → plus-que-parfait<\/li><li>futur → conditionnel présent<\/li><li>futur antérieur → conditionnel passé<\/li><\/ul><div class='tip'>Merke: Beim subjonctif bleibt im Alltag einfach der subjonctif présent: <em>Il fallait que je parte.<\/em> Mehr zur indirekten Rede in Kapitel 20.<\/div>"}], "exercises": [{"type": "gap", "title": "Typ 1", "task": "Setze das Verb in die passende Zeit.", "items": [{"q": "Si tu ___ fatigué, repose-toi. (être)", "a": ["es"], "de": "Wenn du müde bist, ruh dich aus."}, {"q": "S'il pleut, nous ___ à la maison. (rester – Futur)", "a": ["resterons"], "de": "Wenn es regnet, bleiben wir zu Hause."}, {"q": "Si vous ___ des questions, appelez-moi. (avoir)", "a": ["avez"], "de": "Wenn Sie Fragen haben, rufen Sie mich an."}, {"q": "Si elle ___ le train de 8 h, elle arrivera à midi. (prendre)", "a": ["prend"], "de": "Wenn sie den Zug um 8 nimmt, kommt sie mittags an."}, {"q": "Si tu ___ ton travail, tu peux sortir. (finir – passé composé)", "a": ["as fini"], "de": "Wenn du deine Arbeit fertig hast, kannst du raus."}, {"q": "Si on ___ maintenant, on sera à l'heure. (partir)", "a": ["part"], "de": "Wenn wir jetzt losgehen, sind wir pünktlich."}]}, {"type": "gap", "title": "Typ 2", "task": "Bilde den irrealen Bedingungssatz der Gegenwart.", "items": [{"q": "Si j'___ riche, je ferais le tour du monde. (être)", "a": ["étais"], "de": "Wenn ich reich wäre, würde ich eine Weltreise machen."}, {"q": "Si tu avais le temps, tu ___ avec nous ? (venir)", "a": ["viendrais"], "de": "Wenn du Zeit hättest, würdest du mitkommen?"}, {"q": "S'il ___ moins cher, je l'achèterais. (être)", "a": ["était"], "de": "Wenn es billiger wäre, würde ich es kaufen."}, {"q": "Si nous habitions à Paris, nous ___ souvent au musée. (aller)", "a": ["irions"], "de": "Wenn wir in Paris wohnten, gingen wir oft ins Museum."}, {"q": "Si j'étais toi, je ne ___ rien. (dire)", "a": ["dirais"], "de": "An deiner Stelle würde ich nichts sagen."}, {"q": "Qu'est-ce que vous feriez si vous ___ au loto ? (gagner)", "a": ["gagniez"], "de": "Was würden Sie tun, wenn Sie im Lotto gewännen?"}, {"q": "Si elle ___ parler français, elle trouverait du travail. (savoir)", "a": ["savait"], "de": "Wenn sie Französisch könnte, fände sie Arbeit."}]}, {"type": "gap", "title": "Typ 3", "task": "Bilde den irrealen Bedingungssatz der Vergangenheit.", "items": [{"q": "Si j'___ su, je serais venu. (avoir)", "a": ["avais"], "de": "Hätte ich das gewusst, wäre ich gekommen."}, {"q": "Si tu m'avais demandé, je t'___ aidé. (avoir)", "a": ["aurais"], "de": "Wenn du mich gefragt hättest, hätte ich dir geholfen."}, {"q": "S'il avait travaillé, il ___ réussi. (avoir)", "a": ["aurait"], "de": "Wenn er gelernt hätte, hätte er bestanden."}, {"q": "Si nous étions partis plus tôt, nous ne ___ pas raté le train. (avoir)", "a": ["aurions"], "de": "Wären wir früher losgefahren, hätten wir den Zug nicht verpasst."}, {"q": "Si elle ___ venue, elle aurait rencontré Paul. (être)", "a": ["était"], "de": "Wäre sie gekommen, hätte sie Paul getroffen."}, {"q": "Si j'avais écouté mes parents, je ___ médecin aujourd'hui. (être – Mischform)", "a": ["serais"], "de": "Hätte ich auf meine Eltern gehört, wäre ich heute Arzt."}]}, {"type": "choice", "title": "Richtig oder falsch?", "task": "Welcher Satz ist korrekt?", "items": [{"q": "Wenn ich Zeit hätte, käme ich.", "options": ["Si j'aurais le temps, je viendrais.", "Si j'avais le temps, je viendrais."], "a": 1, "why": "Nach si nie Konditional."}, {"q": "Wenn er kommt, sage ich es ihm.", "options": ["S'il viendra, je le lui dirai.", "S'il vient, je le lui dirai."], "a": 1, "why": "Nach si nie Futur."}, {"q": "Ich weiß nicht, ob er kommt.", "options": ["Je ne sais pas s'il viendra.", "Je ne sais pas si il viendra."], "a": 0, "why": "si = ob → Futur erlaubt; vor il wird si zu s'."}, {"q": "Falls es regnet, nimm einen Schirm.", "options": ["Au cas où il pleuvrait, prends un parapluie.", "Au cas où il pleut, prends un parapluie."], "a": 0, "why": "au cas où + Konditional."}, {"q": "Wenn du ankommst (sicher), essen wir.", "options": ["Quand tu arriveras, on mangera.", "Quand tu arrives, on mangera."], "a": 0, "why": "quand + Zukunft → Futur."}, {"q": "Selbst wenn es regnet, gehe ich raus.", "options": ["Même s'il pleuvra, je sortirai.", "Même s'il pleut, je sortirai."], "a": 1, "why": "même si wie si: kein Futur."}]}, {"type": "gap", "title": "Zeitenfolge", "task": "Setze das Verb in die richtige Zeit (Hauptsatz in der Vergangenheit).", "items": [{"q": "Il a dit qu'il ___ fatigué. (être – gleichzeitig)", "a": ["était"], "de": "Er sagte, er sei müde."}, {"q": "Elle m'a dit qu'elle ___ demain. (venir – nachzeitig)", "a": ["viendrait"], "de": "Sie sagte mir, sie komme morgen."}, {"q": "Ils ont expliqué qu'ils ___ le bus. (rater – vorzeitig)", "a": ["avaient raté"], "de": "Sie erklärten, sie hätten den Bus verpasst."}, {"q": "Je savais que tu ___ raison. (avoir – gleichzeitig)", "a": ["avais"], "de": "Ich wusste, dass du recht hast."}, {"q": "Il pensait qu'elle ___ . (partir – vorzeitig)", "a": ["était partie", "était déjà partie"], "de": "Er dachte, sie sei schon abgereist."}]}], "cards": [{"f": "Goldene Regel nach si", "b": "nie Futur, nie Konditional"}, {"f": "Typ 1 (real)", "b": "si + présent → présent / futur / impératif"}, {"f": "Typ 2 (irreal Gegenwart)", "b": "si + imparfait → conditionnel présent"}, {"f": "Typ 3 (irreal Vergangenheit)", "b": "si + plus-que-parfait → conditionnel passé"}, {"f": "Wenn ich reich wäre, …", "b": "Si j'étais riche, …"}, {"f": "Hätte ich das gewusst, wäre ich gekommen.", "b": "Si j'avais su, je serais venu."}, {"f": "An deiner Stelle …", "b": "Si j'étais toi … / À ta place …"}, {"f": "si vor il / elle", "b": "s'il – aber si elle"}, {"f": "au cas où", "b": "falls – mit Konditional: au cas où il pleuvrait"}, {"f": "à condition que / à moins que", "b": "+ subjonctif"}, {"f": "même si", "b": "selbst wenn – wie si (kein Futur)"}, {"f": "si = ob", "b": "Futur erlaubt: Je ne sais pas s'il viendra."}, {"f": "quand oder si?", "b": "quand = sobald (sicher, mit Futur) · si = falls (Bedingung)"}, {"f": "Zeitenfolge: présent →", "b": "imparfait (Il a dit qu'il était malade.)"}, {"f": "Zeitenfolge: passé composé →", "b": "plus-que-parfait"}, {"f": "Zeitenfolge: futur →", "b": "conditionnel présent (Il a dit qu'il viendrait.)"}, {"f": "Sans toi, je serais perdu.", "b": "Ohne dich wäre ich verloren. (sans + Konditional)"}, {"f": "Pourvu qu'il fasse beau !", "b": "Hoffentlich ist schönes Wetter! (+ subjonctif)"}]}, {"nr": 17, "id": "k18", "title": "Der Imperativ", "teil": "Das Verb und seine Ergänzungen", "intro": "Der Imperativ hat im Französischen nur drei Formen: tu, nous und vous. Er ist einfach zu bilden – die Knackpunkte sind das fehlende -s bei den -er-Verben, vier unregelmäßige Verben und die Stellung der Pronomen.", "sections": [{"h": "Bildung", "html": "<p>Der Imperativ entspricht den Präsensformen von <em>tu, nous, vous<\/em> – ohne Subjektpronomen:<\/p><table><tr><th>Form<\/th><th>parler<\/th><th>finir<\/th><th>prendre<\/th><\/tr><tr><td>tu<\/td><td><em>Parle !<\/em><\/td><td><em>Finis !<\/em><\/td><td><em>Prends !<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>Parlons !<\/em><\/td><td><em>Finissons !<\/em><\/td><td><em>Prenons !<\/em><\/td><\/tr><tr><td>vous<\/td><td><em>Parlez !<\/em><\/td><td><em>Finissez !<\/em><\/td><td><em>Prenez !<\/em><\/td><\/tr><\/table><ul><li><em>tu<\/em>: eine vertraute Person – <em>Viens ici !<\/em><\/li><li><em>nous<\/em>: „Lasst uns …“ – <em>Allons-y ! Partons !<\/em><\/li><li><em>vous<\/em>: höflich oder mehrere – <em>Entrez, s'il vous plaît.<\/em><\/li><\/ul><div class='warn'>Achtung: Bei den <em>-er<\/em>-Verben (und bei <em>aller<\/em>, <em>ouvrir, offrir<\/em>) fällt in der <em>tu<\/em>-Form das <em>-s<\/em> weg: <em>Tu parles → Parle !<\/em> <em>Tu vas → Va !<\/em> <em>Tu ouvres → Ouvre !<\/em><\/div><div class='tip'>Merke: Vor <em>y<\/em> und <em>en<\/em> kommt das <em>-s<\/em> zurück (Wohlklang, Liaison): <em>Vas-y !<\/em> (Los!) <em>Manges-en !<\/em> (Iss davon!)<\/div>"}, {"h": "Unregelmäßige Imperative", "html": "<p>Vier Verben bilden den Imperativ aus dem subjonctif:<\/p><table><tr><th>Verb<\/th><th>tu<\/th><th>nous<\/th><th>vous<\/th><\/tr><tr><td><em>être<\/em><\/td><td><em>sois<\/em><\/td><td><em>soyons<\/em><\/td><td><em>soyez<\/em><\/td><\/tr><tr><td><em>avoir<\/em><\/td><td><em>aie<\/em><\/td><td><em>ayons<\/em><\/td><td><em>ayez<\/em><\/td><\/tr><tr><td><em>savoir<\/em><\/td><td><em>sache<\/em><\/td><td><em>sachons<\/em><\/td><td><em>sachez<\/em><\/td><\/tr><tr><td><em>vouloir<\/em><\/td><td><em>veuille<\/em><\/td><td>–<\/td><td><em>veuillez<\/em><\/td><\/tr><\/table><ul><li><em>Sois sage !<\/em> – Sei brav!<\/li><li><em>N'aie pas peur !<\/em> – Hab keine Angst!<\/li><li><em>Soyez patients.<\/em> – Seid geduldig.<\/li><li><em>Sachez que …<\/em> – Sie sollen wissen, dass …<\/li><li><em>Veuillez patienter.<\/em> – Bitte warten Sie. (sehr förmlich)<\/li><\/ul><div class='tip'>Merke: <em>Veuillez<\/em> + Infinitiv ist die höfliche Formel in Briefen und Ansagen: <em>Veuillez agréer, Madame, mes salutations distinguées.<\/em><\/div>"}, {"h": "Der verneinte Imperativ", "html": "<p><em>ne … pas<\/em> umschließt das Verb wie gewohnt:<\/p><ul><li><em>Ne parle pas si fort !<\/em> – Sprich nicht so laut!<\/li><li><em>Ne partez pas !<\/em><\/li><li><em>N'oublions pas …<\/em> – Vergessen wir nicht …<\/li><li><em>Ne fais jamais ça !<\/em> – Mach das nie!<\/li><\/ul><div class='tip'>Merke: Anders als im Italienischen (<em>non parlare<\/em>) und Spanischen (<em>no hables<\/em>) bleibt die Form gleich – nur <em>ne … pas<\/em> kommt dazu.<\/div>"}, {"h": "Pronomen beim Imperativ", "html": "<p><b>Bejahter Imperativ<\/b>: Pronomen stehen <b>nach<\/b> dem Verb, mit Bindestrich. <em>me<\/em> und <em>te<\/em> werden zu <em>moi<\/em> und <em>toi<\/em>:<\/p><ul><li><em>Regarde-moi !<\/em> – Schau mich an!<\/li><li><em>Lève-toi !<\/em> – Steh auf!<\/li><li><em>Prends-le !<\/em> – Nimm ihn!<\/li><li><em>Téléphonez-lui.<\/em> – Rufen Sie ihn/sie an.<\/li><li><em>Allons-y !<\/em> – Gehen wir!<\/li><\/ul><p>Zwei Pronomen: direktes vor indirektem Objekt, <em>y<\/em> und <em>en<\/em> am Ende:<\/p><ul><li><em>Donne-le-moi !<\/em> – Gib es mir!<\/li><li><em>Dites-le-lui.<\/em> – Sagt es ihm.<\/li><li><em>Donne-m'en !<\/em> – Gib mir etwas davon!<\/li><\/ul><p><b>Verneinter Imperativ<\/b>: Pronomen stehen <b>vor<\/b> dem Verb, normale Reihenfolge:<\/p><ul><li><em>Ne me regarde pas !<\/em><\/li><li><em>Ne te lève pas !<\/em><\/li><li><em>Ne le lui dis pas !<\/em><\/li><li><em>N'y va pas !<\/em><\/li><\/ul>"}, {"h": "Reflexive Verben im Imperativ", "html": "<table><tr><th>Person<\/th><th>bejaht<\/th><th>verneint<\/th><\/tr><tr><td>tu<\/td><td><em>Dépêche-toi !<\/em><\/td><td><em>Ne te dépêche pas !<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>Dépêchons-nous !<\/em><\/td><td><em>Ne nous dépêchons pas !<\/em><\/td><\/tr><tr><td>vous<\/td><td><em>Dépêchez-vous !<\/em><\/td><td><em>Ne vous dépêchez pas !<\/em><\/td><\/tr><\/table><p>Weitere häufige: <em>Assieds-toi / Asseyez-vous<\/em> (Setz dich / Setzen Sie sich), <em>Tais-toi !<\/em> (Sei still!), <em>Calme-toi !<\/em>, <em>Amusez-vous bien !<\/em> (Viel Spaß!), <em>Ne t'inquiète pas !<\/em> (Mach dir keine Sorgen!), <em>Souviens-toi !<\/em><\/p>"}, {"h": "Aufforderungen höflicher formulieren", "html": "<p>Der Imperativ wirkt im Französischen schnell schroff. Höflicher sind:<\/p><table><tr><th>Form<\/th><th>Beispiel<\/th><\/tr><tr><td>+ <em>s'il te plaît / s'il vous plaît<\/em><\/td><td><em>Ferme la porte, s'il te plaît.<\/em><\/td><\/tr><tr><td>Frage mit <em>pouvoir<\/em><\/td><td><em>Tu peux fermer la porte ? Vous pourriez m'aider ?<\/em><\/td><\/tr><tr><td><em>Je voudrais que<\/em> + subjonctif<\/td><td><em>Je voudrais que tu m'aides.<\/em><\/td><\/tr><tr><td>Futur (Anweisung)<\/td><td><em>Vous prendrez la deuxième rue à droite.<\/em><\/td><\/tr><tr><td>Infinitiv (Rezepte, Schilder)<\/td><td><em>Ajouter le sel. Ne pas fumer. Tirer.<\/em><\/td><\/tr><tr><td><em>Il faut<\/em> + Infinitiv<\/td><td><em>Il faut tourner à gauche.<\/em><\/td><\/tr><tr><td><em>Veuillez<\/em> + Infinitiv<\/td><td><em>Veuillez fermer la porte.<\/em><\/td><\/tr><\/table><div class='tip'>Merke: Auf Schildern und in Rezepten steht der Infinitiv – wie im Deutschen: <em>Ne pas se pencher au-dehors.<\/em> (Nicht hinauslehnen.)<\/div>"}], "exercises": [{"type": "gap", "title": "Bildung des Imperativs", "task": "Setze den Imperativ in der angegebenen Person ein.", "items": [{"q": "___ la porte, s'il te plaît ! (fermer, tu)", "a": ["Ferme"], "de": "Mach bitte die Tür zu!"}, {"q": "___ vite ! (venir, tu)", "a": ["Viens"], "de": "Komm schnell!"}, {"q": "___ au cinéma ce soir ! (aller, nous)", "a": ["Allons"], "de": "Lass uns heute Abend ins Kino gehen!"}, {"q": "___ votre temps. (prendre, vous)", "a": ["Prenez"], "de": "Lassen Sie sich Zeit."}, {"q": "___ tes devoirs ! (finir, tu)", "a": ["Finis"], "de": "Mach deine Hausaufgaben fertig!"}, {"q": "___ à la maison ! (rentrer, tu)", "a": ["Rentre"], "de": "Komm nach Hause!"}, {"q": "___ la fenêtre ! (ouvrir, tu)", "a": ["Ouvre"], "de": "Mach das Fenster auf!"}, {"q": "___ attention ! (faire, vous)", "a": ["Faites"], "de": "Passen Sie auf!"}, {"q": "___ ! (aller + y, tu)", "a": ["Vas-y"], "de": "Los, mach schon!"}]}, {"type": "gap", "title": "Unregelmäßige Imperative", "task": "Setze den Imperativ ein.", "items": [{"q": "___ sage ! (être, tu)", "a": ["Sois"], "de": "Sei brav!"}, {"q": "N'___ pas peur ! (avoir, tu)", "a": ["aie"], "de": "Hab keine Angst!"}, {"q": "___ patients ! (être, vous)", "a": ["Soyez"], "de": "Seid geduldig!"}, {"q": "___ courage ! (avoir, nous)", "a": ["Ayons"], "de": "Lasst uns mutig sein!"}, {"q": "___ patienter, s'il vous plaît. (vouloir, vous)", "a": ["Veuillez"], "de": "Bitte warten Sie."}, {"q": "___ que je ne changerai pas d'avis. (savoir, vous)", "a": ["Sachez"], "de": "Wissen Sie, dass ich meine Meinung nicht ändern werde."}]}, {"type": "choice", "title": "Pronomen beim Imperativ", "task": "Welche Form ist richtig?", "items": [{"q": "Schau mich an!", "options": ["Me regarde !", "Regarde-moi !", "Regarde-me !"], "a": 1, "why": "Bejaht: Pronomen nach dem Verb, me → moi."}, {"q": "Schau mich nicht an!", "options": ["Ne regarde-moi pas !", "Ne me regarde pas !"], "a": 1, "why": "Verneint: Pronomen vor dem Verb."}, {"q": "Gib es mir!", "options": ["Donne-moi-le !", "Donne-le-moi !"], "a": 1, "why": "Direktes vor indirektem Objekt."}, {"q": "Setz dich!", "options": ["Assieds-toi !", "Toi assieds !", "Assieds-te !"], "a": 0, "why": "Reflexiv bejaht: -toi."}, {"q": "Mach dir keine Sorgen!", "options": ["Ne t'inquiète pas !", "Ne inquiète-toi pas !"], "a": 0, "why": "Verneint: te vor dem Verb."}, {"q": "Sag es ihr nicht!", "options": ["Ne le lui dis pas !", "Ne dis-le-lui pas !"], "a": 0, "why": "Verneint: normale Pronomenstellung."}, {"q": "Beeilen wir uns!", "options": ["Nous dépêchons !", "Dépêchons-nous !"], "a": 1, "why": "Bejaht: Pronomen hinten."}, {"q": "Nimm welche davon!", "options": ["Prends-en !", "En prends !"], "a": 0, "why": "en nach dem Verb."}]}, {"type": "gap", "title": "Verneinte Imperative", "task": "Verneine die Aufforderung.", "items": [{"q": "Pars ! → ___ !", "a": ["Ne pars pas"], "de": "Geh nicht!"}, {"q": "Lève-toi ! → ___ !", "a": ["Ne te lève pas"], "de": "Steh nicht auf!"}, {"q": "Prends-le ! → ___ !", "a": ["Ne le prends pas"], "de": "Nimm ihn nicht!"}, {"q": "Allez-y ! → ___ !", "a": ["N'y allez pas"], "de": "Geht nicht hin!"}, {"q": "Dites-le-lui ! → ___ !", "a": ["Ne le lui dites pas"], "de": "Sagt es ihm nicht!"}]}], "cards": [{"f": "Imperativ – Formen", "b": "nur tu, nous, vous – ohne Pronomen: Parle ! Parlons ! Parlez !"}, {"f": "tu-Form der -er-Verben", "b": "ohne -s: Parle ! Mange ! Va !"}, {"f": "Vas-y ! – warum mit -s?", "b": "vor y und en kommt das -s zurück"}, {"f": "être – Imperativ", "b": "sois, soyons, soyez"}, {"f": "avoir – Imperativ", "b": "aie, ayons, ayez"}, {"f": "savoir / vouloir – Imperativ", "b": "sache, sachons, sachez / veuille, veuillez"}, {"f": "Bitte warten Sie. (förmlich)", "b": "Veuillez patienter."}, {"f": "verneinter Imperativ", "b": "Ne parle pas !"}, {"f": "Pronomen im bejahten Imperativ", "b": "nach dem Verb: Regarde-moi ! Prends-le !"}, {"f": "Pronomen im verneinten Imperativ", "b": "vor dem Verb: Ne me regarde pas !"}, {"f": "Gib es mir!", "b": "Donne-le-moi !"}, {"f": "Setz dich! / Setzen Sie sich!", "b": "Assieds-toi ! / Asseyez-vous !"}, {"f": "Sei still!", "b": "Tais-toi !"}, {"f": "Mach dir keine Sorgen!", "b": "Ne t'inquiète pas !"}, {"f": "Gehen wir! / Los!", "b": "Allons-y ! / Vas-y !"}, {"f": "Viel Spaß!", "b": "Amusez-vous bien ! / Amuse-toi bien !"}, {"f": "Imperativ auf Schildern und in Rezepten", "b": "Infinitiv: Ne pas fumer. Ajouter le sel."}]}, {"nr": 18, "id": "k19", "title": "Infinitiv, Partizip und gérondif", "teil": "Das Verb und seine Ergänzungen", "intro": "Infinite Verbformen machen Sätze kürzer und eleganter: après avoir mangé statt „nachdem ich gegessen hatte“, en marchant statt „während ich ging“. Dieses Kapitel zeigt den Infinitiv mit und ohne Präposition, das Partizip Präsens, das gérondif und das Partizip Perfekt als Adjektiv.", "sections": [{"h": "Der Infinitiv ohne Präposition", "html": "<p>Direkt angeschlossen wird der Infinitiv nach:<\/p><ul><li>Modalverben: <em>pouvoir, vouloir, devoir, savoir, falloir<\/em> – <em>Je dois partir. Il faut manger.<\/em><\/li><li>Verben der Bewegung: <em>aller, venir, partir, sortir, rentrer, descendre, monter<\/em> – <em>Je vais chercher du pain. Viens voir !<\/em><\/li><li>Verben der Vorliebe und Meinung: <em>aimer, adorer, préférer, détester, espérer, penser, croire, compter<\/em> – <em>J'aime lire. Il espère venir.<\/em><\/li><li>Wahrnehmungsverben: <em>voir, entendre, regarder, écouter, sentir<\/em> – <em>Je l'entends chanter.<\/em><\/li><li><em>faire<\/em> und <em>laisser<\/em>: <em>Je fais réparer ma voiture. Laisse-moi dormir.<\/em><\/li><li>unpersönlichen Ausdrücken: <em>il vaut mieux, il faut<\/em><\/li><\/ul><div class='warn'>Achtung: <em>venir<\/em> + Infinitiv = kommen, um zu …; <em>venir de<\/em> + Infinitiv = gerade getan haben: <em>Je viens te voir<\/em> (Ich komme, um dich zu besuchen) – <em>Je viens de te voir<\/em> (Ich habe dich gerade gesehen).<\/div>"}, {"h": "Infinitiv mit à oder de", "html": "<p>Viele Verben verlangen eine Präposition vor dem Infinitiv – das muss man mitlernen (Übersicht in Kapitel 27):<\/p><table><tr><th>mit <em>à<\/em><\/th><th>mit <em>de<\/em><\/th><\/tr><tr><td><em>commencer à<\/em> – anfangen zu<\/td><td><em>finir de<\/em> – aufhören, fertig sein mit<\/td><\/tr><tr><td><em>apprendre à<\/em> – lernen zu<\/td><td><em>arrêter de<\/em> – aufhören zu<\/td><\/tr><tr><td><em>réussir à<\/em> – schaffen zu<\/td><td><em>essayer de<\/em> – versuchen zu<\/td><\/tr><tr><td><em>continuer à<\/em> – weitermachen<\/td><td><em>oublier de<\/em> – vergessen zu<\/td><\/tr><tr><td><em>aider qn à<\/em> – jdm helfen zu<\/td><td><em>décider de<\/em> – beschließen zu<\/td><\/tr><tr><td><em>hésiter à<\/em> – zögern zu<\/td><td><em>refuser de<\/em> – sich weigern zu<\/td><\/tr><tr><td><em>s'habituer à<\/em> – sich gewöhnen an<\/td><td><em>avoir envie / besoin / peur de<\/em><\/td><\/tr><tr><td><em>passer son temps à<\/em><\/td><td><em>dire / demander / permettre à qn de<\/em><\/td><\/tr><\/table><p>Auch nach Adjektiven und Substantiven: <em>Je suis content de te voir. C'est facile à comprendre. J'ai le temps de lire. C'est l'heure de partir.<\/em><\/p><div class='tip'>Merke: <em>C'est difficile à faire<\/em> (die Sache ist schwer zu machen) – <em>Il est difficile de faire ça<\/em> (es ist schwer, das zu tun). <em>à<\/em> wenn das Objekt fehlt, <em>de<\/em> wenn es folgt.<\/div>"}, {"h": "Infinitiv nach Präpositionen", "html": "<p>Nach Präpositionen steht im Französischen der Infinitiv (nie ein -ant-Partizip wie im Englischen):<\/p><ul><li><em>pour<\/em> (um zu): <em>Je travaille pour gagner ma vie.<\/em><\/li><li><em>sans<\/em> (ohne zu): <em>Il est parti sans dire au revoir.<\/em><\/li><li><em>avant de<\/em> (bevor): <em>Lave-toi les mains avant de manger.<\/em><\/li><li><em>au lieu de<\/em> (anstatt zu): <em>Au lieu de travailler, il dort.<\/em><\/li><li><em>afin de<\/em> (um zu, gehoben)<\/li><\/ul><p><b>Infinitiv Perfekt<\/b> (<em>avoir/être<\/em> + Partizip) nach <em>après<\/em> – für Vorzeitigkeit:<\/p><ul><li><em>Après avoir mangé, nous sommes sortis.<\/em> – Nachdem wir gegessen hatten, …<\/li><li><em>Après être rentrée, elle s'est couchée.<\/em> (Angleichung bei être)<\/li><li><em>Merci de m'avoir aidé.<\/em> – Danke, dass du mir geholfen hast.<\/li><\/ul><div class='warn'>Achtung: Diese Konstruktionen funktionieren nur bei <b>gleichem Subjekt<\/b>. Sonst braucht es einen Nebensatz: <em>avant qu'il parte<\/em>, <em>pour que tu comprennes<\/em> (Kapitel 15).<\/div>"}, {"h": "Das Partizip Präsens", "html": "<p>Bildung: Stamm der <em>nous<\/em>-Form + <em>-ant<\/em>: <em>nous parlons → parlant, nous finissons → finissant, nous faisons → faisant<\/em>.<\/p><p>Ausnahmen: <em>être → étant, avoir → ayant, savoir → sachant<\/em>.<\/p><p>Das Partizip Präsens ist <b>unveränderlich<\/b> und gehört eher zur Schriftsprache. Es ersetzt<\/p><ul><li>einen Relativsatz mit <em>qui<\/em>: <em>Les étudiants parlant français …<\/em> = <em>qui parlent français<\/em><\/li><li>einen Kausalsatz: <em>Étant malade, il n'est pas venu.<\/em> – Da er krank war, …<\/li><li><em>Ayant fini son travail, elle est partie.<\/em> – Nachdem sie … beendet hatte<\/li><\/ul><div class='warn'>Achtung: Davon zu unterscheiden ist das <b>Verbaladjektiv<\/b> auf -ant, das sich angleicht: <em>une histoire intéressante, des enfants obéissants<\/em>. Manche schreiben sich sogar anders: <em>fatiguant<\/em> (ermüdend, Partizip) – <em>fatigant<\/em> (anstrengend, Adjektiv); <em>convainquant – convaincant<\/em>.<\/div>"}, {"h": "Das gérondif", "html": "<p><em>en<\/em> + Partizip Präsens: <em>en parlant, en faisant, en étant<\/em>. Das Subjekt ist immer dasselbe wie im Hauptsatz. Es drückt aus:<\/p><table><tr><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td>Gleichzeitigkeit (während)<\/td><td><em>Je chante en prenant ma douche.<\/em> – Ich singe beim Duschen.<\/td><\/tr><tr><td>Art und Weise (indem)<\/td><td><em>Il a appris le français en regardant des films.<\/em><\/td><\/tr><tr><td>Bedingung (wenn)<\/td><td><em>En partant maintenant, tu arriveras à l'heure.<\/em><\/td><\/tr><tr><td>Zeitpunkt (als)<\/td><td><em>En sortant, j'ai vu Paul.<\/em> – Als ich hinausging, …<\/td><\/tr><tr><td>Gegensatz mit <em>tout<\/em><\/td><td><em>Tout en étant riche, il vit simplement.<\/em> – Obwohl er reich ist, …<\/td><\/tr><\/table><div class='warn'>Achtung: <em>J'ai vu Paul en sortant<\/em> (ich ging hinaus) ≠ <em>J'ai vu Paul sortant du cinéma<\/em> (Paul kam aus dem Kino). Das gérondif bezieht sich immer auf das Subjekt!<\/div><div class='tip'>Merke: Das gérondif entspricht dem ital. <em>gerundio<\/em> und span. <em>gerundio<\/em> in Sätzen wie <em>imparo ascoltando / aprendo escuchando<\/em>. Eine Verlaufsform („ich bin am …“) gibt es damit aber nicht – dafür steht <em>être en train de<\/em>.<\/div>"}, {"h": "Das Partizip Perfekt", "html": "<p>Neben den zusammengesetzten Zeiten wird das Partizip Perfekt als <b>Adjektiv<\/b> verwendet und dann angeglichen:<\/p><ul><li><em>une porte fermée, des fenêtres ouvertes, un plat préparé<\/em><\/li><li><em>Elle a l'air fatiguée.<\/em><\/li><li><em>la langue parlée / écrite<\/em><\/li><\/ul><p>Verkürzte Nebensätze (gehoben): <em>Une fois le travail terminé, nous sommes partis.<\/em> – Als die Arbeit beendet war, … <em>Arrivés à la gare, ils ont cherché un taxi.<\/em><\/p><p>Feste Ausdrücke: <em>vu<\/em> (angesichts), <em>compris / y compris<\/em> (inklusive), <em>étant donné<\/em> (angesichts), <em>excepté<\/em> (außer): <em>Tout le monde est venu, excepté Paul.<\/em> – vorangestellt unveränderlich.<\/p>"}, {"h": "faire und laisser + Infinitiv", "html": "<p><em>faire<\/em> + Infinitiv = etwas machen lassen (veranlassen):<\/p><ul><li><em>Je fais réparer ma voiture.<\/em> – Ich lasse mein Auto reparieren.<\/li><li><em>Elle s'est fait couper les cheveux.<\/em> – Sie hat sich die Haare schneiden lassen.<\/li><li><em>Ce film me fait rire.<\/em> – Dieser Film bringt mich zum Lachen.<\/li><li><em>Fais-moi savoir.<\/em> – Lass es mich wissen.<\/li><\/ul><p><em>laisser<\/em> + Infinitiv = etwas zulassen, (zu)lassen:<\/p><ul><li><em>Laisse-moi tranquille !<\/em> – Lass mich in Ruhe!<\/li><li><em>Il laisse ses enfants regarder la télé.<\/em><\/li><li><em>Laissez-moi passer.<\/em><\/li><\/ul><div class='warn'>Achtung: Das Pronomen steht vor <em>faire/laisser<\/em>, nicht vor dem Infinitiv: <em>Je la fais réparer.<\/em> Und das Partizip <em>fait<\/em> wird vor einem Infinitiv nie angeglichen: <em>la voiture que j'ai fait réparer<\/em>.<\/div>"}], "exercises": [{"type": "choice", "title": "Infinitiv mit oder ohne Präposition?", "task": "Wähle die richtige Ergänzung.", "items": [{"q": "J'ai commencé ___ apprendre le russe.", "options": ["–", "à", "de"], "a": 1, "why": "commencer à."}, {"q": "Il a arrêté ___ fumer.", "options": ["–", "à", "de"], "a": 2, "why": "arrêter de."}, {"q": "Nous voulons ___ partir tôt.", "options": ["–", "à", "de"], "a": 0, "why": "Modalverb + Infinitiv ohne Präposition."}, {"q": "N'oublie pas ___ fermer la porte.", "options": ["–", "à", "de"], "a": 2, "why": "oublier de."}, {"q": "Elle a réussi ___ trouver un travail.", "options": ["–", "à", "de"], "a": 1, "why": "réussir à."}, {"q": "J'aime ___ cuisiner.", "options": ["–", "à", "de"], "a": 0, "why": "aimer + Infinitiv direkt."}, {"q": "Il essaie ___ comprendre.", "options": ["–", "à", "de"], "a": 2, "why": "essayer de."}, {"q": "Tu m'aides ___ porter la valise ?", "options": ["–", "à", "de"], "a": 1, "why": "aider qn à."}, {"q": "J'ai décidé ___ changer de travail.", "options": ["–", "à", "de"], "a": 2, "why": "décider de."}, {"q": "C'est un livre facile ___ lire.", "options": ["à", "de"], "a": 0, "why": "Adjektiv + à ohne folgendes Objekt."}]}, {"type": "gap", "title": "Präposition + Infinitiv", "task": "Setze die passende Form ein.", "items": [{"q": "Lave-toi les mains avant ___ manger.", "a": ["de"], "de": "Wasch dir vor dem Essen die Hände."}, {"q": "Il est parti sans ___ au revoir. (dire)", "a": ["dire"], "de": "Er ist gegangen, ohne sich zu verabschieden."}, {"q": "Après ___ mangé, on a fait une promenade.", "a": ["avoir"], "de": "Nachdem wir gegessen hatten, machten wir einen Spaziergang."}, {"q": "Après ___ arrivés, ils ont dormi.", "a": ["être"], "de": "Nachdem sie angekommen waren, schliefen sie."}, {"q": "Merci de m'___ invité.", "a": ["avoir"], "de": "Danke für die Einladung."}, {"q": "Au lieu ___ travailler, il regarde la télé.", "a": ["de"], "de": "Anstatt zu arbeiten, sieht er fern."}, {"q": "Je fais du sport ___ rester en forme.", "a": ["pour"], "de": "Ich mache Sport, um fit zu bleiben."}]}, {"type": "gap", "title": "Das gérondif", "task": "Bilde das gérondif.", "items": [{"q": "Il écoute de la musique ___ . (travailler)", "a": ["en travaillant"], "de": "Er hört bei der Arbeit Musik."}, {"q": "J'ai appris l'italien ___ en Italie. (vivre)", "a": ["en vivant"], "de": "Ich habe Italienisch gelernt, indem ich in Italien lebte."}, {"q": "___ , j'ai rencontré ma voisine. (sortir)", "a": ["En sortant"], "de": "Als ich hinausging, traf ich meine Nachbarin."}, {"q": "On se fatigue ___ trop. (faire)", "a": ["en faisant"], "de": "Man ermüdet, wenn man zu viel macht."}, {"q": "Ne parle pas ___ ! (manger)", "a": ["en mangeant"], "de": "Sprich nicht beim Essen!"}, {"q": "___ plus tôt, tu éviteras les bouchons. (partir)", "a": ["En partant"], "de": "Wenn du früher losfährst, vermeidest du Staus."}, {"q": "Il est tombé ___ du vélo. (descendre)", "a": ["en descendant"], "de": "Er ist beim Absteigen vom Rad gefallen."}, {"q": "Tout ___ malade, elle est allée travailler. (être)", "a": ["en étant"], "de": "Obwohl sie krank war, ging sie zur Arbeit."}]}, {"type": "choice", "title": "Partizip, Adjektiv oder gérondif?", "task": "Wähle die richtige Form.", "items": [{"q": "C'est un film très ___.", "options": ["intéressant", "intéressante", "en intéressant"], "a": 0, "why": "Verbaladjektiv, angeglichen an un film (m.)."}, {"q": "Ce travail est ___.", "options": ["fatiguant", "fatigant"], "a": 1, "why": "Adjektiv: fatigant (ohne u)."}, {"q": "___ malade, il est resté chez lui.", "options": ["Étant", "En étant", "Été"], "a": 0, "why": "Partizip Präsens als Begründung."}, {"q": "Les portes sont ___.", "options": ["fermé", "fermés", "fermées"], "a": 2, "why": "Partizip als Adjektiv, f. Pl."}, {"q": "J'ai fait ___ ma voiture.", "options": ["réparer", "réparé", "réparée"], "a": 0, "why": "faire + Infinitiv."}, {"q": "La voiture que j'ai fait ___ marche bien.", "options": ["réparer", "réparée"], "a": 0, "why": "faire + Infinitiv; fait bleibt unverändert."}]}, {"type": "choice", "title": "faire oder laisser?", "task": "Wähle das passende Verb.", "items": [{"q": "Lass mich in Ruhe!", "options": ["Fais-moi tranquille !", "Laisse-moi tranquille !"], "a": 1, "why": "laisser = in Ruhe lassen."}, {"q": "Ich lasse mir die Haare schneiden.", "options": ["Je me fais couper les cheveux.", "Je me laisse couper les cheveux."], "a": 0, "why": "Veranlassen → faire."}, {"q": "Dieser Witz bringt mich zum Lachen.", "options": ["Cette blague me fait rire.", "Cette blague me laisse rire."], "a": 0, "why": "bewirken → faire."}, {"q": "Lassen Sie mich durch.", "options": ["Faites-moi passer.", "Laissez-moi passer."], "a": 1, "why": "zulassen → laisser."}]}], "cards": [{"f": "Infinitiv ohne Präposition nach …", "b": "Modalverben, Bewegungsverben, aimer/préférer/espérer, voir/entendre, faire/laisser"}, {"f": "Je viens te voir / Je viens de te voir", "b": "Ich komme dich besuchen / Ich habe dich gerade gesehen"}, {"f": "commencer, apprendre, réussir, aider qn + ?", "b": "à + Infinitiv"}, {"f": "finir, arrêter, essayer, oublier, décider + ?", "b": "de + Infinitiv"}, {"f": "C'est facile à faire / Il est facile de faire ça", "b": "à ohne Objekt danach / de mit Objekt danach"}, {"f": "bevor (gleiches Subjekt)", "b": "avant de + Infinitiv"}, {"f": "ohne zu / anstatt zu", "b": "sans + Infinitiv / au lieu de + Infinitiv"}, {"f": "nachdem (gleiches Subjekt)", "b": "après avoir/être + Partizip: après avoir mangé"}, {"f": "Danke, dass du mir geholfen hast.", "b": "Merci de m'avoir aidé."}, {"f": "Partizip Präsens – Bildung", "b": "nous-Stamm + -ant: parlant, finissant (Ausnahmen: étant, ayant, sachant)"}, {"f": "gérondif", "b": "en + Partizip Präsens: en parlant"}, {"f": "Funktionen des gérondif", "b": "gleichzeitig, Art und Weise, Bedingung, Zeitpunkt"}, {"f": "tout en …", "b": "Gegensatz: Tout en étant riche, il vit simplement."}, {"f": "fatiguant / fatigant", "b": "Partizip (ermüdend) / Adjektiv (anstrengend)"}, {"f": "faire + Infinitiv", "b": "machen lassen: Je fais réparer ma voiture."}, {"f": "laisser + Infinitiv", "b": "zulassen: Laisse-moi dormir."}, {"f": "Pronomen bei faire + Infinitiv", "b": "vor faire: Je la fais réparer."}, {"f": "y compris / excepté", "b": "inklusive / außer"}]}, {"nr": 19, "id": "k20", "title": "Verbalperiphrasen", "teil": "Das Verb und seine Ergänzungen", "intro": "Mit Fügungen aus einem Hilfsverb und einem Infinitiv drückt das Französische aus, ob etwas bevorsteht, gerade abläuft, beginnt, aufhört oder sich wiederholt. Viele davon sind im Alltag häufiger als die einfachen Zeiten.", "sections": [{"h": "Zeitliche Periphrasen im Überblick", "html": "<table><tr><th>Periphrase<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>aller<\/em> + Inf.<\/td><td>werden, gleich (futur proche)<\/td><td><em>Je vais partir.<\/em><\/td><\/tr><tr><td><em>être sur le point de<\/em> + Inf.<\/td><td>im Begriff sein<\/td><td><em>Le train est sur le point de partir.<\/em><\/td><\/tr><tr><td><em>être en train de<\/em> + Inf.<\/td><td>gerade dabei sein<\/td><td><em>Je suis en train de lire.<\/em><\/td><\/tr><tr><td><em>venir de<\/em> + Inf.<\/td><td>gerade getan haben<\/td><td><em>Il vient de sortir.<\/em><\/td><\/tr><tr><td><em>commencer à / se mettre à<\/em><\/td><td>anfangen<\/td><td><em>Il s'est mis à pleuvoir.<\/em><\/td><\/tr><tr><td><em>continuer à / de<\/em><\/td><td>weitermachen<\/td><td><em>Elle continue à travailler.<\/em><\/td><\/tr><tr><td><em>finir de / arrêter de / cesser de<\/em><\/td><td>aufhören<\/td><td><em>J'ai fini de manger.<\/em><\/td><\/tr><\/table><div class='tip'>Merke: Die Reihenfolge auf einer Zeitachse: <em>être sur le point de → commencer à → être en train de → finir de → venir de<\/em>.<\/div>"}, {"h": "être en train de: die Verlaufsform", "html": "<p>Das Französische hat keine grammatische Verlaufsform wie das Englische („I am reading“) oder Spanische (<em>estoy leyendo<\/em>). Das einfache Präsens reicht meist: <em>Je lis.<\/em> – Ich lese (gerade).<\/p><p>Will man betonen, dass etwas <b>gerade jetzt<\/b> abläuft, nimmt man <em>être en train de<\/em>:<\/p><ul><li><em>Ne me dérange pas, je suis en train de travailler.<\/em> – Stör mich nicht, ich arbeite gerade.<\/li><li><em>Qu'est-ce que tu es en train de faire ?<\/em> – Was machst du gerade?<\/li><li>Im imparfait: <em>J'étais en train de dormir quand tu as appelé.<\/em><\/li><\/ul><div class='warn'>Achtung: Nie <em>je suis lisant<\/em> ✗ – das gérondif oder Partizip Präsens bildet keine Verlaufsform.<\/div>"}, {"h": "aller, venir de und être sur le point de", "html": "<p><b>aller<\/b> + Infinitiv: nahe Zukunft, Absicht (Kapitel 14). Im imparfait: Handlung, die gleich stattfinden sollte: <em>J'allais partir quand il est arrivé.<\/em> – Ich wollte gerade gehen, als …<\/p><p><b>venir de<\/b> + Infinitiv: unmittelbare Vergangenheit (Kapitel 13): <em>Je viens de finir.<\/em> – Im imparfait: <em>Il venait de partir.<\/em><\/p><p><b>être sur le point de<\/b> + Infinitiv: kurz davor sein: <em>J'étais sur le point de t'appeler.<\/em> – Ich war gerade dabei, dich anzurufen.<\/p><div class='tip'>Merke: <em>faillir<\/em> + Infinitiv (nur im passé composé) = beinahe: <em>J'ai failli tomber.<\/em> – Ich wäre beinahe gefallen.<\/div>"}, {"h": "Beginn, Fortsetzung und Ende", "html": "<ul><li><em>commencer à<\/em> – anfangen zu: <em>Il commence à faire froid.<\/em><\/li><li><em>se mettre à<\/em> – (plötzlich) anfangen: <em>Le bébé s'est mis à pleurer.<\/em><\/li><li><em>continuer à / de<\/em> – weitermachen: <em>Continue à chercher !<\/em><\/li><li><em>finir de<\/em> – fertig werden: <em>Tu as fini de manger ?<\/em><\/li><li><em>arrêter de / cesser de<\/em> – aufhören: <em>Arrête de crier ! Il a cessé de pleuvoir.<\/em><\/li><li><em>finir par<\/em> – schließlich, am Ende: <em>Il a fini par accepter.<\/em> – Er hat schließlich zugestimmt.<\/li><li><em>commencer par<\/em> – zuerst: <em>Commençons par le début.<\/em><\/li><\/ul><div class='warn'>Achtung: <em>finir de<\/em> (fertig werden mit) ≠ <em>finir par<\/em> (letztendlich etwas tun): <em>J'ai fini de lire.<\/em> – <em>J'ai fini par lire le livre.<\/em><\/div>"}, {"h": "Wiederholung und Gewohnheit", "html": "<ul><li><em>re-<\/em> als Vorsilbe: <em>refaire, relire, revoir, recommencer<\/em> – <em>Il faut tout recommencer.<\/em><\/li><li><em>de nouveau, encore<\/em>: <em>Il pleut de nouveau. Tu es encore en retard !<\/em><\/li><li><em>avoir l'habitude de<\/em> – gewohnt sein: <em>J'ai l'habitude de me lever tôt.<\/em><\/li><li><em>avoir tendance à<\/em> – dazu neigen: <em>Il a tendance à exagérer.<\/em><\/li><li><em>ne pas arrêter de<\/em> – ständig: <em>Il n'arrête pas de parler.<\/em> – Er redet ununterbrochen.<\/li><li><em>passer son temps à<\/em>: <em>Elle passe son temps à lire.<\/em><\/li><\/ul><div class='tip'>Merke: <em>Il n'arrête pas de pleuvoir.<\/em> = Es regnet ununterbrochen – sehr idiomatisch.<\/div>"}, {"h": "Modale Periphrasen", "html": "<table><tr><th>Ausdruck<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>devoir<\/em> + Inf.<\/td><td>müssen; Vermutung<\/td><td><em>Il doit être malade.<\/em> – Er ist wohl krank.<\/td><\/tr><tr><td><em>il faut<\/em> + Inf.<\/td><td>man muss<\/td><td><em>Il faut partir.<\/em><\/td><\/tr><tr><td><em>avoir à<\/em> + Inf.<\/td><td>zu tun haben<\/td><td><em>J'ai beaucoup à faire.<\/em><\/td><\/tr><tr><td><em>être obligé de<\/em><\/td><td>gezwungen sein<\/td><td><em>Je suis obligé de partir.<\/em><\/td><\/tr><tr><td><em>avoir besoin de<\/em><\/td><td>brauchen<\/td><td><em>J'ai besoin de dormir.<\/em><\/td><\/tr><tr><td><em>avoir envie de<\/em><\/td><td>Lust haben<\/td><td><em>J'ai envie de sortir.<\/em><\/td><\/tr><tr><td><em>il vaut mieux<\/em><\/td><td>es ist besser<\/td><td><em>Il vaut mieux attendre.<\/em><\/td><\/tr><tr><td><em>avoir beau<\/em> + Inf.<\/td><td>noch so sehr … (vergeblich)<\/td><td><em>J'ai beau chercher, je ne trouve pas.<\/em><\/td><\/tr><\/table><div class='tip'>Merke: <em>J'ai beau essayer …<\/em> – So sehr ich es auch versuche … Eine elegante, typisch französische Wendung.<\/div>"}], "exercises": [{"type": "gap", "title": "Welche Periphrase?", "task": "Setze die passende Periphrase ein (Präsens).", "items": [{"q": "Chut ! Le bébé ___ dormir. (gerade dabei)", "a": ["est en train de"], "de": "Pst! Das Baby schläft gerade."}, {"q": "Le film ___ commencer. (im Begriff)", "a": ["est sur le point de"], "de": "Der Film fängt gleich an."}, {"q": "Nous ___ arriver. (gerade getan)", "a": ["venons d'"], "de": "Wir sind gerade angekommen."}, {"q": "Il ___ faire beau. (anfangen)", "a": ["commence à"], "de": "Es wird langsam schön."}, {"q": "Elle ___ fumer l'an dernier. (aufhören, passé composé)", "a": ["a arrêté de"], "de": "Sie hat letztes Jahr aufgehört zu rauchen."}, {"q": "Je ___ partir en vacances demain. (futur proche)", "a": ["vais"], "de": "Ich fahre morgen in Urlaub."}, {"q": "Il ___ parler pendant le film ! (ununterbrochen)", "a": ["n'arrête pas de"], "de": "Er redet während des Films ununterbrochen!"}]}, {"type": "choice", "title": "Bedeutung erkennen", "task": "Was bedeutet der Satz?", "items": [{"q": "J'ai failli rater le train.", "options": ["Ich habe den Zug verpasst.", "Ich hätte beinahe den Zug verpasst."], "a": 1, "why": "faillir = beinahe."}, {"q": "Il a fini par comprendre.", "options": ["Er hat schließlich verstanden.", "Er hat aufgehört zu verstehen."], "a": 0, "why": "finir par = schließlich."}, {"q": "Elle s'est mise à rire.", "options": ["Sie fing an zu lachen.", "Sie hörte auf zu lachen."], "a": 0, "why": "se mettre à = anfangen."}, {"q": "Il doit être chez lui.", "options": ["Er muss nach Hause.", "Er ist wohl zu Hause."], "a": 1, "why": "devoir als Vermutung."}, {"q": "J'ai beau lui expliquer, il ne comprend pas.", "options": ["Ich erkläre es ihm schön.", "So sehr ich es ihm erkläre, er versteht es nicht."], "a": 1, "why": "avoir beau = vergeblich, so sehr auch."}, {"q": "J'allais te téléphoner.", "options": ["Ich wollte dich gerade anrufen.", "Ich bin dich anrufen gegangen."], "a": 0, "why": "aller im imparfait + Infinitiv."}]}, {"type": "choice", "title": "finir de oder finir par?", "task": "Wähle die richtige Präposition.", "items": [{"q": "Tu as fini ___ ranger ta chambre ?", "options": ["de", "par"], "a": 0, "why": "fertig werden mit → finir de."}, {"q": "Après des heures de discussion, il a fini ___ dire oui.", "options": ["de", "par"], "a": 1, "why": "schließlich → finir par."}, {"q": "On commence ___ l'entrée, puis le plat.", "options": ["à", "par"], "a": 1, "why": "zuerst → commencer par."}, {"q": "Il commence ___ neiger.", "options": ["à", "par"], "a": 0, "why": "anfangen zu → commencer à."}, {"q": "Continue ___ travailler !", "options": ["à", "par"], "a": 0, "why": "continuer à."}]}], "cards": [{"f": "être en train de", "b": "gerade dabei sein: Je suis en train de lire."}, {"f": "être sur le point de", "b": "im Begriff sein: Le train est sur le point de partir."}, {"f": "venir de + Infinitiv", "b": "gerade getan haben"}, {"f": "aller + Infinitiv im imparfait", "b": "gerade tun wollen: J'allais partir."}, {"f": "faillir + Infinitiv", "b": "beinahe: J'ai failli tomber."}, {"f": "se mettre à", "b": "(plötzlich) anfangen"}, {"f": "finir de / finir par", "b": "fertig werden mit / schließlich etwas tun"}, {"f": "commencer à / commencer par", "b": "anfangen zu / zuerst etwas tun"}, {"f": "arrêter de / cesser de", "b": "aufhören zu"}, {"f": "Er redet ununterbrochen.", "b": "Il n'arrête pas de parler."}, {"f": "avoir l'habitude de", "b": "gewohnt sein zu"}, {"f": "avoir tendance à", "b": "dazu neigen"}, {"f": "devoir als Vermutung", "b": "Il doit être malade. – Er ist wohl krank."}, {"f": "avoir beau + Infinitiv", "b": "noch so sehr … (vergeblich): J'ai beau chercher …"}, {"f": "il vaut mieux", "b": "es ist besser: Il vaut mieux attendre."}, {"f": "Verlaufsform wie im Spanischen (estoy leyendo)?", "b": "Gibt es nicht – einfaches Präsens oder être en train de"}]}, {"nr": 20, "id": "k21", "title": "Die indirekte Rede", "teil": "Das Verb und seine Ergänzungen", "intro": "In der indirekten Rede gibt man wieder, was jemand gesagt oder gefragt hat. Anders als im Deutschen gibt es keinen eigenen Konjunktiv dafür – stattdessen verschieben sich Zeiten, Pronomen und Zeitangaben, wenn das einleitende Verb in der Vergangenheit steht.", "sections": [{"h": "Aussagesätze", "html": "<p>Aussagen werden mit <em>que<\/em> eingeleitet; Pronomen und Possessiva passen sich an:<\/p><ul><li><em>Paul : « Je suis fatigué. »<\/em> → <em>Paul dit qu'il est fatigué.<\/em><\/li><li><em>Marie : « J'ai perdu mon sac. »<\/em> → <em>Marie dit qu'elle a perdu son sac.<\/em><\/li><\/ul><p>Typische Einleitungsverben: <em>dire, répondre, expliquer, raconter, affirmer, annoncer, ajouter, penser, croire, promettre<\/em>.<\/p><div class='warn'>Achtung: <em>que<\/em> muss wiederholt werden, wenn mehrere Aussagen folgen: <em>Il dit qu'il est malade et qu'il ne viendra pas.<\/em> Und <em>que<\/em> darf nie weggelassen werden wie das deutsche „dass“: <em>Il dit qu'il vient.<\/em> (nicht <em>Il dit il vient<\/em>)<\/div><div class='tip'>Merke: Steht das Einleitungsverb im Präsens oder Futur, ändern sich die Zeiten <b>nicht<\/b>.<\/div>"}, {"h": "Zeitverschiebung", "html": "<p>Steht das Einleitungsverb in einer <b>Vergangenheitszeit<\/b> (<em>il a dit, il disait, il avait dit<\/em>), verschieben sich die Zeiten:<\/p><table><tr><th>direkte Rede<\/th><th>indirekte Rede (Vergangenheit)<\/th><\/tr><tr><td><em>présent<\/em>: « Je suis malade. »<\/td><td><em>imparfait<\/em>: Il a dit qu'il était malade.<\/td><\/tr><tr><td><em>passé composé<\/em>: « J'ai fini. »<\/td><td><em>plus-que-parfait<\/em>: Il a dit qu'il avait fini.<\/td><\/tr><tr><td><em>futur simple<\/em>: « Je viendrai. »<\/td><td><em>conditionnel présent<\/em>: Il a dit qu'il viendrait.<\/td><\/tr><tr><td><em>futur proche<\/em>: « Je vais partir. »<\/td><td><em>aller<\/em> im imparfait: Il a dit qu'il allait partir.<\/td><\/tr><tr><td><em>futur antérieur<\/em>: « J'aurai fini. »<\/td><td><em>conditionnel passé<\/em>: Il a dit qu'il aurait fini.<\/td><\/tr><\/table><p>Unverändert bleiben: <em>imparfait, plus-que-parfait, conditionnel, subjonctif<\/em>.<\/p><div class='tip'>Merke: Ist die Aussage noch immer gültig, darf das Präsens bleiben: <em>Il m'a dit qu'il habite à Lyon.<\/em> (er wohnt immer noch dort).<\/div>"}, {"h": "Zeit- und Ortsangaben", "html": "<table><tr><th>direkte Rede<\/th><th>indirekte Rede (Vergangenheit)<\/th><\/tr><tr><td><em>aujourd'hui<\/em><\/td><td><em>ce jour-là<\/em><\/td><\/tr><tr><td><em>hier<\/em><\/td><td><em>la veille<\/em> (am Vortag)<\/td><\/tr><tr><td><em>demain<\/em><\/td><td><em>le lendemain<\/em> (am nächsten Tag)<\/td><\/tr><tr><td><em>maintenant<\/em><\/td><td><em>à ce moment-là<\/em><\/td><\/tr><tr><td><em>la semaine dernière<\/em><\/td><td><em>la semaine précédente / d'avant<\/em><\/td><\/tr><tr><td><em>la semaine prochaine<\/em><\/td><td><em>la semaine suivante / d'après<\/em><\/td><\/tr><tr><td><em>il y a deux jours<\/em><\/td><td><em>deux jours plus tôt<\/em><\/td><\/tr><tr><td><em>dans deux jours<\/em><\/td><td><em>deux jours plus tard<\/em><\/td><\/tr><tr><td><em>ici<\/em><\/td><td><em>là<\/em><\/td><\/tr><\/table><p><em>Elle a dit : « Je partirai demain. »<\/em> → <em>Elle a dit qu'elle partirait le lendemain.<\/em><\/p>"}, {"h": "Indirekte Fragen", "html": "<p>Indirekte Fragen haben die Wortstellung des Aussagesatzes – ohne Inversion, ohne <em>est-ce que<\/em>, ohne Fragezeichen:<\/p><table><tr><th>direkte Frage<\/th><th>indirekte Frage<\/th><\/tr><tr><td><em>« Tu viens ? » / « Est-ce que tu viens ? »<\/em><\/td><td><em>Il demande <b>si<\/b> je viens.<\/em><\/td><\/tr><tr><td><em>« Où habites-tu ? »<\/em><\/td><td><em>Il demande <b>où<\/b> j'habite.<\/em><\/td><\/tr><tr><td><em>« Qu'est-ce que tu fais ? » / « Que fais-tu ? »<\/em><\/td><td><em>Il demande <b>ce que<\/b> je fais.<\/em><\/td><\/tr><tr><td><em>« Qu'est-ce qui se passe ? »<\/em><\/td><td><em>Il demande <b>ce qui<\/b> se passe.<\/em><\/td><\/tr><tr><td><em>« Qui est là ? »<\/em><\/td><td><em>Il demande <b>qui<\/b> est là.<\/em><\/td><\/tr><tr><td><em>« Quand pars-tu ? »<\/em><\/td><td><em>Il demande <b>quand<\/b> je pars.<\/em><\/td><\/tr><\/table><p>Mit Zeitverschiebung: <em>Il m'a demandé si j'étais libre / où j'habitais / ce que je ferais.<\/em><\/p><div class='warn'>Achtung: <em>si<\/em> („ob“) + <em>il<\/em> → <em>s'il<\/em>. Und nach <em>si<\/em> = „ob“ sind Futur und Konditional erlaubt: <em>Il m'a demandé si je viendrais.<\/em><\/div>"}, {"h": "Indirekte Aufforderungen", "html": "<p>Aufforderungen werden zu <em>de<\/em> + Infinitiv:<\/p><ul><li><em>« Viens ! »<\/em> → <em>Il me dit de venir.<\/em><\/li><li><em>« Ne fumez pas ! »<\/em> → <em>Il nous a demandé de ne pas fumer.<\/em><\/li><li><em>« Asseyez-vous. »<\/em> → <em>Elle leur a dit de s'asseoir.<\/em><\/li><\/ul><p>Typische Verben: <em>dire à qn de, demander à qn de, conseiller à qn de, ordonner à qn de, interdire à qn de, proposer à qn de<\/em>.<\/p><p>Alternativ mit <em>que<\/em> + subjonctif: <em>Il exige que nous partions.<\/em><\/p><div class='tip'>Merke: Verneinter Infinitiv: <em>ne pas<\/em> steht zusammen vor dem Verb: <em>Il m'a dit de ne pas m'inquiéter.<\/em><\/div>"}, {"h": "Ein Beispiel im Zusammenhang", "html": "<p><b>Direkt:<\/b><\/p><p><em>Hier, ma sœur m'a appelé : « Je suis à Rome. Je suis arrivée ce matin et je vais rester une semaine. Est-ce que tu veux venir ? Réserve vite un billet ! »<\/em><\/p><p><b>Indirekt:<\/b><\/p><p><em>Hier, ma sœur m'a appelé. Elle m'a dit qu'elle était à Rome, qu'elle était arrivée le matin même et qu'elle allait rester une semaine. Elle m'a demandé si je voulais venir et elle m'a dit de réserver vite un billet.<\/em><\/p><div class='tip'>Merke: Im Deutschen nutzt man dafür den Konjunktiv I (<em>sie sei in Rom<\/em>) – das Französische braucht nur die Zeitverschiebung.<\/div>"}], "exercises": [{"type": "gap", "title": "Aussagen wiedergeben", "task": "Setze das Verb in die richtige Zeit (Einleitung in der Vergangenheit).", "items": [{"q": "« Je suis malade. » → Il a dit qu'il ___ malade.", "a": ["était"], "de": "Er sagte, er sei krank."}, {"q": "« J'ai raté le bus. » → Elle a expliqué qu'elle ___ le bus.", "a": ["avait raté"], "de": "Sie erklärte, sie habe den Bus verpasst."}, {"q": "« Je viendrai demain. » → Il a promis qu'il ___ le lendemain.", "a": ["viendrait"], "de": "Er versprach, am nächsten Tag zu kommen."}, {"q": "« Nous allons déménager. » → Ils ont annoncé qu'ils ___ déménager.", "a": ["allaient"], "de": "Sie kündigten an, dass sie umziehen würden."}, {"q": "« J'aime le jazz. » → Elle m'a dit qu'elle ___ le jazz.", "a": ["aimait"], "de": "Sie sagte mir, sie möge Jazz."}, {"q": "« Nous avons gagné ! » → Ils ont crié qu'ils ___ .", "a": ["avaient gagné"], "de": "Sie riefen, sie hätten gewonnen."}, {"q": "« Je travaillais à Lyon. » → Il a raconté qu'il ___ à Lyon.", "a": ["travaillait"], "de": "Er erzählte, er habe in Lyon gearbeitet."}]}, {"type": "gap", "title": "Zeitangaben anpassen", "task": "Ersetze die Zeitangabe.", "items": [{"q": "« Je pars demain. » → Il a dit qu'il partait ___ .", "a": ["le lendemain"], "de": "Er sagte, er fahre am nächsten Tag."}, {"q": "« Je l'ai vu hier. » → Elle a dit qu'elle l'avait vu ___ .", "a": ["la veille"], "de": "Sie sagte, sie habe ihn am Vortag gesehen."}, {"q": "« J'ai beaucoup de travail aujourd'hui. » → Il a dit qu'il avait beaucoup de travail ___ .", "a": ["ce jour-là"], "de": "Er sagte, er habe an dem Tag viel Arbeit."}, {"q": "« Je reviens la semaine prochaine. » → Elle a dit qu'elle revenait la semaine ___ .", "a": ["suivante", "d'après"], "de": "Sie sagte, sie komme in der Woche darauf zurück."}]}, {"type": "gap", "title": "Indirekte Fragen", "task": "Ergänze das Fragewort.", "items": [{"q": "« Tu as faim ? » → Il m'a demandé ___ j'avais faim.", "a": ["si"], "de": "Er fragte mich, ob ich Hunger hätte."}, {"q": "« Qu'est-ce que tu veux ? » → Elle m'a demandé ___ je voulais.", "a": ["ce que"], "de": "Sie fragte mich, was ich wolle."}, {"q": "« Où est la gare ? » → Le touriste a demandé ___ était la gare.", "a": ["où"], "de": "Der Tourist fragte, wo der Bahnhof sei."}, {"q": "« Qu'est-ce qui ne va pas ? » → Le médecin a demandé ___ n'allait pas.", "a": ["ce qui"], "de": "Der Arzt fragte, was nicht stimme."}, {"q": "« Il vient ? » → Je me demandais ___ venait.", "a": ["s'il"], "de": "Ich fragte
