zaine / une douzaine / une centaine"}, {"f": "six, dix – Aussprache", "b": "allein [sis]; vor Konsonant [si]; vor Vokal [siz]"}, {"f": "Telefonnummern", "b": "in Zweiergruppen: 01 42 68 … = zéro un, quarante-deux …"}]}, {"nr": 27, "id": "k28", "title": "Verbanschlüsse – Übersicht", "teil": "Anhang", "intro": "Zum Nachschlagen: Welche Verben stehen mit à, welche mit de, welche direkt mit dem Infinitiv? Und welche Adjektive und Ausdrücke verlangen welche Präposition? Diese Listen ergänzen die Kapitel 18, 22 und 25.", "sections": [{"h": "Verb + Infinitiv ohne Präposition", "html": "<table><tr><th>Gruppe<\/th><th>Verben<\/th><\/tr><tr><td>Modalverben<\/td><td><em>devoir, pouvoir, savoir, vouloir, falloir (il faut)<\/em><\/td><\/tr><tr><td>Vorliebe, Meinung<\/td><td><em>aimer, adorer, détester, préférer, aimer mieux, désirer, souhaiter, espérer, compter, penser, croire, oser, sembler, paraître<\/em><\/td><\/tr><tr><td>Bewegung<\/td><td><em>aller, venir, partir, sortir, rentrer, retourner, monter, descendre, courir, envoyer qn<\/em><\/td><\/tr><tr><td>Wahrnehmung<\/td><td><em>voir, regarder, entendre, écouter, sentir<\/em><\/td><\/tr><tr><td>Veranlassung<\/td><td><em>faire, laisser<\/em><\/td><\/tr><tr><td>Sonstige<\/td><td><em>il vaut mieux, avoir beau, faillir, devoir, prétendre<\/em><\/td><\/tr><\/table><ul><li><em>J'espère te revoir bientôt.<\/em><\/li><li><em>Elle est venue nous aider.<\/em><\/li><li><em>Il paraît être content.<\/em><\/li><\/ul>"}, {"h": "Verb + à + Infinitiv", "html": "<table><tr><th>Verb<\/th><th>Bedeutung<\/th><\/tr><tr><td><em>aider qn à<\/em><\/td><td>jdm helfen zu<\/td><\/tr><tr><td><em>apprendre à<\/em><\/td><td>lernen zu; <em>apprendre à qn à<\/em> – jdm beibringen<\/td><\/tr><tr><td><em>arriver à<\/em><\/td><td>es schaffen<\/td><\/tr><tr><td><em>s'attendre à<\/em><\/td><td>erwarten<\/td><\/tr><tr><td><em>chercher à<\/em><\/td><td>versuchen, danach trachten<\/td><\/tr><tr><td><em>commencer à<\/em><\/td><td>anfangen<\/td><\/tr><tr><td><em>consister à<\/em><\/td><td>darin bestehen<\/td><\/tr><tr><td><em>continuer à<\/em><\/td><td>weitermachen<\/td><\/tr><tr><td><em>se décider à<\/em><\/td><td>sich entschließen<\/td><\/tr><tr><td><em>encourager qn à<\/em><\/td><td>ermutigen<\/td><\/tr><tr><td><em>s'habituer à<\/em><\/td><td>sich gewöhnen an<\/td><\/tr><tr><td><em>hésiter à<\/em><\/td><td>zögern<\/td><\/tr><tr><td><em>inviter qn à<\/em><\/td><td>einladen<\/td><\/tr><tr><td><em>se mettre à<\/em><\/td><td>anfangen<\/td><\/tr><tr><td><em>obliger qn à<\/em><\/td><td>zwingen<\/td><\/tr><tr><td><em>passer son temps à<\/em><\/td><td>seine Zeit verbringen mit<\/td><\/tr><tr><td><em>penser à<\/em><\/td><td>daran denken<\/td><\/tr><tr><td><em>se préparer à<\/em><\/td><td>sich vorbereiten<\/td><\/tr><tr><td><em>renoncer à<\/em><\/td><td>verzichten auf<\/td><\/tr><tr><td><em>réussir à<\/em><\/td><td>gelingen, schaffen<\/td><\/tr><tr><td><em>tenir à<\/em><\/td><td>Wert darauf legen<\/td><\/tr><\/table>"}, {"h": "Verb + de + Infinitiv", "html": "<table><tr><th>Verb<\/th><th>Bedeutung<\/th><\/tr><tr><td><em>accepter de<\/em><\/td><td>bereit sein, annehmen<\/td><\/tr><tr><td><em>s'arrêter de / arrêter de<\/em><\/td><td>aufhören<\/td><\/tr><tr><td><em>avoir besoin / envie / peur / l'intention de<\/em><\/td><td>brauchen / Lust haben / Angst haben / vorhaben<\/td><\/tr><tr><td><em>avoir le temps / le droit de<\/em><\/td><td>Zeit haben / das Recht haben<\/td><\/tr><tr><td><em>cesser de<\/em><\/td><td>aufhören<\/td><\/tr><tr><td><em>choisir de<\/em><\/td><td>sich entscheiden<\/td><\/tr><tr><td><em>conseiller à qn de<\/em><\/td><td>raten<\/td><\/tr><tr><td><em>craindre de<\/em><\/td><td>fürchten<\/td><\/tr><tr><td><em>décider de<\/em><\/td><td>beschließen<\/td><\/tr><tr><td><em>défendre / interdire à qn de<\/em><\/td><td>verbieten<\/td><\/tr><tr><td><em>demander à qn de<\/em><\/td><td>bitten<\/td><\/tr><tr><td><em>se dépêcher de<\/em><\/td><td>sich beeilen<\/td><\/tr><tr><td><em>dire à qn de<\/em><\/td><td>sagen (auffordern)<\/td><\/tr><tr><td><em>empêcher qn de<\/em><\/td><td>hindern<\/td><\/tr><tr><td><em>essayer de<\/em><\/td><td>versuchen<\/td><\/tr><tr><td><em>éviter de<\/em><\/td><td>vermeiden<\/td><\/tr><tr><td><em>finir de<\/em><\/td><td>fertig werden<\/td><\/tr><tr><td><em>s'occuper de<\/em><\/td><td>sich kümmern um<\/td><\/tr><tr><td><em>oublier de<\/em><\/td><td>vergessen<\/td><\/tr><tr><td><em>permettre à qn de<\/em><\/td><td>erlauben<\/td><\/tr><tr><td><em>promettre à qn de<\/em><\/td><td>versprechen<\/td><\/tr><tr><td><em>proposer à qn de<\/em><\/td><td>vorschlagen<\/td><\/tr><tr><td><em>refuser de<\/em><\/td><td>sich weigern<\/td><\/tr><tr><td><em>regretter de<\/em><\/td><td>bedauern<\/td><\/tr><tr><td><em>rêver de<\/em><\/td><td>träumen von<\/td><\/tr><tr><td><em>se souvenir de<\/em><\/td><td>sich erinnern<\/td><\/tr><tr><td><em>venir de<\/em><\/td><td>gerade getan haben<\/td><\/tr><\/table><div class='tip'>Merke: Verben des Sagens und Bittens folgen dem Muster <em>verbe à qn de faire qc<\/em>: <em>Je lui ai demandé de venir.<\/em><\/div>"}, {"h": "Verben mit wechselnder Präposition", "html": "<table><tr><th>Verb<\/th><th>Konstruktion und Bedeutung<\/th><\/tr><tr><td><em>commencer<\/em><\/td><td><em>à<\/em> + Inf. (anfangen zu) – <em>par<\/em> + Inf. (zuerst tun)<\/td><\/tr><tr><td><em>finir<\/em><\/td><td><em>de<\/em> + Inf. (fertig werden) – <em>par<\/em> + Inf. (schließlich tun)<\/td><\/tr><tr><td><em>décider<\/em><\/td><td><em>de<\/em> (beschließen) – <em>se décider à<\/em> (sich durchringen)<\/td><\/tr><tr><td><em>penser<\/em><\/td><td><em>à<\/em> (denken an) – <em>de<\/em> (halten von: <em>Qu'est-ce que tu penses de lui ?<\/em>) – direkt + Inf. (vorhaben)<\/td><\/tr><tr><td><em>jouer<\/em><\/td><td><em>à<\/em> (Spiel) – <em>de<\/em> (Instrument)<\/td><\/tr><tr><td><em>manquer<\/em><\/td><td><em>qc<\/em> (verpassen) – <em>de qc<\/em> (Mangel haben) – <em>à qn<\/em> (fehlen)<\/td><\/tr><tr><td><em>s'occuper<\/em><\/td><td><em>de<\/em> (sich kümmern um)<\/td><\/tr><tr><td><em>tenir<\/em><\/td><td><em>à<\/em> (hängen an) – <em>de<\/em> (ähneln, nach jdm kommen)<\/td><\/tr><\/table><div class='warn'>Achtung: <em>J'ai manqué le train<\/em> (verpasst) – <em>Il manque de patience<\/em> (es fehlt ihm an) – <em>Tu me manques<\/em> (ich vermisse dich).<\/div>"}, {"h": "Adjektive und Präpositionen", "html": "<table><tr><th>mit à<\/th><th>mit de<\/th><\/tr><tr><td><em>prêt à<\/em> – bereit zu<\/td><td><em>content / heureux de<\/em> – froh über<\/td><\/tr><tr><td><em>le premier / dernier à<\/em><\/td><td><em>fier de<\/em> – stolz auf<\/td><\/tr><tr><td><em>facile / difficile à<\/em> (+ Inf. ohne Objekt)<\/td><td><em>sûr / certain de<\/em> – sicher<\/td><\/tr><tr><td><em>agréable à<\/em><\/td><td><em>capable de<\/em> – fähig zu<\/td><\/tr><tr><td><em>utile à<\/em><\/td><td><em>plein de<\/em> – voll von<\/td><\/tr><tr><td><em>fidèle à<\/em><\/td><td><em>responsable de<\/em><\/td><\/tr><tr><td><em>semblable à<\/em><\/td><td><em>fatigué de<\/em> – müde von / leid<\/td><\/tr><tr><td><em>habile à<\/em><\/td><td><em>amoureux de<\/em> – verliebt in<\/td><\/tr><\/table><p>Weitere: <em>gentil avec / envers<\/em> (nett zu), <em>fâché contre / avec<\/em>, <em>bon en maths<\/em> (gut in), <em>intéressé par<\/em> (interessiert an), <em>différent de<\/em> (anders als).<\/p><div class='warn'>Achtung: <em>amoureux de<\/em> – „verliebt <b>in<\/b>“; <em>bon en<\/em> – „gut <b>in<\/b>“ (Fach), <em>fort en anglais<\/em>.<\/div>"}, {"h": "Feste Wendungen mit avoir, être, faire", "html": "<table><tr><th>avoir<\/th><th>être<\/th><th>faire<\/th><\/tr><tr><td><em>avoir l'air<\/em> – aussehen<\/td><td><em>être en train de<\/em> – gerade dabei<\/td><td><em>faire attention à<\/em> – aufpassen<\/td><\/tr><tr><td><em>avoir lieu<\/em> – stattfinden<\/td><td><em>être d'accord avec<\/em> – einverstanden<\/td><td><em>faire la connaissance de<\/em> – kennenlernen<\/td><\/tr><tr><td><em>avoir de la chance<\/em> – Glück haben<\/td><td><em>être en retard / en avance<\/em><\/td><td><em>faire la queue<\/em> – Schlange stehen<\/td><\/tr><tr><td><em>avoir du mal à<\/em> – Mühe haben<\/td><td><em>être à l'heure<\/em> – pünktlich<\/td><td><em>faire les courses<\/em> – einkaufen<\/td><\/tr><tr><td><em>avoir hâte de<\/em> – es kaum erwarten<\/td><td><em>être au courant<\/em> – Bescheid wissen<\/td><td><em>faire semblant de<\/em> – so tun als ob<\/td><\/tr><tr><td><em>avoir honte de<\/em> – sich schämen<\/td><td><em>être pressé<\/em> – es eilig haben<\/td><td><em>faire exprès<\/em> – absichtlich tun<\/td><\/tr><tr><td><em>en avoir marre<\/em> – es satt haben<\/td><td><em>être en forme<\/em> – fit sein<\/td><td><em>faire la grasse matinée<\/em> – ausschlafen<\/td><\/tr><\/table>"}], "exercises": [{"type": "choice", "title": "Welche Präposition?", "task": "Wähle à, de oder keine (–).", "items": [{"q": "J'hésite ___ lui dire la vérité.", "options": ["–", "à", "de"], "a": 1, "why": "hésiter à."}, {"q": "Il a refusé ___ venir.", "options": ["–", "à", "de"], "a": 2, "why": "refuser de."}, {"q": "Nous comptons ___ partir lundi.", "options": ["–", "à", "de"], "a": 0, "why": "compter + Infinitiv direkt (vorhaben)."}, {"q": "Je me suis habitué ___ me lever tôt.", "options": ["–", "à", "de"], "a": 1, "why": "s'habituer à."}, {"q": "Elle m'a conseillé ___ prendre le train.", "options": ["–", "à", "de"], "a": 2, "why": "conseiller à qn de."}, {"q": "Il fait semblant ___ dormir.", "options": ["–", "à", "de"], "a": 2, "why": "faire semblant de."}, {"q": "J'ai du mal ___ comprendre.", "options": ["–", "à", "de"], "a": 1, "why": "avoir du mal à."}, {"q": "Elle ose ___ dire non.", "options": ["–", "à", "de"], "a": 0, "why": "oser + Infinitiv direkt."}, {"q": "J'ai hâte ___ te voir.", "options": ["–", "à", "de"], "a": 2, "why": "avoir hâte de."}, {"q": "Ils m'ont invité ___ dîner.", "options": ["–", "à", "de"], "a": 1, "why": "inviter qn à."}]}, {"type": "gap", "title": "Ergänze die Präposition", "task": "Setze à, de, par, en oder avec ein.", "items": [{"q": "Qu'est-ce que tu penses ___ ce film ?", "a": ["de"], "de": "Was hältst du von diesem Film?"}, {"q": "Elle est très forte ___ maths.", "a": ["en"], "de": "Sie ist sehr gut in Mathe."}, {"q": "Il est amoureux ___ sa voisine.", "a": ["de"], "de": "Er ist in seine Nachbarin verliebt."}, {"q": "Je suis prêt ___ partir.", "a": ["à"], "de": "Ich bin bereit zu gehen."}, {"q": "Il est toujours gentil ___ moi.", "a": ["avec"], "de": "Er ist immer nett zu mir."}, {"q": "On a commencé ___ un apéritif.", "a": ["par"], "de": "Wir haben mit einem Aperitif angefangen."}, {"q": "Il manque ___ expérience.", "a": ["d'"], "de": "Es fehlt ihm an Erfahrung."}, {"q": "Fais attention ___ la marche !", "a": ["à"], "de": "Achtung, Stufe!"}]}, {"type": "choice", "title": "Feste Wendungen", "task": "Was bedeutet der Ausdruck?", "items": [{"q": "Le concert a lieu samedi.", "options": ["Das Konzert findet am Samstag statt.", "Das Konzert hat am Samstag Platz."], "a": 0, "why": "avoir lieu = stattfinden."}, {"q": "Tu as l'air fatigué.", "options": ["Du brauchst Luft.", "Du siehst müde aus."], "a": 1, "why": "avoir l'air = aussehen."}, {"q": "Je suis pressé.", "options": ["Ich habe es eilig.", "Ich bin gepresst."], "a": 0, "why": "être pressé = es eilig haben."}, {"q": "Le dimanche, je fais la grasse matinée.", "options": ["Sonntags frühstücke ich üppig.", "Sonntags schlafe ich aus."], "a": 1, "why": "faire la grasse matinée = ausschlafen."}, {"q": "Tu es au courant ?", "options": ["Weißt du Bescheid?", "Bist du in Eile?"], "a": 0, "why": "être au courant = Bescheid wissen."}, {"q": "Il l'a fait exprès.", "options": ["Er hat es schnell gemacht.", "Er hat es absichtlich gemacht."], "a": 1, "why": "exprès = absichtlich."}]}], "cards": [{"f": "oser, compter, espérer + Infinitiv", "b": "ohne Präposition"}, {"f": "s'habituer, hésiter, réussir, inviter qn", "b": "+ à"}, {"f": "refuser, accepter, éviter, oublier", "b": "+ de"}, {"f": "demander / conseiller / permettre", "b": "à qn de faire qc"}, {"f": "empêcher qn de", "b": "jdn daran hindern"}, {"f": "avoir du mal à", "b": "Mühe haben"}, {"f": "avoir hâte de", "b": "es kaum erwarten können"}, {"f": "faire semblant de", "b": "so tun als ob"}, {"f": "penser à / penser de", "b": "denken an / halten von"}, {"f": "manquer le train / manquer de / manquer à", "b": "verpassen / Mangel haben / fehlen"}, {"f": "amoureux de / bon en", "b": "verliebt in / gut in"}, {"f": "prêt à / capable de", "b": "bereit zu / fähig zu"}, {"f": "avoir lieu", "b": "stattfinden"}, {"f": "avoir l'air", "b": "aussehen"}, {"f": "être au courant", "b": "Bescheid wissen"}, {"f": "faire la queue", "b": "Schlange stehen"}, {"f": "faire la connaissance de", "b": "kennenlernen"}, {"f": "en avoir marre", "b": "es satt haben"}, {"f": "tenir à / tenir de", "b": "hängen an / nach jdm kommen"}, {"f": "être pressé", "b": "es eilig haben"}]}, {"nr": 28, "id": "k29", "title": "Verbtabellen", "teil": "Anhang", "intro": "Die 28 wichtigsten Verben in allen Alltagszeiten zum Nachschlagen: die drei regelmäßigen Muster und die häufigsten unregelmäßigen Verben – mit présent, imparfait, passé composé, futur, subjonctif, conditionnel, Imperativ und Partizip.", "sections": [{"h": "So nutzt du die Tabellen", "html": "<p>Für jedes Verb findest du die sechs Personen in <em>présent, imparfait, passé composé, futur simple<\/em> und <em>subjonctif présent<\/em>, darunter <em>conditionnel<\/em> (1. Person), Imperativ, Partizip und Hilfsverb.<\/p><p>Aus wenigen <b>Stammformen<\/b> lässt sich fast alles ableiten:<\/p><table><tr><th>Zeit<\/th><th>abgeleitet von<\/th><th>Beispiel<\/th><\/tr><tr><td><em>imparfait<\/em><\/td><td><em>nous<\/em>-Form Präsens – <em>-ons<\/em><\/td><td><em>nous buvons → je buvais<\/em><\/td><\/tr><tr><td><em>subjonctif<\/em><\/td><td><em>ils<\/em>-Form Präsens – <em>-ent<\/em> (nous/vous: nous-Stamm)<\/td><td><em>ils boivent → que je boive<\/em><\/td><\/tr><tr><td><em>futur / conditionnel<\/em><\/td><td>Infinitiv (bzw. unregelmäßiger Stamm)<\/td><td><em>boire → ur / subj.", "b": "faites / ferai / fasse"}, {"f": "pouvoir: futur / subj. / Partizip", "b": "pourrai / puisse / pu"}, {"f": "vouloir: ils / futur / subj.", "b": "veulent / voudrai / veuille"}, {"f": "devoir: ils / futur / Partizip", "b": "doivent / devrai / dû"}, {"f": "savoir: futur / subj. / Imperativ", "b": "saurai / sache / sache, sachons, sachez"}, {"f": "venir: ils / futur / subj.", "b": "viennent / viendrai / vienne"}, {"f": "prendre: ils / Partizip / subj.", "b": "prennent / pris / prenne"}, {"f": "mettre: Partizip", "b": "mis"}, {"f": "dire: vous / Partizip", "b": "dites / dit"}, {"f": "voir: nous / futur / Partizip", "b": "voyons / verrai / vu"}, {"f": "connaître: il / Partizip", "b": "connaît / connu"}, {"f": "boire: nous / ils / Partizip", "b": "buvons / boivent / bu"}, {"f": "écrire: nous / Partizip", "b": "écrivons / écrit"}, {"f": "ouvrir: je / Partizip", "b": "ouvre / ouvert"}, {"f": "recevoir: je / ils / Partizip", "b": "reçois / reçoivent / reçu"}, {"f": "croire: nous / Partizip", "b": "croyons / cru"}, {"f": "vivre: Partizip", "b": "vécu"}, {"f": "naître / mourir: Partizip, Hilfsverb", "b": "né / mort – être"}, {"f": "mourir: je / futur", "b": "meurs / mourrai"}, {"f": "s'asseoir: Imperativ", "b": "assieds-toi / asseyez-vous"}, {"f": "partir: je / Hilfsverb", "b": "pars / être"}, {"f": "Stamm des imparfait", "b": "nous-Form ohne -ons (außer être: ét-)"}, {"f": "Stamm des subjonctif", "b": "ils-Form ohne -ent"}]}, {"nr": 29, "id": "k30", "title": "Gesprochenes Französisch und Frankophonie", "teil": "Anhang", "intro": "Das Französisch der Lehrbücher ist nicht das Französisch der Straße – und nicht das von Brüssel, Genf oder Montréal. Hier lernst du die Sprachebenen, die wichtigsten Merkmale der gesprochenen Sprache und die Besonderheiten in Belgien, der Schweiz und Kanada kennen.", "sections": [{"h": "Drei Sprachebenen", "html": "<p>Das Französische unterscheidet deutlicher als das Deutsche zwischen Registern:<\/p><table><tr><th>Register<\/th><th>Beispiel „Ich habe kein Geld“<\/th><th>Gebrauch<\/th><\/tr><tr><td><em>soutenu<\/em> (gehoben)<\/td><td><em>Je ne dispose point d'argent.<\/em><\/td><td>Literatur, feierliche Reden<\/td><\/tr><tr><td><em>courant<\/em> (Standard)<\/td><td><em>Je n'ai pas d'argent.<\/em><\/td><td>Schrift, Beruf, Medien<\/td><\/tr><tr><td><em>familier<\/em> (umgangssprachlich)<\/td><td><em>J'ai pas de fric / de thune.<\/em><\/td><td>unter Freunden<\/td><\/tr><\/table><p>Typische Paare Standard – familiär:<\/p><ul><li><em>la voiture – la bagnole<\/em>; <em>l'argent – le fric<\/em>; <em>le travail – le boulot<\/em>; <em>manger – bouffer<\/em>; <em>l'homme – le mec<\/em>; <em>la femme – la nana<\/em>; <em>l'ami – le pote<\/em>; <em>les vêtements – les fringues<\/em>; <em>le livre – le bouquin<\/em>; <em>avoir peur – avoir la trouille<\/em><\/li><\/ul><div class='warn'>Achtung: Familiäre Wörter verstehen ist wichtig – selbst verwenden nur, wenn du die Situation gut einschätzen kannst.<\/div>"}, {"h": "Merkmale der gesprochenen Sprache", "html": "<ul><li><b>ne fällt weg<\/b>: <em>Je sais pas. C'est pas grave. Il y a personne.<\/em><\/li><li><b>on statt nous<\/b>: <em>On y va ? On a mangé au resto.<\/em><\/li><li><b>Intonationsfrage<\/b> statt Inversion: <em>Tu viens ? Tu fais quoi ?<\/em><\/li><li><b>ça statt cela<\/b>: <em>Ça va ? Ça me plaît.<\/em><\/li><li><b>Verschlucken<\/b> des e und von Silben: <em>j'sais pas<\/em> → [schepa], <em>il y a<\/em> → [ja], <em>tu es<\/em> → [tä], <em>je suis<\/em> → [schüi], <em>peut-être<\/em> → [ptät]<\/li><li><b>Herausstellung<\/b>: <em>Moi, je trouve que … Ton frère, il est où ?<\/em><\/li><li><b>Füllwörter<\/b>: <em>ben, bon, alors, euh, du coup, en fait, quoi, genre<\/em><\/li><li><b>Kurzwörter<\/b>: <em>le resto, le ciné, la fac, l'appart, d'acc, le petit-déj, sympa, à plus<\/em><\/li><\/ul><div class='tip'>Merke: <em>du coup<\/em> (also, deshalb) und <em>en fait<\/em> (eigentlich) hörst du in jedem zweiten Satz.<\/div>"}, {"h": "Verlan und Jugendsprache", "html": "<p>Im <em>verlan<\/em> (von <em>l'envers<\/em> – umgekehrt) werden Silben vertauscht. Manche Wörter sind in die Alltagssprache eingegangen:<\/p><table><tr><th>verlan<\/th><th>Ursprung<\/th><th>Bedeutung<\/th><\/tr><tr><td><em>ouf<\/em><\/td><td><em>fou<\/em><\/td><td>verrückt, krass<\/td><\/tr><tr><td><em>relou<\/em><\/td><td><em>lourd<\/em><\/td><td>nervig<\/td><\/tr><tr><td><em>chelou<\/em><\/td><td><em>louche<\/em><\/td><td>komisch, zwielichtig<\/td><\/tr><tr><td><em>vénère<\/em><\/td><td><em>énervé<\/em><\/td><td>sauer<\/td><\/tr><tr><td><em>meuf<\/em><\/td><td><em>femme<\/em><\/td><td>Frau, Freundin<\/td><\/tr><tr><td><em>keum<\/em><\/td><td><em>mec<\/em><\/td><td>Typ<\/td><\/tr><tr><td><em>téma<\/em><\/td><td><em>mater<\/em><\/td><td>schau mal<\/td><\/tr><\/table><p>Weitere Ausdrücke: <em>trop bien<\/em> (super), <em>grave<\/em> (total: <em>c'est grave bien<\/em>), <em>kiffer<\/em> (mögen), <em>bref<\/em> (kurz gesagt), <em>j'avoue<\/em> (stimmt).<\/p>"}, {"h": "Belgien und die Schweiz", "html": "<p><b>Zahlen<\/b>:<\/p><table><tr><th>Zahl<\/th><th>Frankreich<\/th><th>Belgien<\/th><th>Westschweiz<\/th><\/tr><tr><td>70<\/td><td><em>soixante-dix<\/em><\/td><td><em>septante<\/em><\/td><td><em>septante<\/em><\/td><\/tr><tr><td>80<\/td><td><em>quatre-vingts<\/em><\/td><td><em>quatre-vingts<\/em><\/td><td><em>huitante<\/em> (Waadt, Wallis, Freiburg)<\/td><\/tr><tr><td>90<\/td><td><em>quatre-vingt-dix<\/em><\/td><td><em>nonante<\/em><\/td><td><em>nonante<\/em><\/td><\/tr><\/table><p><b>Mahlzeiten<\/b>:<\/p><table><tr><th>Mahlzeit<\/th><th>Frankreich<\/th><th>Belgien / Schweiz / Québec<\/th><\/tr><tr><td>Frühstück<\/td><td><em>le petit-déjeuner<\/em><\/td><td><em>le déjeuner<\/em><\/td><\/tr><tr><td>Mittagessen<\/td><td><em>le déjeuner<\/em><\/td><td><em>le dîner<\/em><\/td><\/tr><tr><td>Abendessen<\/td><td><em>le dîner<\/em><\/td><td><em>le souper<\/em><\/td><\/tr><\/table><p>Weitere Wörter: Belgien <em>une fois<\/em> (mal: <em>viens une fois<\/em>), <em>s'il vous plaît<\/em> = auch „bitte schön“ beim Geben; Schweiz <em>le natel<\/em> (Handy), <em>septante<\/em>, <em>la panosse<\/em> (Wischmopp), <em>Adieu<\/em> (auch Begrüßung!).<\/p><div class='tip'>Merke: <em>À tantôt<\/em> (Belgien) = bis später.<\/div>"}, {"h": "Québec und Kanada", "html": "<p>Das kanadische Französisch klingt anders (Diphthonge, <em>tu<\/em> → [tsü]) und hat eigene Wörter:<\/p><table><tr><th>Québec<\/th><th>Frankreich<\/th><th>Deutsch<\/th><\/tr><tr><td><em>le char<\/em><\/td><td><em>la voiture<\/em><\/td><td>Auto<\/td><\/tr><tr><td><em>magasiner<\/em><\/td><td><em>faire du shopping<\/em><\/td><td>einkaufen gehen<\/td><\/tr><tr><td><em>le courriel<\/em><\/td><td><em>le mail<\/em><\/td><td>E-Mail<\/td><\/tr><tr><td><em>la fin de semaine<\/em><\/td><td><em>le week-end<\/em><\/td><td>Wochenende<\/td><\/tr><tr><td><em>le dépanneur<\/em><\/td><td><em>l'épicerie<\/em><\/td><td>Tante-Emma-Laden<\/td><\/tr><tr><td><em>le chum / la blonde<\/em><\/td><td><em>le copain / la copine<\/em><\/td><td>(fester) Freund / Freundin<\/td><\/tr><tr><td><em>c'est plate<\/em><\/td><td><em>c'est ennuyeux<\/em><\/td><td>das ist langweilig<\/td><\/tr><tr><td><em>bienvenue<\/em><\/td><td><em>de rien<\/em><\/td><td>gern geschehen<\/td><\/tr><tr><td><em>présentement<\/em><\/td><td><em>actuellement<\/em><\/td><td>derzeit<\/td><\/tr><\/table><ul><li>Fragepartikel <em>-tu<\/em>: <em>Tu viens-tu ?<\/em> – Kommst du?<\/li><li>Québec vermeidet Anglizismen, die in Frankreich üblich sind: <em>arrêt<\/em> statt <em>stop<\/em> auf Verkehrsschildern, <em>clavardage<\/em> (Chat).<\/li><\/ul>"}, {"h": "Französisch in der Welt", "html": "<p>Französisch ist Amtssprache in 29 Ländern und wird von rund 320 Millionen Menschen gesprochen – die meisten davon in <b>Afrika<\/b> (Senegal, Côte d'Ivoire, DR Kongo, Kamerun, Mali …). Die <em>Organisation internationale de la Francophonie<\/em> vereint über 80 Staaten.<\/p><p>Einige afrikanische Besonderheiten: <em>essencerie<\/em> (Tankstelle, Senegal), <em>gâter<\/em> (kaputtgehen: <em>la voiture est gâtée<\/em>), <em>tantôt<\/em> (heute Nachmittag), <em>présentement<\/em>.<\/p><div class='tip'>Merke: Im Standardfranzösisch gibt es kaum Unterschiede in der Grammatik zwischen den Ländern – die Abweichungen betreffen vor allem Aussprache und Wortschatz. Wer das Französisch aus Frankreich lernt, wird überall verstanden.<\/div>"}], "exercises": [{"type": "choice", "title": "Welches Register?", "task": "Ordne den Satz einer Sprachebene zu.", "items": [{"q": "J'ai pas le temps, là.", "options": ["soutenu", "courant", "familier"], "a": 2, "why": "ne fehlt, là als Füllwort → familiär."}, {"q": "Je n'ai pas le temps.", "options": ["soutenu", "courant", "familier"], "a": 1, "why": "Standardsprache."}, {"q": "Il bosse comme un dingue.", "options": ["soutenu", "courant", "familier"], "a": 2, "why": "bosser, dingue → familiär."}, {"q": "Puis-je vous être utile ?", "options": ["soutenu", "courant", "familier"], "a": 0, "why": "Inversion mit je → gehoben."}, {"q": "On va au ciné ?", "options": ["soutenu", "courant", "familier"], "a": 2, "why": "Kurzwort ciné, on = wir → familiär."}]}, {"type": "gap", "title": "Übersetze ins Standardfranzösisch", "task": "Setze das Standardwort ein.", "items": [{"q": "le boulot → le ___", "a": ["travail"], "de": "die Arbeit"}, {"q": "la bagnole → la ___", "a": ["voiture"], "de": "das Auto"}, {"q": "le fric → l'___", "a": ["argent"], "de": "das Geld"}, {"q": "le bouquin → le ___", "a": ["livre"], "de": "das Buch"}, {"q": "le pote → l'___", "a": ["ami"], "de": "der Freund"}, {"q": "relou (verlan) → ___", "a": ["lourd"], "de": "nervig"}, {"q": "ouf (verlan) → ___", "a": ["fou"], "de": "verrückt"}]}, {"type": "choice", "title": "Frankophonie", "task": "Was ist gemeint?", "items": [{"q": "In Brüssel: septante-cinq", "options": ["57", "75", "95"], "a": 1, "why": "septante = 70."}, {"q": "In Genf: nonante", "options": ["9", "90", "19"], "a": 1, "why": "nonante = 90."}, {"q": "In Lausanne lädt man dich zum dîner ein. Wann?", "options": ["mittags", "abends"], "a": 0, "why": "In der Schweiz: dîner = Mittagessen."}, {"q": "In Montréal: Je vais magasiner.", "options": ["Ich gehe einkaufen.", "Ich gehe ins Lager."], "a": 0, "why": "magasiner = shoppen."}, {"q": "In Québec: C'est mon chum.", "options": ["Das ist mein Freund (Partner).", "Das ist mein Kaugummi."], "a": 0, "why": "chum = (fester) Freund."}, {"q": "In Québec: Merci ! – Bienvenue !", "options": ["Willkommen!", "Gern geschehen!"], "a": 1, "why": "bienvenue = de rien."}]}], "cards": [{"f": "Drei Register", "b": "soutenu (gehoben), courant (Standard), familier (umgangssprachlich)"}, {"f": "le boulot / bosser", "b": "die Arbeit / arbeiten (familiär)"}, {"f": "le fric, la thune", "b": "Geld (familiär)"}, {"f": "la bagnole", "b": "Auto (familiär)"}, {"f": "le mec / la nana", "b": "Typ / Frau, Mädchen (familiär)"}, {"f": "le pote", "b": "Kumpel"}, {"f": "du coup / en fait", "b": "also, deshalb / eigentlich"}, {"f": "verlan", "b": "Silbentausch: ouf (fou), relou (lourd), meuf (femme)"}, {"f": "chelou", "b": "komisch, zwielichtig (louche)"}, {"f": "septante / nonante", "b": "70 / 90 in Belgien und der Schweiz"}, {"f": "huitante", "b": "80 in Teilen der Westschweiz"}, {"f": "déjeuner – dîner – souper (BE, CH, QC)", "b": "Frühstück – Mittagessen – Abendessen"}, {"f": "le char / magasiner (Québec)", "b": "Auto / einkaufen gehen"}, {"f": "le courriel", "b": "E-Mail (Québec, auch offiziell in Frankreich)"}, {"f": "la fin de semaine (Québec)", "b": "das Wochenende"}, {"f": "Tu viens-tu ? (Québec)", "b": "Kommst du? (Fragepartikel -tu)"}, {"f": "à plus / d'acc / sympa", "b": "bis später / okay / nett"}, {"f": "Wie viele Menschen sprechen Französisch?", "b": "rund 320 Millionen, die meisten in Afrika"}]}]</script>
<script>
(function(){
const CH = JSON.parse(document.getElementById('data').textContent);
const byId = {}; CH.forEach(c=>byId[c.id]=c);
const $ = s=>document.querySelector(s);
const app=$('#app'), top=$('#top'), tabs=$('#tabs');

/* ---- per-viewer progress (best effort) ---- */
let P={};
try{ P=JSON.parse(localStorage.getItem('frgr-progress')||'{}')||{}; }catch(e){ P={}; }
function save(){ try{ localStorage.setItem('frgr-progress',JSON.stringify(P)); }catch(e){} }
function prog(id){ return P[id]||(P[id]={ex:{},cards:{}}); }
function chapterPct(c){
  const p=P[c.id]; if(!p) return 0;
  const tot=c.exercises.length + 1; let got=0;
  c.exercises.forEach((e,i)=>{ const s=p.ex[i]; if(s) got+=s.r/s.n; });
  const known=Object.values(p.cards||{}).filter(v=>v===1).length;
  got += c.cards.length? known/c.cards.length : 0;
  return Math.round(100*got/tot);
}

const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const label=c=> (String(c.nr).includes('.')? 'Überblick' : 'Kapitel '+c.nr);
function ring(p){
  const r=12, C=2*Math.PI*r, d=C*p/100;
  return `<svg class="ring" viewBox="0 0 30 30" aria-label="${p} Prozent"><circle cx="15" cy="15" r="${r}" fill="none" stroke="var(--line)" stroke-width="3"/>`+
    `<circle cx="15" cy="15" r="${r}" fill="none" stroke="${p>=80?'var(--green)':'var(--blue)'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${d} ${C}" transform="rotate(-90 15 15)"/>`+
    `<text x="15" y="18.5" text-anchor="middle" font-size="8.5" fill="var(--muted)" font-family="sans-serif">${p}</text></svg>`;
}

/* ---- routing: #home, #k11, #k11-ueben, #k11-karten, #mix ---- */
function go(h){ if(location.hash!=='#'+h) location.hash=h; else render(); }
window.addEventListener('hashchange',render);

function render(){
  const h=(location.hash||'#home').slice(1);
  window.scrollTo(0,0);
  if(h==='mix') return renderMix();
  const m=h.match(/^(k\d+b?)(?:-(ueben|karten))?$/);
  if(m && byId[m[1]]) return renderChapter(byId[m[1]], m[2]||'lernen');
  renderHome();
}

/* ---- home ---- */
function renderHome(){
  tabs.hidden=true;
  top.innerHTML=`<div class="t">Französisch-Grammatik</div>`;
  const totalEx=CH.reduce((a,c)=>a+c.exercises.reduce((b,e)=>b+e.items.length,0),0);
  const totalCards=CH.reduce((a,c)=>a+c.cards.length,0);
  const known=CH.reduce((a,c)=>a+Object.values((P[c.id]||{}).cards||{}).filter(v=>v===1).length,0);
  let last=null; try{ last=localStorage.getItem('frgr-last'); }catch(e){}
  let html=`<section class="hero"><h1>Grammaire française</h1>
    <p>Merkblätter, Übungen und Lernkarten zu allen Kapiteln der französischen Grammatik, von der Aussprache bis zum subjonctif. Antippen, lernen, prüfen.</p>
    <div class="stats"><div class="stat"><b>${CH.length}</b>Kapitel</div><div class="stat"><b>${totalEx}</b>Übungssätze</div><div class="stat"><b>${known}/${totalCards}</b>Karten gewusst</div></div>
    <div class="quick">
      ${last&&byId[last]?`<button class="qbtn" data-go="${last}">Weiterlernen<small>${esc(byId[last].title)}</small></button>`:`<button class="qbtn" data-go="k01">Loslegen<small>Kapitel 1</small></button>`}
      <button class="qbtn alt" data-go="mix">Gemischte Karten<small>20 aus allen Kapiteln</small></button>
    </div>
    <input class="search" id="q" type="search" placeholder="Suchen, z. B. en, subjonctif, Uhrzeit" autocomplete="off">
    <div id="hits"></div></section>`;
  let teil=null;
  CH.forEach((c,i)=>{
    if(c.teil!==teil){ if(teil!==null) html+='</div>'; teil=c.teil; html+=`<div class="teil">${esc(teil)}</div><div class="list">`; }
    html+=`<button class="row" data-go="${c.id}"><span class="n">${String(c.nr).includes('.')?'·':c.nr}</span><span class="tt"><b>${esc(c.title)}</b><small>${c.sections.length} Abschnitte · ${c.exercises.length} Übungen · ${c.cards.length} Karten</small></span>${ring(chapterPct(c))}</button>`;
  });
  html+='</div>';
  app.innerHTML=html;
  const q=$('#q'), hits=$('#hits');
  q.addEventListener('input',()=>{
    const t=q.value.trim().toLowerCase();
    if(t.length<2){ hits.innerHTML=''; return; }
    const out=[];
    CH.forEach(c=>c.sections.forEach((s,si)=>{
      const plain=(s.h+' '+s.html.replace(/<[^>]+>/g,' ')).toLowerCase();
      if(plain.includes(t)) out.push({c,si,s});
    }));
    hits.innerHTML = out.length? `<div class="list" style="margin-top:8px">`+out.slice(0,25).map(o=>`<button class="hit" data-go="${o.c.id}" data-sec="${o.si}"><b>${esc(o.s.h)}</b><small>${label(o.c)} · ${esc(o.c.title)}</small></button>`).join('')+`</div>` : `<p class="empty">Nichts gefunden.</p>`;
  });
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-go]'); if(!b) return;
  const sec=b.dataset.sec;
  go(b.dataset.go);
  if(sec!=null) setTimeout(()=>{ const el=document.getElementById('s'+sec); if(el) el.scrollIntoView({behavior:'smooth'}); },60);
});

/* ---- chapter ---- */
function renderChapter(c,tab){
  try{ localStorage.setItem('frgr-last',c.id); }catch(e){}
  tabs.hidden=false;
  tabs.querySelectorAll('.tab').forEach(t=>{ t.setAttribute('aria-selected', t.dataset.tab===tab?'true':'false'); t.onclick=()=>go(c.id+(t.dataset.tab==='lernen'?'':'-'+t.dataset.tab)); });
  top.innerHTML=`<button class="back" data-home aria-label="Zur Übersicht"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg>Inhalt</button><div class="t">${esc(c.title)}</div><span class="num">${String(c.nr).includes('.')?'':c.nr}</span>`;
  top.querySelector('[data-home]').onclick=()=>go('home');
  const idx=CH.indexOf(c), prev=CH[idx-1], next=CH[idx+1];
  const nav=`<div class="next">${prev?`<button class="btn ghost" data-go="${prev.id}">‹ ${esc(prev.title)}</button>`:''}${next?`<button class="btn ghost" data-go="${next.id}">${esc(next.title)} ›</button>`:''}</div>`;
  const head=`<header class="chhead"><div class="kn">${label(c)} · ${esc(c.teil)}</div><h1>${esc(c.title)}</h1>${tab==='lernen'?`<p>${esc(c.intro)}</p>`:''}</header>`;
  if(tab==='lernen'){
    app.innerHTML=head+`<div class="toc">${c.sections.map((s,i)=>`<button class="chip" data-sec="${i}">${esc(s.h)}</button>`).join('')}</div>`+
      c.sections.map((s,i)=>`<section class="sec" id="s${i}"><h2>${esc(s.h)}</h2>${s.html.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>')}</section>`).join('')+
      `<div class="bar"><button class="btn" data-go="${c.id}-ueben">Jetzt üben</button><button class="btn sec2" data-go="${c.id}-karten">Lernkarten</button></div>`+nav;
    app.querySelectorAll('.toc .chip').forEach(b=>b.onclick=()=>document.getElementById('s'+b.dataset.sec).scrollIntoView({behavior:'smooth'}));
  } else if(tab==='ueben'){
    app.innerHTML=head+c.exercises.map((e,i)=>exHTML(c,e,i)).join('')+nav;
    c.exercises.forEach((e,i)=>wireEx(c,e,i));
  } else {
    app.innerHTML=head+`<div id="cards"></div>`+nav;
    runCards($('#cards'), c.cards.map((x,i)=>({...x,cid:c.id,i})), c.id);
  }
}

/* ---- exercises ---- */
function norm(s){ return String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/\s+/g,' ').replace(/\s*'\s*/g,"'").replace(/[!?.,;:]+$/,'').trim(); }
function deacc(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,''); }
function exHTML(c,e,i){
  const s=(P[c.id]&&P[c.id].ex[i]);
  let h=`<section class="ex" id="ex${i}"><span class="score" id="sc${i}">${s?`zuletzt ${s.r}/${s.n}`:''}</span><h2>${esc(e.title||('Übung '+(i+1)))}</h2><p class="task">${esc(e.task||'')}</p>`;
  e.items.forEach((it,j)=>{
    if(e.type==='gap'){
      const parts=it.q.split('___');
      h+=`<div class="it"><div class="q"><span class="ix">${j+1}.</span><em>${esc(parts[0])}</em><input class="gap" id="g${i}-${j}" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" aria-label="Lücke ${j+1}"><em>${esc(parts.slice(1).join('___'))}</em></div>${it.de?`<span class="de">${esc(it.de)}</span>`:''}<div class="fb" id="f${i}-${j}"></div></div>`;
    } else {
      h+=`<div class="it"><div class="q"><span class="ix">${j+1}.</span><em>${esc(it.q)}</em></div><div class="opts">${it.options.map((o,k)=>`<button class="opt" data-k="${k}" id="o${i}-${j}-${k}">${esc(o)}</button>`).join('')}</div><div class="why" id="w${i}-${j}" hidden></div></div>`;
    }
  });
  h+= e.type==='gap'
    ? `<div class="bar"><button class="btn" data-check>Prüfen</button><button class="btn sec2" data-show>Lösungen zeigen</button><button class="btn ghost" data-reset>Neu</button></div>`
    : `<div class="bar"><button class="btn ghost" data-reset>Neu</button></div>`;
  return h+`</section>`;
}
function record(c,i,r,n){ prog(c.id).ex[i]={r,n}; save(); const sc=document.getElementById('sc'+i); if(sc) sc.textContent=`${r}/${n} richtig`; }
function wireEx(c,e,i){
  const box=document.getElementById('ex'+i);
  if(e.type==='gap'){
    const check=()=>{
      let r=0;
      e.items.forEach((it,j)=>{
        const inp=document.getElementById(`g${i}-${j}`), fb=document.getElementById(`f${i}-${j}`);
        const v=norm(inp.value); const sols=it.a.map(norm);
        inp.classList.remove('ok','bad','near');
        if(!v){ fb.className='fb'; fb.textContent=''; return; }
        if(sols.includes(v)){ inp.classList.add('ok'); fb.className='fb ok'; fb.textContent='Richtig'+(it.a.length>1?' · auch: '+it.a.filter(a=>norm(a)!==v).join(', '):''); r++; }
        else if(sols.map(deacc).includes(deacc(v))){ inp.classList.add('near'); fb.className='fb near'; fb.textContent='Fast: Akzent prüfen → '+it.a[0]; }
        else { inp.classList.add('bad'); fb.className='fb bad'; fb.textContent='Lösung: '+it.a.join(' / '); }
      });
      record(c,i,r,e.items.length);
    };
    box.querySelector('[data-check]').onclick=check;
    box.querySelector('[data-show]').onclick=()=>e.items.forEach((it,j)=>{ const fb=document.getElementById(`f${i}-${j}`); fb.className='fb ok'; fb.textContent='Lösung: '+it.a.join(' / '); });
    box.querySelectorAll('.gap').forEach((inp,j,all)=>inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); if(all[j+1]) all[j+1].focus(); else { inp.blur(); check(); } } }));
  } else {
    let answered=0, right=0;
    e.items.forEach((it,j)=>{
      const opts=[...box.querySelectorAll(`[id^="o${i}-${j}-"]`)];
      opts.forEach(b=>b.onclick=()=>{
        const k=+b.dataset.k; opts.forEach(o=>o.disabled=true);
        opts[it.a].classList.add('ok'); if(k!==it.a) b.classList.add('bad'); else right++;
        answered++;
        const w=document.getElementById(`w${i}-${j}`); if(it.why){ w.textContent=it.why; w.hidden=false; }
        if(answered===e.items.length) record(c,i,right,e.items.length);
      });
    });
  }
  box.querySelector('[data-reset]').onclick=()=>{
    const fresh=document.createElement('div'); fresh.innerHTML=exHTML(c,e,i); box.replaceWith(fresh.firstElementChild); wireEx(c,e,i);
  };
}

/* ---- flashcards ---- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function runCards(el, deck, cid){
  let queue=shuffle(deck), pos=0, good=0, again=[];
  function show(){
    if(pos>=queue.length){
      if(again.length){ queue=shuffle(again); again=[]; pos=0; }
      else { el.innerHTML=`<div class="done"><h2>Très bien !</h2><p class="empty">${good} Karten gewusst.</p><div class="bar" style="justify-content:center"><button class="btn" id="cagain">Nochmal mischen</button></div></div>`; $('#cagain').onclick=()=>runCards(el,deck,cid); return; }
    }
    const k=queue[pos]; const src=cid?'':`${esc(byId[k.cid].title)}`;
    el.innerHTML=`<div class="cardwrap"><div class="cardmeta"><span>Karte ${pos+1} von ${queue.length}</span><span>${again.length?again.length+' zum Wiederholen':''}</span></div>
      <div class="fc" id="fc" role="button" tabindex="0" aria-label="Karte umdrehen"><div class="inner">
        <div class="face"><span class="lab">Frage</span><div class="tx">${esc(k.f)}</div>${src?`<div class="src">${src}</div>`:''}</div>
        <div class="face back"><span class="lab">Antwort</span><div class="tx">${esc(k.b)}</div></div>
      </div></div>
      <div class="cardbtns"><button class="btn no" id="cno">Nochmal</button><button class="btn yes" id="cyes">Gewusst</button></div>
      <p class="empty" style="text-align:center;font-size:14px">Tippe auf die Karte zum Umdrehen.</p></div>`;
    const fc=$('#fc'); const flip=()=>fc.classList.toggle('flip');
    fc.onclick=flip; fc.onkeydown=ev=>{ if(ev.key===' '||ev.key==='Enter'){ ev.preventDefault(); flip(); } };
    $('#cyes').onclick=()=>{ prog(k.cid).cards[k.i]=1; save(); good++; pos++; show(); };
    $('#cno').onclick=()=>{ prog(k.cid).cards[k.i]=0; save(); again.push(k); pos++; show(); };
  }
  show();
}
function renderMix(){
  tabs.hidden=true;
  top.innerHTML=`<button class="back" data-home><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg>Inhalt</button><div class="t">Gemischte Karten</div>`;
  top.querySelector('[data-home]').onclick=()=>go('home');
  const all=[]; CH.forEach(c=>c.cards.forEach((x,i)=>all.push({...x,cid:c.id,i})));
  // bevorzugt Karten, die noch nicht gewusst wurden
  const unknown=all.filter(k=>((P[k.cid]||{}).cards||{})[k.i]!==1);
  const pool=shuffle(unknown.length>=20?unknown:all).slice(0,20);
  app.innerHTML=`<header class="chhead"><div class="kn">Alle Kapitel</div><h1>20 gemischte Karten</h1><p>Karten, die du noch nicht gewusst hast, kommen zuerst.</p></header><div id="cards"></div>`;
  runCards($('#cards'), pool, null);
}

render();
})();
</script>
