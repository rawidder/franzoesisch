 ___ (heureux)", "a": ["heureux"], "de": "glückliche Kinder"}, {"q": "des chaussures ___ (marron)", "a": ["marron"], "de": "braune Schuhe"}, {"q": "des yeux ___ (bleu)", "a": ["bleus"], "de": "blaue Augen"}, {"q": "les matchs ___ (final)", "a": ["finals", "finaux"], "de": "die Endspiele"}, {"q": "une jupe et un pull ___ (noir)", "a": ["noirs"], "de": "ein schwarzer Rock und ein schwarzer Pullover"}, {"q": "des chemises ___ (bleu clair)", "a": ["bleu clair"], "de": "hellblaue Hemden"}]}, {"type": "choice", "title": "Vor oder nach dem Substantiv?", "task": "Wähle die übliche Wortstellung.", "items": [{"q": "ein rotes Auto", "options": ["une rouge voiture", "une voiture rouge"], "a": 1, "why": "Farben stehen nach dem Substantiv."}, {"q": "ein kleines Dorf", "options": ["un petit village", "un village petit"], "a": 0, "why": "BAGS: petit steht vorne."}, {"q": "eine interessante Frage", "options": ["une intéressante question", "une question intéressante"], "a": 1, "why": "Längere Adjektive stehen hinten."}, {"q": "eine gute Idee", "options": ["une bonne idée", "une idée bonne"], "a": 0, "why": "BAGS: bon steht vorne."}, {"q": "der französische Wein", "options": ["le français vin", "le vin français"], "a": 1, "why": "Nationalität → hinten."}, {"q": "eine offene Tür", "options": ["une ouverte porte", "une porte ouverte"], "a": 1, "why": "Partizipien → hinten."}, {"q": "der erste Tag", "options": ["le premier jour", "le jour premier"], "a": 0, "why": "Ordnungszahlen stehen vorne."}]}, {"type": "choice", "title": "Stellung und Bedeutung", "task": "Welche Bedeutung hat der Ausdruck?", "items": [{"q": "mon ancien professeur", "options": ["mein ehemaliger Lehrer", "mein alter (betagter) Lehrer"], "a": 0, "why": "ancien vorne = ehemalig."}, {"q": "une voiture propre", "options": ["ein eigenes Auto", "ein sauberes Auto"], "a": 1, "why": "propre hinten = sauber."}, {"q": "le pauvre garçon", "options": ["der bedauernswerte Junge", "der mittellose Junge"], "a": 0, "why": "pauvre vorne = bedauernswert."}, {"q": "la semaine dernière", "options": ["letzte Woche (vergangene)", "die letzte Woche (einer Reihe)"], "a": 0, "why": "dernier hinten = vergangen."}, {"q": "un grand homme", "options": ["ein großgewachsener Mann", "ein bedeutender Mann"], "a": 1, "why": "grand vorne bei Personen = bedeutend."}, {"q": "une femme seule", "options": ["eine einzige Frau", "eine alleinstehende Frau"], "a": 1, "why": "seul hinten = allein."}, {"q": "mon cher ami", "options": ["mein lieber Freund", "mein teurer Freund"], "a": 0, "why": "cher vorne = lieb."}]}, {"type": "gap", "title": "Komparativ und Superlativ", "task": "Ergänze die fehlenden Wörter.", "items": [{"q": "Ce gâteau est ___ que l'autre. (besser)", "a": ["meilleur"], "de": "Dieser Kuchen ist besser als der andere."}, {"q": "Paris est la ville la ___ visitée de France. (meist)", "a": ["plus"], "de": "Paris ist die meistbesuchte Stadt Frankreichs."}, {"q": "Marie est aussi grande ___ sa mère.", "a": ["que"], "de": "Marie ist so groß wie ihre Mutter."}, {"q": "C'est la ___ pizza de la ville. (beste)", "a": ["meilleure"], "de": "Das ist die beste Pizza der Stadt."}, {"q": "Les prix sont de plus en ___ élevés.", "a": ["plus"], "de": "Die Preise werden immer höher."}, {"q": "Je n'ai pas la ___ idée. (geringste)", "a": ["moindre"], "de": "Ich habe nicht die geringste Ahnung."}, {"q": "C'est le restaurant ___ moins cher du quartier.", "a": ["le"], "de": "Das ist das billigste Restaurant im Viertel."}, {"q": "La situation est ___ qu'hier. (schlimmer)", "a": ["pire", "plus mauvaise"], "de": "Die Lage ist schlimmer als gestern."}]}], "cards": [{"f": "Feminin: Grundregel", "b": "+ e: petit → petite (t wird hörbar)"}, {"f": "-er / -f / -x im Feminin", "b": "-ère (chère) · -ve (sportive) · -se (heureuse)"}, {"f": "-en, -on, -el im Feminin", "b": "Konsonant verdoppeln: italienne, bonne, naturelle"}, {"f": "blanc, frais, long, doux – Feminin", "b": "blanche, fraîche, longue, douce"}, {"f": "gentil, gros, faux, fou – Feminin", "b": "gentille, grosse, fausse, folle"}, {"f": "complet, secret, inquiet – Feminin", "b": "complète, secrète, inquiète (mit è, nicht -ette)"}, {"f": "beau, nouveau, vieux vor Vokal (m. Sg.)", "b": "bel, nouvel, vieil: un bel appartement"}, {"f": "belle, nouvelle, vieille", "b": "Feminin von beau, nouveau, vieux"}, {"f": "-al im Plural", "b": "-aux: nationaux (Ausnahmen: banals, finals, fatals, navals)"}, {"f": "marron, orange, bleu clair im Plural", "b": "unveränderlich: des chaussures marron"}, {"f": "m. + f. Substantiv → Adjektiv?", "b": "maskuliner Plural: une jupe et un pull noirs"}, {"f": "Normale Stellung des Adjektivs", "b": "nach dem Substantiv: une voiture rouge"}, {"f": "BAGS", "b": "Beauty, Age, Goodness, Size – diese stehen vorne: beau, jeune, bon, petit …"}, {"f": "ancien vorne / hinten", "b": "ehemalig / antik, alt"}, {"f": "propre vorne / hinten", "b": "eigen / sauber"}, {"f": "pauvre vorne / hinten", "b": "bedauernswert / arm"}, {"f": "cher vorne / hinten", "b": "lieb / teuer"}, {"f": "la dernière semaine / la semaine dernière", "b": "die letzte Woche (einer Reihe) / letzte Woche (vergangene)"}, {"f": "Komparativ", "b": "plus / aussi / moins + Adj. + que"}, {"f": "Superlativ nach dem Substantiv", "b": "Artikel wiederholen: la ville la plus belle"}, {"f": "bon – Komparativ, Superlativ", "b": "meilleur, le meilleur (nie plus bon!)"}, {"f": "mauvais – Komparativ", "b": "plus mauvais oder pire"}, {"f": "der geringste", "b": "le moindre: pas la moindre idée"}, {"f": "immer größer / immer weniger", "b": "de plus en plus grand / de moins en moins"}, {"f": "„der … der Welt“ beim Superlativ", "b": "de: le plus haut du monde"}]}, {"nr": 5, "id": "k05", "title": "Possessiva und Demonstrativa", "teil": "Das Substantiv und seine Begleiter", "intro": "Possessivbegleiter (mein, dein …) und Demonstrativbegleiter (dieser, jener) richten sich nach dem Substantiv, das sie begleiten – nicht nach dem Besitzer. Dazu kommen die entsprechenden Pronomen: le mien, celui-ci und Co.", "sections": [{"h": "Die Possessivbegleiter", "html": "<table><tr><th>Besitzer<\/th><th>m. Sg.<\/th><th>f. Sg.<\/th><th>Plural<\/th><\/tr><tr><td>je<\/td><td><em>mon<\/em><\/td><td><em>ma<\/em><\/td><td><em>mes<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>ton<\/em><\/td><td><em>ta<\/em><\/td><td><em>tes<\/em><\/td><\/tr><tr><td>il / elle / on<\/td><td><em>son<\/em><\/td><td><em>sa<\/em><\/td><td><em>ses<\/em><\/td><\/tr><tr><td>nous<\/td><td colspan='2'><em>notre<\/em><\/td><td><em>nos<\/em><\/td><\/tr><tr><td>vous<\/td><td colspan='2'><em>votre<\/em><\/td><td><em>vos<\/em><\/td><\/tr><tr><td>ils / elles<\/td><td colspan='2'><em>leur<\/em><\/td><td><em>leurs<\/em><\/td><\/tr><\/table><ul><li><em>mon frère, ma sœur, mes parents<\/em><\/li><li><em>notre maison, nos enfants<\/em><\/li><li><em>leur voiture, leurs amis<\/em><\/li><\/ul><p>Anders als im Italienischen steht <b>kein Artikel<\/b> davor: <em>la mia casa<\/em> → <em>ma maison<\/em>.<\/p><div class='tip'>Merke: <em>vous<\/em> als Höflichkeitsform: <em>votre passeport, vos bagages<\/em> – auch wenn nur eine Person angesprochen wird.<\/div>"}, {"h": "son oder sa? Nach dem Besitz, nicht nach dem Besitzer", "html": "<p>Das Possessiv richtet sich nach dem Genus des <b>Besitzes<\/b>. <em>son/sa/ses<\/em> heißt daher sowohl „sein“ als auch „ihr“:<\/p><table><tr><th>Französisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>Paul aime sa mère.<\/em><\/td><td>Paul liebt seine Mutter.<\/td><\/tr><tr><td><em>Julie aime son père.<\/em><\/td><td>Julie liebt ihren Vater.<\/td><\/tr><tr><td><em>Julie aime sa mère.<\/em><\/td><td>Julie liebt ihre Mutter.<\/td><\/tr><\/table><p>Wenn nötig, verdeutlicht man mit <em>à lui / à elle<\/em>: <em>C'est sa voiture à elle.<\/em> – Das ist <i>ihr<\/i> Auto.<\/p><div class='warn'>Achtung: Vor femininen Wörtern mit Vokal oder stummem h steht <em>mon, ton, son<\/em> statt <em>ma, ta, sa<\/em>: <em>mon amie, ton école, son histoire, mon idée<\/em>. Das Wort bleibt feminin: <em>mon amie est gentille<\/em>.<\/div><div class='warn'>Achtung: <em>leur<\/em> (ihr, mehrere Besitzer) vs. <em>son/sa<\/em> (ihr, eine Besitzerin): <em>Les enfants aiment leur chien.<\/em> – <em>Marie aime son chien.<\/em><\/div>"}, {"h": "Possessiv oder Artikel?", "html": "<p>Bei <b>Körperteilen<\/b> steht meist der bestimmte Artikel, weil der Besitzer schon klar ist – oft mit einem reflexiven oder indirekten Pronomen:<\/p><ul><li><em>Je me lave les mains.<\/em> – Ich wasche mir die Hände.<\/li><li><em>Elle s'est cassé la jambe.<\/em> – Sie hat sich das Bein gebrochen.<\/li><li><em>Il lève la main.<\/em> – Er hebt die Hand.<\/li><li><em>J'ai mal au ventre.<\/em> – Mir tut der Bauch weh.<\/li><\/ul><p>Mit Adjektiv oder wenn der Körperteil Subjekt ist, steht das Possessiv: <em>Ses yeux sont bleus. Il a levé sa main droite.<\/em><\/p><div class='tip'>Merke: Wie im Italienischen und Spanischen: <em>mi lavo le mani – me lavo las manos – je me lave les mains<\/em>.<\/div>"}, {"h": "Die Possessivpronomen: le mien, la tienne …", "html": "<p>Possessivpronomen ersetzen Possessiv + Substantiv. Sie stehen <b>mit Artikel<\/b>:<\/p><table><tr><th>Besitzer<\/th><th>m. Sg.<\/th><th>f. Sg.<\/th><th>m. Pl.<\/th><th>f. Pl.<\/th><\/tr><tr><td>je<\/td><td><em>le mien<\/em><\/td><td><em>la mienne<\/em><\/td><td><em>les miens<\/em><\/td><td><em>les miennes<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>le tien<\/em><\/td><td><em>la tienne<\/em><\/td><td><em>les tiens<\/em><\/td><td><em>les tiennes<\/em><\/td><\/tr><tr><td>il/elle<\/td><td><em>le sien<\/em><\/td><td><em>la sienne<\/em><\/td><td><em>les siens<\/em><\/td><td><em>les siennes<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>le nôtre<\/em><\/td><td><em>la nôtre<\/em><\/td><td colspan='2'><em>les nôtres<\/em><\/td><\/tr><tr><td>vous<\/td><td><em>le vôtre<\/em><\/td><td><em>la vôtre<\/em><\/td><td colspan='2'><em>les vôtres<\/em><\/td><\/tr><tr><td>ils/elles<\/td><td><em>le leur<\/em><\/td><td><em>la leur<\/em><\/td><td colspan='2'><em>les leurs<\/em><\/td><\/tr><\/table><ul><li><em>Ce n'est pas ma valise, c'est la tienne.<\/em> – Das ist nicht mein Koffer, das ist deiner.<\/li><li><em>Leurs enfants sont plus âgés que les nôtres.<\/em><\/li><\/ul><div class='warn'>Achtung: <em>notre/votre<\/em> (Begleiter, ohne Akzent, kurzes o) – <em>le nôtre/le vôtre<\/em> (Pronomen, mit Zirkumflex, langes o).<\/div><p>Mit <em>à<\/em> und <em>de<\/em> verschmilzt der Artikel: <em>Je pense aux miens.<\/em> (an meine Angehörigen) – <em>Parle-moi du tien.<\/em><\/p>"}, {"h": "Besitz mit être à und de", "html": "<p>„Gehören“ drückt man mit <em>être à<\/em> + betontem Pronomen oder Name aus:<\/p><ul><li><em>Ce livre est à moi.<\/em> – Dieses Buch gehört mir.<\/li><li><em>À qui est ce sac ? – Il est à Marie.<\/em> – Wem gehört die Tasche? – Marie.<\/li><li><em>C'est à toi ?<\/em> – Gehört das dir?<\/li><\/ul><p>Den deutschen Genitiv bildet man mit <em>de<\/em>: <em>la voiture de Pierre<\/em> (Pierres Auto), <em>le chien des voisins<\/em> (der Hund der Nachbarn).<\/p><div class='tip'>Merke: <em>un ami à moi<\/em> = ein Freund von mir; <em>C'est à toi de jouer.<\/em> = Du bist dran.<\/div>"}, {"h": "Die Demonstrativbegleiter: ce, cet, cette, ces", "html": "<table><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>m. vor Konsonant<\/td><td><em>ce<\/em> livre<\/td><td rowspan='3'><em>ces<\/em> livres / hommes / tables<\/td><\/tr><tr><td>m. vor Vokal / stummem h<\/td><td><em>cet<\/em> homme, <em>cet<\/em> arbre<\/td><\/tr><tr><td>feminin<\/td><td><em>cette<\/em> table, <em>cette<\/em> amie<\/td><\/tr><\/table><p><em>ce<\/em> bedeutet „dieser“ und „jener“. Zur Unterscheidung hängt man <em>-ci<\/em> (hier) und <em>-là<\/em> (dort) an:<\/p><ul><li><em>Je prends cette robe-ci, pas cette robe-là.<\/em> – Ich nehme dieses Kleid, nicht jenes.<\/li><li><em>Ce jour-là, il pleuvait.<\/em> – An jenem Tag regnete es.<\/li><\/ul><p>Zeitangaben: <em>ce matin<\/em> (heute Morgen), <em>cet après-midi, ce soir, cette semaine, cette année<\/em>.<\/p><div class='warn'>Achtung: <em>cet<\/em> und <em>cette<\/em> klingen gleich [sät]. <em>cet<\/em> nur für maskuline Wörter vor Vokal: <em>cet été<\/em> (dieser Sommer), aber <em>cette heure<\/em> (f).<\/div>"}, {"h": "Die Demonstrativpronomen: celui, celle, ceux, celles", "html": "<table><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>maskulin<\/td><td><em>celui<\/em><\/td><td><em>ceux<\/em><\/td><\/tr><tr><td>feminin<\/td><td><em>celle<\/em><\/td><td><em>celles<\/em><\/td><\/tr><\/table><p>Sie stehen <b>nie allein<\/b>, sondern immer mit<\/p><ul><li><em>-ci / -là<\/em>: <em>Quel pull préfères-tu ? Celui-ci ou celui-là ?<\/em> – diesen oder jenen?<\/li><li><em>de<\/em>: <em>Ma voiture est rouge, celle de Paul est noire.<\/em> – die von Paul<\/li><li>Relativpronomen: <em>Ceux qui veulent partir peuvent partir.<\/em> – Diejenigen, die …; <em>C'est celle que je préfère.<\/em><\/li><\/ul><div class='warn'>Achtung: Nicht <em>ce<\/em> und <em>celui<\/em> verwechseln: <em>ce livre<\/em> (Begleiter, mit Substantiv) – <em>celui-ci<\/em> (Pronomen, ohne Substantiv).<\/div>"}, {"h": "Neutrale Demonstrativa: ce, ceci, cela, ça", "html": "<p>Für Sachverhalte und nicht benannte Dinge:<\/p><table><tr><th>Form<\/th><th>Gebrauch<\/th><th>Beispiel<\/th><\/tr><tr><td><em>ce / c'<\/em><\/td><td>mit <em>être<\/em> und vor Relativsatz<\/td><td><em>C'est vrai. Ce qui compte, c'est la santé.<\/em><\/td><\/tr><tr><td><em>ceci<\/em><\/td><td>dies (hier), schriftlich, kündigt an<\/td><td><em>Retenez bien ceci : …<\/em><\/td><\/tr><tr><td><em>cela<\/em><\/td><td>das, schriftlich<\/td><td><em>Cela ne me plaît pas.<\/em><\/td><\/tr><tr><td><em>ça<\/em><\/td><td>das, gesprochen<\/td><td><em>Ça va ? Ça coûte combien ? J'aime ça.<\/em><\/td><\/tr><\/table><p><b>c'est<\/b> oder <b>il est<\/b>?<\/p><ul><li><em>c'est<\/em> + Artikel/Begleiter + Substantiv: <em>C'est un ami. C'est mon frère.<\/em><\/li><li><em>c'est<\/em> + Name / betontes Pronomen: <em>C'est Marie. C'est moi.<\/em><\/li><li><em>c'est<\/em> + Adjektiv für einen Sachverhalt: <em>C'est intéressant. C'est difficile à dire.<\/em><\/li><li><em>il/elle est<\/em> + Adjektiv für eine Person/Sache: <em>Elle est intelligente.<\/em>; + Beruf ohne Artikel: <em>Il est dentiste.<\/em><\/li><\/ul><div class='tip'>Merke: <em>Ce sont<\/em> im Plural ist korrekt, gesprochen hört man meist <em>c'est<\/em>: <em>Ce sont / C'est mes amis.<\/em><\/div>"}], "exercises": [{"type": "gap", "title": "Possessivbegleiter", "task": "Setze den passenden Possessivbegleiter ein.", "items": [{"q": "J'ai perdu ___ clés. (je)", "a": ["mes"], "de": "Ich habe meine Schlüssel verloren."}, {"q": "Paul aime ___ mère. (il)", "a": ["sa"], "de": "Paul liebt seine Mutter."}, {"q": "Marie téléphone à ___ père. (elle)", "a": ["son"], "de": "Marie ruft ihren Vater an."}, {"q": "C'est ___ amie Sophie. (je)", "a": ["mon"], "de": "Das ist meine Freundin Sophie."}, {"q": "Les enfants rangent ___ chambre. (ils)", "a": ["leur"], "de": "Die Kinder räumen ihr Zimmer auf."}, {"q": "Nous vendons ___ maison. (nous)", "a": ["notre"], "de": "Wir verkaufen unser Haus."}, {"q": "Madame, ___ passeport, s'il vous plaît. (vous)", "a": ["votre"], "de": "Ihren Pass bitte, gnädige Frau."}, {"q": "Tu connais ___ histoire ? (il)", "a": ["son"], "de": "Kennst du seine Geschichte?"}, {"q": "Ils ont oublié ___ billets. (ils)", "a": ["leurs"], "de": "Sie haben ihre Fahrkarten vergessen."}, {"q": "Où est ___ école ? (tu)", "a": ["ton"], "de": "Wo ist deine Schule?"}]}, {"type": "choice", "title": "sein oder ihr?", "task": "Wähle die richtige Übersetzung.", "items": [{"q": "Julie liebt ihren Hund.", "options": ["Julie aime sa chien.", "Julie aime son chien.", "Julie aime leur chien."], "a": 1, "why": "chien ist maskulin → son, egal wer der Besitzer ist."}, {"q": "Thomas besucht seine Großmutter.", "options": ["Thomas rend visite à son grand-mère.", "Thomas rend visite à sa grand-mère."], "a": 1, "why": "grand-mère ist feminin → sa."}, {"q": "Die Nachbarn verkaufen ihr Auto.", "options": ["Les voisins vendent sa voiture.", "Les voisins vendent leur voiture."], "a": 1, "why": "Mehrere Besitzer → leur."}, {"q": "Anne vergisst immer ihre Brille.", "options": ["Anne oublie toujours ses lunettes.", "Anne oublie toujours leurs lunettes."], "a": 0, "why": "Eine Besitzerin, Plural-Besitz → ses."}, {"q": "Er wäscht sich die Hände.", "options": ["Il lave ses mains.", "Il se lave les mains."], "a": 1, "why": "Körperteil → Reflexivpronomen + Artikel."}]}, {"type": "gap", "title": "Possessivpronomen", "task": "Ersetze durch das Possessivpronomen.", "items": [{"q": "Ce n'est pas mon stylo, c'est ___ . (deiner)", "a": ["le tien"], "de": "Das ist nicht mein Kuli, das ist deiner."}, {"q": "Ta voiture est rapide, ___ est lente. (meine)", "a": ["la mienne"], "de": "Dein Auto ist schnell, meins ist langsam."}, {"q": "Nos enfants jouent avec ___ . (ihre, mehrere Besitzer)", "a": ["les leurs"], "de": "Unsere Kinder spielen mit ihren."}, {"q": "Votre maison est plus grande que ___ . (unsere)", "a": ["la nôtre", "la notre"], "de": "Ihr Haus ist größer als unseres."}, {"q": "J'ai mes billets. Tu as ___ ? (deine)", "a": ["les tiens"], "de": "Ich habe meine Fahrkarten. Hast du deine?"}, {"q": "Ce sont tes clés ou ___ ? (seine)", "a": ["les siennes"], "de": "Sind das deine Schlüssel oder seine?"}, {"q": "Mon chien est noir, ___ est blanc. (eurer)", "a": ["le vôtre", "le votre"], "de": "Mein Hund ist schwarz, eurer ist weiß."}]}, {"type": "gap", "title": "ce, cet, cette, ces", "task": "Setze den Demonstrativbegleiter ein.", "items": [{"q": "___ livre est passionnant.", "a": ["Ce"], "de": "Dieses Buch ist spannend."}, {"q": "___ homme est mon voisin.", "a": ["Cet"], "de": "Dieser Mann ist mein Nachbar."}, {"q": "Tu connais ___ chanson ?", "a": ["cette"], "de": "Kennst du dieses Lied?"}, {"q": "___ chaussures sont trop petites.", "a": ["Ces"], "de": "Diese Schuhe sind zu klein."}, {"q": "On part en vacances ___ été.", "a": ["cet"], "de": "Wir fahren diesen Sommer in Urlaub."}, {"q": "Qu'est-ce que tu fais ___ après-midi ?", "a": ["cet"], "de": "Was machst du heute Nachmittag?"}, {"q": "___ année, je vais apprendre le français.", "a": ["Cette"], "de": "Dieses Jahr lerne ich Französisch."}, {"q": "Je n'aime pas ___ héros.", "a": ["ce"], "de": "Ich mag diesen Helden nicht. (h aspiré)"}]}, {"type": "gap", "title": "celui, celle, ceux, celles", "task": "Setze das Demonstrativpronomen ein.", "items": [{"q": "Quelle robe ? ___-ci ou celle-là ?", "a": ["Celle"], "de": "Welches Kleid? Dieses oder jenes?"}, {"q": "Mon appartement est petit, ___ de Luc est grand.", "a": ["celui"], "de": "Meine Wohnung ist klein, die von Luc ist groß."}, {"q": "___ qui ont fini peuvent sortir.", "a": ["Ceux"], "de": "Diejenigen, die fertig sind, dürfen hinausgehen."}, {"q": "Ces photos sont belles, mais je préfère ___ de Lisa.", "a": ["celles"], "de": "Diese Fotos sind schön, aber ich mag die von Lisa lieber."}, {"q": "Quel gâteau veux-tu ? ___ au chocolat.", "a": ["Celui"], "de": "Welchen Kuchen willst du? Den mit Schokolade."}, {"q": "C'est la chanson ? – Non, c'est ___ que j'ai entendue hier.", "a": ["celle"], "de": "Ist das das Lied? – Nein, es ist das, das ich gestern gehört habe."}]}, {"type": "choice", "title": "c'est oder il/elle est?", "task": "Wähle die richtige Form.", "items": [{"q": "___ mon frère.", "options": ["C'est", "Il est"], "a": 0, "why": "Begleiter + Substantiv → c'est."}, {"q": "___ architecte.", "options": ["C'est", "Il est"], "a": 1, "why": "Beruf ohne Artikel → il est."}, {"q": "___ un bon architecte.", "options": ["C'est", "Il est"], "a": 0, "why": "Artikel + Substantiv → c'est."}, {"q": "Tu as vu Marie ? ___ très sympa.", "options": ["C'est", "Elle est"], "a": 1, "why": "Adjektiv über eine Person → elle est."}, {"q": "Apprendre le français ? ___ passionnant !", "options": ["C'est", "Il est"], "a": 0, "why": "Adjektiv über einen Sachverhalt → c'est."}, {"q": "Qui est là ? – ___ moi.", "options": ["C'est", "Je suis"], "a": 0, "why": "c'est + betontes Pronomen."}, {"q": "___ coûte combien ?", "options": ["Ça", "Ce"], "a": 0, "why": "ça als Subjekt vor anderen Verben als être."}]}], "cards": [{"f": "mein / meine / meine (Pl.)", "b": "mon / ma / mes"}, {"f": "unser / euer / ihr (mehrere Besitzer)", "b": "notre, votre, leur – Plural: nos, vos, leurs"}, {"f": "son / sa – sein oder ihr?", "b": "beides: richtet sich nach dem Besitz, nicht nach dem Besitzer"}, {"f": "meine Freundin (amie)", "b": "mon amie – mon vor femininem Vokal"}, {"f": "Possessiv mit Artikel wie im Italienischen?", "b": "Nein: ma maison (nicht la ma …)"}, {"f": "Ich wasche mir die Hände.", "b": "Je me lave les mains."}, {"f": "meiner / meine (Pronomen)", "b": "le mien, la mienne, les miens, les miennes"}, {"f": "unserer / eurer (Pronomen)", "b": "le nôtre, le vôtre – mit Zirkumflex"}, {"f": "ihrer (mehrere Besitzer, Pronomen)", "b": "le leur, la leur, les leurs"}, {"f": "Das gehört mir.", "b": "C'est à moi."}, {"f": "Wem gehört das?", "b": "À qui est-ce ? / C'est à qui ?"}, {"f": "ce / cet / cette / ces", "b": "m. vor Konsonant / m. vor Vokal / f. / Plural"}, {"f": "dieser hier / jener dort", "b": "-ci / -là: cette robe-ci, ce jour-là"}, {"f": "heute Morgen / heute Abend", "b": "ce matin / ce soir"}, {"f": "celui, celle, ceux, celles", "b": "stehen nur mit -ci/-là, de oder Relativsatz"}, {"f": "die von Paul (Auto)", "b": "celle de Paul"}, {"f": "diejenigen, die …", "b": "ceux qui … / celles qui …"}, {"f": "ceci / cela / ça", "b": "dies (schriftlich) / das (schriftlich) / das (gesprochen)"}, {"f": "c'est oder il est + Beruf?", "b": "Il est médecin. – C'est un médecin."}, {"f": "c'est + Adjektiv", "b": "für Sachverhalte: C'est difficile."}, {"f": "il/elle est + Adjektiv", "b": "für Personen/bestimmte Dinge: Elle est sympa."}, {"f": "ein Freund von mir", "b": "un ami à moi / un de mes amis"}, {"f": "Du bist dran.", "b": "C'est à toi."}, {"f": "cet été / cette heure", "b": "cet nur für maskuline Wörter vor Vokal"}]}, {"nr": 6, "id": "k06", "title": "Indefinita und Verneinung", "teil": "Das Substantiv und seine Begleiter", "intro": "Die französische Verneinung ist zweiteilig: ne … pas umklammert das Verb. Dazu kommen ne … jamais, ne … rien, ne … personne und andere. Indefinitpronomen wie quelqu'un, chaque oder tout bezeichnen unbestimmte Personen, Dinge und Mengen.", "sections": [{"h": "Die Grundform: ne … pas", "html": "<p>Die Verneinung hat zwei Teile: <em>ne<\/em> vor dem konjugierten Verb, <em>pas<\/em> danach. Vor Vokal wird <em>ne<\/em> zu <em>n'<\/em>:<\/p><ul><li><em>Je ne parle pas italien.<\/em> – Ich spreche kein Italienisch.<\/li><li><em>Il n'aime pas le poisson.<\/em> – Er mag keinen Fisch.<\/li><\/ul><p><b>Stellung<\/b>:<\/p><table><tr><th>Fall<\/th><th>Beispiel<\/th><\/tr><tr><td>einfache Zeit<\/td><td><em>Je ne travaille pas.<\/em><\/td><\/tr><tr><td>mit Objektpronomen<\/td><td><em>Je ne le vois pas.<\/em> (ne vor dem Pronomen)<\/td><\/tr><tr><td>zusammengesetzte Zeit<\/td><td><em>Je n'ai pas compris.<\/em> (um das Hilfsverb)<\/td><\/tr><tr><td>Verb + Infinitiv<\/td><td><em>Je ne veux pas partir.<\/em><\/td><\/tr><tr><td>verneinter Infinitiv<\/td><td><em>Il m'a dit de ne pas partir.<\/em> (beide Teile vor den Infinitiv)<\/td><\/tr><tr><td>Frage mit Inversion<\/td><td><em>N'as-tu pas faim ?<\/em><\/td><\/tr><\/table><div class='tip'>Merke: In der gesprochenen Alltagssprache fällt <em>ne<\/em> fast immer weg: <em>J'sais pas. C'est pas grave. Il vient pas.<\/em> Schriftlich ist es Pflicht.<\/div><div class='warn'>Achtung: „kein“ = <em>ne … pas de<\/em>: <em>Je n'ai pas de voiture.<\/em> (siehe Kapitel 3).<\/div>"}, {"h": "Weitere Verneinungswörter", "html": "<table><tr><th>Verneinung<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>ne … jamais<\/em><\/td><td>nie<\/td><td><em>Il ne ment jamais.<\/em><\/td><\/tr><tr><td><em>ne … plus<\/em><\/td><td>nicht mehr, kein … mehr<\/td><td><em>Je ne fume plus. Il n'y a plus de pain.<\/em><\/td><\/tr><tr><td><em>ne … rien<\/em><\/td><td>nichts<\/td><td><em>Je ne vois rien.<\/em><\/td><\/tr><tr><td><em>ne … personne<\/em><\/td><td>niemand<\/td><td><em>Je ne connais personne ici.<\/em><\/td><\/tr><tr><td><em>ne … pas encore<\/em><\/td><td>noch nicht<\/td><td><em>Il n'est pas encore là.<\/em><\/td><\/tr><tr><td><em>ne … aucun(e)<\/em><\/td><td>kein einziger<\/td><td><em>Je n'ai aucune idée.<\/em><\/td><\/tr><tr><td><em>ne … nulle part<\/em><\/td><td>nirgends<\/td><td><em>Je ne le trouve nulle part.<\/em><\/td><\/tr><tr><td><em>ne … ni … ni<\/em><\/td><td>weder … noch<\/td><td><em>Il n'aime ni le thé ni le café.<\/em><\/td><\/tr><tr><td><em>ne … que<\/em><\/td><td>nur (keine echte Verneinung)<\/td><td><em>Je n'ai que dix euros.<\/em><\/td><\/tr><\/table><p>Kombinationen sind möglich: <em>Il ne dit plus rien.<\/em> (Er sagt nichts mehr.) <em>Je ne vois jamais personne.<\/em><\/p><div class='warn'>Achtung: Nach <em>ne … que<\/em> bleibt der Artikel: <em>Il ne boit que de l'eau.<\/em> (Er trinkt nur Wasser.) – es ist ja keine Verneinung.<\/div>"}, {"h": "Stellung von rien, personne, aucun", "html": "<p>In zusammengesetzten Zeiten unterscheiden sich die Verneinungswörter:<\/p><table><tr><th>vor dem Partizip<\/th><th>nach dem Partizip<\/th><\/tr><tr><td><em>Je n'ai <b>pas<\/b> mangé.<\/em><\/td><td><em>Je n'ai vu <b>personne<\/b>.<\/em><\/td><\/tr><tr><td><em>Je n'ai <b>jamais<\/b> vu ça.<\/em><\/td><td><em>Il n'a trouvé <b>aucune<\/b> solution.<\/em><\/td><\/tr><tr><td><em>Je n'ai <b>rien<\/b> compris.<\/em><\/td><td><em>Je ne l'ai vu <b>nulle part<\/b>.<\/em><\/td><\/tr><tr><td><em>Il n'a <b>plus<\/b> téléphoné.<\/em><\/td><td><em>Je n'ai mangé <b>que<\/b> du pain.<\/em><\/td><\/tr><\/table><p><b>Als Subjekt<\/b> stehen <em>rien, personne, aucun<\/em> am Satzanfang – mit <em>ne<\/em>, aber ohne <em>pas<\/em>:<\/p><ul><li><em>Personne n'est venu.<\/em> – Niemand ist gekommen.<\/li><li><em>Rien ne marche.<\/em> – Nichts funktioniert.<\/li><li><em>Aucun élève n'a répondu.<\/em> – Kein Schüler hat geantwortet.<\/li><\/ul><div class='warn'>Achtung: Nie <em>pas<\/em> zusammen mit <em>rien, personne, jamais<\/em> usw.: falsch <em>Je ne vois pas rien.<\/em><\/div>"}, {"h": "Kurzantworten: non, si, moi non plus", "html": "<ul><li><em>Jamais !<\/em> – Nie! <em>Personne.<\/em> – Niemand. <em>Rien.<\/em> – Nichts.<\/li><li><em>Pas moi.<\/em> – Ich nicht. <em>Pas du tout.<\/em> – Überhaupt nicht. <em>Pas encore.<\/em> – Noch nicht.<\/li><\/ul><p><b>si<\/b> statt <em>oui<\/em> widerspricht einer <b>verneinten<\/b> Frage (wie deutsches „doch“):<\/p><ul><li><em>Tu ne viens pas ? – Si, je viens !<\/em> – Kommst du nicht? – Doch!<\/li><\/ul><p><b>aussi / non plus<\/b>:<\/p><ul><li><em>J'aime le jazz. – Moi aussi.<\/em> – Ich auch.<\/li><li><em>Je n'aime pas le jazz. – Moi non plus.<\/em> – Ich auch nicht.<\/li><li><em>J'aime le jazz. – Pas moi.<\/em> / <em>Je n'aime pas le jazz. – Moi si.<\/em><\/li><\/ul><div class='tip'>Merke: Wie span. <em>yo tampoco<\/em> und ital. <em>neanche io<\/em>: <em>moi non plus<\/em>.<\/div>"}, {"h": "quelqu'un, quelque chose, quelque part", "html": "<table><tr><th>positiv<\/th><th>verneint<\/th><\/tr><tr><td><em>quelqu'un<\/em> jemand<\/td><td><em>ne … personne<\/em> niemand<\/td><\/tr><tr><td><em>quelque chose<\/em> etwas<\/td><td><em>ne … rien<\/em> nichts<\/td><\/tr><tr><td><em>quelque part<\/em> irgendwo<\/td><td><em>ne … nulle part<\/em> nirgends<\/td><\/tr><tr><td><em>quelquefois, parfois<\/em> manchmal<\/td><td><em>ne … jamais<\/em> nie<\/td><\/tr><\/table><p>Mit Adjektiv steht <em>de<\/em> + maskuline Form: <em>quelque chose d'intéressant<\/em> (etwas Interessantes), <em>quelqu'un de gentil<\/em> (jemand Nettes), <em>rien de nouveau<\/em> (nichts Neues), <em>personne d'autre<\/em> (niemand anderes).<\/p><div class='warn'>Achtung: <em>quelque chose<\/em> ist maskulin (obwohl <em>la chose<\/em> feminin ist): <em>Quelque chose est arrivé.<\/em><\/div>"}, {"h": "quelques, plusieurs, certains, chaque, chacun", "html": "<table><tr><th>Wort<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>quelques<\/em><\/td><td>einige, ein paar<\/td><td><em>J'ai quelques questions.<\/em><\/td><\/tr><tr><td><em>plusieurs<\/em><\/td><td>mehrere (unveränderlich)<\/td><td><em>plusieurs fois, plusieurs personnes<\/em><\/td><\/tr><tr><td><em>certain(e)s<\/em><\/td><td>gewisse, manche<\/td><td><em>Certains élèves sont absents.<\/em><\/td><\/tr><tr><td><em>chaque<\/em><\/td><td>jeder (Begleiter, nur Sg.)<\/td><td><em>chaque jour, chaque semaine<\/em><\/td><\/tr><tr><td><em>chacun(e)<\/em><\/td><td>jeder (Pronomen)<\/td><td><em>Chacun a son opinion.<\/em><\/td><\/tr><tr><td><em>quelques-un(e)s<\/em><\/td><td>einige (Pronomen)<\/td><td><em>J'en ai lu quelques-uns.<\/em><\/td><\/tr><tr><td><em>n'importe qui / quoi / où<\/em><\/td><td>irgendwer / -was / -wo (egal)<\/td><td><em>Il dit n'importe quoi.<\/em> Er redet Unsinn.<\/td><\/tr><\/table><div class='warn'>Achtung: <em>chaque<\/em> ist Begleiter, <em>chacun<\/em> Pronomen: <em>Chaque élève a un livre.<\/em> – <em>Chacun a un livre.<\/em><\/div>"}, {"h": "tout, toute, tous, toutes", "html": "<table><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>maskulin<\/td><td><em>tout<\/em><\/td><td><em>tous<\/em><\/td><\/tr><tr><td>feminin<\/td><td><em>toute<\/em><\/td><td><em>toutes<\/em><\/td><\/tr><\/table><ul><li>Begleiter mit Artikel: <em>tout le monde<\/em> (alle), <em>toute la journée<\/em> (den ganzen Tag), <em>tous les jours<\/em> (jeden Tag), <em>toutes les semaines<\/em><\/li><li>Pronomen: <em>tout<\/em> = alles: <em>Tout va bien.<\/em>; <em>tous<\/em> = alle: <em>Ils sont tous là.<\/em><\/li><li>Adverb (= ganz): <em>tout seul, tout près<\/em><\/li><\/ul><div class='warn'>Achtung: Das Pronomen <em>tous<\/em> spricht man mit hörbarem s [tus]: <em>Ils sont tous venus.<\/em> Der Begleiter <em>tous les jours<\/em> [tu] nicht.<\/div><div class='tip'>Merke: <em>tout le monde<\/em> (alle Leute) steht mit Verb im Singular: <em>Tout le monde est là.<\/em> „Die ganze Welt“ = <em>le monde entier<\/em>.<\/div><p>Als Adverb ist <em>tout<\/em> unveränderlich, außer vor femininen Adjektiven mit Konsonant: <em>Il est tout content. Elle est tout heureuse.<\/em> – aber <em>Elle est toute contente.<\/em><\/p>"}, {"h": "autre, même und on", "html": "<ul><li><em>autre<\/em> – andere: <em>un autre café<\/em> (noch einen Kaffee), <em>l'autre jour<\/em> (neulich), <em>les autres<\/em> (die anderen), <em>d'autres amis<\/em> (andere Freunde)<\/li><li><em>l'un … l'autre<\/em>: <em>Ils s'aident l'un l'autre.<\/em> (gegenseitig)<\/li><li><em>même<\/em> – derselbe / selbst / sogar: <em>la même chose<\/em>, <em>moi-même<\/em>, <em>Même Paul est venu.<\/em><\/li><\/ul><p><b>on<\/b> ist ein sehr häufiges Indefinitpronomen mit Verb in der 3. Person Singular:<\/p><ul><li>„man“: <em>En France, on mange tard.<\/em><\/li><li>umgangssprachlich „wir“: <em>On va au cinéma ?<\/em> – Gehen wir ins Kino?<\/li><\/ul><div class='tip'>Merke: Mit <em>on<\/em> = „wir“ werden Adjektive und Partizipien oft im Plural angeglichen: <em>On est fatigués. On est allées au marché<\/em> (nur Frauen).<\/div>"}], "exercises": [{"type": "gap", "title": "Verneine die Sätze", "task": "Setze die fehlenden Verneinungswörter ein.", "items": [{"q": "Je ___ comprends pas.", "a": ["ne"], "de": "Ich verstehe nicht."}, {"q": "Il n'a ___ fini. (noch nicht)", "a": ["pas encore"], "de": "Er ist noch nicht fertig."}, {"q": "Elle ne fume ___ . (nicht mehr)", "a": ["plus"], "de": "Sie raucht nicht mehr."}, {"q": "Je ne vois ___ . (nichts)", "a": ["rien"], "de": "Ich sehe nichts."}, {"q": "Nous ne connaissons ___ ici. (niemand)", "a": ["personne"], "de": "Wir kennen hier niemanden."}, {"q": "Il ne va ___ au cinéma. (nie)", "a": ["jamais"], "de": "Er geht nie ins Kino."}, {"q": "Je n'ai ___ idée. (keine einzige)", "a": ["aucune"], "de": "Ich habe keine Ahnung."}, {"q": "Je ne trouve mes clés ___ . (nirgends)", "a": ["nulle part"], "de": "Ich finde meine Schlüssel nirgends."}, {"q": "Il n'a ___ vingt ans. (nur)", "a": ["que"], "de": "Er ist erst zwanzig."}]}, {"type": "choice", "title": "Stellung der Verneinung", "task": "Welcher Satz ist richtig?", "items": [{"q": "Ich habe nicht verstanden.", "options": ["Je n'ai compris pas.", "Je n'ai pas compris.", "Je ne pas ai compris."], "a": 1, "why": "pas steht zwischen Hilfsverb und Partizip."}, {"q": "Ich habe niemanden gesehen.", "options": ["Je n'ai personne vu.", "Je n'ai vu personne."], "a": 1, "why": "personne steht nach dem Partizip."}, {"q": "Ich habe nichts gegessen.", "options": ["Je n'ai rien mangé.", "Je n'ai mangé rien."], "a": 0, "why": "rien steht vor dem Partizip."}, {"q": "Ich sehe ihn nicht.", "options": ["Je le ne vois pas.", "Je ne le vois pas."], "a": 1, "why": "ne steht vor dem Objektpronomen."}, {"q": "Er hat mir gesagt, nicht zu rauchen.", "options": ["Il m'a dit de ne fumer pas.", "Il m'a dit de ne pas fumer."], "a": 1, "why": "Verneinter Infinitiv: ne pas vor dem Infinitiv."}, {"q": "Niemand ist gekommen.", "options": ["Personne n'est venu.", "Personne n'est pas venu."], "a": 0, "why": "personne als Subjekt + ne, ohne pas."}, {"q": "Nichts ist unmöglich.", "options": ["Rien n'est impossible.", "Rien est impossible."], "a": 0, "why": "ne ist schriftlich Pflicht."}]}, {"type": "choice", "title": "oui, si, aussi, non plus", "task": "Wähle die passende Antwort.", "items": [{"q": "Tu n'as pas faim ? – ___, j'ai très faim !", "options": ["Oui", "Si", "Non"], "a": 1, "why": "Widerspruch zu verneinter Frage → si."}, {"q": "J'adore Paris. – Moi ___.", "options": ["aussi", "non plus"], "a": 0, "why": "Zustimmung zu bejahtem Satz → aussi."}, {"q": "Je ne parle pas chinois. – Moi ___.", "options": ["aussi", "non plus"], "a": 1, "why": "Zustimmung zu verneintem Satz → non plus."}, {"q": "Tu as fini ? – Non, pas ___.", "options": ["encore", "plus"], "a": 0, "why": "pas encore = noch nicht."}, {"q": "Tu aimes le foot ? – Pas ___ !", "options": ["du tout", "rien"], "a": 0, "why": "pas du tout = überhaupt nicht."}, {"q": "Je ne bois jamais de café. – Moi ___, j'en bois tous les matins.", "options": ["si", "oui", "aussi"], "a": 0, "why": "Widerspruch zu verneintem Satz: moi si."}]}, {"type": "gap", "title": "Indefinita", "task": "Setze das passende Wort ein.", "items": [{"q": "Il y a ___ à la porte. (jemand)", "a": ["quelqu'un"], "de": "Da ist jemand an der Tür."}, {"q": "Tu veux boire ___ ? (etwas)", "a": ["quelque chose"], "de": "Willst du etwas trinken?"}, {"q": "J'ai vu ce film ___ fois. (mehrere)", "a": ["plusieurs"], "de": "Ich habe den Film mehrmals gesehen."}, {"q": "___ semaine, je fais du sport. (jede)", "a": ["Chaque"], "de": "Jede Woche mache ich Sport."}, {"q": "___ a ses problèmes. (jeder)", "a": ["Chacun"], "de": "Jeder hat seine Probleme."}, {"q": "Il a lu ___ les livres de la bibliothèque. (alle)", "a": ["tous"], "de": "Er hat alle Bücher der Bibliothek gelesen."}, {"q": "J'ai travaillé ___ la journée. (den ganzen)", "a": ["toute"], "de": "Ich habe den ganzen Tag gearbeitet."}, {"q": "C'est quelque chose ___ intéressant.", "a": ["d'"], "de": "Das ist etwas Interessantes."}, {"q": "Il dit n'importe ___ . (was)", "a": ["quoi"], "de": "Er redet irgendwas daher."}]}, {"type": "choice", "title": "tout, tous, toute, toutes", "task": "Wähle die richtige Form.", "items": [{"q": "___ le monde est content.", "options": ["Tout", "Tous"], "a": 0, "why": "le monde ist m. Sg. → tout."}, {"q": "Je me lève à 7 h ___ les jours.", "options": ["tout", "tous"], "a": 1, "why": "les jours → m. Pl. → tous."}, {"q": "Elle a mangé ___ la tarte.", "options": ["tout", "toute"], "a": 1, "why": "la tarte → f. Sg. → toute."}, {"q": "___ les filles sont parties.", "options": ["Tous", "Toutes"], "a": 1, "why": "f. Pl. → toutes."}, {"q": "Il habite ___ près d'ici.", "options": ["tout", "tous"], "a": 0, "why": "Adverb (ganz) → unveränderlich."}, {"q": "Mes amis ? Ils sont ___ venus.", "options": ["tout", "tous"], "a": 1, "why": "Pronomen m. Pl. → tous (gesprochen [tus])."}]}], "cards": [{"f": "Grundform der Verneinung", "b": "ne … pas um das konjugierte Verb: Je ne parle pas."}, {"f": "Verneinung im passé composé", "b": "um das Hilfsverb: Je n'ai pas compris."}, {"f": "verneinter Infinitiv", "b": "ne pas zusammen davor: de ne pas fumer"}, {"f": "nie / nicht mehr / nichts / niemand", "b": "ne … jamais / ne … plus / ne … rien / ne … personne"}, {"f": "noch nicht", "b": "ne … pas encore"}, {"f": "kein einziger", "b": "ne … aucun(e): Je n'ai aucune idée."}, {"f": "nirgends", "b": "ne … nulle part"}, {"f": "weder … noch", "b": "ne … ni … ni"}, {"f": "nur", "b": "ne … que: Je n'ai que dix euros. (Artikel bleibt)"}, {"f": "Je n'ai vu personne / Je n'ai rien vu", "b": "personne nach dem Partizip, rien davor"}, {"f": "Niemand ist gekommen.", "b": "Personne n'est venu. (ohne pas)"}, {"f": "„doch“ auf verneinte Frage", "b": "si: Tu ne viens pas ? – Si !"}, {"f": "ich auch / ich auch nicht", "b": "moi aussi / moi non plus"}, {"f": "überhaupt nicht", "b": "pas du tout"}, {"f": "etwas Interessantes / jemand Nettes", "b": "quelque chose d'intéressant / quelqu'un de gentil"}, {"f": "nichts Neues", "b": "rien de nouveau"}, {"f": "chaque / chacun", "b": "jeder (Begleiter) / jeder (Pronomen)"}, {"f": "mehrere / einige", "b": "plusieurs / quelques"}, {"f": "alle (Leute)", "b": "tout le monde + Verb im Singular"}, {"f": "jeden Tag / den ganzen Tag", "b": "tous les jours / toute la journée"}, {"f": "Ils sont tous là – Aussprache?", "b": "tous als Pronomen mit hörbarem s [tus]"}, {"f": "n'importe quoi", "b": "irgendwas / Unsinn"}, {"f": "on", "b": "man; umgangssprachlich: wir (Verb 3. Sg.)"}, {"f": "gesprochenes Französisch und ne", "b": "ne fällt meist weg: J'sais pas."}]}, {"nr": 7, "id": "k07", "title": "Die Relativpronomen", "teil": "Das Substantiv und seine Begleiter", "intro": "Relativsätze beschreiben ein Substantiv näher. Im Französischen hängt die Wahl des Pronomens nicht vom Genus ab wie im Deutschen (der, die, das), sondern von seiner Funktion im Relativsatz: qui für das Subjekt, que für das Objekt, dont für de-Ergänzungen, où für Ort und Zeit.", "sections": [{"h": "qui und que", "html": "<table><tr><th>Pronomen<\/th><th>Funktion<\/th><th>Beispiel<\/th><\/tr><tr><td><em>qui<\/em><\/td><td>Subjekt (wer/was tut etwas?)<\/td><td><em>L'homme qui parle est mon père.<\/em> – Der Mann, der spricht …<\/td><\/tr><tr><td><em>que / qu'<\/em><\/td><td>direktes Objekt (wen/was?)<\/td><td><em>Le livre que je lis est génial.<\/em> – Das Buch, das ich lese …<\/td><\/tr><\/table><p>Beide stehen für Personen und Sachen, Singular und Plural.<\/p><div class='tip'>Merke: Folgt direkt ein Verb, ist es meist <em>qui<\/em>; folgt ein Subjekt (Pronomen oder Substantiv), ist es <em>que<\/em>: <em>la femme qui chante<\/em> – <em>la femme que tu connais<\/em>.<\/div><div class='warn'>Achtung: <em>qui<\/em> wird nie apostrophiert: <em>l'ami qui arrive<\/em>. <em>que<\/em> dagegen schon: <em>l'ami qu'elle attend<\/em>.<\/div><p>Steht nach <em>que<\/em> ein Verb im passé composé mit <em>avoir<\/em>, wird das Partizip an das vorausgehende Objekt angeglichen: <em>la lettre que j'ai écrite<\/em> (siehe Kapitel 11).<\/p>"}, {"h": "où – Ort und Zeit", "html": "<p><em>où<\/em> steht für Orte und – anders als im Deutschen – auch für <b>Zeitpunkte<\/b>:<\/p><ul><li><em>La ville où j'habite est petite.<\/em> – Die Stadt, in der ich wohne …<\/li><li><em>Le restaurant où nous avons mangé.<\/em> – Das Restaurant, in dem wir gegessen haben.<\/li><li><em>Le jour où je t'ai rencontré …<\/em> – Der Tag, an dem ich dich getroffen habe …<\/li><li><em>Au moment où il est arrivé …<\/em> – In dem Moment, als er ankam …<\/li><\/ul><p>Mit Präposition: <em>d'où<\/em> (woher), <em>par où<\/em> (wo entlang): <em>le pays d'où il vient<\/em>.<\/p><div class='warn'>Achtung: „der Tag, an dem“ = <em>le jour où<\/em> – nicht <em>le jour quand<\/em>!<\/div>"}, {"h": "dont", "html": "<p><em>dont<\/em> ersetzt eine Ergänzung mit <b>de<\/b>. Es entspricht deutschem „dessen, deren, von dem, über den …“:<\/p><table><tr><th>Grundstruktur<\/th><th>Relativsatz<\/th><\/tr><tr><td><em>parler de<\/em><\/td><td><em>le film dont je t'ai parlé<\/em> – der Film, von dem ich dir erzählt habe<\/td><\/tr><tr><td><em>avoir besoin de<\/em><\/td><td><em>l'outil dont j'ai besoin<\/em> – das Werkzeug, das ich brauche<\/td><\/tr><tr><td><em>avoir peur de<\/em><\/td><td><em>le chien dont il a peur<\/em> – der Hund, vor dem er Angst hat<\/td><\/tr><tr><td><em>être fier de<\/em><\/td><td><em>le travail dont elle est fière<\/em><\/td><\/tr><tr><td>Besitz (<em>de<\/em>)<\/td><td><em>l'ami dont le frère est médecin<\/em> – der Freund, dessen Bruder Arzt ist<\/td><\/tr><tr><td>Teil einer Menge<\/td><td><em>trois enfants, dont deux filles<\/em> – darunter zwei Mädchen<\/td><\/tr><\/table><div class='warn'>Achtung: Bei <em>dont<\/em> im Besitzsinn bleibt die normale Wortstellung: <em>la femme dont je connais le mari<\/em> (die Frau, deren Mann ich kenne) – nicht wie im Deutschen umgestellt.<\/div><div class='tip'>Merke: Viele Verben, die im Deutschen kein „von“ haben, haben im Französischen <em>de<\/em>: <em>avoir besoin de, se souvenir de, s'occuper de, avoir envie de<\/em> → <em>dont<\/em>.<\/div>"}, {"h": "Präposition + lequel / qui", "html": "<p>Nach anderen Präpositionen (<em>avec, pour, sans, sur, chez, dans<\/em> …) steht<\/p><ul><li>bei <b>Personen<\/b> meist <em>qui<\/em>: <em>la personne avec qui je travaille<\/em><\/li><li>bei <b>Sachen<\/b> immer <em>lequel<\/em>: <em>le stylo avec lequel j'écris<\/em><\/li><\/ul><table><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>maskulin<\/td><td><em>lequel<\/em><\/td><td><em>lesquels<\/em><\/td><\/tr><tr><td>feminin<\/td><td><em>laquelle<\/em><\/td><td><em>lesquelles<\/em><\/td><\/tr><\/table><ul><li><em>la raison pour laquelle il est parti<\/em> – der Grund, warum er gegangen ist<\/li><li><em>la table sur laquelle il y a un vase<\/em><\/li><li><em>les amis chez qui je dors<\/em><\/li><\/ul><div class='warn'>Achtung: Mit <em>à<\/em> und <em>de<\/em> verschmilzt <em>lequel<\/em>: <em>auquel, à laquelle, auxquels, auxquelles<\/em> – <em>duquel, de laquelle, desquels, desquelles<\/em>. <em>le projet auquel je pense<\/em> (penser à), <em>le parc près duquel j'habite<\/em> (près de).<\/div><div class='tip'>Merke: Bei zusammengesetzten Präpositionen mit <em>de<\/em> (<em>près de, à côté de, au milieu de<\/em>) steht <em>duquel<\/em>, nicht <em>dont<\/em>.<\/div>"}, {"h": "ce qui, ce que, ce dont", "html": "<p>Bezieht sich der Relativsatz auf keinen bestimmten Begriff, sondern auf „das, was“, steht <em>ce<\/em> davor:<\/p><table><tr><th>Form<\/th><th>Funktion<\/th><th>Beispiel<\/th><\/tr><tr><td><em>ce qui<\/em><\/td><td>Subjekt<\/td><td><em>Ce qui m'intéresse, c'est l'histoire.<\/em> – Was mich interessiert …<\/td><\/tr><tr><td><em>ce que<\/em><\/td><td>Objekt<\/td><td><em>Fais ce que tu veux.<\/em> – Mach, was du willst.<\/td><\/tr><tr><td><em>ce dont<\/em><\/td><td>de-Ergänzung<\/td><td><em>C'est ce dont j'ai besoin.<\/em> – Das ist das, was ich brauche.<\/td><\/tr><tr><td><em>ce à quoi<\/em><\/td><td>à-Ergänzung<\/td><td><em>C'est ce à quoi je pense.<\/em> – Daran denke ich.<\/td><\/tr><\/table><p>Auch in indirekten Fragen: <em>Je ne sais pas ce qu'il veut.<\/em> – Ich weiß nicht, was er will.<\/p><div class='warn'>Achtung: Deutsches „was“ als Relativpronomen ist fast nie <em>que<\/em> allein: <em>Tout ce que je sais …<\/em> (Alles, was ich weiß …).<\/div>"}, {"h": "Satzbezogenes Relativpronomen und Hervorhebung", "html": "<p>Bezieht sich der Relativsatz auf einen ganzen vorhergehenden Satz, steht <em>ce qui / ce que<\/em> mit Komma:<\/p><ul><li><em>Il est arrivé en retard, ce qui m'a énervé.<\/em> – …, was mich geärgert hat.<\/li><li><em>Elle a démissionné, ce que personne n'a compris.<\/em><\/li><\/ul><p>Zur <b>Hervorhebung<\/b> eines Satzteils (<em>mise en relief<\/em>) dienen <em>c'est … qui<\/em> und <em>c'est … que<\/em>:<\/p><ul><li><em>C'est Marie qui a gagné.<\/em> – Marie hat gewonnen (nicht jemand anderes).<\/li><li><em>C'est demain que je pars.<\/em> – Morgen fahre ich.<\/li><li><em>C'est moi qui ai raison.<\/em> – Ich habe recht. (Verb richtet sich nach <em>moi<\/em>!)<\/li><\/ul><div class='warn'>Achtung: Nach <em>c'est moi qui, c'est toi qui …<\/em> wird das Verb mit der passenden Person konjugiert: <em>C'est nous qui avons payé. C'est vous qui êtes en retard.<\/em><\/div>"}], "exercises": [{"type": "choice", "title": "qui oder que?", "task": "Wähle das richtige Relativpronomen.", "items": [{"q": "La femme ___ chante est ma voisine.", "options": ["qui", "que"], "a": 0, "why": "Subjekt des Relativsatzes → qui."}, {"q": "Le film ___ nous avons vu était drôle.", "options": ["qui", "que"], "a": 1, "why": "Objekt (nous haben ihn gesehen) → que."}, {"q": "C'est un livre ___ m'a beaucoup plu.", "options": ["qui", "que"], "a": 0, "why": "Subjekt → qui."}, {"q": "Les amis ___ j'ai invités arrivent.", "options": ["qui", "que"], "a": 1, "why": "Objekt → que."}, {"q": "Le train ___ part à 8 heures est complet.", "options": ["qui", "que"], "a": 0, "why": "Subjekt → qui."}, {"q": "La robe ___ elle porte est jolie.", "options": ["qui", "qu'"], "a": 1, "why": "Objekt vor elle → qu'."}, {"q": "Voici l'étudiant ___ a gagné le prix.", "options": ["qui", "qu'"], "a": 0, "why": "Subjekt; qui wird nie apostrophiert."}]}, {"type": "gap", "title": "qui, que, où, dont", "task": "Setze das passende Relativpronomen ein.", "items": [{"q": "C'est la maison ___ je suis né.", "a": ["où"], "de": "Das ist das Haus, in dem ich geboren bin."}, {"q": "Voici le livre ___ je t'ai parlé.", "a": ["dont"], "de": "Hier ist das Buch, von dem ich dir erzählt habe."}, {"q": "Je me souviens du jour ___ tu es arrivé.", "a": ["où"], "de": "Ich erinnere mich an den Tag, an dem du angekommen bist."}, {"q": "C'est l'outil ___ j'ai besoin.", "a": ["dont"], "de": "Das ist das Werkzeug, das ich brauche."}, {"q": "Le monsieur ___ habite en face est très gentil.", "a": ["qui"], "de": "Der Herr, der gegenüber wohnt, ist sehr nett."}, {"q": "La chanson ___ tu écoutes est française.", "a": ["que"], "de": "Das Lied, das du hörst, ist französisch."}, {"q": "J'ai un ami ___ le père est pilote.", "a": ["dont"], "de": "Ich habe einen Freund, dessen Vater Pilot ist."}, {"q": "La ville ___ nous allons est loin.", "a": ["où"], "de": "Die Stadt, in die wir fahren, ist weit."}, {"q": "Ils ont trois enfants, ___ deux jumeaux.", "a": ["dont"], "de": "Sie haben drei Kinder, darunter Zwillinge."}]}, {"type": "gap", "title": "lequel, auquel, duquel", "task": "Setze die passende Form von lequel ein.", "items": [{"q": "Voici le stylo avec ___ j'ai signé.", "a": ["lequel"], "de": "Hier ist der Kuli, mit dem ich unterschrieben habe."}, {"q": "C'est la raison pour ___ je suis venu.", "a": ["laquelle"], "de": "Das ist der Grund, warum ich gekommen bin."}, {"q": "Le projet ___ je pense est ambitieux. (penser à)", "a": ["auquel"], "de": "Das Projekt, an das ich denke, ist ehrgeizig."}, {"q": "Le parc près ___ j'habite est grand.", "a": ["duquel"], "de": "Der Park, in dessen Nähe ich wohne, ist groß."}, {"q": "Les questions ___ il a répondu étaient difficiles. (répondre à)", "a": ["auxquelles"], "de": "Die Fragen, die er beantwortet hat, waren schwierig."}, {"q": "La boîte dans ___ je range mes photos est pleine.", "a": ["laquelle"], "de": "Die Schachtel, in der ich meine Fotos aufbewahre, ist voll."}, {"q": "Les amis avec ___ je pars sont sympas. (Personen)", "a": ["qui", "lesquels"], "de": "Die Freunde, mit denen ich verreise, sind nett."}]}, {"type": "choice", "title": "ce qui, ce que, ce dont", "task": "Wähle die passende Form.", "items": [{"q": "Dis-moi ___ tu veux.", "options": ["ce qui", "ce que", "ce dont"], "a": 1, "why": "Objekt von vouloir → ce que."}, {"q": "___ me plaît, c'est le calme.", "options": ["Ce qui", "Ce que", "Ce dont"], "a": 0, "why": "Subjekt von plaire → ce qui."}, {"q": "C'est exactement ___ j'avais besoin.", "options": ["ce qui", "ce que", "ce dont"], "a": 2, "why": "avoir besoin de → ce dont."}, {"q": "Je ne comprends pas ___ se passe.", "options": ["ce qui", "ce que", "ce dont"], "a": 0, "why": "Subjekt von se passer → ce qui."}, {"q": "Il pleut, ___ est dommage.", "options": ["ce qui", "ce que", "qui"], "a": 0, "why": "Bezug auf den ganzen Satz, Subjekt → ce qui."}, {"q": "Raconte-moi ___ tu te souviens.", "options": ["ce qui", "ce que", "ce dont"], "a": 2, "why": "se souvenir de → ce dont."}]}, {"type": "choice", "title": "Hervorhebung", "task": "Welcher Satz ist korrekt?", "items": [{"q": "Ich bin es, der bezahlt hat.", "options": ["C'est moi qui a payé.", "C'est moi qui ai payé."], "a": 1, "why": "Verb richtet sich nach moi → ai."}, {"q": "Wir sind es, die recht haben.", "options": ["C'est nous qui avons raison.", "C'est nous qui ont raison."], "a": 0, "why": "nous → avons."}, {"q": "Morgen fahre ich (nicht heute).", "options": ["C'est demain qui je pars.", "C'est demain que je pars."], "a": 1, "why": "Hervorgehobene Zeitangabe → c'est … que."}, {"q": "Paul hat das Fenster zerbrochen.", "options": ["C'est Paul qui a cassé la fenêtre.", "C'est Paul que a cassé la fenêtre."], "a": 0, "why": "Hervorgehobenes Subjekt → c'est … qui."}, {"q": "Ihr seid zu spät.", "options": ["C'est vous qui êtes en retard.", "C'est vous qui est en retard."], "a": 0, "why": "vous → êtes."}]}], "cards": [{"f": "qui (Relativpronomen)", "b": "Subjekt: l'homme qui parle"}, {"f": "que (Relativpronomen)", "b": "direktes Objekt: le livre que je lis"}, {"f": "Faustregel qui/que", "b": "Verb folgt → qui · Subjekt folgt → que"}, {"f": "Wird qui apostrophiert?", "b": "Nie: l'ami qui arrive (aber: qu'elle)"}, {"f": "où im Relativsatz", "b": "Ort und Zeit: la ville où …, le jour où …"}, {"f": "der Tag, an dem …", "b": "le jour où … (nicht quand!)"}, {"f": "dont", "b": "ersetzt eine Ergänzung mit de: le film dont je parle"}, {"f": "das, was ich brauche", "b": "ce dont j'ai besoin"}, {"f": "der Freund, dessen Vater Arzt ist", "b": "l'ami dont le père est médecin"}, {"f": "darunter (bei Aufzählungen)", "b": "dont: trois enfants, dont deux filles"}, {"f": "Präposition + Sache", "b": "lequel, laquelle, lesquels, lesquelles: avec lequel"}, {"f": "Präposition + Person", "b": "meist qui: avec qui, pour qui, chez qui"}, {"f": "à + lequel", "b": "auquel, à laquelle, auxquels, auxquelles"}, {"f": "de + lequel (nach près de usw.)", "b": "duquel, de laquelle, desquels, desquelles"}, {"f": "der Grund, warum", "b": "la raison pour laquelle"}, {"f": "was (Subjekt / Objekt)", "b": "ce qui / ce que: Ce qui compte … Fais ce que tu veux."}, {"f": "alles, was ich weiß", "b": "tout ce que je sais"}, {"f": "…, was mich ärgert (Bezug auf Satz)", "b": ", ce qui m'énerve"}, {"f": "Hervorhebung Subjekt / anderer Satzteil", "b": "c'est … qui / c'est … que"}, {"f": "Ich bin es, der recht hat.", "b": "C'est moi qui ai raison. (Verb in 1. Person)"}, {"f": "Partizipangleichung nach que", "b": "la lettre que j'ai écrite"}, {"f": "woher (relativ)", "b": "d'où: le pays d'où il vient"}]}, {"nr": 8, "id": "k08", "title": "Fragen und Ausrufe", "teil": "Das Substantiv und seine Begleiter", "intro": "Französisch kennt drei Arten, eine Frage zu stellen: nur mit der Stimme, mit est-ce que oder mit Umstellung (Inversion). Sie unterscheiden sich vor allem im Sprachregister. Dazu kommen die Fragewörter, das veränderliche quel und die Ausrufe.", "sections": [{"h": "Drei Fragetypen", "html": "<table><tr><th>Typ<\/th><th>Beispiel<\/th><th>Register<\/th><\/tr><tr><td>Intonation<\/td><td><em>Tu viens ?<\/em><\/td><td>gesprochen, familiär<\/td><\/tr><tr><td><em>est-ce que<\/em><\/td><td><em>Est-ce que tu viens ?<\/em><\/td><td>neutral, immer richtig<\/td><\/tr><tr><td>Inversion<\/td><td><em>Viens-tu ?<\/em><\/td><td>gehoben, schriftlich<\/td><\/tr><\/table><p><b>Intonation<\/b>: Aussagesatz mit steigender Stimme. Die häufigste Form im Alltag.<\/p><p><b>est-ce que<\/b> (wörtlich: „ist es, dass“) wird vor den unveränderten Aussagesatz gesetzt, vor Vokal <em>est-ce qu'<\/em>: <em>Est-ce qu'il pleut ?<\/em><\/p><div class='tip'>Merke: Wenn du unsicher bist, nimm <em>est-ce que<\/em> – das passt in jeder Situation.<\/div>"}, {"h": "Die Inversion", "html": "<p>Bei der Inversion tauschen Subjektpronomen und Verb die Plätze und werden mit Bindestrich verbunden:<\/p><ul><li><em>Parlez-vous français ?<\/em> – Sprechen Sie Französisch?<\/li><li><em>Avez-vous des enfants ?<\/em><\/li><\/ul><p>Endet das Verb in der 3. Person auf Vokal, wird ein <b>-t-<\/b> eingeschoben:<\/p><ul><li><em>Parle-t-il anglais ? A-t-elle fini ? Va-t-on au cinéma ?<\/em><\/li><\/ul><p>Ist das Subjekt ein <b>Substantiv<\/b>, bleibt es vorne und wird durch ein Pronomen wiederholt (<em>inversion complexe<\/em>):<\/p><ul><li><em>Marie est-elle là ?<\/em> – Ist Marie da?<\/li><li><em>Vos parents habitent-ils à Lyon ?<\/em><\/li><\/ul><p>In zusammengesetzten Zeiten wird das Hilfsverb umgestellt: <em>As-tu compris ? Est-il parti ?<\/em><\/p><div class='warn'>Achtung: Bei <em>je<\/em> ist die Inversion kaum noch üblich (Ausnahmen: <em>Puis-je … ? Suis-je … ?<\/em>). Sag lieber: <em>Est-ce que je peux … ?<\/em><\/div>"}, {"h": "Die Fragewörter", "html": "<table><tr><th>Fragewort<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>qui<\/em><\/td><td>wer, wen<\/td><td><em>Qui est-ce ?<\/em><\/td><\/tr><tr><td><em>que / quoi<\/em><\/td><td>was<\/td><td><em>Que fais-tu ? Tu fais quoi ?<\/em><\/td><\/tr><tr><td><em>où<\/em><\/td><td>wo, wohin<\/td><td><em>Où vas-tu ?<\/em><\/td><\/tr><tr><td><em>d'où<\/em><\/td><td>woher<\/td><td><em>D'où venez-vous ?<\/em><\/td><\/tr><tr><td><em>quand<\/em><\/td><td>wann<\/td><td><em>Quand est-ce qu'il arrive ?<\/em><\/td><\/tr><tr><td><em>comment<\/em><\/td><td>wie<\/td><td><em>Comment tu t'appelles ?<\/em><\/td><\/tr><tr><td><em>pourquoi<\/em><\/td><td>warum<\/td><td><em>Pourquoi tu ris ? – Parce que …<\/em><\/td><\/tr><tr><td><em>combien (de)<\/em><\/td><td>wie viel(e)<\/td><td><em>Combien ça coûte ? Combien d'enfants ?<\/em><\/td><\/tr><tr><td><em>quel(le)(s)<\/em><\/td><td>welche(r/s)<\/td><td><em>Quelle heure est-il ?<\/em><\/td><\/tr><\/table><p>Die drei Muster am Beispiel „Wo wohnst du?“:<\/p><ul><li><em>Tu habites où ?<\/em> (familiär, Fragewort am Ende)<\/li><li><em>Où est-ce que tu habites ?<\/em> (neutral)<\/li><li><em>Où habites-tu ?<\/em> (gehoben)<\/li><\/ul><div class='tip'>Merke: <em>pourquoi<\/em> (warum) – <em>parce que<\/em> (weil); <em>pour quoi<\/em> getrennt = „wofür“.<\/div>"}, {"h": "que, quoi und qu'est-ce que", "html": "<p>„Was“ hat mehrere Formen:<\/p><table><tr><th>Form<\/th><th>Gebrauch<\/th><th>Beispiel<\/th><\/tr><tr><td><em>qu'est-ce que<\/em><\/td><td>Objekt, neutral<\/td><td><em>Qu'est-ce que tu fais ?<\/em><\/td><\/tr><tr><td><em>que<\/em> + Inversion<\/td><td>Objekt, gehoben<\/td><td><em>Que fais-tu ?<\/em><\/td><\/tr><tr><td><em>quoi<\/em><\/td><td>am Satzende (familiär) und nach Präposition<\/td><td><em>Tu fais quoi ? De quoi tu parles ? À quoi tu penses ?<\/em><\/td><\/tr><tr><td><em>qu'est-ce qui<\/em><\/td><td>Subjekt („was passiert?“)<\/td><td><em>Qu'est-ce qui se passe ?<\/em><\/td><\/tr><\/table><p>Bei <b>Personen<\/b>:<\/p><ul><li>Subjekt: <em>Qui parle ? / Qui est-ce qui parle ?<\/em> – Wer spricht?<\/li><li>Objekt: <em>Qui cherches-tu ? / Qui est-ce que tu cherches ? / Tu cherches qui ?<\/em> – Wen suchst du?<\/li><li>mit Präposition: <em>Avec qui ? À qui ? Chez qui ?<\/em><\/li><\/ul><div class='warn'>Achtung: <em>qu'est-ce qui<\/em> (Subjekt) vs. <em>qu'est-ce que<\/em> (Objekt): <em>Qu'est-ce qui te plaît ?<\/em> (Was gefällt dir?) – <em>Qu'est-ce que tu aimes ?<\/em> (Was magst du?)<\/div>"}, {"h": "quel und lequel", "html": "<p><em>quel<\/em> (welcher) richtet sich in Genus und Zahl nach dem Substantiv – alle Formen klingen gleich [käl]:<\/p><table><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>maskulin<\/td><td><em>quel<\/em><\/td><td><em>quels<\/em><\/td><\/tr><tr><td>feminin<\/td><td><em>quelle<\/em><\/td><td><em>quelles<\/em><\/td><\/tr><\/table><ul><li><em>Quel temps fait-il ?<\/em> – Wie ist das Wetter?<\/li><li><em>Quelle est ton adresse ?<\/em> – Wie ist deine Adresse? (mit <em>être<\/em> getrennt)<\/li><li><em>Quels films aimes-tu ?<\/em><\/li><li><em>À quelle heure ? De quel côté ?<\/em><\/li><\/ul><div class='warn'>Achtung: „Wie ist dein Name / deine Telefonnummer?“ = <em>Quel est ton nom ? Quel est ton numéro ?<\/em> – nicht <em>comment<\/em>.<\/div><p><em>lequel<\/em> (welcher davon) ist das Pronomen dazu: <em>Il y a deux gâteaux. Lequel veux-tu ?<\/em> – <em>Laquelle de ces robes préfères-tu ?<\/em><\/p>"}, {"h": "Indirekte Fragen", "html": "<p>In indirekten Fragen gibt es <b>keine Inversion<\/b> und kein <em>est-ce que<\/em>:<\/p><table><tr><th>direkte Frage<\/th><th>indirekte Frage<\/th><\/tr><tr><td><em>Tu viens ?<\/em><\/td><td><em>Je me demande <b>si<\/b> tu viens.<\/em><\/td><\/tr><tr><td><em>Où habite-t-il ?<\/em><\/td><td><em>Je ne sais pas <b>où<\/b> il habite.<\/em><\/td><\/tr><tr><td><em>Qu'est-ce que tu veux ?<\/em><\/td><td><em>Dis-moi <b>ce que<\/b> tu veux.<\/em><\/td><\/tr><tr><td><em>Qu'est-ce qui se passe ?<\/em><\/td><td><em>Explique-moi <b>ce qui<\/b> se passe.<\/em><\/td><\/tr><\/table><div class='warn'>Achtung: Aus <em>qu'est-ce que / que<\/em> wird <em>ce que<\/em>, aus <em>qu'est-ce qui<\/em> wird <em>ce qui<\/em>. <em>si<\/em> („ob“) wird vor <em>il/ils<\/em> zu <em>s'<\/em>: <em>Je ne sais pas s'il vient.<\/em><\/div>"}, {"h": "Ausrufe", "html": "<ul><li><em>Quel / Quelle<\/em> + Substantiv: <em>Quelle belle journée !<\/em> (Was für ein schöner Tag!) <em>Quel dommage !<\/em> (Wie schade!)<\/li><li><em>Que / Comme<\/em> + Satz: <em>Que c'est beau ! Comme il est grand !<\/em> (Wie groß er ist!)<\/li><li><em>Qu'est-ce que<\/em> + Satz (familiär): <em>Qu'est-ce qu'il fait chaud !<\/em> (Ist das heiß!)<\/li><li><em>Ce que<\/em> (familiär): <em>Ce qu'elle est drôle !<\/em><\/li><li><em>Tellement / si<\/em>: <em>C'est tellement beau !<\/em><\/li><\/ul><div class='tip'>Merke: Nach <em>comme<\/em> und <em>que<\/em> im Ausruf bleibt die Wortstellung des Aussagesatzes: <em>Comme tu as changé !<\/em> – Wie du dich verändert hast!<\/div>"}], "exercises": [{"type": "choice", "title": "Fragetypen erkennen", "task": "Welche Frage ist korrekt gebildet?", "items": [{"q": "Sprichst du Englisch? (gehoben)", "options": ["Parles-tu anglais ?", "Parle-tu anglais ?", "Tu parles-tu anglais ?"], "a": 0, "why": "Inversion: Verb-Pronomen."}, {"q": "Spricht er Englisch? (gehoben)", "options": ["Parle-il anglais ?", "Parle-t-il anglais ?"], "a": 1, "why": "Verb endet auf Vokal → -t-."}, {"q": "Ist Marie da? (gehoben)", "options": ["Est Marie là ?", "Marie est-elle là ?"], "a": 1, "why": "Substantiv-Subjekt bleibt vorne + Pronomen."}, {"q": "Kommt er? (neutral)", "options": ["Est-ce qu'il vient ?", "Est-ce qu'il vient-il ?"], "a": 0, "why": "est-ce que + Aussagesatz, keine Inversion."}, {"q": "Hast du verstanden? (gehoben)", "options": ["As-tu compris ?", "Compris-tu ?"], "a": 0, "why": "Inversion mit dem Hilfsverb."}, {"q": "Hat sie angerufen? (gehoben)", "options": ["A-elle téléphoné ?", "A-t-elle téléphoné ?"], "a": 1, "why": "a endet auf Vokal → -t-."}]}, {"type": "gap", "title": "Fragewörter", "task": "Setze das passende Fragewort ein.", "items": [{"q": "___ vas-tu ? – À la gare.", "a": ["Où"], "de": "Wohin gehst du? – Zum Bahnhof."}, {"q": "___ coûte ce pull ? – 40 euros.", "a": ["Combien"], "de": "Wie viel kostet der Pullover?"}, {"q": "___ tu ne viens pas ? – Parce que je suis malade.", "a": ["Pourquoi"], "de": "Warum kommst du nicht?"}, {"q": "___ est-ce qu'il arrive ? – Demain.", "a": ["Quand"], "de": "Wann kommt er an? – Morgen."}, {"q": "___ allez-vous ? – Très bien, merci.", "a": ["Comment"], "de": "Wie geht es Ihnen?"}, {"q": "___ venez-vous ? – De Hambourg.", "a": ["D'où"], "de": "Woher kommen Sie? – Aus Hamburg."}, {"q": "___ est-ce ? – C'est mon cousin.", "a": ["Qui"], "de": "Wer ist das? – Das ist mein Cousin."}, {"q": "Avec ___ tu pars en vacances ?", "a": ["qui"], "de": "Mit wem fährst du in Urlaub?"}, {"q": "De ___ tu parles ?", "a": ["quoi"], "de": "Wovon sprichst du?"}]}, {"type": "choice", "title": "qu'est-ce que oder qu'est-ce qui?", "task": "Wähle die richtige Form.", "items": [{"q": "___ tu fais ce soir ?", "options": ["Qu'est-ce que", "Qu'est-ce qui"], "a": 0, "why": "Objekt (tu machst was?) → qu'est-ce que."}, {"q": "___ se passe ?", "options": ["Qu'est-ce que", "Qu'est-ce qui"], "a": 1, "why": "Subjekt → qu'est-ce qui."}, {"q": "___ t'intéresse ?", "options": ["Qu'est-ce que", "Qu'est-ce qui"], "a": 1, "why": "Subjekt von intéresser → qu'est-ce qui."}, {"q": "___ vous voulez boire ?", "options": ["Qu'est-ce que", "Qu'est-ce qui"], "a": 0, "why": "Objekt von vouloir → qu'est-ce que."}, {"q": "___ cherches-tu ? (Person, gehoben)", "options": ["Qui", "Que"], "a": 0, "why": "Person → qui."}, {"q": "___ fais-tu ? (gehoben)", "options": ["Que", "Quoi"], "a": 0, "why": "Mit Inversion am Satzanfang → que."}]}, {"type": "gap", "title": "quel, quelle, quels, quelles", "task": "Setze die richtige Form von quel ein.", "items": [{"q": "___ heure est-il ?", "a": ["Quelle"], "de": "Wie spät ist es?"}, {"q": "___ est ton nom ?", "a": ["Quel"], "de": "Wie ist dein Name?"}, {"q": "___ langues parles-tu ?", "a": ["Quelles"], "de": "Welche Sprachen sprichst du?"}, {"q": "___ temps fait-il ?", "a": ["Quel"], "de": "Wie ist das Wetter?"}, {"q": "___ sont tes films préférés ?", "a": ["Quels"], "de": "Welche sind deine Lieblingsfilme?"}, {"q": "___ belle surprise !", "a": ["Quelle"], "de": "Was für eine schöne Überraschung!"}, {"q": "Voici deux pulls. ___ préfères-tu ?", "a": ["Lequel"], "de": "Hier sind zwei Pullover. Welchen magst du lieber?"}]}, {"type": "gap", "title": "Indirekte Fragen", "task": "Ergänze die indirekte Frage.", "items": [{"q": "Tu viens ? → Je voudrais savoir ___ tu viens.", "a": ["si"], "de": "Ich möchte wissen, ob du kommst."}, {"q": "Qu'est-ce que tu veux ? → Dis-moi ___ tu veux.", "a": ["ce que"], "de": "Sag mir, was du willst."}, {"q": "Où habite-t-elle ? → Je ne sais pas ___ elle habite.", "a": ["où"], "de": "Ich weiß nicht, wo sie wohnt."}, {"q": "Qu'est-ce qui ne va pas ? → Explique-moi ___ ne va pas.", "a": ["ce qui"], "de": "Erklär mir, was nicht stimmt."}, {"q": "Il vient ? → Je me demande ___ vient.", "a": ["s'il"], "de": "Ich frage mich, ob er kommt."}, {"q": "Quand part le train ? → Savez-vous ___ part le train ?", "a": ["quand"], "de": "Wissen Sie, wann der Zug abfährt?"}]}], "cards": [{"f": "Drei Fragetypen", "b": "Intonation (Tu viens ?) · est-ce que (Est-ce que tu viens ?) · Inversion (Viens-tu ?)"}, {"f": "Welcher Fragetyp passt immer?", "b": "est-ce que"}, {"f": "Inversion mit -t-", "b": "wenn das Verb auf Vokal endet: Parle-t-il ? A-t-elle … ?"}, {"f": "Ist Marie da? (Inversion)", "b": "Marie est-elle là ?"}, {"f": "woher", "b": "d'où"}, {"f": "warum / weil", "b": "pourquoi / parce que"}, {"f": "wie viel(e)", "b": "combien (de): Combien d'enfants ?"}, {"f": "Was machst du? (3 Varianten)", "b": "Tu fais quoi ? · Qu'est-ce que tu fais ? · Que fais-tu ?"}, {"f": "Was passiert?", "b": "Qu'est-ce qui se passe ? (Subjekt → qui)"}, {"f": "Wovon sprichst du?", "b": "De quoi tu parles ? (quoi nach Präposition)"}, {"f": "quel – Formen", "b": "quel, quelle, quels, quelles (alle [käl])"}, {"f": "Wie ist deine Adresse?", "b": "Quelle est ton adresse ?"}, {"f": "welcher davon?", "b": "lequel, laquelle, lesquels, lesquelles"}, {"f": "indirekte Frage: ob", "b": "si (s'il): Je ne sais pas s'il vient."}, {"f": "indirekte Frage: was (Objekt / Subjekt)", "b": "ce que / ce qui"}, {"f": "Inversion in indirekten Fragen?", "b": "Nein: Je ne sais pas où il habite."}, {"f": "Was für ein schöner Tag!", "b": "Quelle belle journée !"}, {"f": "Wie schade!", "b": "Quel dommage !"}, {"f": "Wie groß er ist!", "b": "Comme il est grand ! / Qu'il est grand !"}, {"f": "Inversion mit je?", "b": "kaum üblich – außer Puis-je … ? Suis-je … ?"}]}, {"nr": 9, "id": "k09", "title": "Die Personalpronomen", "teil": "Das Substantiv und seine Begleiter", "intro": "Französische Pronomen sind ein System für sich: unbetonte Formen, die direkt vor dem Verb stehen (je, le, lui, y, en), und betonte Formen, die allein stehen können (moi, toi, lui). Anders als im Spanischen und Italienischen darf das Subjektpronomen nie wegfallen.", "sections": [{"h": "Subjektpronomen", "html": "<table><tr><th>Person<\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>1.<\/td><td><em>je (j')<\/em> ich<\/td><td><em>nous<\/em> wir<\/td><\/tr><tr><td>2.<\/td><td><em>tu<\/em> du<\/td><td><em>vous<\/em> ihr / Sie<\/td><\/tr><tr><td>3.<\/td><td><em>il<\/em> er, <em>elle<\/em> sie, <em>on<\/em> man/wir<\/td><td><em>ils<\/em> sie (m. oder gemischt), <em>elles<\/em> sie (nur f.)<\/td><\/tr><\/table><div class='warn'>Achtung: Anders als im Italienischen und Spanischen ist das Subjektpronomen <b>Pflicht<\/b> – die Verbendungen klingen oft gleich: <em>je parle, tu parles, il parle, ils parlent<\/em> werden alle [parl] gesprochen.<\/div><p><b>Anrede<\/b>: <em>tu<\/em> (vertraut, eine Person) – <em>vous<\/em> (höflich, eine Person; oder mehrere Personen). Das Verb steht bei <em>vous<\/em> immer im Plural, Adjektive aber im Singular bei einer Person: <em>Vous êtes prête, madame ?<\/em><\/p><p><em>il<\/em> und <em>elle<\/em> stehen auch für Sachen, je nach Genus: <em>La voiture ? Elle est au garage.<\/em><\/p><div class='tip'>Merke: Unpersönliches <em>il<\/em> = es: <em>Il pleut. Il fait froid. Il est tard. Il faut partir.<\/em><\/div>"}, {"h": "Direkte Objektpronomen", "html": "<p>Sie ersetzen das direkte Objekt (Akkusativ, ohne Präposition) und stehen <b>vor dem konjugierten Verb<\/b>:<\/p><table><tr><th>Person<\/th><th>Pronomen<\/th><th>Beispiel<\/th><\/tr><tr><td>mich<\/td><td><em>me (m')<\/em><\/td><td><em>Il me voit.<\/em><\/td><\/tr><tr><td>dich<\/td><td><em>te (t')<\/em><\/td><td><em>Je t'aime.<\/em><\/td><\/tr><tr><td>ihn / es<\/td><td><em>le (l')<\/em><\/td><td><em>Le livre ? Je le lis.<\/em><\/td><\/tr><tr><td>sie (Sg.)<\/td><td><em>la (l')<\/em><\/td><td><em>La lettre ? Je la lis.<\/em><\/td><\/tr><tr><td>uns<\/td><td><em>nous<\/em><\/td><td><em>Il nous invite.<\/em><\/td><\/tr><tr><td>euch / Sie<\/td><td><em>vous<\/em><\/td><td><em>Je vous remercie.<\/em><\/td><\/tr><tr><td>sie (Pl.)<\/td><td><em>les<\/em><\/td><td><em>Les clés ? Je les cherche.<\/em><\/td><\/tr><\/table><p>Das neutrale <em>le<\/em> ersetzt ganze Aussagen: <em>Je le sais.<\/em> (Ich weiß es.) <em>Je le crois.<\/em><\/p><div class='warn'>Achtung: Einige Verben haben im Französischen ein direktes Objekt, im Deutschen nicht – oder umgekehrt: <em>attendre qn<\/em> (auf jdn warten): <em>Je l'attends.<\/em> <em>chercher qn<\/em> (jdn suchen / abholen), <em>écouter qn<\/em> (jdm zuhören): <em>Je t'écoute.<\/em> <em>aider qn<\/em> (jdm helfen): <em>Je l'aide.<\/em><\/div>"}, {"h": "Indirekte Objektpronomen", "html": "<p>Sie ersetzen ein Objekt mit <em>à<\/em> + Person (Dativ):<\/p><table><tr><th>Person<\/th><th>Pronomen<\/th><th>Beispiel<\/th><\/tr><tr><td>mir<\/td><td><em>me (m')<\/em><\/td><td><em>Il me téléphone.<\/em><\/td><\/tr><tr><td>dir<\/td><td><em>te (t')<\/em><\/td><td><em>Je te donne le livre.<\/em><\/td><\/tr><tr><td>ihm / ihr<\/td><td><em>lui<\/em><\/td><td><em>Je lui parle.<\/em><\/td><\/tr><tr><td>uns<\/td><td><em>nous<\/em><\/td><td><em>Elle nous écrit.<\/em><\/td><\/tr><tr><td>euch / Ihnen<\/td><td><em>vous<\/em><\/td><td><em>Je vous explique.<\/em><\/td><\/tr><tr><td>ihnen<\/td><td><em>leur<\/em><\/td><td><em>Je leur dis bonjour.<\/em><\/td><\/tr><\/table><p>Typische Verben mit <em>à<\/em> + Person: <em>parler, téléphoner, écrire, répondre, donner, dire, demander, plaire, ressembler, sourire, conseiller, permettre, interdire<\/em>.<\/p><div class='warn'>Achtung: <em>lui<\/em> = ihm <b>und<\/b> ihr. Und das Pronomen <em>leur<\/em> ist unveränderlich – nicht mit dem Possessiv <em>leurs<\/em> verwechseln: <em>Je leur donne leurs cadeaux.<\/em><\/div><div class='warn'>Achtung: Bei <em>penser à, s'intéresser à, faire attention à<\/em> und Verben der Bewegung steht bei Personen das betonte Pronomen nach <em>à<\/em>: <em>Je pense à toi.<\/em> (nicht <em>je te pense<\/em>)<\/div>"}, {"h": "Das Pronomen y", "html": "<p><em>y<\/em> ersetzt<\/p><ul><li>eine <b>Ortsangabe<\/b> mit <em>à, en, dans, chez, sur<\/em> … (dort, dorthin): <em>Tu vas à Paris ? – Oui, j'y vais.<\/em> <em>Elle est chez elle ? – Oui, elle y est.<\/em><\/li><li>eine <b>Sache<\/b> mit <em>à<\/em>: <em>Tu penses à ton examen ? – Oui, j'y pense.<\/em> <em>Il s'intéresse à la politique ? – Oui, il s'y intéresse.<\/em><\/li><\/ul><p>Feste Wendungen: <em>Il y a<\/em> (es gibt), <em>On y va !<\/em> (Los geht's!), <em>Ça y est !<\/em> (Geschafft!), <em>J'y suis.<\/em> (Ich hab's kapiert.)<\/p><div class='warn'>Achtung: Für Personen mit <em>à<\/em> steht nicht <em>y<\/em>, sondern <em>lui/leur<\/em> oder <em>à + betontes Pronomen<\/em>: <em>Je pense à Marie → Je pense à elle.<\/em><\/div><div class='tip'>Merke: Bei <em>aller<\/em> im Futur und Konditional entfällt <em>y<\/em> aus Wohlklanggründen: <em>J'irai<\/em> (nicht <em>j'y irai<\/em>).<\/div>"}, {"h": "Das Pronomen en", "html": "<p><em>en<\/em> ersetzt eine Ergänzung mit <em>de<\/em>:<\/p><ul><li><b>Teilungsartikel / Mengen<\/b>: <em>Tu veux du pain ? – Oui, j'en veux.<\/em> <em>Il a des enfants ? – Oui, il en a trois.<\/em> <em>Tu as de l'argent ? – Non, je n'en ai pas.<\/em><\/li><li><b>Mengenangaben<\/b> bleiben stehen: <em>J'en ai beaucoup. J'en voudrais un kilo.<\/em><\/li><li><b>Verben mit de<\/b>: <em>Tu as besoin de ton vélo ? – Oui, j'en ai besoin.<\/em> <em>Il parle de son voyage ? – Oui, il en parle.<\/em><\/li><li><b>Herkunft<\/b> (von dort): <em>Tu viens de la poste ? – Oui, j'en viens.<\/em><\/li><\/ul><div class='warn'>Achtung: Bei Zahlen muss die Zahl wiederholt werden: <em>Tu as des frères ? – J'en ai deux.<\/em> Mit <em>un/une<\/em>: <em>Tu as une voiture ? – Oui, j'en ai une.<\/em> (verneint: <em>Je n'en ai pas.<\/em>)<\/div><div class='tip'>Merke: Wie ital. <em>ne<\/em>: <em>Ne ho due<\/em> = <em>J'en ai deux<\/em>. Feste Wendungen: <em>Je m'en vais<\/em> (ich gehe weg), <em>J'en ai marre<\/em> (ich hab's satt), <em>Je ne m'en souviens pas<\/em>.<\/div>"}, {"h": "Die Reihenfolge mehrerer Pronomen", "html": "<p>Stehen mehrere Pronomen vor dem Verb, gilt diese feste Reihenfolge:<\/p><table><tr><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr><tr><td><em>me, te, se, nous, vous<\/em><\/td><td><em>le, la, les<\/em><\/td><td><em>lui, leur<\/em><\/td><td><em>y<\/em><\/td><td><em>en<\/em><\/td><\/tr><\/table><ul><li><em>Il me le donne.<\/em> – Er gibt es mir.<\/li><li><em>Je le lui donne.<\/em> – Ich gebe es ihm/ihr.<\/li><li><em>Je les leur montre.<\/em> – Ich zeige sie ihnen.<\/li><li><em>Il y en a.<\/em> – Es gibt welche.<\/li><li><em>Je vous en prie.<\/em> – Bitte sehr / Gern geschehen.<\/li><\/ul><div class='tip'>Merke: Merksatz: „<b>me te se nous vous<\/b> vor <b>le la les<\/b> vor <b>lui leur<\/b> vor <b>y<\/b> vor <b>en<\/b>.“ <em>lui/leur<\/em> und <em>me/te<\/em> stehen nie zusammen.<\/div><div class='warn'>Achtung: Anders als im Italienischen (<em>glielo<\/em>) und Spanischen (<em>se lo<\/em>) bleibt <em>le lui<\/em> unverändert und getrennt: <em>Je le lui dis.<\/em><\/div>"}, {"h": "Stellung der Pronomen", "html": "<table><tr><th>Fall<\/th><th>Stellung<\/th><th>Beispiel<\/th><\/tr><tr><td>einfache Zeit<\/td><td>vor dem Verb<\/td><td><em>Je le vois.<\/em><\/td><\/tr><tr><td>zusammengesetzte Zeit<\/td><td>vor dem Hilfsverb<\/td><td><em>Je l'ai vu.<\/em><\/td><\/tr><tr><td>Verneinung<\/td><td>zwischen <em>ne<\/em> und Verb<\/td><td><em>Je ne l'ai pas vu.<\/em><\/td><\/tr><tr><td>Verb + Infinitiv<\/td><td>vor dem Infinitiv<\/td><td><em>Je vais le voir. Je veux lui parler.<\/em><\/td><\/tr><tr><td>bejahter Imperativ<\/td><td>nach dem Verb, mit Bindestrich<\/td><td><em>Regarde-le ! Donne-le-moi !<\/em><\/td><\/tr><tr><td>verneinter Imperativ<\/td><td>vor dem Verb, normal<\/td><td><em>Ne le regarde pas !<\/em><\/td><\/tr><\/table><div class='warn'>Achtung: Anders als im Italienischen und Spanischen hängt man im Französischen das Pronomen nie an den Infinitiv: <em>Je vais le faire<\/em> (ital. <em>farlo<\/em>, span. <em>hacerlo<\/em>).<\/div><p>Im <b>bejahten Imperativ<\/b> werden <em>me/te<\/em> zu <em>moi/toi<\/em>, und die Reihenfolge ist: direktes vor indirektem Objekt: <em>Donne-le-moi. Dites-le-lui. Donne-m'en.<\/em><\/p><div class='tip'>Merke: Bei <em>faire, laisser<\/em> und Wahrnehmungsverben steht das Pronomen vor dem konjugierten Verb: <em>Je le fais réparer. Je les entends chanter.<\/em><\/div>"}, {"h": "Die betonten Pronomen", "html": "<table><tr><th>Subjekt<\/th><th>betont<\/th><\/tr><tr><td><em>je<\/em><\/td><td><em>moi<\/em><\/td><\/tr><tr><td><em>tu<\/em><\/td><td><em>toi<\/em><\/td><\/tr><tr><td><em>il / elle<\/em><\/td><td><em>lui / elle<\/em><\/td><\/tr><tr><td><em>on<\/em><\/td><td><em>soi<\/em><\/td><\/tr><tr><td><em>nous / vous<\/em><\/td><td><em>nous / vous<\/em><\/td><\/tr><tr><td><em>ils / elles<\/em><\/td><td><em>eux / elles<\/em><\/td><\/tr><\/table><p>Gebrauch:<\/p><ul><li>allein, ohne Verb: <em>Qui veut un café ? – Moi !<\/em><\/li><li>zur Betonung: <em>Moi, je reste ici. Lui, il est fou.<\/em><\/li><li>nach Präpositionen: <em>avec toi, chez eux, pour elle, sans moi<\/em><\/li><li>nach <em>c'est<\/em>: <em>C'est lui.<\/em><\/li><li>bei Vergleichen: <em>plus grand que moi<\/em><\/li><li>mit <em>-même<\/em>: <em>moi-même, eux-mêmes<\/em><\/li><li>bei Verben mit <em>à<\/em> + Person, die kein Dativpronomen erlauben: <em>Je pense à toi. Fais attention à eux.<\/em><\/li><\/ul><div class='tip'>Merke: <em>chez moi<\/em> = bei mir / zu mir nach Hause. <em>soi<\/em> nach <em>on, chacun, tout le monde<\/em>: <em>On rentre chez soi.<\/em><\/div>"}], "exercises": [{"type": "gap", "title": "Direkte Objektpronomen", "task": "Ersetze das Objekt durch le, la, l' oder les.", "items": [{"q": "Tu lis le journal ? – Oui, je ___ lis.", "a": ["le"], "de": "Liest du die Zeitung? – Ja, ich lese sie."}, {"q": "Tu connais Marie ? – Oui, je ___ connais.", "a": ["la"], "de": "Kennst du Marie? – Ja, ich kenne sie."}, {"q": "Tu as les billets ? – Oui, je ___ ai.", "a": ["les"], "de": "Hast du die Fahrkarten? – Ja, ich habe sie."}, {"q": "Tu attends le bus ? – Oui, je ___ attends.", "a": ["l'"], "de": "Wartest du auf den Bus? – Ja."}, {"q": "Tu aides ta sœur ? – Oui, je ___ aide.", "a": ["l'"], "de": "Hilfst du deiner Schwester? – Ja."}, {"q": "Vous regardez la télé ? – Non, nous ne ___ regardons pas.", "a": ["la"], "de": "Seht ihr fern? – Nein."}, {"q": "Il sait que tu viens ? – Oui, il ___ sait.", "a": ["le"], "de": "Weiß er, dass du kommst? – Ja, er weiß es."}, {"q": "Tu écoutes tes parents ? – Oui, je ___ écoute.", "a": ["les"], "de": "Hörst du auf deine Eltern? – Ja."}]}, {"type": "choice", "title": "Direkt oder indirekt?", "task": "Wähle das richtige Pronomen.", "items": [{"q": "Je téléphone à Paul. → Je ___ téléphone.", "options": ["le", "lui"], "a": 1, "why": "téléphoner à → indirekt → lui."}, {"q": "J'invite Paul. → Je ___ invite.", "options": ["l'", "lui"], "a": 0, "why": "inviter qn → direkt → l'."}, {"q": "J'écris à mes parents. → Je ___ écris.", "options": ["les", "leur"], "a": 1, "why": "écrire à → indirekt Plural → leur."}, {"q": "J'aide mes voisins. → Je ___ aide.", "options": ["les", "leur"], "a": 0, "why": "aider qn → direkt."}, {"q": "Je demande à Sophie. → Je ___ demande.", "options": ["la", "lui"], "a": 1, "why": "demander à qn → lui."}, {"q": "J'attends mes amis. → Je ___ attends.", "options": ["les", "leur"], "a": 0, "why": "attendre qn → direkt."}, {"q": "Ce film plaît à mes enfants. → Ce film ___ plaît.", "options": ["les", "leur"], "a": 1, "why": "plaire à → leur."}, {"q": "Je pense à ma grand-mère. → Je ___.", "options": ["lui pense", "pense à elle"], "a": 1, "why": "penser à + Person → betontes Pronomen."}]}, {"type": "choice", "title": "y oder en?", "task": "Wähle das passende Pronomen.", "items": [{"q": "Tu vas à la plage ? – Oui, j'___ vais.", "options": ["y", "en"], "a": 0, "why": "Ort mit à → y."}, {"q": "Tu veux du café ? – Oui, j'___ veux.", "options": ["y", "en"], "a": 1, "why": "Teilungsartikel → en."}, {"q": "Tu as des frères ? – Oui, j'___ ai deux.", "options": ["y", "en"], "a": 1, "why": "Mengenangabe → en + Zahl."}, {"q": "Tu penses à tes vacances ? – Oui, j'___ pense.", "options": ["y", "en"], "a": 0, "why": "Sache mit à → y."}, {"q": "Il parle de son travail ? – Oui, il ___ parle.", "options": ["y", "en"], "a": 1, "why": "parler de → en."}, {"q": "Elle revient de Rome ? – Oui, elle ___ revient.", "options": ["y", "en"], "a": 1, "why": "Herkunft mit de → en."}, {"q": "Tu habites en France ? – Oui, j'___ habite.", "options": ["y", "en"], "a": 0, "why": "Ort mit en (Präposition) → y."}, {"q": "Tu as besoin de la voiture ? – Non, je n'___ ai pas besoin.", "options": ["y", "en"], "a": 1, "why": "avoir besoin de → en."}]}, {"type": "gap", "title": "Zwei Pronomen", "task": "Ersetze beide Objekte durch Pronomen in der richtigen Reihenfolge.", "items": [{"q": "Il me donne le livre. → Il ___ donne.", "a": ["me le"], "de": "Er gibt es mir."}, {"q": "Je donne la clé à Pierre. → Je ___ donne.", "a": ["la lui"], "de": "Ich gebe ihn ihm."}, {"q": "Elle montre les photos à ses amis. → Elle ___ montre.", "a": ["les leur"], "de": "Sie zeigt sie ihnen."}, {"q": "Tu nous envoies la lettre ? → Tu ___ envoies ?", "a": ["nous l'"], "de": "Schickst du ihn uns?"}, {"q": "Il y a du lait ? – Oui, il ___ a.", "a": ["y en"], "de": "Gibt es Milch? – Ja, es gibt welche."}, {"q": "Je te prête mes livres. → Je ___ prête.", "a": ["te les"], "de": "Ich leihe sie dir."}, {"q": "Donne-moi le sel ! → Donne-___ !", "a": ["le-moi"], "de": "Gib es mir!"}]}, {"type": "choice", "title": "Stellung der Pronomen", "task": "Welcher Satz ist richtig?", "items": [{"q": "Ich werde ihn morgen anrufen.", "options": ["Je vais l'appeler demain.", "Je le vais appeler demain.", "Je vais appeler-le demain."], "a": 0, "why": "Pronomen vor dem Infinitiv."}, {"q": "Ich habe sie nicht gesehen.", "options": ["Je n'ai pas la vue.", "Je ne l'ai pas vue.", "Je ne ai pas l'vue."], "a": 1, "why": "Pronomen vor dem Hilfsverb, zwischen ne und Verb."}, {"q": "Ruf mich an!", "options": ["Me appelle !", "Appelle-moi !", "Appelle-me !"], "a": 1, "why": "Bejahter Imperativ: Pronomen hinten, me → moi."}, {"q": "Ruf mich nicht an!", "options": ["Ne m'appelle pas !", "N'appelle-moi pas !"], "a": 0, "why": "Verneinter Imperativ: Pronomen vorne."}, {"q": "Sag es ihm!", "options": ["Dis-lui-le !", "Dis-le-lui !"], "a": 1, "why": "Imperativ: direkt vor indirekt."}, {"q": "Ich lasse es reparieren.", "options": ["Je fais le réparer.", "Je le fais réparer."], "a": 1, "why": "Bei faire + Infinitiv steht das Pronomen vor faire."}]}, {"type": "gap", "title": "Betonte Pronomen", "task": "Setze das passende betonte Pronomen ein.", "items": [{"q": "Tu viens avec ___ ? (ich)", "a": ["moi"], "de": "Kommst du mit mir?"}, {"q": "___, il ne dit jamais rien. (er)", "a": ["Lui"], "de": "Er sagt nie etwas."}, {"q": "Ce cadeau est pour ___. (sie, Pl. f.)", "a": ["elles"], "de": "Dieses Geschenk ist für sie."}, {"q": "On dîne chez ___ ce soir ? (sie, Pl. m.)", "a": ["eux"], "de": "Essen wir heute Abend bei ihnen?"}, {"q": "Qui a fait ça ? – C'est ___ ! (du)", "a": ["toi"], "de": "Wer hat das gemacht? – Du!"}, {"q": "Elle est plus âgée que ___. (ich)", "a": ["moi"], "de": "Sie ist älter als ich."}, {"q": "Je pense souvent à ___. (ihr, Sg. f.)", "a": ["elle"], "de": "Ich denke oft an sie."}, {"q": "On est bien chez ___.", "a": ["soi"], "de": "Zu Hause ist es am schönsten."}]}], "cards": [{"f": "Subjektpronomen weglassen wie im Italienischen?", "b": "Nein – im Französischen Pflicht: je parle, nicht parle"}, {"f": "ils / elles", "b": "ils = m. oder gemischte Gruppe · elles = n
