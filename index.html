Xi/OZ0jmyAAAAAElFTkSuQmCC"><meta name="theme-color" content="#1f4fa8"></head><body>
<title>Französisch-Grammatik</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: ein Schulheft ("cahier") – kariertes Papier, roter Heftrand, Pigna-Blau als Tinte; eine Spalte, Navigation unten */
:root{
  --paper:#f7f8fb; --sheet:#ffffff; --grid:#e3e8f2; --ink:#1b2333; --muted:#5e6878;
  --blue:#1f4fa8; --blue-soft:#e6edfa; --red:#c8323a; --red-soft:#fbe9ea;
  --green:#1f7a4d; --green-soft:#e3f4ea; --amber:#9a6200; --amber-soft:#fdf2dc;
  --line:#d9dfea;
  --f-display:"Young Serif", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11151d; --sheet:#171c26; --grid:#1f2633; --ink:#e7ebf2; --muted:#9aa4b5;
  --blue:#8fb3ff; --blue-soft:#1a2640; --red:#ff7b82; --red-soft:#3a1d22;
  --green:#6fd3a0; --green-soft:#16302a; --amber:#f1b95b; --amber-soft:#36290f; --line:#2a3242; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#11151d; --sheet:#171c26; --grid:#1f2633; --ink:#e7ebf2; --muted:#9aa4b5;
  --blue:#8fb3ff; --blue-soft:#1a2640; --red:#ff7b82; --red-soft:#3a1d22;
  --green:#6fd3a0; --green-soft:#16302a; --amber:#f1b95b; --amber-soft:#36290f; --line:#2a3242; color-scheme:dark; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-attachment:fixed}
button{font:inherit;color:inherit}
a{color:var(--blue)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
em{font-style:normal;color:var(--blue)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:52px}
.back{border:0;background:none;color:var(--blue);font-size:17px;padding:6px 4px;cursor:pointer;display:flex;align-items:center;gap:2px}
.top .t{font-family:var(--f-display);font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .num{font-family:var(--f-display);color:var(--amber);font-size:18px}

/* home */
.hero{padding:22px 0 10px}
.hero h1{font-size:34px;line-height:1.1}
.hero p{color:var(--muted);margin:.5em 0 0;max-width:34em}
.stats{display:flex;gap:10px;margin:16px 0 4px;flex-wrap:wrap}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--muted)}
.stat b{display:block;color:var(--ink);font-size:20px;font-family:var(--f-display);font-weight:400}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.qbtn{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font-weight:700;font-size:15px}
.qbtn small{display:block;font-weight:400;opacity:.85;font-size:13px;margin-top:2px}
.qbtn.alt{background:var(--sheet);color:var(--ink);border:1px solid var(--line)}
:root[data-theme="dark"] .qbtn:not(.alt){color:#0e1420}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .qbtn:not(.alt){color:#0e1420} }
.search{width:100%;margin:12px 0 4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);font:inherit;color:var(--ink)}
.teil{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:700}
.list{background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.list::before{content:"";position:absolute;left:52px;top:0;bottom:0;width:1.5px;background:var(--amber);opacity:.55}
.row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row .n{width:26px;text-align:right;font-family:var(--f-display);color:var(--amber);font-size:18px;flex:none;font-variant-numeric:tabular-nums}
.row .tt{flex:1;min-width:0;padding-left:8px}
.row .tt b{display:block;font-weight:700}
.row .tt small{color:var(--muted);font-size:13px}
.ring{flex:none;width:30px;height:30px}
.hit{padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.hit small{color:var(--muted);display:block;font-size:13px}

/* chapter */
.chhead{padding:18px 0 6px}
.chhead .kn{color:var(--amber);font-family:var(--f-display);font-size:15px}
.chhead h1{font-size:30px;line-height:1.12;margin-top:2px}
.chhead p{color:var(--muted);margin:.55em 0 0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--sheet) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:0;background:none;padding:8px 4px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--blue);background:var(--blue-soft)}

.toc{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.sec{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;scroll-margin-top:70px}
.sec h2{font-size:21px;line-height:1.2;margin-bottom:8px}
.sec p{margin:.5em 0}
.sec ul,.sec ol{padding-left:1.2em;margin:.5em 0}
.sec li{margin:.2em 0}
.sec small{color:var(--muted);font-size:.88em}
.tw{overflow-x:auto;margin:10px -4px}
.sec table{border-collapse:collapse;width:100%;font-size:15px}
.sec th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line);font-weight:700}
.sec td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tip,.warn{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15.5px}
.tip{background:var(--blue-soft)}
.tip::before{content:"Merke";display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--blue);margin-bottom:2px}
.warn{background:var(--red-soft)}
.warn::before{content:"Achtung";display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--red);margin-bottom:2px}
.next{display:flex;gap:10px;margin:18px 0}
.next button{flex:1}

/* exercises */
.ex{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.ex h2{font-size:20px}
.ex .task{color:var(--muted);margin:.3em 0 .8em;font-size:15px}
.ex .score{font-size:13px;color:var(--muted);float:right;margin-top:4px}
.it{padding:10px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.q{line-height:1.9}
.q .ix{color:var(--muted);font-size:14px;margin-right:6px}
.gap{font:inherit;font-size:16px;color:var(--blue);border:0;border-bottom:2px solid var(--muted);background:transparent;min-width:5.5em;width:7em;padding:0 2px;border-radius:0;outline:none}
.gap:focus{border-bottom-color:var(--blue)}
.gap.ok{border-bottom-color:var(--green);color:var(--green)}
.gap.bad{border-bottom-color:var(--red);color:var(--red)}
.gap.near{border-bottom-color:var(--amber);color:var(--amber)}
.de{color:var(--muted);font-size:14px;display:block}
.fb{font-size:14px;margin-top:4px}
.fb.ok{color:var(--green)} .fb.bad{color:var(--red)} .fb.near{color:var(--amber)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:15.5px;color:var(--blue)}
.opt.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt.bad{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.opt[disabled]{cursor:default}
.why{font-size:14px;color:var(--muted);margin-top:6px}
.bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:700;font-size:15px;background:var(--blue);color:var(--sheet)}
.btn.sec2{background:var(--blue-soft);color:var(--blue)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:400}
.btn:focus-visible,.opt:focus-visible,.row:focus-visible,.tab:focus-visible,.chip:focus-visible,.qbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* cards */
.cardwrap{padding:14px 0}
.cardmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}
.fc{perspective:1200px;height:min(56vh,380px);cursor:pointer;-webkit-tap-highlight-color:transparent}
.fc .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);
  background:var(--sheet);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;overflow:auto}
.face .lab{position:absolute;top:12px;left:16px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.face .tx{font-size:22px;line-height:1.35;font-family:var(--f-display)}
.face.back{transform:rotateY(180deg);background:var(--blue-soft)}
.face.back .tx{color:var(--blue);font-family:var(--f-body);font-weight:700}
.face .src{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cardbtns .btn{padding:14px}
.btn.no{background:var(--red-soft);color:var(--red)}
.btn.yes{background:var(--green-soft);color:var(--green)}
.done{text-align:center;padding:40px 10px}
.done h2{font-size:26px}
.empty{color:var(--muted)}
@media (prefers-reduced-motion: reduce){ .fc .inner{transition:none} }

<script type="application/json" id="data">[{"nr": 1, "id": "k01", "title": "Aussprache und Schreibung", "teil": "Einführung", "intro": "Französisch wird anders gesprochen, als es geschrieben wird – aber nach festen Regeln. Wer stumme Endungen, Nasale, Liaison und Akzente kennt, kann fast jedes Wort richtig lesen. Dieses Kapitel legt dafür das Fundament.", "sections": [{"h": "Das Alphabet und Buchstabieren", "html": "<p>Das französische Alphabet hat 26 Buchstaben. Dazu kommen Akzente (<em>é, è, ê, à, ù, â, î, ô, û, ë, ï, ü, ÿ<\/em>), die Cedille (<em>ç<\/em>) und die Ligaturen <em>œ<\/em> und <em>æ<\/em>. Die Buchstaben sind maskulin: <em>un a, un b<\/em>.<\/p><table><tr><th>Buchstabe<\/th><th>Aussprache<\/th><th>Buchstabe<\/th><th>Aussprache<\/th><\/tr><tr><td>a<\/td><td>a<\/td><td>n<\/td><td>änn<\/td><\/tr><tr><td>b<\/td><td>be<\/td><td>o<\/td><td>o<\/td><\/tr><tr><td>c<\/td><td>sse<\/td><td>p<\/td><td>pe<\/td><\/tr><tr><td>d<\/td><td>de<\/td><td>q<\/td><td>kü<\/td><\/tr><tr><td>e<\/td><td>ö<\/td><td>r<\/td><td>ärr<\/td><\/tr><tr><td>f<\/td><td>äff<\/td><td>s<\/td><td>äss<\/td><\/tr><tr><td>g<\/td><td>sche (stimmhaft)<\/td><td>t<\/td><td>te<\/td><\/tr><tr><td>h<\/td><td>asch<\/td><td>u<\/td><td>ü<\/td><\/tr><tr><td>i<\/td><td>i<\/td><td>v<\/td><td>we<\/td><\/tr><tr><td>j<\/td><td>schi (stimmhaft)<\/td><td>w<\/td><td>dubl-we<\/td><\/tr><tr><td>k<\/td><td>ka<\/td><td>x<\/td><td>iks<\/td><\/tr><tr><td>l<\/td><td>äll<\/td><td>y<\/td><td>i grec<\/td><\/tr><tr><td>m<\/td><td>ämm<\/td><td>z<\/td><td>säd<\/td><\/tr><\/table><p>Buchstabieren: <em>Comment ça s'écrit ?<\/em> – <em>H, U, B, E, R.<\/em> Doppelbuchstaben: <em>deux L<\/em>; Akzente: <em>e accent aigu<\/em> (é), <em>e accent grave<\/em> (è), <em>e accent circonflexe<\/em> (ê), <em>c cédille<\/em> (ç).<\/p><div class='warn'>Achtung: <em>g<\/em> und <em>j<\/em> werden gegenüber dem Deutschen „vertauscht“ ausgesprochen: <em>g<\/em> = „sche“, <em>j<\/em> = „schi“. Und <em>e<\/em> klingt wie „ö“, <em>i<\/em> wie „i“ – Verwechslungsgefahr beim Diktieren von E-Mail-Adressen!<\/div>"}, {"h": "Stumme Buchstaben am Wortende", "html": "<p>Die wichtigste Regel: <b>Endkonsonanten werden meist nicht gesprochen<\/b>, ebenso das <em>-e<\/em> am Wortende.<\/p><ul><li><em>petit, grand, trop, vous, nez, prix<\/em> – der Endkonsonant ist stumm.<\/li><li><em>table, porte, rue<\/em> – das End-e ist stumm, aber es sorgt dafür, dass der Konsonant davor gesprochen wird: <em>peti<b>t<\/b><\/em> [pti] – <em>peti<b>te<\/b><\/em> [ptit].<\/li><li>Plural-<em>s<\/em> und Verbendungen <em>-es, -ent<\/em> sind stumm: <em>ils parlent<\/em> klingt wie <em>il parle<\/em>.<\/li><\/ul><p><b>CaReFuL<\/b>: Die Endkonsonanten <em>c, r, f, l<\/em> werden dagegen meist gesprochen: <em>avec, bonjour, neuf, hôtel<\/em>.<\/p><table><tr><th>geschrieben<\/th><th>gesprochen<\/th><\/tr><tr><td><em>Paris<\/em><\/td><td>pari<\/td><\/tr><tr><td><em>beaucoup<\/em><\/td><td>boku<\/td><\/tr><tr><td><em>ils mangent<\/em><\/td><td>il mãsch<\/td><\/tr><tr><td><em>le sac, le chef, le sel<\/em><\/td><td>c, f, l hörbar<\/td><\/tr><\/table><div class='warn'>Achtung: Das <em>-r<\/em> der Infinitive auf <em>-er<\/em> und der Endung <em>-ier<\/em> ist stumm: <em>parler<\/em> [parle], <em>premier<\/em> [prömje]. Ausnahmen bei <em>-er<\/em>: <em>la mer, hier, fier, cher<\/em>.<\/div><div class='tip'>Merke: Einige Wörter sprechen den Endkonsonanten: <em>le bus, le fils<\/em> [fiss], <em>l'est, l'ouest, le sud<\/em>. Zahlen siehe Kapitel 26.<\/div>"}, {"h": "Vokale und Vokalverbindungen", "html": "<p>Mehrere Buchstaben stehen oft für einen einzigen Laut:<\/p><table><tr><th>Schreibung<\/th><th>Laut<\/th><th>Beispiele<\/th><\/tr><tr><td><em>ou<\/em><\/td><td>u<\/td><td><em>vous, rouge, où<\/em><\/td><\/tr><tr><td><em>u<\/em><\/td><td>ü<\/td><td><em>tu, rue, sur<\/em><\/td><\/tr><tr><td><em>oi<\/em><\/td><td>wa<\/td><td><em>moi, trois, voiture<\/em><\/td><\/tr><tr><td><em>au, eau<\/em><\/td><td>o<\/td><td><em>chaud, beau, eau<\/em><\/td><\/tr><tr><td><em>ai, ei<\/em><\/td><td>offenes ä<\/td><td><em>lait, mais, neige<\/em><\/td><\/tr><tr><td><em>eu, œu<\/em><\/td><td>ö<\/td><td><em>deux, peu, sœur, cœur<\/em><\/td><\/tr><tr><td><em>é, -er, -ez<\/em><\/td><td>geschlossenes e<\/td><td><em>été, parler, nez<\/em><\/td><\/tr><tr><td><em>è, ê<\/em><\/td><td>offenes ä<\/td><td><em>mère, tête<\/em><\/td><\/tr><tr><td><em>oui, ui<\/em><\/td><td>wi, üi<\/td><td><em>oui, huit, nuit<\/em><\/td><\/tr><\/table><p>Das unbetonte <em>e<\/em> (<em>e muet, e caduc<\/em>) in <em>le, je, petit, samedi<\/em> klingt wie ein kurzes „ö“ und fällt in der gesprochenen Sprache oft ganz weg: <em>sam'di, j'sais pas<\/em>.<\/p><div class='tip'>Merke: Das Französische betont immer die <b>letzte gesprochene Silbe<\/b> eines Wortes bzw. einer Wortgruppe: <em>chocoLAT, universiTÉ<\/em>. Akzente haben mit der Betonung nichts zu tun – anders als im Spanischen und Italienischen!<\/div>"}, {"h": "Nasalvokale", "html": "<p>Folgt auf einen Vokal ein <em>n<\/em> oder <em>m<\/em> in derselben Silbe (also vor Konsonant oder am Wortende), wird der Vokal durch die Nase gesprochen und das <em>n/m<\/em> nicht mehr hörbar.<\/p><table><tr><th>Laut<\/th><th>Schreibungen<\/th><th>Beispiele<\/th><\/tr><tr><td>ã (wie in „Restaurant“)<\/td><td><em>an, am, en, em<\/em><\/td><td><em>France, chambre, enfant, temps<\/em><\/td><\/tr><tr><td>õ<\/td><td><em>on, om<\/em><\/td><td><em>bonjour, nom, ombre<\/em><\/td><\/tr><tr><td>ẽ (nasales ä)<\/td><td><em>in, im, ain, ein, un, yn<\/em><\/td><td><em>vin, simple, pain, plein, un, lundi<\/em><\/td><\/tr><\/table><p>Kein Nasal, wenn ein Vokal oder ein zweites <em>n/m<\/em> folgt:<\/p><ul><li><em>bon<\/em> [bõ] – <em>bonne<\/em> [bonn]<\/li><li><em>an<\/em> [ã] – <em>âne<\/em> [ahn]<\/li><li><em>fin<\/em> [fẽ] – <em>fine<\/em> [fin]<\/li><li><em>italien<\/em> – <em>italienne<\/em><\/li><\/ul><div class='warn'>Achtung: <em>-ent<\/em> ist in Verben der 3. Person Plural stumm (<em>ils chantent<\/em> [schãt]), in anderen Wörtern aber nasal: <em>souvent, lent, le vent<\/em> [vã].<\/div>"}, {"h": "Konsonanten: c/ç, g/ge, qu, gn, ch, h, s", "html": "<p><b>c und g<\/b> haben zwei Aussprachen, je nach folgendem Vokal – wie im Italienischen und Spanischen:<\/p><table><tr><th><\/th><th>vor a, o, u, Konsonant<\/th><th>vor e, i, y<\/th><\/tr><tr><td><em>c<\/em><\/td><td>k: <em>café, comme, cube<\/em><\/td><td>s: <em>ceci, cinéma<\/em><\/td><\/tr><tr><td><em>g<\/em><\/td><td>g: <em>gare, goût, grand<\/em><\/td><td>stimmhaftes „sch“: <em>genou, girafe<\/em><\/td><\/tr><\/table><p>Für den s-Laut vor <em>a, o, u<\/em> schreibt man <em>ç<\/em>: <em>ça, garçon, reçu<\/em>. Für das „sch“ vor <em>a, o<\/em> schreibt man <em>ge<\/em>: <em>mangeons, Georges<\/em>. Für das harte g vor <em>e, i<\/em> schreibt man <em>gu<\/em>: <em>guerre, guide<\/em>.<\/p><ul><li><em>qu<\/em> = k: <em>qui, quatre, musique<\/em><\/li><li><em>ch<\/em> = „sch“: <em>chat, chercher<\/em> (in Fremdwörtern k: <em>orchestre, chorale<\/em>)<\/li><li><em>gn<\/em> = „nj“: <em>montagne, Espagne<\/em> (wie ital. <em>gn<\/em>, span. <em>ñ<\/em>)<\/li><li><em>h<\/em> ist immer stumm: <em>hôtel, homme<\/em><\/li><li><em>s<\/em> zwischen Vokalen = stimmhaft (z): <em>maison, rose<\/em>; <em>ss<\/em> = stimmlos: <em>poisson<\/em> (Fisch) ↔ <em>poison<\/em> (Gift)<\/li><li><em>ill<\/em> und <em>-il<\/em> nach Vokal = „j“: <em>fille, famille, travail, soleil<\/em> – Ausnahmen: <em>ville, mille, tranquille<\/em> [il]<\/li><li><em>th<\/em> = t: <em>thé, théâtre<\/em>; <em>ph<\/em> = f: <em>photo<\/em><\/li><\/ul><div class='warn'>Achtung: Diese Regeln erzwingen Schreibänderungen bei Verben: <em>manger → nous mangeons<\/em>, <em>commencer → nous commençons<\/em>.<\/div>"}, {"h": "Liaison und Elision", "html": "<p><b>Liaison<\/b>: Ein sonst stummer Endkonsonant wird gesprochen, wenn das nächste Wort mit Vokal oder stummem <em>h<\/em> beginnt – und an dieses Wort gebunden:<\/p><ul><li><em>les‿amis<\/em> [lezami], <em>vous‿avez<\/em> [vuzave], <em>un‿homme<\/em> [ẽnomm]<\/li><li><em>-s, -x, -z<\/em> klingen dabei wie stimmhaftes s (z): <em>deux‿enfants<\/em> [döz-ãfã]<\/li><li><em>-d<\/em> klingt wie t: <em>un grand‿homme<\/em> [grãtomm]<\/li><\/ul><p>Pflicht ist die Liaison nach Artikeln, Zahlwörtern, Pronomen und vorangestellten Adjektiven sowie nach einsilbigen Präpositionen: <em>chez‿elle, en‿Italie, très‿intéressant<\/em>. Verboten ist sie nach <em>et<\/em> (<em>et | elle<\/em>) und vor einem <b>h aspiré<\/b>.<\/p><p><b>Elision<\/b>: Vor Vokal oder stummem <em>h<\/em> fällt bei kurzen Wörtern der Vokal weg und wird durch einen Apostroph ersetzt:<\/p><table><tr><th>Wort<\/th><th>Elision<\/th><\/tr><tr><td><em>le, la<\/em><\/td><td><em>l'ami, l'école, l'hôtel<\/em><\/td><\/tr><tr><td><em>je, me, te, se<\/em><\/td><td><em>j'aime, il m'appelle<\/em><\/td><\/tr><tr><td><em>de, ne, que<\/em><\/td><td><em>d'accord, je n'ai pas, qu'il<\/em><\/td><\/tr><tr><td><em>si<\/em> (nur vor il/ils)<\/td><td><em>s'il vous plaît<\/em> – aber <em>si elle<\/em><\/td><\/tr><\/table><div class='warn'>Achtung: Beim <b>h aspiré<\/b> (in Wörterbüchern mit * markiert) gibt es weder Liaison noch Elision: <em>le héros, la honte, les | haricots, le hamburger<\/em>. Das h wird trotzdem nicht gesprochen.<\/div>"}, {"h": "Die Akzente und ihre Funktion", "html": "<p>Französische Akzente zeigen <b>nie die Betonung<\/b>, sondern die Aussprache des <em>e<\/em> oder unterscheiden Wörter:<\/p><table><tr><th>Akzent<\/th><th>Funktion<\/th><th>Beispiele<\/th><\/tr><tr><td><em>accent aigu<\/em> ´<\/td><td>nur auf e: geschlossenes e<\/td><td><em>été, café, né<\/em><\/td><\/tr><tr><td><em>accent grave<\/em> `<\/td><td>auf e: offenes ä; auf a, u: Unterscheidung<\/td><td><em>mère, très<\/em>; <em>à, là, où<\/em><\/td><\/tr><tr><td><em>accent circonflexe<\/em> ^<\/td><td>oft Ersatz für ein früheres s<\/td><td><em>forêt<\/em> (Forst), <em>hôpital<\/em> (Hospital), <em>fête<\/em> (Fest)<\/td><\/tr><tr><td><em>tréma<\/em> ¨<\/td><td>Vokal getrennt sprechen<\/td><td><em>Noël, naïf, maïs<\/em><\/td><\/tr><tr><td><em>cédille<\/em> ¸<\/td><td>c = s vor a, o, u<\/td><td><em>français, leçon<\/em><\/td><\/tr><\/table><p>Wichtige Paare mit Unterscheidungsakzent:<\/p><table><tr><th>mit Akzent<\/th><th>ohne Akzent<\/th><\/tr><tr><td><em>à<\/em> nach, in, zu<\/td><td><em>a<\/em> (er/sie) hat<\/td><\/tr><tr><td><em>où<\/em> wo<\/td><td><em>ou<\/em> oder<\/td><\/tr><tr><td><em>là<\/em> da, dort<\/td><td><em>la<\/em> die<\/td><\/tr><tr><td><em>dû<\/em> geschuldet (Partizip von devoir)<\/td><td><em>du<\/em> des, vom<\/td><\/tr><tr><td><em>sûr<\/em> sicher<\/td><td><em>sur<\/em> auf<\/td><\/tr><\/table><div class='tip'>Merke: Der Zirkumflex verrät oft ein verwandtes deutsches oder englisches Wort mit s: <em>la côte<\/em> (Küste), <em>la bête<\/em> (Biest), <em>le château<\/em> (Kastell).<\/div><p>Auf Großbuchstaben setzt man Akzente korrekterweise ebenfalls: <em>À bientôt, ÉCOLE<\/em> (in der Praxis oft weggelassen).<\/p>"}, {"h": "Satzzeichen, Groß- und Kleinschreibung", "html": "<p>Vor zweiteiligen Satzzeichen (<em>? ! : ;<\/em>) und innerhalb der Anführungszeichen « » steht im Französischen ein (schmales) Leerzeichen:<\/p><ul><li><em>Tu viens ?<\/em> – <em>Quelle surprise !<\/em><\/li><li><em>Il a dit : « Bonjour ! »<\/em><\/li><\/ul><p><b>Kleingeschrieben<\/b> werden – anders als im Deutschen:<\/p><ul><li>alle Substantive außer Eigennamen: <em>la table, l'amour<\/em><\/li><li>Wochentage und Monate: <em>lundi, en mai<\/em><\/li><li>Sprachen und Nationalitäts-Adjektive: <em>je parle allemand, un vin français<\/em><\/li><li>Anreden im Satz: <em>monsieur Dupont, madame<\/em><\/li><\/ul><p><b>Großgeschrieben<\/b> werden dagegen Einwohnerbezeichnungen als Substantiv: <em>les Français, un Allemand<\/em>, dazu Länder, Städte und Institutionen.<\/p><div class='warn'>Achtung: <em>Les Allemands parlent allemand.<\/em> – Die Deutschen (Substantiv, groß) sprechen Deutsch (Sprache, klein).<\/div><div class='tip'>Merke: Das Komma steht im Französischen sparsamer als im Deutschen; vor <em>que<\/em> („dass“) steht keines: <em>Je pense qu'il viendra.<\/em><\/div>"}], "exercises": [{"type": "choice", "title": "Wie wird es ausgesprochen?", "task": "Wähle die richtige Beschreibung des markierten Lauts.", "items": [{"q": "petit – das t am Ende …", "options": ["wird gesprochen", "ist stumm"], "a": 1, "why": "Endkonsonanten sind meist stumm."}, {"q": "petite – das t …", "options": ["wird gesprochen", "ist stumm"], "a": 0, "why": "Das stumme End-e macht den Konsonanten davor hörbar."}, {"q": "ils parlent – die Endung -ent …", "options": ["klingt nasal wie in „vent“", "ist stumm"], "a": 1, "why": "-ent der 3. Person Plural ist immer stumm."}, {"q": "souvent – die Endung -ent …", "options": ["klingt nasal [ã]", "ist stumm"], "a": 0, "why": "In Nicht-Verben ist -ent ein Nasalvokal."}, {"q": "avec – das c …", "options": ["wird gesprochen", "ist stumm"], "a": 0, "why": "CaReFuL: c, r, f, l am Ende werden meist gesprochen."}, {"q": "parler – das r …", "options": ["wird gesprochen", "ist stumm"], "a": 1, "why": "Infinitiv-Endung -er klingt wie é."}, {"q": "maison – das s klingt …", "options": ["stimmlos wie in „Bus“", "stimmhaft wie in „Rose“"], "a": 1, "why": "Einfaches s zwischen Vokalen ist stimmhaft."}, {"q": "fille – ill klingt …", "options": ["wie „il“", "wie „ij“"], "a": 1, "why": "ill wird meist wie j gesprochen (Ausnahmen: ville, mille, tranquille)."}, {"q": "bonne – on klingt …", "options": ["nasal [õ]", "nicht nasal [onn]"], "a": 1, "why": "Doppel-n: kein Nasal."}]}, {"type": "gap", "title": "c oder ç, g oder ge?", "task": "Ergänze c, ç, g oder ge.", "items": [{"q": "Il parle fran___ais.", "a": ["ç"], "de": "Er spricht Französisch."}, {"q": "Nous man___ons à huit heures.", "a": ["ge"], "de": "Wir essen um acht Uhr."}, {"q": "Nous commen___ons demain.", "a": ["ç"], "de": "Wir fangen morgen an."}, {"q": "Le ___inéma est fermé.", "a": ["c"], "de": "Das Kino ist geschlossen."}, {"q": "C'est un petit gar___on.", "a": ["ç"], "de": "Das ist ein kleiner Junge."}, {"q": "Nous voya___ons en train.", "a": ["ge"], "de": "Wir reisen mit dem Zug."}, {"q": "J'ai re___u ta lettre.", "a": ["ç"], "de": "Ich habe deinen Brief erhalten."}, {"q": "Elle a mal au ___enou.", "a": ["g"], "de": "Sie hat Knieschmerzen."}]}, {"type": "choice", "title": "Liaison ja oder nein?", "task": "Wird gebunden?", "items": [{"q": "les amis", "options": ["Liaison", "keine Liaison"], "a": 0, "why": "Nach dem Artikel ist die Liaison Pflicht: [lezami]."}, {"q": "vous avez", "options": ["Liaison", "keine Liaison"], "a": 0, "why": "Pronomen + Verb: Pflicht-Liaison."}, {"q": "et elle", "options": ["Liaison", "keine Liaison"], "a": 1, "why": "Nach et nie Liaison."}, {"q": "les héros", "options": ["Liaison", "keine Liaison"], "a": 1, "why": "héros hat ein h aspiré."}, {"q": "un homme", "options": ["Liaison", "keine Liaison"], "a": 0, "why": "homme hat ein stummes h: [ẽnomm]."}, {"q": "deux enfants", "options": ["Liaison", "keine Liaison"], "a": 0, "why": "Zahlwort + Substantiv: Liaison mit z-Laut."}, {"q": "en Italie", "options": ["Liaison", "keine Liaison"], "a": 0, "why": "Nach einsilbigen Präpositionen wird gebunden."}, {"q": "les haricots", "options": ["Liaison", "keine Liaison"], "a": 1, "why": "haricot hat ein h aspiré – Liaison wäre ein typischer Fehler."}]}, {"type": "gap", "title": "Elision", "task": "Setze die richtige Form ein (mit oder ohne Apostroph).", "items": [{"q": "___ hôtel est complet. (le)", "a": ["L'"], "de": "Das Hotel ist ausgebucht."}, {"q": "___ héros du film est jeune. (le)", "a": ["Le"], "de": "Der Held des Films ist jung."}, {"q": "___ aime le chocolat. (je)", "a": ["J'"], "de": "Ich mag Schokolade."}, {"q": "Je ___ ai pas le temps. (ne)", "a": ["n'"], "de": "Ich habe keine Zeit."}, {"q": "Je pense ___ elle a raison. (que)", "a": ["qu'"], "de": "Ich denke, dass sie recht hat."}, {"q": "___ il pleut, on reste ici. (si)", "a": ["S'"], "de": "Wenn es regnet, bleiben wir hier."}, {"q": "___ elle vient, je pars. (si)", "a": ["Si"], "de": "Wenn sie kommt, gehe ich."}, {"q": "C'est le livre ___ Anne. (de)", "a": ["d'"], "de": "Das ist Annes Buch."}]}, {"type": "choice", "title": "Akzent oder nicht?", "task": "Welche Schreibung passt?", "items": [{"q": "Il ___ un chien.", "options": ["a", "à"], "a": 0, "why": "a = er hat (avoir)."}, {"q": "Je vais ___ Paris.", "options": ["a", "à"], "a": 1, "why": "à = nach, in (Präposition)."}, {"q": "___ habites-tu ?", "options": ["Ou", "Où"], "a": 1, "why": "où = wo."}, {"q": "Du thé ___ du café ?", "options": ["ou", "où"], "a": 0, "why": "ou = oder."}, {"q": "Pose le livre ___ la table.", "options": ["sur", "sûr"], "a": 0, "why": "sur = auf."}, {"q": "Tu es ___ ?", "options": ["sur", "sûr"], "a": 1, "why": "sûr = sicher."}, {"q": "Je suis ___, viens !", "options": ["la", "là"], "a": 1, "why": "là = da, hier."}, {"q": "On mange ___ pain.", "options": ["du", "dû"], "a": 0, "why": "du = Teilungsartikel (de + le)."}]}, {"type": "choice", "title": "Groß oder klein?", "task": "Wähle die korrekte Schreibung.", "items": [{"q": "Mon anniversaire est en ___.", "options": ["Mars", "mars"], "a": 1, "why": "Monate werden kleingeschrieben."}, {"q": "Les ___ aiment le fromage.", "options": ["Français", "français"], "a": 0, "why": "Einwohner als Substantiv: groß."}, {"q": "Elle parle ___.", "options": ["Allemand", "allemand"], "a": 1, "why": "Sprachen: klein."}, {"q": "C'est un vin ___.", "options": ["Italien", "italien"], "a": 1, "why": "Adjektive der Nationalität: klein."}, {"q": "On se voit ___.", "options": ["Lundi", "lundi"], "a": 1, "why": "Wochentage: klein."}, {"q": "Bonjour, ___ Martin.", "options": ["Monsieur", "monsieur"], "a": 1, "why": "Anrede mitten im Satz: klein (am Briefanfang: Monsieur)."}, {"q": "Nous habitons en ___.", "options": ["Allemagne", "allemagne"], "a": 0, "why": "Ländernamen: groß."}]}], "cards": [{"f": "Endkonsonanten im Französischen", "b": "meist stumm: petit, trop, vous – außer CaReFuL: c, r, f, l (avec, bonjour, neuf, hôtel)"}, {"f": "ils parlent – wie spricht man -ent?", "b": "stumm: klingt wie il parle"}, {"f": "Wo liegt die Betonung?", "b": "immer auf der letzten gesprochenen Silbe: chocolat, université"}, {"f": "ou / u", "b": "ou = u (vous) · u = ü (tu)"}, {"f": "oi", "b": "wa: moi, trois"}, {"f": "au, eau", "b": "o: chaud, beau"}, {"f": "ai, è, ê", "b": "offenes ä: lait, mère, tête"}, {"f": "é, -er, -ez", "b": "geschlossenes e: été, parler, nez"}, {"f": "Nasalvokal ã", "b": "an, am, en, em: France, temps"}, {"f": "Nasalvokal ẽ", "b": "in, im, ain, ein, un: vin, pain, plein, un"}, {"f": "bon / bonne", "b": "bon [bõ] nasal · bonne [bonn] nicht nasal"}, {"f": "ç", "b": "s-Laut vor a, o, u: ça, garçon, reçu"}, {"f": "nous mangeons – warum ge?", "b": "g bleibt weich vor o nur mit e: mangeons"}, {"f": "gn", "b": "nj: montagne (wie ital. gn, span. ñ)"}, {"f": "ill, -ail, -eil", "b": "j-Laut: fille, travail, soleil · Ausnahmen: ville, mille, tranquille"}, {"f": "s zwischen Vokalen", "b": "stimmhaft: maison, rose · ss stimmlos: poisson ↔ poison"}, {"f": "Liaison", "b": "stummer Endkonsonant wird vor Vokal gebunden: les‿amis, vous‿avez"}, {"f": "Liaison verboten", "b": "nach et und vor h aspiré: et | elle, les | héros"}, {"f": "Elision", "b": "le, la, je, me, te, se, de, ne, que → l', j', m' … vor Vokal/stummem h"}, {"f": "si + il", "b": "s'il – aber si elle (keine Elision)"}, {"f": "h aspiré – was bedeutet das?", "b": "keine Liaison und keine Elision: le héros, la honte, les haricots"}, {"f": "accent aigu / grave", "b": "é = geschlossenes e · è = offenes ä"}, {"f": "accent circonflexe", "b": "oft Ersatz für ein altes s: forêt, hôpital, fête"}, {"f": "a / à · ou / où", "b": "hat / nach · oder / wo"}, {"f": "sur / sûr · la / là", "b": "auf / sicher · die / da"}, {"f": "Leerzeichen bei Satzzeichen", "b": "vor ? ! : ; und innerhalb « »: Tu viens ?"}, {"f": "Kleinschreibung", "b": "Wochentage, Monate, Sprachen, Nationalitäts-Adjektive: lundi, mai, l'allemand, un vin français"}, {"f": "les Français / le français", "b": "die Franzosen (groß) / die französische Sprache (klein)"}]}, {"nr": 2, "id": "k02", "title": "Das Substantiv", "teil": "Das Substantiv und seine Begleiter", "intro": "Jedes französische Substantiv ist maskulin oder feminin – ein Neutrum gibt es nicht. Anders als im Italienischen und Spanischen verrät die Endung das Genus seltener; deshalb lernst du den Artikel am besten immer mit. Der Plural ist meist nur geschrieben, nicht gesprochen.", "sections": [{"h": "Genus: kein einfaches -o/-a", "html": "<p>Im Französischen gibt es keine klare Endungsregel wie <em>-o/-a<\/em> im Italienischen oder Spanischen. Viele Substantive enden auf stummes <em>-e<\/em> – und die können beides sein:<\/p><table><tr><th>maskulin<\/th><th>feminin<\/th><\/tr><tr><td><em>le livre<\/em> das Buch<\/td><td><em>la table<\/em> der Tisch<\/td><\/tr><tr><td><em>le monde<\/em> die Welt<\/td><td><em>la porte<\/em> die Tür<\/td><\/tr><tr><td><em>le musée<\/em> das Museum<\/td><td><em>la chaise<\/em> der Stuhl<\/td><\/tr><tr><td><em>le problème<\/em> das Problem<\/td><td><em>la plage<\/em> der Strand<\/td><\/tr><\/table><p>Das deutsche Genus hilft nicht: <em>la mer<\/em> (das Meer), <em>le soleil<\/em> (die Sonne), <em>la lune<\/em> (der Mond), <em>la voiture<\/em> (das Auto).<\/p><div class='tip'>Merke: Lerne jedes Substantiv mit Artikel – und zwar mit <em>le/la<\/em> oder <em>un/une<\/em>, nicht mit <em>l'<\/em>, denn <em>l'école<\/em> verrät das Genus nicht. Also: <em>une école<\/em> (f), <em>un hôtel<\/em> (m).<\/div><div class='warn'>Achtung – Vergleich mit Italienisch/Spanisch: Viele „gleiche“ Wörter haben ein anderes Genus: <em>la dent<\/em> (il dente), <em>le lait<\/em> (la leche), <em>la fleur<\/em> (il fiore), <em>le sang<\/em> (la sangre).<\/div>"}, {"h": "Endungen, die das Genus verraten", "html": "<p>Einige Endungen sind ziemlich verlässlich:<\/p><table><tr><th>Endung<\/th><th>Genus<\/th><th>Beispiele<\/th><\/tr><tr><td><em>-tion, -sion<\/em><\/td><td>f<\/td><td><em>la nation, la décision<\/em><\/td><\/tr><tr><td><em>-té, -tié<\/em><\/td><td>f<\/td><td><em>la liberté, la société, l'amitié<\/em><\/td><\/tr><tr><td><em>-ence, -ance<\/em><\/td><td>f<\/td><td><em>la patience, la chance<\/em><\/td><\/tr><tr><td><em>-ure<\/em><\/td><td>f<\/td><td><em>la voiture, la culture<\/em><\/td><\/tr><tr><td><em>-ette, -elle<\/em><\/td><td>f<\/td><td><em>la fourchette, la vaisselle<\/em><\/td><\/tr><tr><td><em>-ade, -ude<\/em><\/td><td>f<\/td><td><em>la salade, l'habitude<\/em><\/td><\/tr><tr><td><em>-eur<\/em> (abstrakt)<\/td><td>f<\/td><td><em>la couleur, la peur, la fleur<\/em><\/td><\/tr><tr><td><em>-age<\/em><\/td><td>m<\/td><td><em>le fromage, le voyage, le garage<\/em><\/td><\/tr><tr><td><em>-ment<\/em><\/td><td>m<\/td><td><em>le moment, le gouvernement<\/em><\/td><\/tr><tr><td><em>-isme<\/em><\/td><td>m<\/td><td><em>le tourisme<\/em><\/td><\/tr><tr><td><em>-eau<\/em><\/td><td>m<\/td><td><em>le bateau, le gâteau<\/em><\/td><\/tr><tr><td><em>-oir, -ier<\/em><\/td><td>m<\/td><td><em>le miroir, le cahier<\/em><\/td><\/tr><tr><td><em>-et, -ail<\/em><\/td><td>m<\/td><td><em>le billet, le travail<\/em><\/td><\/tr><tr><td>Konsonant (allg.)<\/td><td>meist m<\/td><td><em>le sac, le lit, le nez<\/em><\/td><\/tr><\/table><div class='warn'>Achtung – wichtige Ausnahmen: <em>la page, la plage, la cage, la nage, l'image (f)<\/em>; <em>l'eau (f), la peau<\/em>; <em>le bonheur, le malheur, le cœur<\/em> (m); <em>le lycée, le musée<\/em> (m, trotz -ée).<\/div><div class='tip'>Merke: Wörter auf <em>-eur<\/em>, die Personen oder Geräte bezeichnen, sind maskulin: <em>le chanteur, l'ordinateur, le moteur<\/em>.<\/div>"}, {"h": "Weitere Genusregeln", "html": "<p><b>Maskulin<\/b> sind:<\/p><ul><li>Wochentage, Monate, Jahreszeiten: <em>le lundi, un mai pluvieux, le printemps<\/em><\/li><li>Sprachen: <em>le français, l'allemand<\/em><\/li><li>Bäume: <em>le chêne, le pommier<\/em><\/li><li>Metalle und Farben: <em>l'or, le bleu<\/em><\/li><li>Länder, die nicht auf <em>-e<\/em> enden: <em>le Portugal, le Japon, le Canada<\/em><\/li><\/ul><p><b>Feminin<\/b> sind:<\/p><ul><li>Länder auf <em>-e<\/em>: <em>la France, l'Allemagne, l'Italie<\/em> (Ausnahme: <em>le Mexique, le Cambodge<\/em>)<\/li><li>Wissenschaften: <em>la biologie, la chimie<\/em><\/li><li>Automarken: <em>une Peugeot, une Renault<\/em><\/li><\/ul><p>Buchstaben sind maskulin: <em>un a, un e<\/em>.<\/p><div class='tip'>Merke: Obstbäume (m) und ihre Früchte (f): <em>le pommier – la pomme, le cerisier – la cerise, le poirier – la poire<\/em>.<\/div>"}, {"h": "Lebewesen: männlich und weiblich", "html": "<p>Bei Personen und vielen Tieren gibt es eine weibliche Form. Die wichtigsten Muster:<\/p><table><tr><th>Muster<\/th><th>männlich<\/th><th>weiblich<\/th><\/tr><tr><td>+ <em>-e<\/em><\/td><td><em>l'ami, l'étudiant, le cousin<\/em><\/td><td><em>l'amie, l'étudiante, la cousine<\/em><\/td><\/tr><tr><td><em>-er → -ère<\/em><\/td><td><em>le boulanger, l'ouvrier<\/em><\/td><td><em>la boulangère, l'ouvrière<\/em><\/td><\/tr><tr><td>Konsonant verdoppeln<\/td><td><em>le Parisien, le chat<\/em><\/td><td><em>la Parisienne, la chatte<\/em><\/td><\/tr><tr><td><em>-eur → -euse<\/em><\/td><td><em>le vendeur, le danseur<\/em><\/td><td><em>la vendeuse, la danseuse<\/em><\/td><\/tr><tr><td><em>-teur → -trice<\/em><\/td><td><em>l'acteur, le directeur<\/em><\/td><td><em>l'actrice, la directrice<\/em><\/td><\/tr><tr><td><em>-e<\/em> bleibt<\/td><td><em>le collègue, le journaliste<\/em><\/td><td><em>la collègue, la journaliste<\/em><\/td><\/tr><tr><td><em>-esse<\/em><\/td><td><em>le prince, le maître<\/em><\/td><td><em>la princesse, la maîtresse<\/em><\/td><\/tr><tr><td>eigenes Wort<\/td><td><em>le père, l'homme, le frère, le roi<\/em><\/td><td><em>la mère, la femme, la sœur, la reine<\/em><\/td><\/tr><\/table><p>Weitere Paare: <em>le neveu – la nièce, l'oncle – la tante, le mari – la femme, le copain – la copine, le coq – la poule<\/em>.<\/p><div class='tip'>Merke: Bei Berufen ist heute die feminine Form üblich: <em>la professeure, l'auteure / l'autrice, la ministre, la médecin<\/em> (umgangssprachlich auch <em>la docteure<\/em>).<\/div><p>Immer feminin, auch für Männer: <em>la personne, la victime, la star, la vedette<\/em>. Immer maskulin: <em>le témoin<\/em>.<\/p>"}, {"h": "Gleiches Wort – anderes Genus, andere Bedeutung", "html": "<table><tr><th>maskulin<\/th><th>feminin<\/th><\/tr><tr><td><em>le livre<\/em> das Buch<\/td><td><em>la livre<\/em> das Pfund<\/td><\/tr><tr><td><em>le tour<\/em> die Runde, Reihe<\/td><td><em>la tour<\/em> der Turm<\/td><\/tr><tr><td><em>le poste<\/em> die Stelle, das Gerät<\/td><td><em>la poste<\/em> die Post<\/td><\/tr><tr><td><em>le mode<\/em> die Art, der Modus<\/td><td><em>la mode<\/em> die Mode<\/td><\/tr><tr><td><em>le manche<\/em> der Stiel<\/td><td><em>la manche<\/em> der Ärmel; <em>la Manche<\/em> der Ärmelkanal<\/td><\/tr><tr><td><em>le mémoire<\/em> die Abschlussarbeit<\/td><td><em>la mémoire<\/em> das Gedächtnis<\/td><\/tr><tr><td><em>le vase<\/em> die Vase<\/td><td><em>la vase<\/em> der Schlamm<\/td><\/tr><tr><td><em>le critique<\/em> der Kritiker<\/td><td><em>la critique<\/em> die Kritik<\/td><\/tr><\/table><p>Beispiele: <em>C'est mon tour.<\/em> – Ich bin dran. <em>La tour Eiffel.<\/em> – Der Eiffelturm. <em>Je vais à la poste.<\/em> – Ich gehe zur Post.<\/p><div class='warn'>Achtung: <em>le vase<\/em> ist maskulin – trotz der deutschen „die Vase“.<\/div>"}, {"h": "Pluralbildung", "html": "<p>Der Regelfall: <b>+ -s<\/b>, das im Gesprochenen stumm ist. Den Plural hört man meist nur am Artikel: <em>le livre<\/em> [lö] – <em>les livres<\/em> [le].<\/p><table><tr><th>Singular<\/th><th>Plural<\/th><th>Beispiele<\/th><\/tr><tr><td>Regel<\/td><td>+ <em>-s<\/em><\/td><td><em>une table → des tables<\/em><\/td><\/tr><tr><td><em>-s, -x, -z<\/em><\/td><td>unverändert<\/td><td><em>le bras → les bras, le prix, le nez<\/em><\/td><\/tr><tr><td><em>-eau, -au, -eu<\/em><\/td><td>+ <em>-x<\/em><\/td><td><em>le bateau → les bateaux, le jeu → les jeux<\/em><\/td><\/tr><tr><td><em>-al<\/em><\/td><td><em>-aux<\/em><\/td><td><em>le journal → les journaux, le cheval → les chevaux<\/em><\/td><\/tr><tr><td><em>-ail<\/em> (einige)<\/td><td><em>-aux<\/em><\/td><td><em>le travail → les travaux<\/em><\/td><\/tr><tr><td><em>-ou<\/em><\/td><td>+ <em>-s<\/em><\/td><td><em>le trou → les trous<\/em><\/td><\/tr><\/table><div class='warn'>Ausnahmen: <em>-al → -als<\/em>: <em>le bal, le festival, le carnaval<\/em>. <em>-eu → -eus<\/em>: <em>le pneu → les pneus<\/em>. <em>-ou → -oux<\/em> bei sieben Wörtern: <em>bijou, caillou, chou, genou, hibou, joujou, pou<\/em>.<\/div><p><b>Unregelmäßig<\/b>:<\/p><ul><li><em>l'œil → les yeux<\/em> (Auge)<\/li><li><em>le ciel → les cieux<\/em> (in der Malerei auch <em>les ciels<\/em>)<\/li><li><em>monsieur → messieurs, madame → mesdames, mademoiselle → mesdemoiselles<\/em><\/li><li><em>un œuf<\/em> [öf] → <em>des œufs<\/em> [ö], <em>un bœuf → des bœufs<\/em> [bö] – Aussprache ändert sich!<\/li><\/ul>"}, {"h": "Pluralwörter und Gruppen", "html": "<p>Der <b>maskuline Plural<\/b> bezeichnet auch gemischte Gruppen:<\/p><table><tr><th>Plural<\/th><th>Bedeutung<\/th><\/tr><tr><td><em>les parents<\/em><\/td><td>die Eltern (auch: Verwandte)<\/td><\/tr><tr><td><em>les enfants<\/em><\/td><td>die Kinder<\/td><\/tr><tr><td><em>les grands-parents<\/em><\/td><td>die Großeltern<\/td><\/tr><tr><td><em>les frères et sœurs<\/em><\/td><td>die Geschwister (kein eigenes Wort!)<\/td><\/tr><tr><td><em>les amis<\/em><\/td><td>Freunde und Freundinnen<\/td><\/tr><\/table><div class='warn'>Achtung: Anders als im Italienischen (<em>i fratelli<\/em>) und Spanischen (<em>los hermanos<\/em>) heißt „Geschwister“ nicht <em>les frères<\/em>, sondern <em>les frères et sœurs<\/em>: <em>Tu as des frères et sœurs ?<\/em><\/div><p><b>Nur im Plural<\/b> stehen u. a.: <em>les vacances<\/em> (Ferien), <em>les gens<\/em> (Leute), <em>les environs<\/em> (Umgebung), <em>les fiançailles<\/em> (Verlobung), <em>les mœurs<\/em> (Sitten), <em>les frais<\/em> (Kosten), <em>les lunettes<\/em> (Brille).<\/p><p>Umgekehrt ist im Französischen Singular, was im Deutschen Plural ist: <em>le pantalon<\/em> (die Hose), <em>le short<\/em>, <em>le jean<\/em>.<\/p><div class='tip'>Merke: <em>la vacance<\/em> (Singular) bedeutet „freie Stelle“; die Ferien sind immer <em>les vacances<\/em>: <em>Bonnes vacances !<\/em><\/div>"}, {"h": "Zusammengesetzte Substantive", "html": "<p>Französisch bildet Zusammensetzungen meist mit Präposition – nicht wie das Deutsche durch Aneinanderreihen:<\/p><table><tr><th>Französisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>la salle de bains<\/em><\/td><td>das Badezimmer<\/td><\/tr><tr><td><em>la machine à laver<\/em><\/td><td>die Waschmaschine<\/td><\/tr><tr><td><em>le verre à vin<\/em><\/td><td>das Weinglas (Glas für Wein)<\/td><\/tr><tr><td><em>le verre de vin<\/em><\/td><td>das Glas Wein<\/td><\/tr><tr><td><em>la tarte aux pommes<\/em><\/td><td>der Apfelkuchen<\/td><\/tr><tr><td><em>le pull en laine<\/em><\/td><td>der Wollpullover<\/td><\/tr><tr><td><em>le chemin de fer<\/em><\/td><td>die Eisenbahn<\/td><\/tr><\/table><ul><li><em>de<\/em>: Inhalt, Zugehörigkeit (<em>une tasse de café<\/em>)<\/li><li><em>à<\/em>: Zweck oder Zutat (<em>une tasse à café, une glace à la vanille<\/em>)<\/li><li><em>en<\/em>: Material (<em>une table en bois<\/em>)<\/li><\/ul><p>Mit Bindestrich: <em>le grand-père, le chou-fleur, l'arc-en-ciel<\/em>. Plural: Substantive und Adjektive werden verändert, Verben und Präpositionen nicht: <em>les grands-pères, les choux-fleurs<\/em>, aber <em>les tire-bouchons, les arcs-en-ciel<\/em>.<\/p>"}], "exercises": [{"type": "choice", "title": "le oder la?", "task": "Wähle den richtigen Artikel.", "items": [{"q": "___ nation", "options": ["le", "la"], "a": 1, "why": "-tion → feminin."}, {"q": "___ fromage", "options": ["le", "la"], "a": 0, "why": "-age → meist maskulin."}, {"q": "___ plage", "options": ["le", "la"], "a": 1, "why": "la plage ist eine Ausnahme bei -age."}, {"q": "___ moment", "options": ["le", "la"], "a": 0, "why": "-ment → maskulin."}, {"q": "___ liberté", "options": ["le", "la"], "a": 1, "why": "-té → feminin."}, {"q": "___ problème", "options": ["le", "la"], "a": 0, "why": "problème ist maskulin (griechisch -ème)."}, {"q": "___ musée", "options": ["le", "la"], "a": 0, "why": "le musée ist maskulin trotz -ée."}, {"q": "___ couleur", "options": ["le", "la"], "a": 1, "why": "Abstrakta auf -eur sind feminin."}, {"q": "___ bateau", "options": ["le", "la"], "a": 0, "why": "-eau → maskulin."}, {"q": "___ mer", "options": ["le", "la"], "a": 1, "why": "la mer – muss man lernen."}]}, {"type": "choice", "title": "Länder und Sachgruppen", "task": "Maskulin oder feminin?", "items": [{"q": "___ Portugal", "options": ["le", "la"], "a": 0, "why": "Land, das nicht auf -e endet → maskulin."}, {"q": "___ Belgique", "options": ["le", "la"], "a": 1, "why": "Land auf -e → feminin."}, {"q": "___ Mexique", "options": ["le", "la"], "a": 0, "why": "Ausnahme: le Mexique."}, {"q": "___ printemps", "options": ["le", "la"], "a": 0, "why": "Jahreszeiten sind maskulin."}, {"q": "___ chimie", "options": ["le", "la"], "a": 1, "why": "Wissenschaften sind feminin."}, {"q": "___ pommier", "options": ["le", "la"], "a": 0, "why": "Bäume sind maskulin."}, {"q": "___ pomme", "options": ["le", "la"], "a": 1, "why": "Die Frucht ist feminin."}, {"q": "___ eau", "options": ["l' (m)", "l' (f)"], "a": 1, "why": "l'eau ist feminin: l'eau froide."}]}, {"type": "gap", "title": "Die weibliche Form", "task": "Bilde die weibliche Entsprechung.", "items": [{"q": "le vendeur → la ___", "a": ["vendeuse"], "de": "der Verkäufer → die Verkäuferin"}, {"q": "l'acteur → l'___", "a": ["actrice"], "de": "der Schauspieler → die Schauspielerin"}, {"q": "le boulanger → la ___", "a": ["boulangère"], "de": "der Bäcker → die Bäckerin"}, {"q": "le Parisien → la ___", "a": ["Parisienne"], "de": "der Pariser → die Pariserin"}, {"q": "le collègue → la ___", "a": ["collègue"], "de": "der Kollege → die Kollegin"}, {"q": "le neveu → la ___", "a": ["nièce"], "de": "der Neffe → die Nichte"}, {"q": "le prince → la ___", "a": ["princesse"], "de": "der Prinz → die Prinzessin"}, {"q": "le copain → la ___", "a": ["copine"], "de": "der Kumpel → die Freundin"}, {"q": "le directeur → la ___", "a": ["directrice"], "de": "der Direktor → die Direktorin"}]}, {"type": "gap", "title": "Der Plural", "task": "Setze die Pluralform ein.", "items": [{"q": "un journal → des ___", "a": ["journaux"], "de": "Zeitungen"}, {"q": "un gâteau → des ___", "a": ["gâteaux"], "de": "Kuchen"}, {"q": "un prix → des ___", "a": ["prix"], "de": "Preise"}, {"q": "un festival → des ___", "a": ["festivals"], "de": "Festivals"}, {"q": "un œil → des ___", "a": ["yeux"], "de": "Augen"}, {"q": "un genou → des ___", "a": ["genoux"], "de": "Knie"}, {"q": "un jeu → des ___", "a": ["jeux"], "de": "Spiele"}, {"q": "un pneu → des ___", "a": ["pneus"], "de": "Reifen"}, {"q": "monsieur → ___", "a": ["messieurs"], "de": "meine Herren"}, {"q": "un travail → des ___", "a": ["travaux"], "de": "Arbeiten, Bauarbeiten"}]}, {"type": "choice", "title": "Genus und Bedeutung", "task": "Welcher Artikel passt zur Bedeutung?", "items": [{"q": "Nous avons visité ___ tour Eiffel.", "options": ["le", "la"], "a": 1, "why": "la tour = der Turm."}, {"q": "On fait ___ tour du lac ?", "options": ["le", "la"], "a": 0, "why": "le tour = die Runde."}, {"q": "Elle a perdu ___ mémoire.", "options": ["le", "la"], "a": 1, "why": "la mémoire = das Gedächtnis."}, {"q": "Je cherche ___ poste de directeur.", "options": ["un", "une"], "a": 0, "why": "le poste = die Stelle."}, {"q": "Il achète une ___ de beurre.", "options": ["livre", "tour"], "a": 0, "why": "une livre = ein Pfund."}, {"q": "Elle aime ___ mode italienne.", "options": ["le", "la"], "a": 1, "why": "la mode = die Mode."}, {"q": "Il a mis des fleurs dans ___ vase.", "options": ["le", "la"], "a": 0, "why": "le vase = die Vase."}]}, {"type": "choice", "title": "Zusammensetzungen", "task": "de, à oder en?", "items": [{"q": "une tasse ___ thé (eine Tasse Tee)", "options": ["de", "à", "en"], "a": 0, "why": "Inhalt → de."}, {"q": "une tasse ___ thé (eine Teetasse)", "options": ["de", "à", "en"], "a": 1, "why": "Zweck → à."}, {"q": "une montre ___ or", "options": ["de", "à", "en"], "a": 2, "why": "Material → en."}, {"q": "une machine ___ laver", "options": ["de", "à", "en"], "a": 1, "why": "Zweck mit Infinitiv → à."}, {"q": "la salle ___ bains", "options": ["de", "à", "en"], "a": 0, "why": "feste Wendung: la salle de bains."}, {"q": "une tarte ___ pommes", "options": ["de", "aux", "en"], "a": 1, "why": "Zutat → à + Artikel: aux pommes."}, {"q": "Tu as des ___ ?", "options": ["frères", "frères et sœurs"], "a": 1, "why": "Geschwister = frères et sœurs."}]}], "cards": [{"f": "Wie lernt man das Genus am besten?", "b": "immer mit Artikel, und zwar un/une oder le/la – nicht mit l'"}, {"f": "-tion, -té, -ence, -ure, -ette", "b": "feminin: la nation, la liberté, la patience, la voiture, la fourchette"}, {"f": "-age, -ment, -isme, -eau, -ier", "b": "maskulin: le voyage, le moment, le tourisme, le bateau, le cahier"}, {"f": "Ausnahmen bei -age", "b": "la page, la plage, la cage, la nage, l'image (f)"}, {"f": "-eur: Genus?", "b": "Abstrakta feminin (la peur, la couleur), Personen/Geräte maskulin (le chanteur, l'ordinateur); le bonheur, le cœur!"}, {"f": "le musée, le lycée", "b": "maskulin trotz -ée"}, {"f": "Länder: Genus", "b": "auf -e feminin (la France), sonst maskulin (le Portugal) · Ausnahme: le Mexique"}, {"f": "Wochentage, Monate, Jahreszeiten, Sprachen", "b": "maskulin: le lundi, le printemps, le français"}, {"f": "-eur → ? / -teur → ?", "b": "-euse (vendeuse) / -trice (actrice)"}, {"f": "-ien → ?", "b": "-ienne: Parisien → Parisienne"}, {"f": "la personne, la victime", "b": "immer feminin, auch für Männer"}, {"f": "le livre / la livre", "b": "das Buch / das Pfund"}, {"f": "le tour / la tour", "b": "die Runde / der Turm"}, {"f": "le poste / la poste", "b": "die Stelle / die Post"}, {"f": "le mode / la mode", "b": "die Art, Modus / die Mode"}, {"f": "la mémoire / le mémoire", "b": "das Gedächtnis / die Abschlussarbeit"}, {"f": "Plural: Regel und Aussprache", "b": "+ s, stumm – den Plural hört man am Artikel: le/les"}, {"f": "Plural von -al", "b": "-aux: journal → journaux (Ausnahmen: bals, festivals, carnavals)"}, {"f": "Plural von -eau, -eu", "b": "+ x: bateaux, jeux (Ausnahme: pneus)"}, {"f": "Die 7 Wörter auf -ou mit -x", "b": "bijoux, cailloux, choux, genoux, hiboux, joujoux, poux"}, {"f": "l'œil → ?", "b": "les yeux"}, {"f": "un œuf / des œufs – Aussprache", "b": "[öf] / [ö] – das f verstummt im Plural"}, {"f": "Geschwister", "b": "les frères et sœurs"}, {"f": "Nur Plural: Ferien, Leute, Kosten, Brille", "b": "les vacances, les gens, les frais, les lunettes"}, {"f": "die Hose", "b": "le pantalon (Singular!)"}, {"f": "une tasse de café / une tasse à café", "b": "eine Tasse Kaffee / eine Kaffeetasse"}, {"f": "Material bei Zusammensetzungen", "b": "en: une table en bois, un pull en laine"}]}, {"nr": 3, "id": "k03", "title": "Der Artikel", "teil": "Das Substantiv und seine Begleiter", "intro": "Im Französischen steht fast nie ein Substantiv ohne Begleiter. Neben dem bestimmten und unbestimmten Artikel gibt es den Teilungsartikel für unbestimmte Mengen – eine Besonderheit, die es im Deutschen und Spanischen nicht gibt, im Italienischen nur ansatzweise.", "sections": [{"h": "Der bestimmte Artikel", "html": "<table><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>maskulin<\/td><td><em>le<\/em> livre<\/td><td><em>les<\/em> livres<\/td><\/tr><tr><td>feminin<\/td><td><em>la<\/em> table<\/td><td><em>les<\/em> tables<\/td><\/tr><tr><td>vor Vokal / stummem h<\/td><td><em>l'<\/em>ami, <em>l'<\/em>heure<\/td><td><em>les‿<\/em>amis (Liaison)<\/td><\/tr><\/table><p>Der Plural <em>les<\/em> ist für beide Genera gleich – deutlich einfacher als im Italienischen (<em>i, gli, le<\/em>).<\/p><p>Der bestimmte Artikel steht – häufiger als im Deutschen –<\/p><ul><li>bei <b>Allgemeinbegriffen<\/b> und Vorlieben: <em>J'aime le chocolat.<\/em> Ich mag Schokolade. <em>La vie est belle.<\/em><\/li><li>bei <b>Ländern, Regionen, Flüssen<\/b>: <em>la France, le Rhin, la Provence<\/em><\/li><li>bei Titeln vor Namen: <em>le président Macron, la reine Élisabeth<\/em><\/li><li>bei Körperteilen (statt Possessiv): <em>Il a les yeux bleus. J'ai mal à la tête.<\/em><\/li><li>bei Wochentagen für Gewohnheiten: <em>le lundi<\/em> = montags<\/li><li>bei Datumsangaben: <em>le 14 juillet<\/em><\/li><\/ul><div class='warn'>Achtung: <em>J'aime le café<\/em> (Vorliebe → bestimmter Artikel), aber <em>Je bois du café<\/em> (Menge → Teilungsartikel). Nach den Verben der Vorliebe – <em>aimer, adorer, préférer, détester<\/em> – steht immer der bestimmte Artikel.<\/div>"}, {"h": "Der unbestimmte Artikel", "html": "<table><tr><th><\/th><th>Singular<\/th><th>Plural<\/th><\/tr><tr><td>maskulin<\/td><td><em>un<\/em> livre<\/td><td><em>des<\/em> livres<\/td><\/tr><tr><td>feminin<\/td><td><em>une<\/em> table<\/td><td><em>des<\/em> tables<\/td><\/tr><\/table><p>Anders als im Deutschen gibt es einen <b>Plural<\/b>: <em>des<\/em>. Er muss stehen, wo das Deutsche gar keinen Artikel hat:<\/p><ul><li><em>J'ai des amis à Lyon.<\/em> – Ich habe Freunde in Lyon.<\/li><li><em>Il y a des pommes.<\/em> – Es gibt Äpfel.<\/li><\/ul><p><b>Kein Artikel<\/b> steht nach <em>être<\/em> und <em>devenir<\/em> bei Beruf, Nationalität, Religion – ohne Adjektiv:<\/p><ul><li><em>Il est médecin.<\/em> – Er ist Arzt.<\/li><li><em>Elle est française.<\/em> – Sie ist Französin.<\/li><\/ul><div class='warn'>Achtung: Mit Adjektiv oder mit <em>c'est<\/em> steht der Artikel: <em>C'est un médecin.<\/em> <em>Il est un bon médecin<\/em> → besser: <em>C'est un bon médecin.<\/em><\/div><div class='tip'>Merke: Vor einem vorangestellten Adjektiv im Plural wird <em>des<\/em> in der gehobenen Sprache zu <em>de<\/em>: <em>de beaux jours, de grandes maisons<\/em>. Umgangssprachlich hört man auch <em>des<\/em>.<\/div>"}, {"h": "à und de mit Artikel verschmolzen", "html": "<p>Die Präpositionen <em>à<\/em> und <em>de<\/em> verschmelzen mit <em>le<\/em> und <em>les<\/em>:<\/p><table><tr><th><\/th><th>+ le<\/th><th>+ la<\/th><th>+ l'<\/th><th>+ les<\/th><\/tr><tr><td><em>à<\/em><\/td><td><em>au<\/em><\/td><td><em>à la<\/em><\/td><td><em>à l'<\/em><\/td><td><em>aux<\/em><\/td><\/tr><tr><td><em>de<\/em><\/td><td><em>du<\/em><\/td><td><em>de la<\/em><\/td><td><em>de l'<\/em><\/td><td><em>des<\/em><\/td><\/tr><\/table><ul><li><em>Je vais au cinéma, à la plage, à l'hôtel, aux États-Unis.<\/em><\/li><li><em>Il rentre du travail, de la gare, de l'école, des Pays-Bas.<\/em><\/li><li><em>le prix du billet<\/em> – der Preis der Fahrkarte; <em>la voiture des voisins<\/em> – das Auto der Nachbarn<\/li><\/ul><div class='warn'>Achtung: <em>la<\/em> und <em>l'<\/em> verschmelzen nie: <em>à la, de l'<\/em>. Und <em>le/les<\/em> als Objektpronomen verschmelzen ebenfalls nicht: <em>Je commence à le faire.<\/em><\/div><div class='tip'>Merke: Wie ital. <em>al, del<\/em> oder span. <em>al, del<\/em> – nur gibt es im Französischen auch die Pluralformen <em>aux, des<\/em>.<\/div>"}, {"h": "Der Teilungsartikel", "html": "<p>Für eine <b>unbestimmte Menge<\/b> von etwas Nicht-Zählbarem (Essen, Getränke, Stoffe, Abstrakta) steht der Teilungsartikel <em>du, de la, de l'<\/em>. Im Deutschen steht hier gar nichts:<\/p><table><tr><th><\/th><th>Form<\/th><th>Beispiel<\/th><\/tr><tr><td>maskulin<\/td><td><em>du<\/em><\/td><td><em>Je mange du pain.<\/em> Ich esse Brot.<\/td><\/tr><tr><td>feminin<\/td><td><em>de la<\/em><\/td><td><em>Tu veux de la confiture ?<\/em> Willst du Marmelade?<\/td><\/tr><tr><td>vor Vokal<\/td><td><em>de l'<\/em><\/td><td><em>Il boit de l'eau.<\/em> Er trinkt Wasser.<\/td><\/tr><tr><td>Plural<\/td><td><em>des<\/em><\/td><td><em>On achète des épinards.<\/em> Wir kaufen Spinat.<\/td><\/tr><\/table><p>Auch bei Abstrakta und Aktivitäten: <em>Il a du courage. Elle a de la chance. Il fait du sport, du piano, de la natation.<\/em><\/p><div class='tip'>Merke: Faustregel – kann man im Deutschen „etwas“ davorsetzen, steht der Teilungsartikel: <em>Je voudrais du fromage<\/em> = (etwas) Käse.<\/div><div class='warn'>Achtung: Bestimmter Artikel für das Ganze/Allgemeine, Teilungsartikel für eine Menge: <em>Le vin est cher.<\/em> (Wein allgemein) – <em>Tu prends du vin ?<\/em> (etwas Wein) – <em>Tu prends le vin ?<\/em> (den bestimmten Wein dort).<\/div>"}, {"h": "de nach Verneinung", "html": "<p>Nach einer <b>Verneinung<\/b> werden <em>un, une, des<\/em> und der Teilungsartikel zu <em>de<\/em> (vor Vokal <em>d'<\/em>):<\/p><table><tr><th>bejaht<\/th><th>verneint<\/th><\/tr><tr><td><em>J'ai une voiture.<\/em><\/td><td><em>Je n'ai pas de voiture.<\/em><\/td><\/tr><tr><td><em>Il y a des œufs.<\/em><\/td><td><em>Il n'y a pas d'œufs.<\/em><\/td><\/tr><tr><td><em>Elle boit du lait.<\/em><\/td><td><em>Elle ne boit pas de lait.<\/em><\/td><\/tr><tr><td><em>On a de l'argent.<\/em><\/td><td><em>On n'a plus d'argent.<\/em><\/td><\/tr><\/table><div class='warn'>Achtung – der bestimmte Artikel bleibt: <em>Je n'aime pas le lait.<\/em> Und nach <em>être<\/em> bleibt auch <em>un/une/des<\/em>: <em>Ce n'est pas un chat, c'est un chien.<\/em><\/div><div class='tip'>Merke: Auch bei Gegenüberstellung bleibt der Artikel: <em>Je ne bois pas du vin, je bois de l'eau.<\/em> („nicht Wein, sondern …“)<\/div>"}, {"h": "de nach Mengenangaben", "html": "<p>Nach <b>Mengenangaben<\/b> steht nur <em>de<\/em> ohne Artikel:<\/p><table><tr><th>Mengenwort<\/th><th>Beispiel<\/th><\/tr><tr><td><em>beaucoup de<\/em> viel<\/td><td><em>beaucoup de travail<\/em><\/td><\/tr><tr><td><em>peu de<\/em> wenig<\/td><td><em>peu de temps<\/em><\/td><\/tr><tr><td><em>trop de<\/em> zu viel<\/td><td><em>trop de sucre<\/em><\/td><\/tr><tr><td><em>assez de<\/em> genug<\/td><td><em>assez d'argent<\/em><\/td><\/tr><tr><td><em>un peu de<\/em> ein wenig<\/td><td><em>un peu de lait<\/em><\/td><\/tr><tr><td><em>combien de<\/em> wie viel<\/td><td><em>combien de personnes ?<\/em><\/td><\/tr><tr><td><em>plus de / moins de<\/em><\/td><td><em>plus de place<\/em><\/td><\/tr><tr><td>Maße und Gefäße<\/td><td><em>un kilo de pommes, une bouteille de vin, un verre d'eau, une tranche de jambon<\/em><\/td><\/tr><\/table><div class='warn'>Ausnahmen: <em>la plupart des<\/em> (die meisten), <em>bien des<\/em> (viele) und <em>la moitié de la/du<\/em> stehen mit Artikel: <em>La plupart des gens sont d'accord.<\/em><\/div><p>Mit bestimmter Menge, die schon bekannt ist, steht der Artikel: <em>beaucoup des amis de Paul<\/em> – viele der Freunde von Paul.<\/p>"}, {"h": "Ohne Artikel", "html": "<p>Kein Artikel steht<\/p><ul><li>bei Berufen und Nationalitäten nach <em>être<\/em>: <em>Il est boulanger.<\/em><\/li><li>in Aufzählungen und Überschriften: <em>Hommes, femmes, enfants, tous étaient là.<\/em><\/li><li>in vielen festen Wendungen mit <em>avoir/faire/prendre<\/em>: <em>avoir faim, avoir peur, avoir raison, faire attention, prendre feu<\/em><\/li><li>nach <em>en<\/em>: <em>en voiture, en France, en été<\/em><\/li><li>bei <em>de<\/em> + Substantiv als nähere Bestimmung: <em>un professeur d'anglais, un jus d'orange<\/em><\/li><li>nach <em>avec/sans<\/em> bei Abstrakta: <em>avec plaisir, sans problème<\/em><\/li><li>bei Städtenamen: <em>Paris, Berlin<\/em> (aber <em>Le Havre, La Rochelle<\/em> mit festem Artikel)<\/li><\/ul><div class='tip'>Merke: <em>J'ai besoin d'argent<\/em> – Ich brauche Geld: Nach <em>avoir besoin de, manquer de<\/em> fällt der Teilungsartikel weg (sonst <em>de + du<\/em>).<\/div>"}], "exercises": [{"type": "gap", "title": "au, à la, à l', aux", "task": "Setze à + Artikel ein.", "items": [{"q": "Ce soir, on va ___ cinéma.", "a": ["au"], "de": "Heute Abend gehen wir ins Kino."}, {"q": "Les enfants sont ___ école.", "a": ["à l'"], "de": "Die Kinder sind in der Schule."}, {"q": "Elle habite ___ États-Unis.", "a": ["aux"], "de": "Sie wohnt in den USA."}, {"q": "Je vais ___ plage.", "a": ["à la"], "de": "Ich gehe an den Strand."}, {"q": "Il a mal ___ dos.", "a": ["au"], "de": "Er hat Rückenschmerzen."}, {"q": "Une glace ___ fraise, s'il vous plaît.", "a": ["à la"], "de": "Ein Erdbeereis, bitte."}, {"q": "Nous parlons ___ voisins.", "a": ["aux"], "de": "Wir sprechen mit den Nachbarn."}, {"q": "On se retrouve ___ hôtel.", "a": ["à l'"], "de": "Wir treffen uns im Hotel."}]}, {"type": "gap", "title": "du, de la, de l', des", "task": "Setze de + Artikel ein.", "items": [{"q": "Le livre ___ professeur est sur la table.", "a": ["du"], "de": "Das Buch des Lehrers liegt auf dem Tisch."}, {"q": "Elle revient ___ gare.", "a": ["de la"], "de": "Sie kommt vom Bahnhof zurück."}, {"q": "C'est la fin ___ vacances.", "a": ["des"], "de": "Das ist das Ende der Ferien."}, {"q": "Il sort ___ hôpital demain.", "a": ["de l'"], "de": "Er kommt morgen aus dem Krankenhaus."}, {"q": "Le prix ___ essence augmente.", "a": ["de l'"], "de": "Der Benzinpreis steigt."}, {"q": "Je parle ___ film d'hier.", "a": ["du"], "de": "Ich spreche über den Film von gestern."}, {"q": "La chambre ___ enfants est en haut.", "a": ["des"], "de": "Das Kinderzimmer ist oben."}]}, {"type": "choice", "title": "Bestimmter Artikel oder Teilungsartikel?", "task": "Wähle die passende Form.", "items": [{"q": "J'adore ___ chocolat.", "options": ["le", "du"], "a": 0, "why": "Vorliebe (adorer) → bestimmter Artikel."}, {"q": "Tu veux ___ chocolat ?", "options": ["le", "du"], "a": 1, "why": "Unbestimmte Menge → Teilungsartikel."}, {"q": "Il boit ___ eau minérale.", "options": ["l'", "de l'"], "a": 1, "why": "Menge → de l'."}, {"q": "Je déteste ___ bière.", "options": ["la", "de la"], "a": 0, "why": "détester → bestimmter Artikel."}, {"q": "Elle fait ___ yoga le mardi.", "options": ["le", "du"], "a": 1, "why": "faire du sport/yoga."}, {"q": "Il a ___ patience avec les enfants.", "options": ["la", "de la"], "a": 1, "why": "Abstraktum als Menge → de la."}, {"q": "___ riz est prêt.", "options": ["Le", "Du"], "a": 0, "why": "Ein bestimmter Reis (der Reis ist fertig)."}, {"q": "On mange ___ poisson ce soir.", "options": ["le", "du"], "a": 1, "why": "etwas Fisch → du."}]}, {"type": "choice", "title": "Verneinung und Mengen", "task": "Welche Form ist richtig?", "items": [{"q": "Je n'ai pas ___ temps.", "options": ["du", "de", "le"], "a": 1, "why": "Nach Verneinung → de."}, {"q": "Il n'y a plus ___ œufs.", "options": ["des", "de", "d'"], "a": 2, "why": "de vor Vokal → d'."}, {"q": "Je n'aime pas ___ café.", "options": ["du", "de", "le"], "a": 2, "why": "Bestimmter Artikel bleibt nach Verneinung."}, {"q": "Ce n'est pas ___ problème.", "options": ["de", "un"], "a": 1, "why": "Nach être bleibt un."}, {"q": "Il y a beaucoup ___ monde.", "options": ["du", "de"], "a": 1, "why": "Mengenwort + de."}, {"q": "Un kilo ___ tomates, s'il vous plaît.", "options": ["des", "de"], "a": 1, "why": "Maßangabe + de."}, {"q": "La plupart ___ élèves sont là.", "options": ["de", "des"], "a": 1, "why": "Ausnahme: la plupart des."}, {"q": "J'ai besoin ___ argent.", "options": ["de l'", "d'"], "a": 1, "why": "avoir besoin de + Menge → nur d'."}]}, {"type": "gap", "title": "Gemischte Lücken", "task": "Setze den passenden Artikel ein (un, une, des, du, de la, de l', de, d', le, la, l', les) – oder lass das Feld mit „–“, wenn keiner steht.", "items": [{"q": "Mon frère est ___ ingénieur.", "a": ["–", "-"], "de": "Mein Bruder ist Ingenieur."}, {"q": "C'est ___ ingénieur très connu.", "a": ["un"], "de": "Er ist ein sehr bekannter Ingenieur."}, {"q": "Nous avons ___ amis à Marseille.", "a": ["des"], "de": "Wir haben Freunde in Marseille."}, {"q": "Elle a ___ cheveux longs.", "a": ["les"], "de": "Sie hat lange Haare."}, {"q": "Il fait ___ vélo tous les jours.", "a": ["du"], "de": "Er fährt jeden Tag Fahrrad."}, {"q": "Je voudrais un verre ___ eau.", "a": ["d'"], "de": "Ich hätte gern ein Glas Wasser."}, {"q": "Il n'a pas ___ voiture.", "a": ["de"], "de": "Er hat kein Auto."}, {"q": "___ Suisse est un beau pays.", "a": ["La"], "de": "Die Schweiz ist ein schönes Land."}, {"q": "Ce sont ___ belles fleurs.", "a": ["de"], "de": "Das sind schöne Blumen."}]}, {"type": "choice", "title": "Mit oder ohne Artikel?", "task": "Wähle die richtige Variante.", "items": [{"q": "Elle est ___.", "options": ["une avocate", "avocate"], "a": 1, "why": "Beruf nach être ohne Adjektiv → kein Artikel."}, {"q": "C'est ___.", "options": ["une avocate", "avocate"], "a": 0, "why": "Nach c'est steht der Artikel."}, {"q": "Il voyage ___.", "options": ["en le train", "en train"], "a": 1, "why": "Nach en kein Artikel."}, {"q": "J'ai ___.", "options": ["faim", "la faim"], "a": 0, "why": "avoir faim – feste Wendung ohne Artikel."}, {"q": "Je l'ai fait ___.", "options": ["avec le plaisir", "avec plaisir"], "a": 1, "why": "avec + Abstraktum ohne Artikel."}, {"q": "Sonntags schlafe ich lange: ___ je dors longtemps.", "options": ["Le dimanche,", "Dimanche,", "Au dimanche,"], "a": 0, "why": "le dimanche = sonntags (Gewohnheit); dimanche ohne Artikel = diesen Sonntag."}]}], "cards": [{"f": "Bestimmter Artikel: Formen", "b": "le, la, l', les"}, {"f": "Unbestimmter Artikel: Formen", "b": "un, une, des"}, {"f": "à + le / à + les", "b": "au / aux"}, {"f": "de + le / de + les", "b": "du / des"}, {"f": "à + la, de + l' – verschmelzen?", "b": "Nein: à la, à l', de la, de l'"}, {"f": "Teilungsartikel", "b": "du, de la, de l', des – für unbestimmte Mengen: du pain, de l'eau"}, {"f": "J'aime le café / Je bois du café", "b": "Vorliebe → bestimmter Artikel · Menge → Teilungsartikel"}, {"f": "Verben der Vorliebe", "b": "aimer, adorer, préférer, détester + bestimmter Artikel"}, {"f": "Ich habe Freunde in Lyon.", "b": "J'ai des amis à Lyon. (des ist Pflicht)"}, {"f": "Artikel nach Verneinung", "b": "un/une/des/du/de la → de: Je n'ai pas de voiture."}, {"f": "Bleibt nach Verneinung erhalten", "b": "bestimmter Artikel (Je n'aime pas le lait) und un/des nach être (Ce n'est pas un chat)"}, {"f": "Mengenangaben + ?", "b": "de ohne Artikel: beaucoup de, peu de, trop de, un kilo de"}, {"f": "die meisten Leute", "b": "la plupart des gens (mit Artikel!)"}, {"f": "des + vorangestelltes Adjektiv", "b": "de: de beaux jours, de grandes maisons"}, {"f": "Er ist Arzt.", "b": "Il est médecin. (kein Artikel) – C'est un médecin."}, {"f": "Körperteile", "b": "bestimmter Artikel statt Possessiv: J'ai mal à la tête. Il a les yeux bleus."}, {"f": "montags", "b": "le lundi"}, {"f": "faire + Sport/Instrument", "b": "faire du sport, du vélo, de la natation, du piano"}, {"f": "Ich brauche Geld.", "b": "J'ai besoin d'argent. (nur de)"}, {"f": "Länder und Artikel", "b": "mit Artikel: la France, le Japon · Städte ohne: Paris"}, {"f": "avoir faim, avoir peur, avoir raison", "b": "feste Wendungen ohne Artikel"}, {"f": "Ce n'est pas du vin, c'est de l'eau.", "b": "Bei Gegenüberstellung bleibt der Teilungsartikel"}, {"f": "un jus d'orange, un professeur d'anglais", "b": "de + Substantiv ohne Artikel als nähere Bestimmung"}, {"f": "Faustregel Teilungsartikel", "b": "wo man auf Deutsch „etwas“ einsetzen kann"}, {"f": "Plural des bestimmten Artikels", "b": "les – für maskulin und feminin gleich"}]}, {"nr": 4, "id": "k04", "title": "Das Adjektiv", "teil": "Das Substantiv und seine Begleiter", "intro": "Französische Adjektive richten sich in Genus und Zahl nach ihrem Substantiv – oft nur in der Schrift, manchmal auch hörbar. Dieses Kapitel zeigt die Bildung der weiblichen Form und des Plurals, die Stellung vor oder nach dem Substantiv und die Steigerung.", "sections": [{"h": "Die weibliche Form: Grundregel", "html": "<p>Die feminine Form bildet man meist mit <b>+ -e<\/b>. Ist der Endkonsonant im Maskulinum stumm, wird er dadurch hörbar:<\/p><table><tr><th>maskulin<\/th><th>feminin<\/th><th>Aussprache<\/th><\/tr><tr><td><em>petit<\/em><\/td><td><em>petite<\/em><\/td><td>[pti] – [ptit]<\/td><\/tr><tr><td><em>grand<\/em><\/td><td><em>grande<\/em><\/td><td>[grã] – [grãd]<\/td><\/tr><tr><td><em>français<\/em><\/td><td><em>française<\/em><\/td><td>[frãsä] – [frãsäs]<\/td><\/tr><tr><td><em>joli<\/em><\/td><td><em>jolie<\/em><\/td><td>gleich<\/td><\/tr><tr><td><em>bleu<\/em><\/td><td><em>bleue<\/em><\/td><td>gleich<\/td><\/tr><\/table><p>Endet das Adjektiv schon auf <em>-e<\/em>, bleibt es gleich: <em>un livre rouge – une robe rouge, facile, jeune, sympathique<\/em>.<\/p><div class='warn'>Achtung: <em>-é<\/em> ist kein stummes e: <em>fatigué → fatiguée, aimé → aimée<\/em>.<\/div>"}, {"h": "Besondere feminine Formen", "html": "<table><tr><th>Endung<\/th><th>feminin<\/th><th>Beispiele<\/th><\/tr><tr><td><em>-er<\/em><\/td><td><em>-ère<\/em><\/td><td><em>cher → chère, premier → première<\/em><\/td><\/tr><tr><td><em>-f<\/em><\/td><td><em>-ve<\/em><\/td><td><em>neuf → neuve, sportif → sportive<\/em><\/td><\/tr><tr><td><em>-x<\/em><\/td><td><em>-se<\/em><\/td><td><em>heureux → heureuse, sérieux → sérieuse<\/em><\/td><\/tr><tr><td><em>-eur<\/em><\/td><td><em>-euse<\/em><\/td><td><em>menteur → menteuse, travailleur → travailleuse<\/em><\/td><\/tr><tr><td><em>-teur<\/em><\/td><td><em>-trice<\/em><\/td><td><em>conservateur → conservatrice<\/em><\/td><\/tr><tr><td><em>-el, -eil<\/em><\/td><td><em>-elle, -eille<\/em><\/td><td><em>naturel → naturelle, pareil → pareille<\/em><\/td><\/tr><tr><td><em>-en, -on<\/em><\/td><td><em>-enne, -onne<\/em><\/td><td><em>italien → italienne, bon → bonne<\/em><\/td><\/tr><tr><td><em>-et<\/em><\/td><td><em>-ette<\/em> / <em>-ète<\/em><\/td><td><em>muet → muette<\/em>; <em>complet → complète, secret → secrète, inquiet → inquiète<\/em><\/td><\/tr><tr><td><em>-c<\/em><\/td><td><em>-che / -que<\/em><\/td><td><em>blanc → blanche, franc → franche; public → publique, grec → grecque<\/em><\/td><\/tr><tr><td><em>-gu<\/em><\/td><td><em>-guë<\/em><\/td><td><em>aigu → aiguë<\/em><\/td><\/tr><\/table><p>Ganz unregelmäßig: <em>long → longue, frais → fraîche, doux → douce, faux → fausse, roux → rousse, gentil → gentille, gros → grosse, bas → basse, épais → épaisse, sec → sèche, fou → folle, mou → molle, favori → favorite<\/em>.<\/p><div class='warn'>Achtung: Vergleichsadjektive wie <em>supérieur, meilleur, extérieur<\/em> folgen der Regel: <em>meilleure, supérieure<\/em>.<\/div>"}, {"h": "beau, nouveau, vieux und Co.", "html": "<p>Fünf Adjektive haben eine <b>zweite maskuline Form<\/b> vor Vokal oder stummem h – damit die Aussprache flüssig bleibt:<\/p><table><tr><th>m. vor Konsonant<\/th><th>m. vor Vokal<\/th><th>feminin<\/th><th>m. Plural<\/th><th>f. Plural<\/th><\/tr><tr><td><em>beau<\/em><\/td><td><em>bel<\/em><\/td><td><em>belle<\/em><\/td><td><em>beaux<\/em><\/td><td><em>belles<\/em><\/td><\/tr><tr><td><em>nouveau<\/em><\/td><td><em>nouvel<\/em><\/td><td><em>nouvelle<\/em><\/td><td><em>nouveaux<\/em><\/td><td><em>nouvelles<\/em><\/td><\/tr><tr><td><em>vieux<\/em><\/td><td><em>vieil<\/em><\/td><td><em>vieille<\/em><\/td><td><em>vieux<\/em><\/td><td><em>vieilles<\/em><\/td><\/tr><tr><td><em>fou<\/em><\/td><td><em>fol<\/em><\/td><td><em>folle<\/em><\/td><td><em>fous<\/em><\/td><td><em>folles<\/em><\/td><\/tr><tr><td><em>mou<\/em><\/td><td><em>mol<\/em><\/td><td><em>molle<\/em><\/td><td><em>mous<\/em><\/td><td><em>molles<\/em><\/td><\/tr><\/table><ul><li><em>un beau jardin – un bel appartement – une belle maison<\/em><\/li><li><em>un nouveau film – un nouvel hôtel – une nouvelle voiture<\/em><\/li><li><em>un vieux monsieur – un vieil homme – une vieille dame<\/em><\/li><\/ul><div class='warn'>Achtung: Im Plural gibt es keine Sonderform: <em>de beaux appartements<\/em> (mit Liaison [boz]).<\/div>"}, {"h": "Der Plural", "html": "<p>Regel: <b>+ -s<\/b> (stumm). Wie beim Substantiv:<\/p><table><tr><th>Singular<\/th><th>Plural<\/th><th>Beispiele<\/th><\/tr><tr><td>Regel<\/td><td>+ <em>-s<\/em><\/td><td><em>petit → petits, petite → petites<\/em><\/td><\/tr><tr><td><em>-s, -x<\/em><\/td><td>unverändert<\/td><td><em>gris, heureux, vieux<\/em><\/td><\/tr><tr><td><em>-eau<\/em><\/td><td>+ <em>-x<\/em><\/td><td><em>beaux, nouveaux<\/em><\/td><\/tr><tr><td><em>-al<\/em><\/td><td><em>-aux<\/em><\/td><td><em>national → nationaux, normal → normaux<\/em><\/td><\/tr><\/table><div class='warn'>Ausnahmen bei <em>-al<\/em>: <em>banal → banals, final → finals, fatal → fatals, naval → navals<\/em>. Die feminine Form ist regelmäßig: <em>nationales<\/em>.<\/div><p>Bezieht sich ein Adjektiv auf mehrere Substantive verschiedenen Geschlechts, steht es im <b>maskulinen Plural<\/b>: <em>une jupe et un pull noirs<\/em>.<\/p><p><b>Farbadjektive<\/b>: Abgeleitet von Substantiven (<em>orange, marron, cerise<\/em>) oder zusammengesetzt (<em>bleu clair, vert foncé<\/em>) sind sie unveränderlich: <em>des chaussures marron, une robe bleu clair<\/em>. Ausnahmen: <em>rose, mauve<\/em> werden angeglichen.<\/p>"}, {"h": "Stellung: nach dem Substantiv", "html": "<p>Die meisten Adjektive stehen im Französischen <b>nach dem Substantiv<\/b> – vor allem:<\/p><ul><li>Farben: <em>une voiture rouge<\/em><\/li><li>Formen: <em>une table ronde<\/em><\/li><li>Nationalität, Religion, Politik: <em>le vin français, l'Église catholique<\/em><\/li><li>Adjektive aus Partizipien: <em>une porte ouverte, un homme fatigué<\/em><\/li><li>längere Adjektive: <em>un livre intéressant, une question difficile<\/em><\/li><li>Adjektive mit Ergänzung: <em>un verre plein d'eau<\/em><\/li><\/ul><div class='tip'>Merke: Wie im Italienischen und Spanischen: <em>una macchina rossa – un coche rojo – une voiture rouge<\/em>.<\/div>"}, {"h": "Stellung: vor dem Substantiv", "html": "<p>Eine kleine Gruppe kurzer, häufiger Adjektive steht <b>vor dem Substantiv<\/b>. Merkhilfe <b>BAGS<\/b> – Beauty, Age, Goodness, Size:<\/p><table><tr><th>Gruppe<\/th><th>Adjektive<\/th><\/tr><tr><td>Beauty<\/td><td><em>beau, joli<\/em><\/td><\/tr><tr><td>Age<\/td><td><em>jeune, vieux, nouveau<\/em><\/td><\/tr><tr><td>Goodness<\/td><td><em>bon, mauvais, meilleur, gentil<\/em><\/td><\/tr><tr><td>Size<\/td><td><em>grand, petit, gros, long, haut<\/em><\/td><\/tr><\/table><p>Außerdem Ordnungszahlen: <em>le premier jour, la deuxième fois<\/em>; und <em>autre, même, tout<\/em>.<\/p><ul><li><em>une jolie maison, un petit village, une bonne idée, un vieux livre<\/em><\/li><\/ul><div class='warn'>Achtung: Steht ein Adjektiv in einer Wortgruppe mit Adverb oder Ergänzung, rückt es oft nach hinten: <em>un homme très grand<\/em> (auch: <em>un très grand homme<\/em>), <em>un plat bon pour la santé<\/em>.<\/div>"}, {"h": "Bedeutungswechsel durch Stellung", "html": "<p>Einige Adjektive ändern ihre Bedeutung je nach Stellung. <b>Vorangestellt<\/b> eher übertragen, <b>nachgestellt<\/b> eher wörtlich:<\/p><table><tr><th>Adjektiv<\/th><th>vorne<\/th><th>hinten<\/th><\/tr><tr><td><em>ancien<\/em><\/td><td><em>mon ancien professeur<\/em> – ehemalig<\/td><td><em>un meuble ancien<\/em> – antik, alt<\/td><\/tr><tr><td><em>grand<\/em><\/td><td><em>un grand homme<\/em> – bedeutend<\/td><td><em>un homme grand<\/em> – groß gewachsen<\/td><\/tr><tr><td><em>cher<\/em><\/td><td><em>mon cher ami<\/em> – lieb<\/td><td><em>un restaurant cher<\/em> – teuer<\/td><\/tr><tr><td><em>propre<\/em><\/td><td><em>ma propre voiture<\/em> – eigen<\/td><td><em>une voiture propre<\/em> – sauber<\/td><\/tr><tr><td><em>pauvre<\/em><\/td><td><em>le pauvre homme<\/em> – bedauernswert<\/td><td><em>un homme pauvre<\/em> – arm (ohne Geld)<\/td><\/tr><tr><td><em>seul<\/em><\/td><td><em>une seule femme<\/em> – eine einzige<\/td><td><em>une femme seule<\/em> – allein, einsam<\/td><\/tr><tr><td><em>dernier<\/em><\/td><td><em>la dernière semaine<\/em> – letzte (einer Reihe)<\/td><td><em>la semaine dernière<\/em> – vergangene<\/td><\/tr><tr><td><em>même<\/em><\/td><td><em>le même jour<\/em> – derselbe<\/td><td><em>le jour même<\/em> – genau an dem Tag<\/td><\/tr><tr><td><em>prochain<\/em><\/td><td><em>la prochaine fois<\/em> – nächste (der Reihe)<\/td><td><em>la semaine prochaine<\/em> – kommende<\/td><\/tr><\/table><div class='tip'>Merke: <em>certain<\/em>: <em>un certain charme<\/em> (ein gewisser) – <em>un succès certain<\/em> (sicher).<\/div>"}, {"h": "Steigerung: Komparativ und Superlativ", "html": "<p><b>Komparativ<\/b>: <em>plus / aussi / moins<\/em> + Adjektiv + <em>que<\/em>:<\/p><ul><li><em>Paul est plus grand que Marc.<\/em> – größer als<\/li><li><em>Elle est aussi intelligente que lui.<\/em> – so … wie<\/li><li><em>Ce film est moins intéressant que le livre.<\/em> – weniger … als<\/li><\/ul><p><b>Superlativ<\/b>: bestimmter Artikel + <em>plus/moins<\/em> + Adjektiv. Steht das Adjektiv nach dem Substantiv, wird der Artikel wiederholt:<\/p><ul><li><em>la plus belle ville<\/em> – die schönste Stadt<\/li><li><em>la ville la plus intéressante<\/em> – die interessanteste Stadt<\/li><li><em>le film le moins cher du festival<\/em> – „im/des“ = <em>de<\/em><\/li><\/ul><table><tr><th>Positiv<\/th><th>Komparativ<\/th><th>Superlativ<\/th><\/tr><tr><td><em>bon<\/em> gut<\/td><td><em>meilleur(e)<\/em><\/td><td><em>le/la meilleur(e)<\/em><\/td><\/tr><tr><td><em>mauvais<\/em> schlecht<\/td><td><em>plus mauvais<\/em> / <em>pire<\/em><\/td><td><em>le plus mauvais<\/em> / <em>le pire<\/em><\/td><\/tr><tr><td><em>petit<\/em> klein<\/td><td><em>plus petit<\/em> / (abstrakt) <em>moindre<\/em><\/td><td><em>le plus petit<\/em> / <em>le moindre<\/em><\/td><\/tr><\/table><div class='warn'>Achtung: Nie <em>plus bon<\/em>! Richtig: <em>Ce gâteau est meilleur.<\/em> Und <em>le moindre<\/em> = der geringste: <em>Je n'en ai pas la moindre idée.<\/em><\/div><div class='tip'>Merke: „immer größer“ = <em>de plus en plus grand<\/em>; „immer weniger“ = <em>de moins en moins<\/em>. Der absolute Superlativ: <em>très, extrêmement, super-<\/em>: <em>très beau<\/em>.<\/div>"}], "exercises": [{"type": "gap", "title": "Die feminine Form", "task": "Setze das Adjektiv in der femininen Form ein.", "items": [{"q": "Ma sœur est très ___. (sportif)", "a": ["sportive"], "de": "Meine Schwester ist sehr sportlich."}, {"q": "Elle a l'air ___. (heureux)", "a": ["heureuse"], "de": "Sie sieht glücklich aus."}, {"q": "C'est une ___ amie. (bon)", "a": ["bonne"], "de": "Das ist eine gute Freundin."}, {"q": "La neige est ___. (blanc)", "a": ["blanche"], "de": "Der Schnee ist weiß."}, {"q": "Cette robe est trop ___. (cher)", "a": ["chère"], "de": "Dieses Kleid ist zu teuer."}, {"q": "La cuisine ___ est réputée. (italien)", "a": ["italienne"], "de": "Die italienische Küche ist berühmt."}, {"q": "J'aime l'eau ___. (frais)", "a": ["fraîche", "fraiche"], "de": "Ich mag kühles Wasser."}, {"q": "Elle est très ___ avec moi. (gentil)", "a": ["gentille"], "de": "Sie ist sehr nett zu mir."}, {"q": "La salle est ___. (complet)", "a": ["complète"], "de": "Der Saal ist voll."}, {"q": "C'est une ___ histoire. (long)", "a": ["longue"], "de": "Das ist eine lange Geschichte."}]}, {"type": "choice", "title": "beau, nouveau, vieux", "task": "Wähle die richtige Form.", "items": [{"q": "un ___ appartement", "options": ["beau", "bel", "belle"], "a": 1, "why": "Maskulin vor Vokal → bel."}, {"q": "un ___ jardin", "options": ["beau", "bel", "belle"], "a": 0, "why": "Maskulin vor Konsonant → beau."}, {"q": "un ___ hôtel", "options": ["nouveau", "nouvel", "nouvelle"], "a": 1, "why": "Stummes h → nouvel."}, {"q": "une ___ dame", "options": ["vieux", "vieil", "vieille"], "a": 2, "why": "Feminin → vieille."}, {"q": "un ___ homme", "options": ["vieux", "vieil", "vieille"], "a": 1, "why": "Maskulin vor stummem h → vieil."}, {"q": "de ___ arbres", "options": ["beaux", "bels", "belles"], "a": 0, "why": "Im Plural keine Sonderform: beaux."}, {"q": "un ___ héros", "options": ["nouveau", "nouvel"], "a": 0, "why": "héros hat ein h aspiré → nouveau."}]}, {"type": "gap", "title": "Plural", "task": "Setze das Adjektiv in die passende Form.", "items": [{"q": "les journaux ___ (national)", "a": ["nationaux"], "de": "die überregionalen Zeitungen"}, {"q": "les routes ___ (national)", "a": ["nationales"], "de": "die Nationalstraßen"}, {"q": "des enfants
