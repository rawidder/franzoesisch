mich, ob er komme."}, {"q": "« Quand partez-vous ? » → Il nous a demandé ___ nous partions.", "a": ["quand"], "de": "Er fragte uns, wann wir abreisten."}]}, {"type": "choice", "title": "Aufforderungen", "task": "Welche Wiedergabe ist korrekt?", "items": [{"q": "« Ferme la porte ! »", "options": ["Il m'a dit que je ferme la porte.", "Il m'a dit de fermer la porte."], "a": 1, "why": "Aufforderung → de + Infinitiv."}, {"q": "« Ne parlez pas ! »", "options": ["Il nous a demandé de ne pas parler.", "Il nous a demandé de parler pas."], "a": 0, "why": "Verneinter Infinitiv: ne pas + Infinitiv."}, {"q": "« Prenez votre temps. »", "options": ["Elle nous a conseillé de prendre notre temps.", "Elle nous a conseillé à prendre notre temps."], "a": 0, "why": "conseiller à qn de."}, {"q": "« Ne t'inquiète pas. »", "options": ["Il m'a dit de ne pas m'inquiéter.", "Il m'a dit de ne pas t'inquiéter."], "a": 0, "why": "Pronomen an die neue Person anpassen: m'inquiéter."}]}], "cards": [{"f": "Einleitung der indirekten Rede", "b": "que – darf nie fehlen und wird bei mehreren Aussagen wiederholt"}, {"f": "Zeitverschiebung: présent →", "b": "imparfait"}, {"f": "Zeitverschiebung: passé composé →", "b": "plus-que-parfait"}, {"f": "Zeitverschiebung: futur →", "b": "conditionnel"}, {"f": "Zeitverschiebung: futur proche →", "b": "allait + Infinitiv"}, {"f": "Was ändert sich nicht?", "b": "imparfait, plus-que-parfait, conditionnel, subjonctif"}, {"f": "demain / hier in der indirekten Rede", "b": "le lendemain / la veille"}, {"f": "aujourd'hui / maintenant", "b": "ce jour-là / à ce moment-là"}, {"f": "la semaine prochaine / dernière", "b": "la semaine suivante / précédente"}, {"f": "indirekte Ja-Nein-Frage", "b": "si: Il demande si je viens."}, {"f": "qu'est-ce que → / qu'est-ce qui →", "b": "ce que / ce qui"}, {"f": "Inversion in indirekten Fragen?", "b": "Nein: Il demande où j'habite."}, {"f": "indirekte Aufforderung", "b": "de + Infinitiv: Il m'a dit de venir."}, {"f": "Er hat mir gesagt, ich solle mir keine Sorgen machen.", "b": "Il m'a dit de ne pas m'inquiéter."}, {"f": "Konjunktiv I wie im Deutschen?", "b": "Gibt es nicht – nur Zeitverschiebung"}]}, {"nr": 21, "id": "k22", "title": "Reflexive Verben, on und das Passiv", "teil": "Das Verb und seine Ergänzungen", "intro": "Reflexive Verben sind im Französischen häufiger als im Deutschen und bilden ihre zusammengesetzten Zeiten immer mit être. Für das Passiv gibt es neben être + Partizip zwei sehr beliebte Alternativen: on und das reflexive se.", "sections": [{"h": "Reflexivpronomen und Bildung", "html": "<table><tr><th>Person<\/th><th>se laver (sich waschen)<\/th><th>s'habiller (sich anziehen)<\/th><\/tr><tr><td>je<\/td><td><em>me lave<\/em><\/td><td><em>m'habille<\/em><\/td><\/tr><tr><td>tu<\/td><td><em>te laves<\/em><\/td><td><em>t'habilles<\/em><\/td><\/tr><tr><td>il/elle/on<\/td><td><em>se lave<\/em><\/td><td><em>s'habille<\/em><\/td><\/tr><tr><td>nous<\/td><td><em>nous lavons<\/em><\/td><td><em>nous habillons<\/em><\/td><\/tr><tr><td>vous<\/td><td><em>vous lavez<\/em><\/td><td><em>vous habillez<\/em><\/td><\/tr><tr><td>ils/elles<\/td><td><em>se lavent<\/em><\/td><td><em>s'habillent<\/em><\/td><\/tr><\/table><p>Das Reflexivpronomen steht wie andere Objektpronomen <b>vor dem Verb<\/b>:<\/p><ul><li>Verneinung: <em>Je ne me lève pas.<\/em><\/li><li>mit Infinitiv: <em>Je vais me coucher.<\/em> – das Pronomen passt sich der Person an: <em>Nous allons nous coucher.<\/em><\/li><li>Imperativ: <em>Lève-toi ! Ne te lève pas !<\/em><\/li><\/ul><div class='warn'>Achtung: Beim Infinitiv nach einem anderen Verb muss das Reflexivpronomen zur Person passen: <em>Tu dois te reposer.<\/em> (nicht <em>se reposer<\/em>).<\/div>"}, {"h": "Häufige reflexive Verben", "html": "<p><b>Tagesablauf<\/b>: <em>se réveiller<\/em> (aufwachen), <em>se lever<\/em> (aufstehen), <em>se doucher, se laver, se brosser les dents, s'habiller, se maquiller, se raser, se dépêcher<\/em> (sich beeilen), <em>se reposer, se coucher<\/em> (ins Bett gehen), <em>s'endormir<\/em> (einschlafen).<\/p><p><b>Reflexiv im Französischen, nicht im Deutschen<\/b>:<\/p><table><tr><th>Französisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>s'appeler<\/em><\/td><td>heißen<\/td><\/tr><tr><td><em>se promener<\/em><\/td><td>spazieren gehen<\/td><\/tr><tr><td><em>se tromper<\/em><\/td><td>sich irren<\/td><\/tr><tr><td><em>se souvenir de<\/em><\/td><td>sich erinnern an<\/td><\/tr><tr><td><em>se taire<\/em><\/td><td>schweigen<\/td><\/tr><tr><td><em>s'en aller<\/em><\/td><td>weggehen<\/td><\/tr><tr><td><em>se passer<\/em><\/td><td>geschehen<\/td><\/tr><tr><td><em>se marier<\/em><\/td><td>heiraten<\/td><\/tr><tr><td><em>s'occuper de<\/em><\/td><td>sich kümmern um<\/td><\/tr><tr><td><em>se moquer de<\/em><\/td><td>sich lustig machen über<\/td><\/tr><\/table><p><b>Reflexiv im Deutschen, nicht im Französischen<\/b>: <em>bouger<\/em> (sich bewegen), <em>changer<\/em> (sich ändern), <em>déménager<\/em> (umziehen), <em>améliorer<\/em> → <em>s'améliorer<\/em> (sich bessern), <em>diminuer<\/em> (sich verringern).<\/p><div class='tip'>Merke: Bedeutungsunterschiede: <em>ennuyer<\/em> (langweilen) – <em>s'ennuyer<\/em> (sich langweilen); <em>rendre compte<\/em> (berichten) – <em>se rendre compte<\/em> (merken); <em>douter<\/em> (zweifeln) – <em>se douter<\/em> (ahnen).<\/div>"}, {"h": "Reziproke Verben", "html": "<p>Im Plural kann <em>se/nous/vous<\/em> auch „einander, sich gegenseitig“ bedeuten:<\/p><ul><li><em>Ils s'aiment.<\/em> – Sie lieben sich (einander).<\/li><li><em>Nous nous écrivons souvent.<\/em> – Wir schreiben uns oft.<\/li><li><em>On se voit demain ?<\/em> – Sehen wir uns morgen?<\/li><li><em>Vous vous connaissez ?<\/em> – Kennt ihr euch?<\/li><\/ul><p>Zur Verdeutlichung: <em>l'un l'autre, les uns les autres, mutuellement<\/em>: <em>Ils s'aident l'un l'autre.<\/em><\/p><div class='tip'>Merke: <em>On se tutoie ?<\/em> – Wollen wir uns duzen? <em>On se fait la bise ?<\/em> – Küsschen zur Begrüßung?<\/div>"}, {"h": "Reflexive Verben im passé composé", "html": "<p>Alle reflexiven Verben bilden die zusammengesetzten Zeiten mit <b>être<\/b>:<\/p><ul><li><em>Je me suis levé(e) tôt.<\/em><\/li><li><em>Elle s'est trompée.<\/em><\/li><li><em>Nous nous sommes promenés.<\/em><\/li><li>Verneinung: <em>Il ne s'est pas rasé.<\/em><\/li><\/ul><p><b>Angleichung<\/b>: In der Regel an das Subjekt (genauer: an das Reflexivpronomen, wenn es direktes Objekt ist):<\/p><ul><li><em>Elle s'est lavée.<\/em> (sie hat sich gewaschen – <em>se<\/em> = direktes Objekt)<\/li><li><em>Elle s'est lavé les mains.<\/em> (sie hat sich die Hände gewaschen – direktes Objekt ist <em>les mains<\/em>, danach → keine Angleichung)<\/li><li><em>Ils se sont parlé.<\/em> (parler <b>à<\/b> qn → <em>se<\/em> indirekt → keine Angleichung)<\/li><li><em>Elles se sont téléphoné.<\/em> – ebenso<\/li><\/ul><div class='warn'>Achtung: Keine Angleichung bei <em>se parler, se téléphoner, se dire, se demander, se sourire, se plaire, se rendre compte<\/em> – das <em>se<\/em> ist dort indirektes Objekt.<\/div>"}, {"h": "Das Passiv mit être", "html": "<p><em>être<\/em> in der jeweiligen Zeit + Partizip Perfekt (angeglichen an das Subjekt). Der Urheber wird mit <em>par<\/em> angeschlossen:<\/p><table><tr><th>Zeit<\/th><th>Beispiel<\/th><\/tr><tr><td>Präsens<\/td><td><em>La maison est construite par l'entreprise.<\/em><\/td><\/tr><tr><td>passé composé<\/td><td><em>Le voleur a été arrêté par la police.<\/em><\/td><\/tr><tr><td>imparfait<\/td><td><em>Les lettres étaient écrites à la main.<\/em><\/td><\/tr><tr><td>Futur<\/td><td><em>Les résultats seront publiés demain.<\/em><\/td><\/tr><\/table><p>Bei Gefühlen und Zuständen steht oft <em>de<\/em> statt <em>par<\/em>: <em>Il est aimé de tous. La table est couverte de livres.<\/em><\/p><div class='warn'>Achtung: Nur Verben mit <b>direktem Objekt<\/b> können ins Passiv. „Mir wurde gesagt“ geht nicht mit <em>dire à<\/em> → <em>On m'a dit …<\/em><\/div><div class='tip'>Merke: Das deutsche „werden“-Passiv und „sein“-Passiv fallen zusammen: <em>La porte est fermée<\/em> = Die Tür ist geschlossen / wird geschlossen (Kontext).<\/div>"}, {"h": "Passiversatz: on und se", "html": "<p>Im Alltag vermeidet man das Passiv gern:<\/p><ul><li><b>on<\/b> + Aktiv: <em>On a volé mon vélo.<\/em> – Mein Fahrrad wurde gestohlen. <em>On m'a dit que …<\/em> – Mir wurde gesagt … <em>Ici, on parle français.<\/em><\/li><li><b>se<\/b> + Verb (Passif pronominal) für allgemeine Regeln und Gewohnheiten: <em>Ça se dit.<\/em> (Das sagt man.) <em>Le vin blanc se boit frais.<\/em> (Weißwein trinkt man kühl.) <em>Ce livre se vend bien.<\/em> (Das Buch verkauft sich gut.) <em>Comment ça s'écrit ?<\/em><\/li><li><b>se faire<\/b> + Infinitiv (wenn dem Subjekt etwas passiert): <em>Il s'est fait voler son portefeuille.<\/em> (Ihm wurde der Geldbeutel gestohlen.) <em>Elle s'est fait renverser par une voiture.<\/em><\/li><\/ul><div class='tip'>Merke: Wie span. <em>se habla español<\/em> und ital. <em>si parla italiano<\/em> – im Französischen meist <em>on parle français<\/em>.<\/div>"}], "exercises": [{"type": "gap", "title": "Reflexivpronomen", "task": "Setze das passende Reflexivpronomen ein.", "items": [{"q": "Je ___ lève à 7 heures.", "a": ["me"], "de": "Ich stehe um 7 Uhr auf."}, {"q": "Tu ___ appelles comment ?", "a": ["t'"], "de": "Wie heißt du?"}, {"q": "Nous ___ promenons au bord de la mer.", "a": ["nous"], "de": "Wir gehen am Meer spazieren."}, {"q": "Ils ___ marient en juin.", "a": ["se"], "de": "Sie heiraten im Juni."}, {"q": "Vous ___ souvenez de moi ?", "a": ["vous"], "de": "Erinnern Sie sich an mich?"}, {"q": "Tu dois ___ reposer.", "a": ["te"], "de": "Du musst dich ausruhen."}, {"q": "Je vais ___ coucher.", "a": ["me"], "de": "Ich gehe ins Bett."}, {"q": "Dépêche-___ !", "a": ["toi"], "de": "Beeil dich!"}]}, {"type": "gap", "title": "Reflexive Verben im passé composé", "task": "Setze das Verb ins passé composé (mit Angleichung).", "items": [{"q": "Elle ___ tôt ce matin. (se lever)", "a": ["s'est levée"], "de": "Sie ist heute früh aufgestanden."}, {"q": "Nous ___ au parc. (se promener)", "a": ["nous sommes promenés"], "de": "Wir sind im Park spazieren gegangen."}, {"q": "Ils ___ en 2015. (se marier)", "a": ["se sont mariés"], "de": "Sie haben 2015 geheiratet."}, {"q": "Je ___ de route. (se tromper; Sprecherin)", "a": ["me suis trompée"], "de": "Ich habe mich im Weg geirrt."}, {"q": "Elles ___ hier soir. (se téléphoner)", "a": ["se sont téléphoné"], "de": "Sie haben gestern Abend telefoniert."}, {"q": "Marie ___ les cheveux. (se laver)", "a": ["s'est lavé"], "de": "Marie hat sich die Haare gewaschen."}, {"q": "Tu ___ ? (s'amuser)", "a": ["t'es bien amusé", "t'es amusé", "t'es bien amusée", "t'es amusée"], "de": "Hast du dich gut amüsiert?"}]}, {"type": "choice", "title": "Reflexiv oder nicht?", "task": "Wähle die richtige Form.", "items": [{"q": "Wir ziehen nächsten Monat um.", "options": ["Nous nous déménageons le mois prochain.", "Nous déménageons le mois prochain."], "a": 1, "why": "déménager ist nicht reflexiv."}, {"q": "Ich irre mich nie.", "options": ["Je ne me trompe jamais.", "Je ne trompe jamais."], "a": 0, "why": "se tromper = sich irren (tromper = betrügen)."}, {"q": "Was ist passiert?", "options": ["Qu'est-ce qui s'est passé ?", "Qu'est-ce qui a passé ?"], "a": 0, "why": "se passer = geschehen."}, {"q": "Beweg dich nicht!", "options": ["Ne te bouge pas !", "Ne bouge pas !"], "a": 1, "why": "bouger ist nicht reflexiv."}, {"q": "Ich langweile mich.", "options": ["Je m'ennuie.", "J'ennuie."], "a": 0, "why": "s'ennuyer = sich langweilen."}, {"q": "Ich habe gemerkt, dass …", "options": ["Je me suis rendu compte que …", "J'ai rendu compte que …"], "a": 0, "why": "se rendre compte = merken."}]}, {"type": "gap", "title": "Das Passiv", "task": "Setze das Verb ins Passiv in der angegebenen Zeit.", "items": [{"q": "Ce château ___ au XVIe siècle. (construire, passé composé)", "a": ["a été construit"], "de": "Dieses Schloss wurde im 16. Jahrhundert gebaut."}, {"q": "Les résultats ___ demain. (publier, futur)", "a": ["seront publiés"], "de": "Die Ergebnisse werden morgen veröffentlicht."}, {"q": "Cette chanson ___ par tout le monde. (connaître, présent)", "a": ["est connue"], "de": "Dieses Lied kennt jeder."}, {"q": "Les voleurs ___ par la police. (arrêter, passé composé)", "a": ["ont été arrêtés"], "de": "Die Diebe wurden von der Polizei festgenommen."}, {"q": "La lettre ___ par ma grand-mère. (écrire, plus-que-parfait)", "a": ["avait été écrite"], "de": "Der Brief war von meiner Großmutter geschrieben worden."}]}, {"type": "choice", "title": "Passiversatz", "task": "Welche Übersetzung ist am natürlichsten?", "items": [{"q": "Mein Fahrrad wurde gestohlen.", "options": ["On a volé mon vélo.", "Mon vélo s'est volé."], "a": 0, "why": "on + Aktiv."}, {"q": "Mir wurde gesagt, dass …", "options": ["J'ai été dit que …", "On m'a dit que …"], "a": 1, "why": "dire à qn → kein Passiv möglich → on."}, {"q": "Weißwein trinkt man kühl.", "options": ["Le vin blanc se boit frais.", "Le vin blanc est bu frais."], "a": 0, "why": "Allgemeine Regel → passif pronominal."}, {"q": "Ihm wurde die Brieftasche gestohlen.", "options": ["Il s'est fait voler son portefeuille.", "Il a été volé son portefeuille."], "a": 0, "why": "se faire + Infinitiv."}, {"q": "Wie schreibt man das?", "options": ["Comment ça s'écrit ?", "Comment c'est écrit-on ?"], "a": 0, "why": "Passif pronominal."}]}], "cards": [{"f": "Reflexivpronomen", "b": "me, te, se, nous, vous, se"}, {"f": "Ich gehe ins Bett. / Wir gehen ins Bett.", "b": "Je vais me coucher. / Nous allons nous coucher."}, {"f": "Reflexiv im Imperativ", "b": "Lève-toi ! / Ne te lève pas !"}, {"f": "heißen / spazieren gehen", "b": "s'appeler / se promener"}, {"f": "sich irren / sich erinnern an", "b": "se tromper / se souvenir de"}, {"f": "geschehen / schweigen", "b": "se passer / se taire"}, {"f": "sich bewegen / umziehen", "b": "bouger / déménager (nicht reflexiv!)"}, {"f": "ennuyer / s'ennuyer", "b": "langweilen / sich langweilen"}, {"f": "se rendre compte", "b": "merken, sich bewusst werden"}, {"f": "Hilfsverb bei reflexiven Verben", "b": "immer être: je me suis levé"}, {"f": "Elle s'est lavée / Elle s'est lavé les mains", "b": "Angleichung nur, wenn se direktes Objekt ist"}, {"f": "Ils se sont parlé – warum ohne -s?", "b": "parler à qn: se ist indirektes Objekt"}, {"f": "reziprok", "b": "Ils s'aiment. On se voit demain ?"}, {"f": "Passiv – Bildung", "b": "être + Partizip (angeglichen) + par"}, {"f": "Il est aimé de tous.", "b": "de statt par bei Gefühlen/Zuständen"}, {"f": "Passiversatz mit on", "b": "On a volé mon vélo. On m'a dit …"}, {"f": "Passif pronominal", "b": "Ça se dit. Ce livre se vend bien."}, {"f": "se faire + Infinitiv", "b": "Il s'est fait voler son portefeuille."}]}, {"nr": 22, "id": "k23", "title": "plaire, manquer & Co. und Verbanschlüsse", "teil": "Das Verb und seine Ergänzungen", "intro": "Viele Verben schließen ihre Ergänzung im Französischen anders an als im Deutschen: direkt statt mit Präposition oder umgekehrt. Dazu kommen Verben wie plaire und manquer, bei denen Subjekt und Objekt gegenüber dem Deutschen vertauscht sind – ähnlich wie span. gustar oder ital. piacere.", "sections": [{"h": "plaire und manquer", "html": "<p>Bei <em>plaire<\/em> (gefallen) ist die Sache das Subjekt, die Person das indirekte Objekt – wie im Deutschen:<\/p><ul><li><em>Ce film me plaît.<\/em> – Der Film gefällt mir.<\/li><li><em>Ces chaussures te plaisent ?<\/em> – Gefallen dir die Schuhe?<\/li><li><em>Paris plaît beaucoup aux touristes.<\/em><\/li><li><em>Ça vous a plu ?<\/em> – Hat es Ihnen gefallen?<\/li><\/ul><p><em>manquer<\/em> (fehlen) funktioniert genauso – und verwirrt deshalb Deutschsprachige:<\/p><ul><li><em>Tu me manques.<\/em> – Du fehlst mir / Ich vermisse dich. (wörtlich: du fehlst mir)<\/li><li><em>Mes amis me manquent.<\/em> – Ich vermisse meine Freunde.<\/li><li><em>Paris lui manque.<\/em> – Er vermisst Paris.<\/li><\/ul><div class='warn'>Achtung: <em>Je te manque<\/em> heißt „Du vermisst mich“! Die Person, die vermisst wird, ist das Subjekt.<\/div><div class='tip'>Merke: Anders als im Spanischen (<em>me gusta<\/em>) sagt man für „mögen“ im Französischen einfach <em>aimer<\/em>: <em>J'aime le chocolat.<\/em> <em>plaire<\/em> betont eher den Eindruck: <em>Ça me plaît.<\/em><\/div>"}, {"h": "Weitere Verben dieses Typs", "html": "<table><tr><th>Verb<\/th><th>Beispiel<\/th><th>Deutsch<\/th><\/tr><tr><td><em>convenir à<\/em><\/td><td><em>Mardi me convient.<\/em><\/td><td>Dienstag passt mir.<\/td><\/tr><tr><td><em>aller à<\/em> (stehen, passen)<\/td><td><em>Cette robe te va bien.<\/em><\/td><td>Das Kleid steht dir.<\/td><\/tr><tr><td><em>rester à<\/em><\/td><td><em>Il me reste dix euros.<\/em><\/td><td>Ich habe noch zehn Euro.<\/td><\/tr><tr><td><em>arriver à<\/em><\/td><td><em>Qu'est-ce qui t'arrive ?<\/em><\/td><td>Was ist mit dir los?<\/td><\/tr><tr><td><em>appartenir à<\/em><\/td><td><em>Ce sac appartient à Marie.<\/em><\/td><td>Die Tasche gehört Marie.<\/td><\/tr><tr><td><em>suffire à<\/em><\/td><td><em>Ça me suffit.<\/em><\/td><td>Das reicht mir.<\/td><\/tr><tr><td><em>il faut à<\/em><\/td><td><em>Il me faut une heure.<\/em><\/td><td>Ich brauche eine Stunde.<\/td><\/tr><tr><td><em>faire mal à<\/em><\/td><td><em>Mon dos me fait mal.<\/em><\/td><td>Mein Rücken tut mir weh.<\/td><\/tr><tr><td><em>tenir à<\/em><\/td><td><em>Je tiens à toi.<\/em><\/td><td>Du bist mir wichtig.<\/td><\/tr><\/table><div class='tip'>Merke: <em>Ça me va.<\/em> – Das passt mir / einverstanden. <em>Ça te dit ?<\/em> – Hast du Lust darauf?<\/div>"}, {"h": "Direktes Objekt im Französischen – Präposition im Deutschen", "html": "<p>Diese Verben haben im Französischen ein <b>direktes Objekt<\/b> (also <em>le/la/les<\/em> als Pronomen):<\/p><table><tr><th>Französisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>attendre qn<\/em><\/td><td>auf jdn warten<\/td><\/tr><tr><td><em>chercher qn/qc<\/em><\/td><td>nach etw. suchen; jdn abholen<\/td><\/tr><tr><td><em>écouter qn<\/em><\/td><td>jdm zuhören<\/td><\/tr><tr><td><em>regarder qc<\/em><\/td><td>sich etw. ansehen<\/td><\/tr><tr><td><em>demander qc<\/em><\/td><td>um etw. bitten, nach etw. fragen<\/td><\/tr><tr><td><em>payer qc<\/em><\/td><td>für etw. bezahlen<\/td><\/tr><tr><td><em>aider qn<\/em><\/td><td>jdm helfen<\/td><\/tr><tr><td><em>remercier qn<\/em><\/td><td>jdm danken<\/td><\/tr><tr><td><em>suivre qn<\/em><\/td><td>jdm folgen<\/td><\/tr><tr><td><em>croire qn<\/em><\/td><td>jdm glauben<\/td><\/tr><tr><td><em>rencontrer qn<\/em><\/td><td>jdm begegnen<\/td><\/tr><tr><td><em>féliciter qn<\/em><\/td><td>jdm gratulieren<\/td><\/tr><\/table><ul><li><em>J'attends le bus. Je l'attends.<\/em><\/li><li><em>Je cherche mes clés. Je les cherche.<\/em><\/li><li><em>Je vous remercie.<\/em> – Ich danke Ihnen.<\/li><\/ul>"}, {"h": "Präposition im Französischen – direktes Objekt im Deutschen", "html": "<table><tr><th>Französisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>téléphoner à qn<\/em><\/td><td>jdn anrufen<\/td><\/tr><tr><td><em>répondre à qn/qc<\/em><\/td><td>jdm/auf etw. antworten<\/td><\/tr><tr><td><em>obéir à qn<\/em><\/td><td>jdm gehorchen<\/td><\/tr><tr><td><em>ressembler à qn<\/em><\/td><td>jdm ähneln<\/td><\/tr><tr><td><em>assister à qc<\/em><\/td><td>an etw. teilnehmen, etw. beiwohnen<\/td><\/tr><tr><td><em>renoncer à qc<\/em><\/td><td>auf etw. verzichten<\/td><\/tr><tr><td><em>jouer à<\/em> (Spiel) / <em>jouer de<\/em> (Instrument)<\/td><td>Fußball / Klavier spielen<\/td><\/tr><tr><td><em>se souvenir de qc<\/em><\/td><td>sich an etw. erinnern<\/td><\/tr><tr><td><em>avoir besoin de qc<\/em><\/td><td>etw. brauchen<\/td><\/tr><tr><td><em>profiter de qc<\/em><\/td><td>etw. nutzen, genießen<\/td><\/tr><tr><td><em>changer de qc<\/em><\/td><td>etw. wechseln: <em>changer de train<\/em><\/td><\/tr><tr><td><em>se servir de qc<\/em><\/td><td>etw. benutzen<\/td><\/tr><tr><td><em>s'approcher de qc<\/em><\/td><td>sich etw. nähern<\/td><\/tr><tr><td><em>douter de qc<\/em><\/td><td>an etw. zweifeln<\/td><\/tr><\/table><ul><li><em>Je téléphone à ma mère. Je lui téléphone.<\/em><\/li><li><em>Il joue au tennis et du piano.<\/em><\/li><li><em>Profitez de vos vacances !<\/em><\/li><\/ul><div class='warn'>Achtung: <em>jouer au foot<\/em> (à + le), <em>jouer aux cartes<\/em>, aber <em>jouer de la guitare<\/em>, <em>jouer du violon<\/em>.<\/div>"}, {"h": "Verben mit anderer Präposition", "html": "<table><tr><th>Französisch<\/th><th>Deutsch<\/th><\/tr><tr><td><em>penser à<\/em><\/td><td>denken an<\/td><\/tr><tr><td><em>s'intéresser à<\/em><\/td><td>sich interessieren für<\/td><\/tr><tr><td><em>participer à<\/em><\/td><td>teilnehmen an<\/td><\/tr><tr><td><em>croire à / en<\/em><\/td><td>glauben an (<em>en Dieu<\/em>)<\/td><\/tr><tr><td><em>dépendre de<\/em><\/td><td>abhängen von<\/td><\/tr><tr><td><em>parler de<\/em><\/td><td>sprechen über<\/td><\/tr><tr><td><em>rêver de<\/em><\/td><td>träumen von<\/td><\/tr><tr><td><em>avoir peur de<\/em><\/td><td>Angst haben vor<\/td><\/tr><tr><td><em>être fier de<\/em><\/td><td>stolz sein auf<\/td><\/tr><tr><td><em>se plaindre de<\/em><\/td><td>sich beschweren über<\/td><\/tr><tr><td><em>compter sur<\/em><\/td><td>zählen auf<\/td><\/tr><tr><td><em>se fâcher contre<\/em><\/td><td>böse werden auf<\/td><\/tr><tr><td><em>être fâché avec<\/em><\/td><td>zerstritten sein mit<\/td><\/tr><\/table><div class='tip'>Merke: Bei Pronomen: <em>à<\/em> + Sache → <em>y<\/em> (<em>J'y pense<\/em>), <em>de<\/em> + Sache → <em>en<\/em> (<em>J'en parle<\/em>); Personen → betontes Pronomen (<em>Je pense à toi, Je parle de lui<\/em>).<\/div>"}, {"h": "Unpersönliche Ausdrücke", "html": "<ul><li><em>il faut<\/em> + Infinitiv / Substantiv / que + subjonctif: <em>Il faut partir. Il faut du courage. Il faut que tu viennes.<\/em><\/li><li><em>il y a<\/em>: es gibt; vor (zeitlich): <em>Il y a un problème. Je l'ai vu il y a deux jours.<\/em><\/li><li><em>il s'agit de<\/em>: es handelt sich um: <em>Il s'agit d'un malentendu.<\/em><\/li><li><em>il paraît que<\/em>: es scheint, angeblich: <em>Il paraît qu'il va pleuvoir.<\/em><\/li><li><em>il vaut mieux<\/em>: es ist besser<\/li><li><em>il manque<\/em>: es fehlt: <em>Il manque deux chaises.<\/em><\/li><li><em>il reste<\/em>: es bleibt übrig: <em>Il reste du gâteau.<\/em><\/li><li>Wetter: <em>il fait beau / chaud / froid / du vent, il pleut, il neige<\/em><\/li><\/ul><div class='warn'>Achtung: <em>il s'agit de<\/em> hat immer das unpersönliche <em>il<\/em>: „In dem Buch geht es um …“ = <em>Dans ce livre, il s'agit de …<\/em> (nicht <em>Ce livre s'agit de<\/em> ✗).<\/div>"}], "exercises": [{"type": "gap", "title": "plaire und manquer", "task": "Setze plaire oder manquer in der richtigen Form ein (Präsens).", "items": [{"q": "Tu me ___ beaucoup.", "a": ["manques"], "de": "Ich vermisse dich sehr."}, {"q": "Ce restaurant nous ___ beaucoup.", "a": ["plaît", "plait"], "de": "Dieses Restaurant gefällt uns sehr."}, {"q": "Mes enfants me ___ .", "a": ["manquent"], "de": "Ich vermisse meine Kinder."}, {"q": "Est-ce que ces fleurs te ___ ?", "a": ["plaisent"], "de": "Gefallen dir diese Blumen?"}, {"q": "La France lui ___ .", "a": ["manque"], "de": "Er/Sie vermisst Frankreich."}, {"q": "Je ___ à mes parents.", "a": ["manque"], "de": "Meine Eltern vermissen mich."}]}, {"type": "choice", "title": "Wer vermisst wen?", "task": "Wähle die richtige Übersetzung.", "items": [{"q": "Ich vermisse dich.", "options": ["Je te manque.", "Tu me manques."], "a": 1, "why": "Die vermisste Person ist Subjekt: tu."}, {"q": "Sie vermisst ihre Heimat.", "options": ["Son pays lui manque.", "Elle manque son pays."], "a": 0, "why": "Das Vermisste ist Subjekt."}, {"q": "Vermisst du mich?", "options": ["Je te manque ?", "Tu me manques ?"], "a": 0, "why": "Ich (vermisst) = Subjekt je."}, {"q": "Das Kleid steht dir gut.", "options": ["Cette robe te va bien.", "Tu vas bien cette robe."], "a": 0, "why": "aller à qn = stehen."}, {"q": "Ich habe noch fünf Euro.", "options": ["Il me reste cinq euros.", "Je reste cinq euros."], "a": 0, "why": "il reste à qn."}]}, {"type": "choice", "title": "Direkt oder mit Präposition?", "task": "Wähle die richtige Konstruktion.", "items": [{"q": "Ich warte auf den Zug.", "options": ["J'attends le train.", "J'attends pour le train."], "a": 0, "why": "attendre qc – direktes Objekt."}, {"q": "Ich rufe meinen Bruder an.", "options": ["Je téléphone mon frère.", "Je téléphone à mon frère."], "a": 1, "why": "téléphoner à qn."}, {"q": "Er hört der Lehrerin zu.", "options": ["Il écoute la professeure.", "Il écoute à la professeure."], "a": 0, "why": "écouter qn."}, {"q": "Sie ähnelt ihrer Mutter.", "options": ["Elle ressemble sa mère.", "Elle ressemble à sa mère."], "a": 1, "why": "ressembler à qn."}, {"q": "Ich brauche Hilfe.", "options": ["J'ai besoin d'aide.", "J'ai besoin aide."], "a": 0, "why": "avoir besoin de."}, {"q": "Er spielt Gitarre.", "options": ["Il joue la guitare.", "Il joue de la guitare.", "Il joue à la guitare."], "a": 1, "why": "Instrument: jouer de."}, {"q": "Wir spielen Karten.", "options": ["Nous jouons aux cartes.", "Nous jouons des cartes."], "a": 0, "why": "Spiel: jouer à."}, {"q": "Ich bezahle den Kaffee.", "options": ["Je paie le café.", "Je paie pour le café."], "a": 0, "why": "payer qc."}, {"q": "Sie hat den Job gewechselt.", "options": ["Elle a changé le travail.", "Elle a changé de travail."], "a": 1, "why": "changer de + Substantiv ohne Artikel."}]}, {"type": "gap", "title": "Die richtige Präposition", "task": "Setze à, de, sur, en oder au/aux/du ein.", "items": [{"q": "Je pense souvent ___ toi.", "a": ["à"], "de": "Ich denke oft an dich."}, {"q": "Ça dépend ___ la météo.", "a": ["de"], "de": "Das hängt vom Wetter ab."}, {"q": "Tu peux compter ___ moi.", "a": ["sur"], "de": "Du kannst auf mich zählen."}, {"q": "Elle s'intéresse ___ l'histoire.", "a": ["à"], "de": "Sie interessiert sich für Geschichte."}, {"q": "Il joue ___ foot le samedi.", "a": ["au"], "de": "Er spielt samstags Fußball."}, {"q": "Je me souviens ___ notre voyage.", "a": ["de"], "de": "Ich erinnere mich an unsere Reise."}, {"q": "Ils sont fiers ___ leur fille.", "a": ["de"], "de": "Sie sind stolz auf ihre Tochter."}, {"q": "Nous avons assisté ___ concert.", "a": ["au"], "de": "Wir haben dem Konzert beigewohnt."}, {"q": "Elle rêve ___ voyager en Asie.", "a": ["de"], "de": "Sie träumt davon, nach Asien zu reisen."}]}, {"type": "choice", "title": "Unpersönliche Ausdrücke", "task": "Wähle die passende Form.", "items": [{"q": "In diesem Film geht es um eine Familie.", "options": ["Ce film s'agit d'une famille.", "Dans ce film, il s'agit d'une famille."], "a": 1, "why": "il s'agit de – immer unpersönlich."}, {"q": "Ich habe ihn vor drei Tagen gesehen.", "options": ["Je l'ai vu il y a trois jours.", "Je l'ai vu avant trois jours."], "a": 0, "why": "vor (zeitlich) = il y a."}, {"q": "Angeblich ist er krank.", "options": ["Il paraît qu'il est malade.", "Il apparaît malade."], "a": 0, "why": "il paraît que = angeblich."}, {"q": "Es fehlen zwei Stühle.", "options": ["Il manque deux chaises.", "Deux chaises manquent à moi."], "a": 0, "why": "il manque + Substantiv."}]}], "cards": [{"f": "Ich vermisse dich.", "b": "Tu me manques."}, {"f": "Du vermisst mich.", "b": "Je te manque."}, {"f": "Das gefällt mir.", "b": "Ça me plaît."}, {"f": "Hat es Ihnen gefallen?", "b": "Ça vous a plu ?"}, {"f": "Das Kleid steht dir.", "b": "Cette robe te va bien."}, {"f": "Dienstag passt mir.", "b": "Mardi me convient."}, {"f": "Ich habe noch zehn Euro.", "b": "Il me reste dix euros."}, {"f": "Was ist mit dir los?", "b": "Qu'est-ce qui t'arrive ?"}, {"f": "attendre, chercher, écouter, aider, remercier", "b": "direktes Objekt (le/la/les)"}, {"f": "téléphoner, répondre, ressembler, obéir", "b": "à + Person (lui/leur)"}, {"f": "jouer à / jouer de", "b": "Spiel/Sport (jouer au tennis) / Instrument (jouer du piano)"}, {"f": "etw. wechseln", "b": "changer de + Substantiv ohne Artikel: changer de train"}, {"f": "etw. genießen / nutzen", "b": "profiter de"}, {"f": "sich interessieren für", "b": "s'intéresser à"}, {"f": "zählen auf", "b": "compter sur"}, {"f": "abhängen von / träumen von", "b": "dépendre de / rêver de"}, {"f": "es geht um …", "b": "il s'agit de …"}, {"f": "vor drei Tagen", "b": "il y a trois jours"}, {"f": "angeblich", "b": "il paraît que"}, {"f": "Du bist mir wichtig.", "b": "Je tiens à toi."}]}, {"nr": 23, "id": "k24", "title": "Das Adverb", "teil": "Das Verb und seine Ergänzungen", "intro": "Anders als im Deutschen unterscheiden sich im Französischen Adjektiv und Adverb: Sie ist schnell (rapide) – sie fährt schnell (rapidement). Dieses Kapitel zeigt die Bildung mit -ment, die wichtigsten ursprünglichen Adverbien, ihre Stellung und die Steigerung.", "sections": [{"h": "Bildung mit -ment", "html": "<p>Grundregel: <b>feminine Form<\/b> des Adjektivs + <em>-ment<\/em>:<\/p><table><tr><th>Adjektiv m.<\/th><th>feminin<\/th><th>Adverb<\/th><\/tr><tr><td><em>lent<\/em><\/td><td><em>lente<\/em><\/td><td><em>lentement<\/em> – langsam<\/td><\/tr><tr><td><em>heureux<\/em><\/td><td><em>heureuse<\/em><\/td><td><em>heureusement<\/em> – glücklicherweise<\/td><\/tr><tr><td><em>doux<\/em><\/td><td><em>douce<\/em><\/td><td><em>doucement<\/em> – sanft, leise<\/td><\/tr><tr><td><em>sérieux<\/em><\/td><td><em>sérieuse<\/em><\/td><td><em>sérieusement<\/em><\/td><\/tr><tr><td><em>facile<\/em><\/td><td><em>facile<\/em><\/td><td><em>facilement<\/em><\/td><\/tr><\/table><p>Endet das Adjektiv (maskulin) auf <b>Vokal<\/b>, nimmt man die maskuline Form: <em>vrai → vraiment, poli → poliment, absolu → absolument<\/em>.<\/p><div class='tip'>Merke: Wie ital. <em>-mente<\/em> und span. <em>-mente<\/em> – <em>lentamente / lentement<\/em>.<\/div>"}, {"h": "Besondere Bildungen", "html": "<table><tr><th>Regel<\/th><th>Beispiele<\/th><\/tr><tr><td><em>-ant → -amment<\/em><\/td><td><em>courant → couramment, constant → constamment, élégant → élégamment<\/em><\/td><\/tr><tr><td><em>-ent → -emment<\/em><\/td><td><em>évident → évidemment, prudent → prudemment, récent → récemment<\/em><\/td><\/tr><tr><td><em>-ément<\/em> (einige Adjektive)<\/td><td><em>énorme → énormément, précis → précisément, profond → profondément, confus → confusément<\/em><\/td><\/tr><\/table><p>Ausnahme bei <em>-ent<\/em>: <em>lent → lentement<\/em> (wird regelmäßig gebildet).<\/p><div class='warn'>Achtung: <em>-amment<\/em> und <em>-emment<\/em> werden beide [aman] ausgesprochen: <em>évidemment<\/em> [evidaman].<\/div><p><b>Unregelmäßig<\/b>: <em>gentil → gentiment, bref → brièvement, gai → gaiement<\/em>.<\/p>"}, {"h": "Ursprüngliche Adverbien", "html": "<table><tr><th>Adjektiv<\/th><th>Adverb<\/th><\/tr><tr><td><em>bon<\/em> gut<\/td><td><em>bien<\/em> gut<\/td><\/tr><tr><td><em>mauvais<\/em> schlecht<\/td><td><em>mal<\/em> schlecht<\/td><\/tr><tr><td><em>meilleur<\/em> besser<\/td><td><em>mieux<\/em> besser<\/td><\/tr><tr><td><em>petit<\/em> klein<\/td><td><em>peu<\/em> wenig<\/td><\/tr><\/table><ul><li><em>C'est un bon cuisinier. Il cuisine bien.<\/em><\/li><li><em>Ce gâteau est meilleur. Elle chante mieux que moi.<\/em><\/li><\/ul><p>Weitere häufige Adverbien:<\/p><ul><li>Zeit: <em>aujourd'hui, hier, demain, maintenant, déjà, toujours, souvent, parfois, jamais, bientôt, tôt, tard, encore, enfin, ensuite, d'abord<\/em><\/li><li>Ort: <em>ici, là, là-bas, partout, ailleurs, dedans, dehors, devant, derrière, loin, près<\/em><\/li><li>Menge: <em>beaucoup, peu, trop, assez, très, plus, moins, tellement, presque<\/em><\/li><li>Art: <em>vite, ensemble, exprès<\/em> (absichtlich), <em>volontiers<\/em> (gern)<\/li><\/ul><div class='warn'>Achtung: <em>très<\/em> steht vor Adjektiven/Adverbien (<em>très bon, très vite<\/em>), <em>beaucoup<\/em> bei Verben (<em>Je travaille beaucoup<\/em>) – nie <em>très beaucoup<\/em> ✗. „Sehr viel“ = <em>énormément<\/em> oder <em>vraiment beaucoup<\/em>.<\/div>"}, {"h": "Adjektive als Adverbien", "html": "<p>Einige Adjektive werden nach bestimmten Verben unverändert als Adverb gebraucht:<\/p><ul><li><em>parler fort / bas<\/em> – laut / leise sprechen<\/li><li><em>coûter cher<\/em> – teuer sein: <em>Ces chaussures coûtent cher.<\/em><\/li><li><em>sentir bon / mauvais<\/em> – gut / schlecht riechen<\/li><li><em>travailler dur<\/em> – hart arbeiten<\/li><li><em>voir clair<\/em> – klar sehen<\/li><li><em>chanter faux / juste<\/em> – falsch / richtig singen<\/li><li><em>s'arrêter net<\/em> – abrupt anhalten<\/li><li><em>aller tout droit<\/em> – geradeaus gehen<\/li><\/ul><div class='warn'>Achtung: Hier keine Angleichung: <em>Ces fleurs sentent bon.<\/em> (nicht <em>bonnes<\/em>).<\/div>"}, {"h": "Stellung des Adverbs", "html": "<ul><li><b>Nach dem konjugierten Verb<\/b> (einfache Zeiten): <em>Il parle bien français. Je vais souvent au cinéma.<\/em> – Anders als im Deutschen nie zwischen Subjekt und Verb!<\/li><li><b>Zwischen Hilfsverb und Partizip<\/b> (kurze Adverbien): <em>J'ai bien dormi. Il a beaucoup travaillé. Tu as déjà fini ? J'ai toujours aimé Paris.<\/em><\/li><li><b>Vor dem Infinitiv<\/b> (kurze Adverbien): <em>Il faut bien réfléchir.<\/em><\/li><li><b>Vor dem Adjektiv / Adverb<\/b>: <em>très beau, trop vite, assez grand<\/em><\/li><li><b>Satzanfang oder -ende<\/b>: Zeit- und Ortsangaben und Satzadverbien: <em>Hier, j'ai vu Marie. Heureusement, il n'a rien.<\/em><\/li><\/ul><div class='warn'>Achtung: <em>Je souvent vais<\/em> ✗ → <em>Je vais souvent.<\/em> Und lange Adverbien auf <em>-ment<\/em> stehen meist nach dem Partizip: <em>Il a répondu rapidement.<\/em><\/div><div class='tip'>Merke: <em>aujourd'hui, hier, demain, ici, là<\/em> stehen nie zwischen Hilfsverb und Partizip: <em>Je suis arrivé hier.<\/em><\/div>"}, {"h": "Steigerung des Adverbs", "html": "<p>Wie beim Adjektiv mit <em>plus / aussi / moins … que<\/em>:<\/p><ul><li><em>Il court plus vite que moi.<\/em><\/li><li><em>Elle parle aussi bien que sa sœur.<\/em><\/li><li><em>Je sors moins souvent qu'avant.<\/em><\/li><\/ul><p>Superlativ mit <em>le<\/em> (unveränderlich, da Adverb): <em>C'est elle qui chante le mieux. Il est venu le plus vite possible.<\/em><\/p><table><tr><th>Positiv<\/th><th>Komparativ<\/th><th>Superlativ<\/th><\/tr><tr><td><em>bien<\/em><\/td><td><em>mieux<\/em><\/td><td><em>le mieux<\/em><\/td><\/tr><tr><td><em>mal<\/em><\/td><td><em>plus mal<\/em> (gehoben: <em>pis<\/em>)<\/td><td><em>le plus mal<\/em><\/td><\/tr><tr><td><em>beaucoup<\/em><\/td><td><em>plus<\/em><\/td><td><em>le plus<\/em><\/td><\/tr><tr><td><em>peu<\/em><\/td><td><em>moins<\/em><\/td><td><em>le moins<\/em><\/td><\/tr><\/table><div class='warn'>Achtung: <em>meilleur<\/em> (Adjektiv) vs. <em>mieux<\/em> (Adverb): <em>Ce vin est meilleur.<\/em> – <em>Il chante mieux.<\/em> Nach <em>c'est<\/em> steht meist <em>mieux<\/em>: <em>C'est mieux comme ça.<\/em><\/div><div class='tip'>Merke: <em>de mieux en mieux<\/em> – immer besser; <em>tant mieux<\/em> – umso besser; <em>tant pis<\/em> – schade, Pech.<\/div>"}], "exercises": [{"type": "gap", "title": "Adverbien auf -ment", "task": "Bilde das Adverb.", "items": [{"q": "Parle plus ___ , s'il te plaît. (lent)", "a": ["lentement"], "de": "Sprich bitte langsamer."}, {"q": "___ , il n'a pas plu. (heureux)", "a": ["Heureusement"], "de": "Zum Glück hat es nicht geregnet."}, {"q": "Elle parle ___ quatre langues. (courant)", "a": ["couramment"], "de": "Sie spricht fließend vier Sprachen."}, {"q": "___ , je viens avec toi ! (évident)", "a": ["Évidemment", "Evidemment"], "de": "Natürlich komme ich mit!"}, {"q": "Il a ___ raison. (absolu)", "a": ["absolument"], "de": "Er hat absolut recht."}, {"q": "Elle m'a répondu très ___ . (gentil)", "a": ["gentiment"], "de": "Sie hat mir sehr freundlich geantwortet."}, {"q": "Ils se sont ___ mariés. (récent)", "a": ["récemment"], "de": "Sie haben kürzlich geheiratet."}, {"q": "Il travaille ___ . (sérieux)", "a": ["sérieusement"], "de": "Er arbeitet ernsthaft."}, {"q": "C'est ___ ce que je voulais. (précis)", "a": ["précisément"], "de": "Das ist genau das, was ich wollte."}, {"q": "Tu es ___ sûr ? (vrai)", "a": ["vraiment"], "de": "Bist du wirklich sicher?"}]}, {"type": "choice", "title": "Adjektiv oder Adverb?", "task": "Wähle die passende Form.", "items": [{"q": "C'est un ___ restaurant.", "options": ["bon", "bien"], "a": 0, "why": "Begleitet ein Substantiv → Adjektiv."}, {"q": "On mange ___ ici.", "options": ["bon", "bien"], "a": 1, "why": "Bezieht sich auf das Verb → Adverb."}, {"q": "Elle chante ___ que moi.", "options": ["meilleur", "mieux"], "a": 1, "why": "Verb → Adverb mieux."}, {"q": "Ce gâteau est ___ que l'autre.", "options": ["meilleur", "mieux"], "a": 0, "why": "Substantiv → Adjektiv meilleur."}, {"q": "Ces roses sentent ___ .", "options": ["bon", "bonnes", "bien"], "a": 0, "why": "sentir bon – unveränderlich."}, {"q": "Cette voiture coûte ___ .", "options": ["chère", "cher", "chèrement"], "a": 1, "why": "coûter cher – unveränderlich."}, {"q": "Il est ___ fatigué.", "options": ["beaucoup", "très"], "a": 1, "why": "Vor Adjektiv → très."}, {"q": "Elle travaille ___ .", "options": ["beaucoup", "très"], "a": 0, "why": "Beim Verb → beaucoup."}]}, {"type": "choice", "title": "Stellung", "task": "Welcher Satz ist richtig?", "items": [{"q": "Ich gehe oft ins Kino.", "options": ["Je souvent vais au cinéma.", "Je vais souvent au cinéma."], "a": 1, "why": "Adverb nach dem konjugierten Verb."}, {"q": "Ich habe gut geschlafen.", "options": ["J'ai bien dormi.", "J'ai dormi bien."], "a": 0, "why": "Kurzes Adverb zwischen Hilfsverb und Partizip."}, {"q": "Er ist gestern angekommen.", "options": ["Il est hier arrivé.", "Il est arrivé hier."], "a": 1, "why": "hier nie zwischen Hilfsverb und Partizip."}, {"q": "Hast du schon gegessen?", "options": ["Tu as déjà mangé ?", "Tu as mangé déjà ?"], "a": 0, "why": "déjà zwischen Hilfsverb und Partizip."}, {"q": "Man muss gut nachdenken.", "options": ["Il faut réfléchir bien.", "Il faut bien réfléchir."], "a": 1, "why": "Kurzes Adverb vor dem Infinitiv."}]}, {"type": "gap", "title": "Steigerung", "task": "Ergänze die Lücke.", "items": [{"q": "Il court plus ___ que son frère. (schnell)", "a": ["vite"], "de": "Er läuft schneller als sein Bruder."}, {"q": "Ça va de ___ . (immer besser)", "a": ["mieux en mieux"], "de": "Es geht immer besser."}, {"q": "C'est Marie qui danse le ___ . (am besten)", "a": ["mieux"], "de": "Marie tanzt am besten."}, {"q": "Je lis ___ qu'avant. (weniger)", "a": ["moins"], "de": "Ich lese weniger als früher."}, {"q": "Tu as raté le train ? Tant ___ . (Pech)", "a": ["pis"], "de": "Du hast den Zug verpasst? Pech gehabt."}]}], "cards": [{"f": "Adverb auf -ment – Bildung", "b": "feminine Form + -ment: lente → lentement"}, {"f": "Adjektiv auf Vokal + -ment", "b": "maskuline Form: vrai → vraiment, poli → poliment"}, {"f": "-ant / -ent → ?", "b": "-amment / -emment: couramment, évidemment"}, {"f": "énorme, précis, profond → Adverb", "b": "énormément, précisément, profondément"}, {"f": "gentil → Adverb", "b": "gentiment"}, {"f": "bon / bien", "b": "Adjektiv (gut) / Adverb (gut)"}, {"f": "meilleur / mieux", "b": "besser (Adjektiv) / besser (Adverb)"}, {"f": "très / beaucoup", "b": "vor Adjektiv / beim Verb – nie très beaucoup"}, {"f": "teuer sein / gut riechen / laut sprechen", "b": "coûter cher / sentir bon / parler fort (unveränderlich)"}, {"f": "Stellung des Adverbs (einfache Zeit)", "b": "nach dem Verb: Je vais souvent au cinéma."}, {"f": "Stellung im passé composé", "b": "kurze Adverbien zwischen Hilfsverb und Partizip: J'ai bien dormi."}, {"f": "hier, demain, ici im passé composé", "b": "am Ende: Je suis arrivé hier."}, {"f": "immer besser", "b": "de mieux en mieux"}, {"f": "umso besser / Pech, schade", "b": "tant mieux / tant pis"}, {"f": "gern / absichtlich", "b": "volontiers / exprès"}, {"f": "Superlativ des Adverbs", "b": "le + plus/moins (unveränderlich): C'est elle qui chante le mieux."}]}, {"nr": 24, "id": "k25", "title": "Konjunktionen und Satzbau", "teil": "Der Satz", "intro": "Der französische Satz folgt fast immer der Reihenfolge Subjekt – Verb – Objekt, auch im Nebensatz. Das macht ihn für Deutschsprachige einfacher, als es scheint. Hier lernst du die Wortstellung, die wichtigsten Konjunktionen und typisch französische Mittel der Hervorhebung.", "sections": [{"h": "Die Wortstellung", "html": "<p>Grundmuster: <b>Subjekt – Verb – Objekt<\/b> (SVO), in Haupt- und Nebensätzen gleich:<\/p><ul><li><em>Marie lit un livre.<\/em><\/li><li><em>Je sais que Marie lit un livre.<\/em> – Ich weiß, dass Marie ein Buch <b>liest<\/b>. (Verb nicht am Ende!)<\/li><li><em>Demain, je vais à Paris.<\/em> – Morgen <b>fahre<\/b> ich nach Paris. (keine Inversion nach Zeitangabe!)<\/li><\/ul><div class='warn'>Achtung: Die zwei typischsten Fehler Deutschsprachiger: Verb ans Ende des Nebensatzes stellen (<em>… que Marie un livre lit<\/em> ✗) und Subjekt und Verb nach vorangestellter Angabe vertauschen (<em>Demain vais-je …<\/em> ✗).<\/div><p>Reihenfolge der Ergänzungen: meist direktes Objekt vor indirektem, dann Ort und Zeit: <em>J'ai donné le livre à Paul hier.<\/em><\/p><div class='tip'>Merke: Inversion gibt es nur in Fragen (gehoben), nach direkter Rede (<em>« Oui », dit-il.<\/em>) und nach einigen Adverbien wie <em>peut-être, aussi, sans doute<\/em> am Satzanfang (gehoben): <em>Peut-être viendra-t-il.<\/em> – Alltagssprachlich: <em>Peut-être qu'il viendra.<\/em><\/div>"}, {"h": "Beiordnende Konjunktionen", "html": "<table><tr><th>Konjunktion<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>et<\/em><\/td><td>und<\/td><td><em>Paul et Marie<\/em><\/td><\/tr><tr><td><em>ou<\/em> (<em>ou bien<\/em>)<\/td><td>oder<\/td><td><em>Du thé ou du café ?<\/em><\/td><\/tr><tr><td><em>mais<\/em><\/td><td>aber, sondern<\/td><td><em>Il est petit mais fort. Ce n'est pas rouge mais bleu.<\/em><\/td><\/tr><tr><td><em>donc<\/em><\/td><td>also<\/td><td><em>Je pense, donc je suis.<\/em><\/td><\/tr><tr><td><em>car<\/em><\/td><td>denn (schriftlich)<\/td><td><em>Je reste, car il pleut.<\/em><\/td><\/tr><tr><td><em>or<\/em><\/td><td>nun aber<\/td><td><em>Il devait venir ; or il n'est pas venu.<\/em><\/td><\/tr><tr><td><em>ni … ni<\/em><\/td><td>weder … noch<\/td><td><em>ni oui ni non<\/em><\/td><\/tr><tr><td><em>soit … soit<\/em><\/td><td>entweder … oder<\/td><td><em>soit demain, soit lundi<\/em><\/td><\/tr><\/table><p>Merksatz: <em>Mais où est donc Ornicar ?<\/em> = <em>mais, ou, et, donc, or, ni, car<\/em>.<\/p><div class='tip'>Merke: Das Deutsche unterscheidet „aber“ und „sondern“ – Französisch hat für beides <em>mais<\/em>.<\/div>"}, {"h": "Zeitliche Konjunktionen", "html": "<table><tr><th>Konjunktion<\/th><th>Bedeutung<\/th><th>Modus<\/th><\/tr><tr><td><em>quand / lorsque<\/em><\/td><td>wenn, als<\/td><td>Indikativ (Futur für Zukunft)<\/td><\/tr><tr><td><em>pendant que<\/em><\/td><td>während (zeitlich)<\/td><td>Indikativ<\/td><\/tr><tr><td><em>depuis que<\/em><\/td><td>seit(dem)<\/td><td>Indikativ<\/td><\/tr><tr><td><em>dès que, aussitôt que<\/em><\/td><td>sobald<\/td><td>Indikativ<\/td><\/tr><tr><td><em>après que<\/em><\/td><td>nachdem<\/td><td>Indikativ<\/td><\/tr><tr><td><em>avant que<\/em><\/td><td>bevor<\/td><td>subjonctif<\/td><\/tr><tr><td><em>jusqu'à ce que<\/em><\/td><td>bis<\/td><td>subjonctif<\/td><\/tr><tr><td><em>en attendant que<\/em><\/td><td>bis, solange<\/td><td>subjonctif<\/td><\/tr><\/table><ul><li><em>Quand j'étais jeune, j'habitais à Lyon.<\/em> – Als ich jung war …<\/li><li><em>Depuis qu'il travaille ici, il est content.<\/em><\/li><li><em>Rentre avant qu'il fasse nuit.<\/em><\/li><\/ul><div class='warn'>Achtung: Deutsches „als“ (einmalig in der Vergangenheit) und „wenn“ (wiederholt/Zukunft) sind beide <em>quand<\/em>.<\/div>"}, {"h": "Grund, Folge, Zweck", "html": "<p><b>Grund<\/b>:<\/p><ul><li><em>parce que<\/em> – weil (Antwort auf <em>pourquoi<\/em>): <em>Je reste parce que je suis malade.<\/em><\/li><li><em>comme<\/em> – da (am Satzanfang): <em>Comme il pleut, je reste.<\/em><\/li><li><em>puisque<\/em> – da ja (bekannter Grund): <em>Puisque tu es là, aide-moi.<\/em><\/li><li><em>car<\/em> – denn (schriftlich, nie am Satzanfang)<\/li><li><em>à cause de<\/em> + Substantiv (negativ) / <em>grâce à<\/em> (positiv): <em>à cause de la pluie, grâce à toi<\/em><\/li><\/ul><p><b>Folge<\/b>: <em>donc, alors, c'est pourquoi, si bien que, tellement … que<\/em>: <em>Il était tellement fatigué qu'il s'est endormi.<\/em><\/p><p><b>Zweck<\/b>: <em>pour que, afin que<\/em> + subjonctif; bei gleichem Subjekt <em>pour / afin de<\/em> + Infinitiv.<\/p><div class='warn'>Achtung: <em>parce que<\/em> nie am Satzanfang für einen vorangestellten Grund – dann <em>comme<\/em>: <em>Comme je suis malade, je reste.<\/em><\/div>"}, {"h": "Gegensatz und Einräumung", "html": "<table><tr><th>Ausdruck<\/th><th>Bedeutung<\/th><th>Konstruktion<\/th><\/tr><tr><td><em>mais<\/em><\/td><td>aber<\/td><td>Hauptsatz<\/td><\/tr><tr><td><em>pourtant, cependant<\/em><\/td><td>trotzdem, jedoch<\/td><td>Adverb<\/td><\/tr><tr><td><em>quand même<\/em><\/td><td>trotzdem (gesprochen)<\/td><td><em>Il pleut, mais je sors quand même.<\/em><\/td><\/tr><tr><td><em>bien que, quoique<\/em><\/td><td>obwohl<\/td><td>+ subjonctif<\/td><\/tr><tr><td><em>même si<\/em><\/td><td>selbst wenn, auch wenn<\/td><td>+ Indikativ<\/td><\/tr><tr><td><em>alors que, tandis que<\/em><\/td><td>während (Gegensatz), wohingegen<\/td><td>+ Indikativ<\/td><\/tr><tr><td><em>malgré<\/em><\/td><td>trotz<\/td><td>+ Substantiv: <em>malgré la pluie<\/em><\/td><\/tr><tr><td><em>au lieu de<\/em><\/td><td>anstatt<\/td><td>+ Infinitiv/Substantiv<\/td><\/tr><\/table><div class='tip'>Merke: <em>bien que<\/em> + subjonctif, aber <em>même si<\/em> + Indikativ: <em>Bien qu'il soit riche … / Même s'il est riche …<\/em><\/div>"}, {"h": "Hervorhebung (mise en relief)", "html": "<p>Französisch betont Satzteile nicht durch Stimme oder Wortstellung wie das Deutsche, sondern mit festen Konstruktionen:<\/p><ul><li><b>c'est … qui / que<\/b>: <em>C'est Paul qui a gagné.<\/em> – PAUL hat gewonnen. <em>C'est à Lyon que j'habite.<\/em><\/li><li><b>Herausstellung mit Pronomen<\/b> (sehr häufig gesprochen): <em>Moi, j'aime le café.<\/em> <em>Le café, je l'adore.<\/em> <em>Paris, c'est magnifique.<\/em><\/li><li><b>ce qui / ce que …, c'est<\/b>: <em>Ce que j'aime, c'est voyager.<\/em> – Was ich liebe, ist Reisen.<\/li><li><b>il y a … qui<\/b>: <em>Il y a quelqu'un qui t'attend.<\/em> – Da wartet jemand auf dich.<\/li><\/ul><div class='tip'>Merke: <em>Moi, je …<\/em> – das betonte Pronomen davor entspricht der Betonung im Deutschen: <em>ICH gehe.<\/em> = <em>Moi, j'y vais.<\/em><\/div>"}, {"h": "Textverknüpfung", "html": "<p>Für Aufzählung und Argumentation:<\/p><table><tr><th>Funktion<\/th><th>Ausdrücke<\/th><\/tr><tr><td>Reihenfolge<\/td><td><em>d'abord, ensuite, puis, après, enfin, finalement<\/em><\/td><\/tr><tr><td>Aufzählung<\/td><td><em>premièrement, deuxièmement; d'une part … d'autre part<\/em><\/td><\/tr><tr><td>Ergänzung<\/td><td><em>de plus, en plus, en outre, par ailleurs<\/em><\/td><\/tr><tr><td>Beispiel<\/td><td><em>par exemple, notamment, comme<\/em><\/td><\/tr><tr><td>Gegensatz<\/td><td><em>en revanche, par contre, au contraire<\/em><\/td><\/tr><tr><td>Folgerung<\/td><td><em>donc, par conséquent, ainsi<\/em><\/td><\/tr><tr><td>Zusammenfassung<\/td><td><em>bref, en résumé, en conclusion, en somme<\/em><\/td><\/tr><tr><td>Umformulierung<\/td><td><em>c'est-à-dire, autrement dit<\/em><\/td><\/tr><\/table><div class='tip'>Merke: <em>par contre<\/em> (dagegen) ist gesprochen sehr häufig; schriftlich eleganter: <em>en revanche<\/em>.<\/div>"}], "exercises": [{"type": "choice", "title": "Wortstellung", "task": "Welcher Satz ist richtig?", "items": [{"q": "Morgen fahre ich nach Paris.", "options": ["Demain je vais à Paris.", "Demain vais-je à Paris."], "a": 0, "why": "Keine Inversion nach Zeitangabe."}, {"q": "Ich weiß, dass er Französisch spricht.", "options": ["Je sais qu'il français parle.", "Je sais qu'il parle français."], "a": 1, "why": "Auch im Nebensatz SVO."}, {"q": "Weil es regnet, bleibe ich zu Hause.", "options": ["Comme il pleut, je reste à la maison.", "Parce que il pleut, reste-je à la maison."], "a": 0, "why": "Vorangestellter Grund → comme; keine Inversion."}, {"q": "Vielleicht kommt er (Alltagssprache).", "options": ["Peut-être qu'il viendra.", "Peut-être il viendra-t-il."], "a": 0, "why": "Peut-être que + normale Wortstellung."}, {"q": "„Ja“, sagte er.", "options": ["« Oui », il a dit.", "« Oui », a-t-il dit."], "a": 1, "why": "Nach direkter Rede: Inversion."}]}, {"type": "gap", "title": "Konjunktionen", "task": "Setze die passende Konjunktion ein.", "items": [{"q": "Je ne viens pas ___ je suis malade. (weil)", "a": ["parce que"], "de": "Ich komme nicht, weil ich krank bin."}, {"q": "___ tu es là, tu peux m'aider. (da ja)", "a": ["Puisque"], "de": "Da du ja hier bist, kannst du mir helfen."}, {"q": "Ce n'est pas mon frère ___ mon cousin. (sondern)", "a": ["mais"], "de": "Das ist nicht mein Bruder, sondern mein Cousin."}, {"q": "Elle est sortie ___ il pleuvait. (obwohl)", "a": ["bien qu'", "quoiqu'"], "de": "Sie ging hinaus, obwohl es regnete."}, {"q": "Il est resté ___ la pluie. (wegen)", "a": ["à cause de"], "de": "Er ist wegen des Regens geblieben."}, {"q": "J'ai réussi ___ toi. (dank)", "a": ["grâce à"], "de": "Ich habe es dank dir geschafft."}, {"q": "Il fait froid, ___ je mets un pull. (also)", "a": ["donc", "alors"], "de": "Es ist kalt, also ziehe ich einen Pullover an."}, {"q": "___ la pluie, nous sommes sortis. (trotz)", "a": ["Malgré"], "de": "Trotz des Regens sind wir hinausgegangen."}, {"q": "Je lis ___ tu regardes la télé. (während, zeitlich)", "a": ["pendant que"], "de": "Ich lese, während du fernsiehst."}, {"q": "Il est riche ___ son frère est pauvre. (wohingegen)", "a": ["alors que", "tandis que"], "de": "Er ist reich, während sein Bruder arm ist."}]}, {"type": "choice", "title": "Modus nach Konjunktionen", "task": "Indikativ oder subjonctif?", "items": [{"q": "Bien qu'il ___ tard, je reste.", "options": ["est", "soit"], "a": 1, "why": "bien que + subjonctif."}, {"q": "Même s'il ___ tard, je reste.", "options": ["est", "soit"], "a": 0, "why": "même si + Indikativ."}, {"q": "Attends jusqu'à ce que je ___ .", "options": ["reviens", "revienne"], "a": 1, "why": "jusqu'à ce que + subjonctif."}, {"q": "Depuis qu'il ___ ici, il est heureux.", "options": ["habite", "habite-t-il", "habiterait"], "a": 0, "why": "depuis que + Indikativ."}, {"q": "Je t'appelle dès que j'___ .", "options": ["arriverai", "arrive", "arrivais"], "a": 0, "why": "dès que + Futur für Zukunft (im Alltag hört man auch das Präsens)."}]}, {"type": "gap", "title": "Hervorhebung", "task": "Hebe den markierten Teil hervor.", "items": [{"q": "Paul a cassé le verre. → C'est Paul ___ a cassé le verre.", "a": ["qui"], "de": "PAUL hat das Glas zerbrochen."}, {"q": "Je pars demain. → C'est demain ___ je pars.", "a": ["que"], "de": "MORGEN fahre ich."}, {"q": "J'aime voyager. → Ce ___ j'aime, c'est voyager.", "a": ["que"], "de": "Was ich liebe, ist Reisen."}, {"q": "Le fromage me plaît. → Ce ___ me plaît, c'est le fromage.", "a": ["qui"], "de": "Was mir gefällt, ist der Käse."}, {"q": "J'adore le chocolat. → Le chocolat, je ___ adore.", "a": ["l'"], "de": "Schokolade liebe ich."}]}], "cards": [{"f": "Grundwortstellung", "b": "Subjekt – Verb – Objekt, auch im Nebensatz"}, {"f": "Inversion nach Zeitangabe am Satzanfang?", "b": "Nein: Demain, je vais à Paris."}, {"f": "Mais où est donc Ornicar ?", "b": "mais, ou, et, donc, or, ni, car"}, {"f": "aber / sondern", "b": "beides mais"}, {"f": "weil / da (vorangestellt) / da ja", "b": "parce que / comme / puisque"}, {"f": "wegen / dank", "b": "à cause de / grâce à"}, {"f": "als / wenn (zeitlich)", "b": "beides quand (oder lorsque)"}, {"f": "während (zeitlich) / während (Gegensatz)", "b": "pendant que / alors que, tandis que"}, {"f": "obwohl / selbst wenn", "b": "bien que + subjonctif / même si + Indikativ"}, {"f": "trotz / trotzdem", "b": "malgré / pourtant, quand même"}, {"f": "sobald", "b": "dès que (+ Futur für Zukunft)"}, {"f": "so … dass", "b": "tellement / si … que"}, {"f": "Hervorhebung", "b": "c'est … qui / c'est … que"}, {"f": "Was ich liebe, ist …", "b": "Ce que j'aime, c'est …"}, {"f": "Herausstellung", "b": "Moi, j'aime … / Le café, je l'adore."}, {"f": "dagegen", "b": "par contre (gesprochen) / en revanche (schriftlich)"}, {"f": "zuerst, dann, schließlich", "b": "d'abord, ensuite/puis, enfin"}, {"f": "das heißt", "b": "c'est-à-dire"}]}, {"nr": 25, "id": "k26", "title": "Die Präpositionen", "teil": "Der Satz", "intro": "Präpositionen sind in jeder Sprache eigenwillig. Im Französischen sind besonders à, de und en vielseitig – und die Regeln für Länder und Städte, für Verkehrsmittel und für Zeitangaben wie depuis, pendant, pour und dans muss man gezielt lernen.", "sections": [{"h": "à und de: die Grundbedeutungen", "html": "<p><b>à<\/b>:<\/p><ul><li>Ort/Richtung: <em>Je suis à la maison. Je vais à Paris.<\/em><\/li><li>Zeitpunkt: <em>à 8 heures, à midi, à Noël<\/em><\/li><li>indirektes Objekt: <em>donner qc à qn<\/em><\/li><li>Merkmal: <em>la fille aux cheveux longs, un café au lait<\/em><\/li><li>Zweck: <em>une tasse à café, une machine à laver<\/em><\/li><li>Art und Weise: <em>à pied, à vélo, à la main, à voix haute<\/em><\/li><li>Zugehörigkeit: <em>C'est à moi.<\/em><\/li><\/ul><p><b>de<\/b>:<\/p><ul><li>Herkunft: <em>Je viens de Berlin.<\/em><\/li><li>Besitz: <em>la voiture de Paul<\/em><\/li><li>Inhalt, Menge: <em>une tasse de café, beaucoup de temps<\/em><\/li><li>Material/Art: <em>un jus d'orange, un cours de français<\/em><\/li><li>Ursache: <em>mourir de faim, trembler de froid<\/em><\/li><li>von … bis: <em>de 9 h à 17 h, de Paris à Lyon<\/em><\/li><\/ul><div class='warn'>Achtung: Verschmelzung mit dem Artikel: <em>au, aux, du, des<\/em> (Kapitel 3).<\/div>"}, {"h": "Länder, Städte, Regionen", "html": "<table><tr><th>Ziel<\/th><th>in / nach<\/th><th>aus<\/th><\/tr><tr><td>Stadt<\/td><td><em>à Paris, à Berlin<\/em><\/td><td><em>de Paris, d'Avignon<\/em><\/td><\/tr><tr><td>Land feminin (auf -e)<\/td><td><em>en France, en Italie<\/em><\/td><td><em>de France, d'Italie<\/em><\/td><\/tr><tr><td>Land maskulin, Vokal<\/td><td><em>en Iran, en Israël<\/em><\/td><td><em>d'Iran<\/em><\/td><\/tr><tr><td>Land maskulin, Konsonant<\/td><td><em>au Portugal, au Japon, au Canada<\/em><\/td><td><em>du Portugal, du Japon<\/em><\/td><\/tr><tr><td>Land Plural<\/td><td><em>aux États-Unis, aux Pays-Bas<\/em><\/td><td><em>des États-Unis<\/em><\/td><\/tr><tr><td>Insel<\/td><td><em>à Malte, à Cuba<\/em> (aber <em>en Corse, en Sicile<\/em>)<\/td><td><em>de Malte<\/em><\/td><\/tr><\/table><p>Regionen: <em>en Bretagne, en Provence, en Bavière<\/em> (f.); <em>dans le Midi<\/em>.<\/p><div class='warn'>Achtung: Für „in“ und „nach“ gibt es keinen Unterschied: <em>J'habite en Italie. Je vais en Italie.<\/em> Städte mit Artikel: <em>au Havre, au Mans<\/em>.<\/div><div class='tip'>Merke: <em>le Mexique<\/em> ist maskulin → <em>au Mexique<\/em>.<\/div>"}, {"h": "Weitere Ortspräpositionen", "html": "<table><tr><th>Präposition<\/th><th>Bedeutung<\/th><th>Beispiel<\/th><\/tr><tr><td><em>dans<\/em><\/td><td>in (drinnen)<\/td><td><em>dans la boîte, dans la rue<\/em><\/td><\/tr><tr><td><em>chez<\/em><\/td><td>bei, zu (Person)<\/td><td><em>chez moi, chez le médecin, chez Marie<\/em><\/td><\/tr><tr><td><em>sur / sous<\/em><\/td><td>auf / unter<\/td><td><em>sur la table, sous le lit<\/em><\/td><\/tr><tr><td><em>devant / derrière<\/em><\/td><td>vor / hinter<\/td><td><em>devant la gare<\/em><\/td><\/tr><tr><td><em>entre / parmi<\/em><\/td><td>zwischen / unter (Menge)<\/td><td><em>entre deux villes, parmi mes amis<\/em><\/td><\/tr><tr><td><em>à côté de / près de / loin de<\/em><\/td><td>neben / nahe / weit von<\/td><td><em>à côté de la banque<\/em><\/td><\/tr><tr><td><em>en face de<\/em><\/td><td>gegenüber<\/td><td><em>en face de l'église<\/em><\/td><\/tr><tr><td><em>au-dessus de / au-dessous de<\/em><\/td><td>oberhalb / unterhalb<\/td><td><\/td><\/tr><tr><td><em>vers<\/em><\/td><td>in Richtung, gegen<\/td><td><em>vers le nord, vers 8 heures<\/em><\/td><\/tr><tr><td><em>par<\/em><\/td><td>durch, über<\/td><td><em>passer par Lyon, regarder par la fenêtre<\/em><\/td><\/tr><tr><td><em>jusqu'à<\/em><\/td><td>bis<\/td><td><em>jusqu'à la gare<\/em><\/td><\/tr><\/table><div class='warn'>Achtung: „im Zug / im Flugzeug“ = <em>dans le train<\/em>, aber „mit dem Zug“ = <em>en train<\/em>. „auf der Straße“ = <em>dans la rue<\/em>!<\/div><div class='tip'>Merke: <em>chez<\/em> + Person = Ort: <em>Je vais chez le coiffeur.<\/em> (zum Friseur), <em>chez nous<\/em> (bei uns, in unserem Land).<\/div>"}, {"h": "Verkehrsmittel", "html": "<table><tr><th>en (drinnen sitzen)<\/th><th>à (draufsitzen, zu Fuß)<\/th><\/tr><tr><td><em>en voiture, en bus, en train, en avion, en bateau, en métro, en taxi<\/em><\/td><td><em>à pied, à vélo, à moto, à cheval, à ski<\/em><\/td><\/tr><\/table><p>Faustregel: Wo man <b>einsteigt<\/b>, steht <em>en<\/em>; wo man <b>aufsteigt<\/b>, steht <em>à<\/em>.<\/p><ul><li><em>Je vais au travail en métro.<\/em><\/li><li><em>On y va à pied ?<\/em><\/li><li>Mit Bestimmung: <em>par le train de 8 heures, avec ma voiture<\/em><\/li><\/ul><div class='tip'>Merke: Umgangssprachlich hört man auch <em>en vélo<\/em> – <em>à vélo<\/em> gilt aber als korrekt.<\/div>"}, {"h": "Zeitpräpositionen: en, dans, à", "html": "<table><tr><th>Präposition<\/th><th>Gebrauch<\/th><th>Beispiel<\/th><\/tr><tr><td><em>à<\/em><\/td><td>Uhrzeit, Zeitpunkt<\/td><td><em>à 8 heures, à midi, à Pâques<\/em><\/td><\/tr><tr><td><em>en<\/em><\/td><td>Monate, Jahre, Jahreszeiten (außer Frühling)<\/td><td><em>en mai, en 2024, en été, en hiver<\/em> – aber <em>au printemps<\/em><\/td><\/tr><tr><td><em>en<\/em><\/td><td>Dauer, die man braucht<\/td><td><em>J'ai lu le livre en deux jours.<\/em> – innerhalb von<\/td><\/tr><tr><td><em>dans<\/em><\/td><td>Zeitpunkt in der Zukunft<\/td><td><em>Je pars dans deux jours.<\/em> – in zwei Tagen<\/td><\/tr><tr><td>ohne Präp.<\/td><td>Wochentage, Datum<\/td><td><em>lundi, le 3 mai, ce matin<\/em><\/td><\/tr><\/table><div class='warn'>Achtung: <em>en deux heures<\/em> (innerhalb von zwei Stunden) ≠ <em>dans deux heures<\/em> (in zwei Stunden, ab jetzt).<\/div>"}, {"h": "depuis, il y a, pendant, pour", "html": "<table><tr><th>Ausdruck<\/th><th>Bedeutung<\/th><th>Zeit<\/th><th>Beispiel<\/th><\/tr><tr><td><em>depuis<\/em><\/td><td>seit (dauert an)<\/td><td>Präsens<\/td><td><em>J'habite ici depuis 2010 / depuis dix ans.<\/em><\/td><\/tr><tr><td><em>il y a<\/em><\/td><td>vor (Zeitpunkt)<\/td><td>Vergangenheit<\/td><td><em>Je suis arrivé il y a dix ans.<\/em><\/td><\/tr><tr><td><em>pendant<\/em><\/td><td>während, lang (abgeschlossene Dauer)<\/td><td>meist passé composé<\/td><td><em>J'ai habité à Rome pendant trois ans.<\/em><\/td><\/tr><tr><td><em>pour<\/em><\/td><td>für (geplante Dauer)<\/td><td>Zukunft<\/td><td><em>Je pars pour une semaine.<\/em><\/td><\/tr><tr><td><em>il y a … que / ça fait … que<\/em><\/td><td>seit (betont)<\/td><td>Präsens<\/td><td><em>Ça fait une heure que j'attends.<\/em><\/td><\/tr><\/table><div class='tip'>Merke: <em>pendant<\/em> kann oft wegfallen: <em>J'ai dormi (pendant) huit heures.<\/em><\/div><div class='warn'>Achtung: „vor“ räumlich = <em>devant<\/em>, zeitlich vor einem Zeitpunkt = <em>avant<\/em> (<em>avant midi<\/em>), vor einer Zeitspanne = <em>il y a<\/em> (<em>il y a deux jours<\/em>).<\/div>"}, {"h": "par, pour, avec, sans, sauf", "html": "<ul><li><em>par<\/em>: durch, von (Passiv), pro: <em>Le livre a été écrit par Hugo. deux fois par semaine, par exemple, par hasard<\/em><\/li><li><em>pour<\/em>: für, um zu, nach (Richtung): <em>C'est pour toi. Je travaille pour vivre. le train pour Lyon<\/em><\/li><li><em>avec<\/em> / <em>sans<\/em>: mit / ohne: <em>un café avec du sucre, sans sucre<\/em><\/li><li><em>sauf<\/em>, <em>à part<\/em>: außer: <em>tous sauf lui<\/em><\/li><li><em>selon, d'après<\/em>: laut, gemäß: <em>selon la météo<\/em><\/li><li><em>contre<\/em>: gegen: <em>contre le mur, voter contre<\/em><\/li><li><em>envers<\/em>: gegenüber (Haltung): <em>gentil envers moi<\/em><\/li><\/ul><div class='tip'>Merke: <em>sans<\/em> + Substantiv ohne Artikel: <em>sans problème, sans sucre<\/em>.<\/div>"}], "exercises": [{"type": "gap", "title": "Länder und Städte", "task": "Setze à, en, au oder aux ein.", "items": [{"q": "J'habite ___ Allemagne.", "a": ["en"], "de": "Ich wohne in Deutschland."}, {"q": "Nous allons ___ Portugal cet été.", "a": ["au"], "de": "Wir fahren diesen Sommer nach Portugal."}, {"q": "Elle travaille ___ Lyon.", "a": ["à"], "de": "Sie arbeitet in Lyon."}, {"q": "Mon frère vit ___ États-Unis.", "a": ["aux"], "de": "Mein Bruder lebt in den USA."}, {"q": "Ils passent leurs vacances ___ Espagne.", "a": ["en"], "de": "Sie verbringen ihren Urlaub in Spanien."}, {"q": "Je suis allé ___ Japon l'année dernière.", "a": ["au"], "de": "Ich war letztes Jahr in Japan."}, {"q": "On fait du ski ___ Suisse.", "a": ["en"], "de": "Wir fahren in der Schweiz Ski."}, {"q": "Elle est née ___ Mexique.", "a": ["au"], "de": "Sie ist in Mexiko geboren."}, {"q": "Nous habitons ___ Bretagne.", "a": ["en"], "de": "Wir wohnen in der Bretagne."}]}, {"type": "choice", "title": "Verkehrsmittel und Orte", "task": "Wähle die richtige Präposition.", "items": [{"q": "Je vais au bureau ___ vélo.", "options": ["en", "à", "par"], "a": 1, "why": "Aufsteigen → à."}, {"q": "Elle voyage toujours ___ train.", "options": ["en", "à", "dans"], "a": 0, "why": "Einsteigen → en."}, {"q": "J'ai rencontré Paul ___ le train.", "options": ["en", "dans"], "a": 1, "why": "im Zug (drinnen) → dans."}, {"q": "Les enfants jouent ___ la rue.", "options": ["sur", "dans"], "a": 1, "why": "auf der Straße = dans la rue."}, {"q": "Je vais ___ le dentiste.", "options": ["à", "chez"], "a": 1, "why": "zu einer Person → chez."}, {"q": "On rentre ___ pied.", "options": ["en", "à"], "a": 1, "why": "à pied."}, {"q": "La pharmacie est ___ la poste.", "options": ["en face de", "en face"], "a": 0, "why": "en face de + Substantiv."}]}, {"type": "choice", "title": "depuis, il y a, pendant, pour", "task": "Wähle den passenden Ausdruck.", "items": [{"q": "J'apprends le français ___ trois ans.", "options": ["depuis", "il y a", "pendant"], "a": 0, "why": "Dauert an → depuis + Präsens."}, {"q": "Je suis arrivé ___ trois ans.", "options": ["depuis", "il y a", "pour"], "a": 1, "why": "Zeitpunkt in der Vergangenheit → il y a."}, {"q": "Il a vécu au Canada ___ cinq ans.", "options": ["depuis", "pendant", "pour"], "a": 1, "why": "Abgeschlossene Dauer → pendant."}, {"q": "Je pars en Italie ___ deux semaines.", "options": ["pendant", "pour", "depuis"], "a": 1, "why": "Geplante Dauer → pour."}, {"q": "Le train part ___ dix minutes.", "options": ["en", "dans", "pour"], "a": 1, "why": "Zukunftszeitpunkt → dans."}, {"q": "Il a fait le trajet ___ trois heures.", "options": ["en", "dans", "depuis"], "a": 0, "why": "Benötigte Zeit → en."}, {"q": "Ça fait une heure ___ je t'attends !", "options": ["que", "depuis", "pendant"], "a": 0, "why": "ça fait … que."}]}, {"type": "gap", "title": "Zeitangaben", "task": "Setze à, en, au oder dans ein – oder „–“, wenn keine Präposition steht.", "items": [{"q": "Le cours commence ___ 9 heures.", "a": ["à"], "de": "Der Kurs beginnt um 9 Uhr."}, {"q": "Je suis né ___ 1975.", "a": ["en"], "de": "Ich bin 1975 geboren."}, {"q": "Les fleurs poussent ___ printemps.", "a": ["au"], "de": "Die Blumen wachsen im Frühling."}, {"q": "Il neige souvent ___ hiver.", "a": ["en"], "de": "Im Winter schneit es oft."}, {"q": "On se voit ___ lundi.", "a": ["–", "-"], "de": "Wir sehen uns am Montag."}, {"q": "Je reviens ___ cinq minutes.", "a": ["dans"], "de": "Ich bin in fünf Minuten zurück."}, {"q": "Nous partons ___ août.", "a": ["en"], "de": "Wir fahren im August."}]}, {"type": "gap", "title": "Gemischte Präpositionen", "task": "Setze die passende Präposition ein.", "items": [{"q": "Ce livre a été écrit ___ Victor Hugo.", "a": ["par"], "de": "Dieses Buch wurde von Victor Hugo geschrieben."}, {"q": "Je fais du sport trois fois ___ semaine.", "a": ["par"], "de": "Ich mache dreimal pro Woche Sport."}, {"q": "Tout le monde est venu ___ Pierre.", "a": ["sauf"], "de": "Alle sind gekommen außer Pierre."}, {"q": "Un café ___ sucre, s'il vous plaît.", "a": ["sans"], "de": "Einen Kaffee ohne Zucker, bitte."}, {"q": "___ la météo, il va pleuvoir.", "a": ["Selon", "D'après"], "de": "Laut Wetterbericht wird es regnen."}, {"q": "Il est arrivé ___ midi. (vor)", "a": ["avant"], "de": "Er ist vor Mittag angekommen."}, {"q": "Il y a une voiture ___ la maison. (vor)", "a": ["devant"], "de": "Vor dem Haus steht ein Auto."}]}], "cards": [{"f": "in/nach + Stadt", "b": "à: à Paris"}, {"f": "in/nach + Land (f.)", "b": "en: en France, en Italie"}, {"f": "in/nach + Land (m.)", "b": "au: au Portugal, au Japon, au Canada"}, {"f": "in/nach + Land (Plural)", "b": "aux: aux États-Unis"}, {"f": "aus Frankreich / aus Japan", "b": "de France / du Japon"}, {"f": "mit dem Zug / im Zug", "b": "en train / dans le train"}, {"f": "zu Fuß / mit dem Rad", "b": "à pied / à vélo"}, {"f": "Faustregel Verkehrsmittel", "b": "einsteigen → en · aufsteigen → à"}, {"f": "zum Arzt / bei mir", "b": "chez le médecin / chez moi"}, {"f": "auf der Straße", "b": "dans la rue"}, {"f": "im Sommer / im Frühling", "b": "en été / au printemps"}, {"f": "im Mai / 2024", "b": "en mai / en 2024"}, {"f": "in zwei Tagen / innerhalb von zwei Tagen", "b": "dans deux jours / en deux jours"}, {"f": "seit (dauert an)", "b": "depuis + Präsens"}, {"f": "vor drei Jahren", "b": "il y a trois ans"}, {"f": "drei Jahre lang (abgeschlossen)", "b": "pendant trois ans"}, {"f": "für eine Woche (geplant)", "b": "pour une semaine"}, {"f": "Ich warte seit einer Stunde.", "b": "Ça fait une heure que j'attends."}, {"f": "vor (räumlich / zeitlich)", "b": "devant / avant"}, {"f": "zwischen / unter (einer Menge)", "b": "entre / parmi"}, {"f": "pro Woche / zufällig", "b": "par semaine / par hasard"}, {"f": "laut, gemäß", "b": "selon, d'après"}]}, {"nr": 26, "id": "k27", "title": "Zahlen, Datum und Uhrzeit", "teil": "Anhang", "intro": "Französische Zahlen sind berüchtigt: 70 heißt „sechzig-zehn“, 80 „vier-zwanzig“, 90 „vier-zwanzig-zehn“. Mit ein paar Regeln wird das System aber logisch. Dazu Ordnungszahlen, Datum, Uhrzeit und Bruchzahlen.", "sections": [{"h": "Zahlen von 0 bis 69", "html": "<table><tr><th>0–16<\/th><th><\/th><th>17–69<\/th><th><\/th><\/tr><tr><td>0 <em>zéro<\/em><\/td><td>9 <em>neuf<\/em><\/td><td>17 <em>dix-sept<\/em><\/td><td>30 <em>trente<\/em><\/td><\/tr><tr><td>1 <em>un / une<\/em><\/td><td>10 <em>dix<\/em><\/td><td>18 <em>dix-huit<\/em><\/td><td>31 <em>trente et un<\/em><\/td><\/tr><tr><td>2 <em>deux<\/em><\/td><td>11 <em>onze<\/em><\/td><td>19 <em>dix-neuf<\/em><\/td><td>40 <em>quarante<\/em><\/td><\/tr><tr><td>3 <em>trois<\/em><\/td><td>12 <em>douze<\/em><\/td><td>20 <em>vingt<\/em><\/td><td>50 <em>cinquante<\/em><\/td><\/tr><tr><td>4 <em>quatre<\/em><\/td><td>13 <em>treize<\/em><\/td><td>21 <em>vingt et un<\/em><\/td><td>60 <em>soixante<\/em><\/td><\/tr><tr><td>5 <em>cinq<\/em><\/td><td>14 <em>quatorze<\/em><\/td><td>22 <em>vingt-deux<\/em><\/td><td>61 <em>soixante et un<\/em><\/td><\/tr><tr><td>6 <em>six<\/em><\/td><td>15 <em>quinze<\/em><\/td><td>23 <em>vingt-trois<\/em><\/td><td>69 <em>soixante-neuf<\/em><\/td><\/tr><tr><td>7 <em>sept<\/em><\/td><td>16 <em>seize<\/em><\/td><td>28 <em>vingt-huit<\/em><\/td><td><\/td><\/tr><tr><td>8 <em>huit<\/em><\/td><td><\/td><td>29 <em>vingt-neuf<\/em><\/td><td><\/td><\/tr><\/table><ul><li>Bei 21, 31, 41, 51, 61 steht <em>et<\/em>: <em>vingt et un<\/em>. Sonst Bindestrich: <em>vingt-deux<\/em>.<\/li><li><em>un<\/em> passt sich an: <em>vingt et une personnes<\/em>.<\/li><\/ul><div class='warn'>Achtung – Aussprache: <em>six, dix<\/em> allein [sis, dis], vor Konsonant [si, di] (<em>six livres<\/em>), vor Vokal [siz, diz] (<em>six amis<\/em>). <em>huit<\/em> [üit], aber <em>huit jours<\/em> [üi]. <em>cinq<\/em> [sẽk], <em>neuf ans<\/em> [növ-ã]. <em>vingt<\/em> [vẽ], aber <em>vingt et un<\/em> [vẽteẽ].<\/div>"}, {"h": "Zahlen von 70 bis 99", "html": "<p>Hier rechnet das Französische (in Frankreich) im Zwanzigersystem:<\/p><table><tr><th>Zahl<\/th><th>Französisch<\/th><th>wörtlich<\/th><\/tr><tr><td>70<\/td><td><em>soixante-dix<\/em><\/td><td>60 + 10<\/td><\/tr><tr><td>71<\/td><td><em>soixante et onze<\/em><\/td><td>60 + 11<\/td><\/tr><tr><td>72<\/td><td><em>soixante-douze<\/em><\/td><td>60 + 12<\/td><\/tr><tr><td>79<\/td><td><em>soixante-dix-neuf<\/em><\/td><td>60 + 19<\/td><\/tr><tr><td>80<\/td><td><em>quatre-vingts<\/em><\/td><td>4 × 20<\/td><\/tr><tr><td>81<\/td><td><em>quatre-vingt-un<\/em><\/td><td>4 × 20 + 1 (ohne et!)<\/td><\/tr><tr><td>90<\/td><td><em>quatre-vingt-dix<\/em><\/td><td>4 × 20 + 10<\/td><\/tr><tr><td>91<\/td><td><em>quatre-vingt-onze<\/em><\/td><td>4 × 20 + 11<\/td><\/tr><tr><td>99<\/td><td><em>quatre-vingt-dix-neuf<\/em><\/td><td>4 × 20 + 19<\/td><\/tr><\/table><div class='warn'>Achtung: <em>quatre-vingts<\/em> hat nur ein <em>-s<\/em>, wenn keine weitere Zahl folgt: <em>quatre-vingts euros<\/em>, aber <em>quatre-vingt-trois euros<\/em>.<\/div><div class='tip'>Merke: In Belgien und der Schweiz ist es einfacher: <em>septante<\/em> (70), <em>nonante<\/em> (90), in der Westschweiz auch <em>huitante<\/em> (80). Siehe Kapitel 29.<\/div>"}, {"h": "Ab 100", "html": "<table><tr><th>Zahl<\/th><th>Französisch<\/th><\/tr><tr><td>100<\/td><td><em>cent<\/em><\/td><\/tr><tr><td>101<\/td><td><em>cent un<\/em><\/td><\/tr><tr><td>200<\/td><td><em>deux cents<\/em><\/td><\/tr><tr><td>250<\/td><td><em>deux cent cinquante<\/em><\/td><\/tr><tr><td>1 000<\/td><td><em>mille<\/em><\/td><\/tr><tr><td>2 000<\/td><td><em>deux mille<\/em><\/td><\/tr><tr><td>1 000 000<\/td><td><em>un million<\/em><\/td><\/tr><tr><td>1 000 000 000<\/td><td><em>un milliard<\/em><\/td><\/tr><\/table><ul><li><em>cent<\/em> bekommt im Plural <em>-s<\/em>, wenn nichts folgt: <em>trois cents<\/em>, aber <em>trois cent dix<\/em>.<\/li><li><em>mille<\/em> ist unveränderlich: <em>deux mille<\/em>.<\/li><li><em>million, milliard<\/em> sind Substantive: <em>deux millions d'habitants<\/em>.<\/li><li>„einhundert, eintausend“: nur <em>cent, mille<\/em> (ohne <em>un<\/em>).<\/li><li>Jahreszahlen: <em>mille neuf cent quatre-vingt-dix<\/em> (1990), <em>deux mille vingt-cinq<\/em> (2025).<\/li><\/ul><div class='warn'>Achtung: Tausender werden mit Leerzeichen getrennt, Dezimalstellen mit Komma: <em>1 500,75 €<\/em>. Seit 1990 dürfen alle Zahlwörter mit Bindestrich geschrieben werden: <em>deux-cent-cinquante<\/em>.<\/div>"}, {"h": "Ordnungszahlen und Brüche", "html": "<p>Ordnungszahlen: Grundzahl + <em>-ième<\/em> (End-e fällt weg):<\/p><table><tr><th>Zahl<\/th><th>Ordnungszahl<\/th><\/tr><tr><td>1<\/td><td><em>premier / première<\/em> (1<sup>er<\/sup>, 1<sup>re<\/sup>)<\/td><\/tr><tr><td>2<\/td><td><em>deuxième<\/em> (auch <em>second(e)<\/em>)<\/td><\/tr><tr><td>3<\/td><td><em>troisième<\/em><\/td><\/tr><tr><td>4<\/td><td><em>quatrième<\/em><\/td><\/tr><tr><td>5<\/td><td><em>cinquième<\/em> (u eingefügt)<\/td><\/tr><tr><td>9<\/td><td><em>neuvième<\/em> (f → v)<\/td><\/tr><tr><td>21<\/td><td><em>vingt et unième<\/em><\/td><\/tr><tr><td>100<\/td><td><em>centième<\/em><\/td><\/tr><\/table><p>Abkürzung: <em>2<sup>e<\/sup>, 3<sup>e<\/sup><\/em>. Herrscher und Jahrhunderte: <em>Louis XIV<\/em> = <em>Louis quatorze<\/em> (Grundzahl!), aber <em>François I<sup>er<\/sup><\/em> = <em>François premier<\/em>; <em>le XX<sup>e<\/sup> siècle<\/em>.<\/p><p><b>Brüche<\/b>: <em>un demi / la moitié<\/em> (½), <em>un tiers<\/em> (⅓), <em>un quart<\/em> (¼), <em>trois quarts<\/em>, ab ⅕ mit Ordnungszahl: <em>un cinquième<\/em>. Prozent: <em>vingt pour cent<\/em>.<\/p><div class='tip'>Merke: <em>une demi-heure<\/em> (vorangestellt unveränderlich), aber <em>une heure et demie<\/em> (nachgestellt angeglichen).<\/div>"}, {"h": "Das Datum", "html": "<p>Wochentage (klein, maskulin): <em>lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche<\/em>.<\/p><p>Monate (klein, maskulin): <em>janvier, février, mars, avril, mai, juin, juillet, août, septembre, octobre, novembre, décembre<\/em>.<\/p><ul><li>Datum mit <b>Grundzahl<\/b> und <em>le<\/em>: <em>le 14 juillet, le 3 mai 2025<\/em><\/li><li>Ausnahme: der Erste: <em>le premier mai<\/em> (1<sup>er<\/sup> mai)<\/li><li><em>Nous sommes le combien ? – Nous sommes le 12.<\/em> / <em>On est quel jour ? – On est mardi.<\/em><\/li><li>Vollständig: <em>lundi 3 mars 2025<\/em> oder <em>le lundi 3 mars<\/em><\/li><\/ul><div class='warn'>Achtung: <em>lundi<\/em> = (diesen) Montag; <em>le lundi<\/em> = montags. <em>en mai<\/em> oder <em>au mois de mai<\/em> = im Mai.<\/div>"}, {"h": "Die Uhrzeit", "html": "<p><em>Quelle heure est-il ? – Il est … heure(s).<\/em><\/p><table><tr><th>Uhrzeit<\/th><th>Alltag<\/th><th>offiziell (24 h)<\/th><\/tr><tr><td>8:00<\/td><td><em>huit heures<\/em><\/td><td><em>huit heures<\/em><\/td><\/tr><tr><td>8:15<\/td><td><em>huit heures et quart<\/em><\/td><td><em>huit heures quinze<\/em><\/td><\/tr><tr><td>8:30<\/td><td><em>huit heures et demie<\/em><\/td><td><em>huit heures trente<\/em><\/td><\/tr><tr><td>8:45<\/td><td><em>neuf heures moins le quart<\/em><\/td><td><em>huit heures quarante-cinq<\/em><\/td><\/tr><tr><td>8:50<\/td><td><em>neuf heures moins dix<\/em><\/td><td><em>huit heures cinquante<\/em><\/td><\/tr><tr><td>12:00<\/td><td><em>midi<\/em><\/td><td><em>douze heures<\/em><\/td><\/tr><tr><td>0:00<\/td><td><em>minuit<\/em><\/td><td><em>zéro heure<\/em><\/td><\/tr><tr><td>20:10<\/td><td><em>huit heures dix du soir<\/em><\/td><td><em>vingt heures dix<\/em><\/td><\/tr><\/table><ul><li><em>du matin, de l'après-midi, du soir<\/em> zur Unterscheidung<\/li><li><em>À quelle heure ? – À 8 heures.<\/em> Schreibweise: <em>8 h 30, 20 h<\/em><\/li><li><em>vers 8 heures<\/em> (gegen), <em>à 8 heures pile<\/em> (genau)<\/li><\/ul><div class='warn'>Achtung: „halb neun“ = <em>huit heures et demie<\/em> (8:30) – nicht <em>neuf<\/em>! Und <em>midi et demi<\/em> (ohne e, weil <em>midi<\/em> maskulin).<\/div>"}, {"h": "Mengen, Alter und Preise", "html": "<ul><li>Sammelzahlen: <em>une dizaine<\/em> (etwa zehn), <em>une douzaine d'œufs<\/em> (ein Dutzend), <em>une vingtaine, une centaine<\/em> (etwa hundert), <em>des milliers<\/em> (Tausende)<\/li><li>Alter: <em>J'ai quarante ans. Il a la cinquantaine.<\/em> (Er ist in den Fünfzigern.)<\/li><li>Preise: <em>Ça coûte combien ? – Ça fait 12,50 €<\/em> (<em>douze euros cinquante<\/em>)<\/li><li>Telefonnummern in Zweiergruppen: <em>01 42 68 53 00<\/em> = <em>zéro un, quarante-deux, soixante-huit, cinquante-trois, zéro zéro<\/em><\/li><li>Rechnen: <em>deux et deux font quatre / deux plus deux égalent quatre; dix moins trois; trois fois quatre; huit divisé par deux<\/em><\/li><\/ul><div class='tip'>Merke: Französische Telefonnummern liest man paarweise – <em>quatre-vingt-dix-sept<\/em> als eine Zahl. Gut üben!<\/div>"}], "exercises": [{"type": "gap", "title": "Zahlen schreiben", "task": "Schreibe die Zahl in Worten.", "items": [{"q": "21 → ___", "a": ["vingt et un", "vingt-et-un"], "de": "einundzwanzig"}, {"q": "35 → ___", "a": ["trente-cinq"], "de": "fünfunddreißig"}, {"q": "71 → ___", "a": ["soixante et onze", "soixante-et-onze"], "de": "einundsiebzig"}, {"q": "80 → ___", "a": ["quatre-vingts"], "de": "achtzig"}, {"q": "84 → ___", "a": ["quatre-vingt-quatre"], "de": "vierundachtzig"}, {"q": "92 → ___", "a": ["quatre-vingt-douze"], "de": "zweiundneunzig"}, {"q": "77 → ___", "a": ["soixante-dix-sept"], "de": "siebenundsiebzig"}, {"q": "300 → ___", "a": ["trois cents", "trois-cents"], "de": "dreihundert"}, {"q": "1 000 → ___", "a": ["mille"], "de": "tausend"}, {"q": "99 → ___", "a": ["quatre-vingt-dix-neuf"], "de": "neunundneunzig"}]}, {"type": "choice", "title": "Mit oder ohne -s?", "task": "Welche Schreibung ist richtig?", "items": [{"q": "80 euros", "options": ["quatre-vingt euros", "quatre-vingts euros"], "a": 1, "why": "Nichts folgt → -s."}, {"q": "85 ans", "options": ["quatre-vingt-cinq ans", "quatre-vingts-cinq ans"], "a": 0, "why": "Zahl folgt → kein -s."}, {"q": "200 pages", "options": ["deux cent pages", "deux cents pages"], "a": 1, "why": "Nichts folgt → cents."}, {"q": "230 pages", "options": ["deux cents trente pages", "deux cent trente pages"], "a": 1, "why": "Zahl folgt → cent."}, {"q": "3000 personnes", "options": ["trois mille personnes", "trois milles personnes"], "a": 0, "why": "mille ist unveränderlich."}, {"q": "2 Millionen Einwohner", "options": ["deux million habitants", "deux millions d'habitants"], "a": 1, "why": "million ist ein Substantiv: Plural + de."}]}, {"type": "gap", "title": "Datum", "task": "Ergänze das Datum.", "items": [{"q": "Der 1. Mai: le ___ mai", "a": ["premier", "1er"], "de": "der Erste Mai"}, {"q": "Der 14. Juli: le ___ juillet", "a": ["quatorze", "14"], "de": "der Nationalfeiertag"}, {"q": "Weihnachten ist am 25. ___ .", "a": ["décembre"], "de": "Dezember"}, {"q": "Mein Geburtstag ist im August: C'est en ___ .", "a": ["août"], "de": "August"}, {"q": "Montags arbeite ich nicht: ___ lundi, je ne travaille pas.", "a": ["Le"], "de": "Montags arbeite ich nicht."}]}, {"type": "gap", "title": "Uhrzeit", "task": "Schreibe die Uhrzeit in der Alltagsform.", "items": [{"q": "7:15 → Il est sept heures ___ .", "a": ["et quart"], "de": "Viertel nach sieben"}, {"q": "9:30 → Il est neuf heures ___ .", "a": ["et demie"], "de": "halb zehn"}, {"q": "10:45 → Il est onze heures ___ .", "a": ["moins le quart"], "de": "Viertel vor elf"}, {"q": "12:00 → Il est ___ .", "a": ["midi"], "de": "Mittag"}, {"q": "5:50 → Il est six heures ___ .", "a": ["moins dix"], "de": "zehn vor sechs"}, {"q": "0:00 → Il est ___ .", "a": ["minuit"], "de": "Mitternacht"}, {"q": "12:30 → Il est midi et ___ .", "a": ["demi"], "de": "halb eins"}]}, {"type": "choice", "title": "Ordnungszahlen und Brüche", "task": "Wähle die richtige Form.", "items": [{"q": "der fünfte Stock", "options": ["le cinqième étage", "le cinquième étage"], "a": 1, "why": "cinq → cinquième (u wird eingefügt)."}, {"q": "das neunte Mal", "options": ["la neufième fois", "la neuvième fois"], "a": 1, "why": "neuf → neuvième (f → v)."}, {"q": "Ludwig XIV.", "options": ["Louis quatorzième", "Louis quatorze"], "a": 1, "why": "Herrscher mit Grundzahl (außer premier)."}, {"q": "ein Viertel", "options": ["un quatrième", "un quart"], "a": 1, "why": "¼ = un quart."}, {"q": "eine halbe Stunde", "options": ["une demie-heure", "une demi-heure"], "a": 1, "why": "demi vorangestellt unveränderlich."}, {"q": "etwa zehn Leute", "options": ["une dizaine de personnes", "une dixième de personnes"], "a": 0, "why": "Sammelzahl: une dizaine."}]}], "cards": [{"f": "21, 31, 41 … 61", "b": "mit et: vingt et un, trente et un"}, {"f": "70 / 71", "b": "soixante-dix / soixante et onze"}, {"f": "80 / 81", "b": "quatre-vingts / quatre-vingt-un (ohne et, ohne s)"}, {"f": "90 / 99", "b": "quatre-vingt-dix / quatre-vingt-dix-neuf"}, {"f": "Wann hat quatre-vingts ein -s?", "b": "nur wenn keine Zahl folgt"}, {"f": "200 / 201", "b": "deux cents / deux cent un"}, {"f": "mille – veränderlich?", "b": "nein: deux mille"}, {"f": "2 Millionen Einwohner", "b": "deux millions d'habitants"}, {"f": "70 und 90 in Belgien/Schweiz", "b": "septante, nonante"}, {"f": "premier / deuxième / cinquième / neuvième", "b": "1. / 2. / 5. / 9."}, {"f": "Ludwig XIV. / Franz I.", "b": "Louis quatorze / François premier"}, {"f": "½, ⅓, ¼", "b": "un demi (la moitié), un tiers, un quart"}, {"f": "der 3. Mai / der 1. Mai", "b": "le 3 mai / le premier mai"}, {"f": "Den Wievielten haben wir?", "b": "Nous sommes le combien ?"}, {"f": "Wie spät ist es?", "b": "Quelle heure est-il ?"}, {"f": "Viertel nach / halb / Viertel vor", "b": "et quart / et demie / moins le quart"}, {"f": "halb neun", "b": "huit heures et demie (8:30)"}, {"f": "Mittag / Mitternacht", "b": "midi / minuit"}, {"f": "etwa zehn / ein Dutzend / etwa hundert", "b": "une di
